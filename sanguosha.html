<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三国杀 · 华夏文脉</title>
<style>
:root{--bg:#17100a;--bg2:#221710;--wood:#2b1d12;--gold:#c9a84c;--gold2:#e6c875;--red:#9c1f1f;--ink:#e9dcc0;--dim:#a8956f;--parch:#f3e9d2;--parch2:#e8d9b8;--cardw:92px;--cardh:128px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#332417,#17100a 65%);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",serif;overflow:hidden;height:100dvh}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1100px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#2b1d12,#1d130b);border-bottom:1px solid #4a3823}
.top .tt{font-size:1.1rem;font-weight:800;letter-spacing:1px;color:var(--gold2);white-space:nowrap}
.top .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #6b5333;background:#2b1d12;color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.82rem}
.btn:hover{background:#3a2818}
.btn.gold{background:linear-gradient(180deg,#e6c875,#c9a84c);color:#3a2600;font-weight:700;border-color:#a8842f}
.btn.red{background:linear-gradient(180deg,#c03,#8b1a1a);color:#fff;border-color:#701515;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lang{display:flex;gap:4px}
.lang button{border:1px solid #5a442b;background:#1d130b;color:var(--dim);padding:3px 6px;border-radius:5px;cursor:pointer;font-size:.72rem}
.lang button.on{background:var(--gold);color:#3a2600;font-weight:700;border-color:var(--gold)}
.table{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:auto 1fr auto;gap:6px;padding:8px}
.seat{position:relative;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid #3a2b18;padding:6px;display:flex;flex-direction:column;gap:4px;min-height:0}
.seat.me{border-color:#c9a84c}
.seat .who{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--dim)}
.seat .who .role{font-size:.7rem;padding:1px 6px;border-radius:4px;background:#3a2818;color:var(--gold2)}
.seat .hp{display:flex;gap:3px}
.seat .hp i{width:13px;height:13px;border-radius:50%;background:#c0392b;box-shadow:inset 0 0 0 2px #701515}
.seat .hp i.off{background:#4a4038;box-shadow:inset 0 0 0 2px #2b251f}
.seat .handc{font-size:.72rem;color:var(--dim)}
.seat .equip{display:flex;gap:4px;flex-wrap:wrap;font-size:.72rem;color:var(--gold2)}
.dead-veil{position:absolute;inset:0;background:rgba(0,0,0,.62);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#b33;font-weight:800;font-size:1.2rem;z-index:3}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.piles{display:flex;gap:14px;align-items:center}
.pile{position:relative;width:70px;height:96px;border-radius:8px;background:linear-gradient(160deg,#5b2b1d,#3a1710);border:1px solid #8a5a33;display:flex;align-items:center;justify-content:center;color:#e6c875;font-size:.8rem;font-weight:700;text-align:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pile .n{position:absolute;top:-7px;right:-6px;background:var(--gold);color:#3a2600;border-radius:50%;width:20px;height:20px;font-size:.68rem;display:flex;align-items:center;justify-content:center;font-weight:800}
.pile.back{background:linear-gradient(160deg,#7a1f1f,#3a0d0d);border-color:#a84a4a}
.log{width:100%;height:100%;min-height:56px;overflow:auto;font-size:.76rem;color:#c9b78e;background:rgba(0,0,0,.25);border:1px solid #3a2b18;border-radius:8px;padding:6px;line-height:1.5}
.log .ln{border-bottom:1px dotted #3a2b18;padding:2px 0}
.log .ln.me{color:#e6c875}
.hand{grid-column:1/-1;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 8px;background:linear-gradient(180deg,#1d130b,#2b1d12);border:1px solid #4a3823;border-radius:12px;min-height:150px}
.hand .empty{color:var(--dim);font-size:.82rem}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card{position:relative;flex:0 0 auto;width:var(--cardw);height:var(--cardh);border-radius:8px;background:linear-gradient(170deg,var(--parch),var(--parch2));color:#2b1d12;border:2px solid #c9a84c;box-shadow:0 3px 8px rgba(0,0,0,.45);cursor:pointer;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .12s,margin-top .12s}
.card:hover,.card.sel{transform:translateY(-6px)}
.card.sel{border-color:#fff;box-shadow:0 0 0 2px #fff}
.card .corner{position:absolute;left:4px;top:2px;font-size:.72rem;font-weight:800;line-height:1.05}
.card .ctype{font-size:.56rem;color:#6b5333;margin-top:10px}
.card .big{font-size:1.7rem;font-weight:900;color:var(--red)}
.card.black .big{color:#1a1a1a}
.card .nm{font-size:.78rem;font-weight:800;text-align:center}
.card .dsc{font-size:.55rem;color:#6b5333;text-align:center;line-height:1.2;overflow:hidden}
.card.equip .big{font-size:1.1rem}
.card.disabled{opacity:.35;cursor:not-allowed}
.card.back{background:linear-gradient(170deg,#5b1d1d,#2d0d0d);border-color:#a84a4a;color:#e6c875;align-items:center;justify-content:center}
.card.back .big{color:#e6c875;font-size:1.4rem}
.gencard{width:132px;border-radius:10px;background:linear-gradient(170deg,#2b1d12,#17100a);border:2px solid var(--gold);color:var(--ink);padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 12px rgba(0,0,0,.5);position:relative;overflow:hidden}
.gencard .fac{position:absolute;top:0;right:0;padding:2px 8px;font-size:.62rem;color:#fff;border-radius:0 0 0 8px}
.gencard .name{font-size:1.15rem;font-weight:900;color:var(--gold2)}
.gencard .sub{font-size:.66rem;color:var(--dim)}
.gencard .skills{font-size:.66rem;color:#d8c8b2;line-height:1.35}
.gencard .skills b{color:var(--gold2)}
.fac.wei{background:#3b5b8c}.fac.shu{background:#9c3b1f}.fac.wu{background:#3d7a4a}.fac.qun{background:#6b5333}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.mbox{background:linear-gradient(180deg,#2b1d12,#1d130b);border:1px solid var(--gold);border-radius:12px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:14px;color:var(--ink)}
.mbox h3{color:var(--gold2);margin:0 0 10px;text-align:center}
.mbox h4{color:var(--gold);margin:12px 0 4px}
.mbox p,.mbox li{font-size:.82rem;line-height:1.7;color:#d8c8b2}
.mbox table{width:100%;border-collapse:collapse;font-size:.76rem}
.mbox td,.mbox th{border:1px solid #4a3823;padding:5px;text-align:left;color:#d8c8b2}
.mbox th{color:var(--gold2);background:#2b1d12}
.close{float:right;background:none;border:none;color:var(--gold);font-size:1.4rem;cursor:pointer}
.role-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.role-pick .gencard{cursor:pointer}
.role-pick .gencard:hover{box-shadow:0 0 0 2px #fff}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#3a2818;border:1px solid var(--gold);color:#fff;padding:8px 16px;border-radius:8px;font-size:.85rem;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hint{text-align:center;color:var(--gold2);font-size:.84rem;min-height:22px;padding:2px}
@media (max-width:760px){:root{--cardw:68px;--cardh:96px}.gencard{width:104px}.top .tt{font-size:.9rem}.pile{width:54px;height:76px}}
/* ================= 华夏文脉·三国杀 特效层 FX ================= */
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:90;overflow:hidden}
.fx{position:absolute;pointer-events:none;will-change:transform,opacity;line-height:1;font-family:"PingFang SC","Microsoft YaHei",serif}
.fx-card{width:76px;height:98px;border-radius:9px;background:linear-gradient(165deg,#f6edd8,#e6d5b4);border:2px solid #c9a84c;box-shadow:0 10px 26px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px;color:#2b1d12;font-weight:800}
.fx-card .ct{font-size:10px;color:#8a6a35;align-self:flex-start;line-height:1.1}
.fx-card .big{font-size:21px;color:#9c1f1f;font-weight:900;line-height:1.1}
.fx-card.black .big{color:#1d1d1d}
.fx-card .nm{font-size:11px;text-align:center;line-height:1.15}
.fx-p{width:7px;height:7px;border-radius:50%}
.fx-glyph{font-weight:900;text-shadow:0 0 22px currentColor,0 4px 8px rgba(0,0,0,.65)}
.fx-text{font-weight:900;text-shadow:0 0 10px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.6);white-space:nowrap}
.fx-banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;text-shadow:0 0 20px currentColor,0 4px 10px rgba(0,0,0,.75);letter-spacing:8px;z-index:47}
.fx-stamp{font-weight:900;text-shadow:0 0 16px currentColor,0 3px 6px rgba(0,0,0,.6);transform:rotate(-14deg);border:3px solid currentColor;border-radius:10px;padding:2px 12px;background:rgba(0,0,0,.3)}
.fx-sweep{position:absolute;top:-12%;bottom:-12%;width:46%;left:0;border-radius:6px}
.fx-vign{position:absolute;inset:0}
/* 座位光效 */
@keyframes fxSeatGold{0%{box-shadow:0 0 0 0 rgba(230,200,117,0);border-color:#3a2b18}18%{box-shadow:0 0 0 5px rgba(230,200,117,.92),0 0 30px 10px rgba(201,168,76,.6);border-color:#e6c875}100%{box-shadow:0 0 0 0 rgba(230,200,117,0);border-color:#3a2b18}}
.fx-seat-gold{animation:fxSeatGold .95s ease-out}
@keyframes fxSeatRed{0%{box-shadow:0 0 0 0 rgba(220,60,60,0);border-color:#3a2b18}18%{box-shadow:0 0 0 6px rgba(235,70,70,.95),0 0 34px 12px rgba(200,30,30,.66);border-color:#e04040}100%{box-shadow:0 0 0 0 rgba(220,60,60,0);border-color:#3a2b18}}
.fx-seat-red{animation:fxSeatRed .75s ease-out}
@keyframes fxSeatGreen{0%{box-shadow:0 0 0 0 rgba(90,220,140,0);border-color:#3a2b18}18%{box-shadow:0 0 0 5px rgba(110,235,160,.92),0 0 30px 10px rgba(60,180,110,.6);border-color:#6ee0a0}100%{box-shadow:0 0 0 0 rgba(90,220,140,0);border-color:#3a2b18}}
.fx-seat-green{animation:fxSeatGreen .95s ease-out}
/* 屏幕震动 */
@keyframes fxShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-8px,4px)}28%{transform:translate(7px,-5px)}44%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}76%{transform:translate(-3px,2px)}}
.fx-shake{animation:fxShake .45s linear}
/* 出牌高光：选中牌呼吸金边 */
.card.sel{animation:cardSelPulse 1s ease-in-out infinite}
@keyframes cardSelPulse{0%,100%{box-shadow:0 0 0 2px #fff,0 0 14px 3px rgba(255,255,255,.7)}50%{box-shadow:0 0 0 3px #ffe9a8,0 0 26px 8px rgba(255,230,150,.95)}}
/* 目标座位提示 */
.seat.can-target{border-color:#ffd76e!important;box-shadow:0 0 12px 3px rgba(255,215,110,.55),inset 0 0 12px rgba(255,215,110,.14);cursor:crosshair}
@media (max-width:760px){.fx-banner{font-size:22px;letter-spacing:4px}.fx-card{width:58px;height:78px}.fx-card .big{font-size:16px}.fx-card .nm{font-size:9px}.fx-card .ct{font-size:8px}}


/* ============ 开局居中面板 ============ */
#sgsStart{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(1100px 640px at 50% 28%,rgba(74,50,28,.92),rgba(14,9,5,.97));font-family:"PingFang SC","Microsoft YaHei",serif;padding:16px}
#sgsStart.on{display:flex}
.sgs-start-card{width:min(460px,92vw);text-align:center;background:linear-gradient(180deg,#2b1d12,#1a1109);border:2px solid var(--gold);border-radius:18px;padding:30px 26px 26px;box-shadow:0 0 60px rgba(201,168,76,.28),0 24px 60px rgba(0,0,0,.6);animation:sgsStartIn .5s cubic-bezier(.2,.7,.3,1)}
.sgs-start-card .seal{font-size:2.1rem;font-weight:900;color:var(--gold2);letter-spacing:6px;text-shadow:0 0 24px rgba(230,200,117,.5)}
.sgs-start-card .sub{color:var(--dim);font-size:.9rem;margin:10px 0 4px;letter-spacing:2px}
.sgs-start-card .roles{color:#c9b78e;font-size:.82rem;margin:2px 0 18px;letter-spacing:3px}
.sgs-start-card .start-btn{display:block;width:100%;padding:14px 0;font-size:1.25rem;font-weight:900;letter-spacing:6px;color:#3a2600;background:linear-gradient(180deg,#f0d789,#c9a84c 55%,#a8842f);border:1px solid #8a6a2a;border-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s}
.sgs-start-card .start-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 22px rgba(230,200,117,.55)}
.sgs-start-card .tip{color:#a8956f;font-size:.72rem;margin-top:14px;line-height:1.7}
@keyframes sgsStartIn{0%{opacity:0;transform:scale(.86) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}

</style>
</head>

function distance(a,b){var n=G.players.length;var i=idxOf(a),j=idxOf(b);var d=Math.min(Math.abs(i-j),n-Math.abs(i-j));if(a.equip.horseM)d--;if(b.equip.horseP)d++;if(hasSkill(a,'mashu'))d--;return Math.max(1,d);}

 els.forEach(function(el){el.classList.remove('can-target');var s=parseInt(el.dataset.s);el.onclick=(function(ss){return function(){try{window.SG&&SG.clickSeat(ss);}catch(e){}};})(s);var i=(humanI+s)%4;var p=G.players[i];if(!p)return;
  el.innerHTML='';
  if(!p.alive){el.innerHTML='<div class="dead-veil">阵亡</div>';return;}
  var hp='';for(var k=0;k<p.maxHp;k++)hp+='<i class="'+(k<p.hp?'':'off')+'"></i>';
  var eq=[];if(p.equip.weapon)eq.push(N(C[p.equip.weapon].name));if(p.equip.armor)eq.push(N(C[p.equip.armor].name));if(p.equip.horseP)eq.push('+1');if(p.equip.horseM)eq.push('-1');
  var role=(p.lord||p===human())?('<span class="role">'+T(p.role)+'</span>'):'';

  if(s!==0){el.innerHTML+='<div class="gencard" style="width:auto;margin-top:2px">'+genCardHtml(p,false)+'</div>';}
 });
}
function renderHand(){
 var el=document.getElementById('hand');if(!G)return;var p=human();

function renderHint(msg){var el=document.getElementById('hint');if(msg)el.textContent=msg;}
function renderActions(btns){var el=document.getElementById('actions');el.innerHTML='';if(!btns)return;btns.forEach(function(b){var x=document.createElement('button');x.className='btn '+(b.cls||'');x.textContent=b.t;x.disabled=!!b.dis;x.onclick=b.fn;el.appendChild(x);});}
function renderAll(msg){renderSeats();renderHand();renderActions(null);if(msg)renderHint(msg);}

/* ===================== 对局流程 ===================== */
function newGame(){
 if(G&&alive().length>1&&!confirm(T('confirmNew')))return;
 var roles=shuffle(['lord','loyal','rebel','spy']);
 var gens=shuffle(GENS.map(function(g){return g.id;})).slice(0,4);
 G={players:[],turn:0,phase:'',usedSlash:0,deck:[],discard:[],over:false,luoyi:false,gaveThisTurn:0};
 buildDeck();
 for(var i=0;i<4;i++){
  var g=genById(gens[i]);var role=roles[i];
  G.players.push({id:i,name:i===0?T('you'):('AI '+(i)),ai:i!==0,role:role,fac:g.fac,gid:g.id,skills:g.skills.map(function(s){return s.c;}),hp:g.hp,maxHp:g.hp,hand:[],equip:{weapon:null,armor:null,horseP:null,horseM:null},alive:true,lord:role==='lord'});
 }
 var lord=G.players.filter(function(p){return p.lord;})[0];lord.hp++;lord.maxHp++;
 G.players.forEach(function(p){p.hand=draw(4);});
 G.turn=idxOf(lord);
 var _lg0=document.getElementById('log');if(_lg0)_lg0.innerHTML='';
 log(T('roleIntro'));
 closeModal();
 renderSeats();renderHand();
 var hu=human();renderHint(T('yourTurn')+' · '+N(genById(hu.gid).name)+' · '+T(hu.role));
 startTurn();
}
function startTurn(){
 var p=cur();G.usedSlash=0;G.luoyi=false;G.gaveThisTurn=0;G.phase='draw';
 renderAll(N(genById(p.gid).name)+' · '+T('phaseStart'));
 setTimeout(drawPhase,500);
}
function drawPhase(){
 var p=cur();var n=2;if(hasSkill(p,'yingzi'))n++;
 var cards=draw(n);p.hand=p.hand.concat(cards);
 log(p.name+' '+T('cardDrawn')+' '+n+' '+T('draw'));
 snd('draw');
 G.phase='play';renderAll();
 if(p.ai){setTimeout(aiPlay,600);}else{enableHumanPlay();}
}
function endTurn(){
 var p=cur();G.phase='discard';
 var limit=G.players.length>0?p.hp:0;
 var keji=hasSkill(p,'keji')&&G.usedSlash===0;
 if(!keji&&p.hand.length>limit){renderHint(T('discardHint')+' ('+p.hand.length+'/'+limit+')');if(p.ai){aiDiscard(p.hand.length-limit);}else{beginDiscard(p.hand.length-limit);return;}}
 finishTurn();
}
function resumePlay(){if(G&&!G.over&&!PENDING&&G.phase==='play'){var p=human();if(p&&p.alive&&cur()===p){enableHumanPlay();}else{renderSeats();}}}
function finishTurn(){
 var p=cur();
 if(hasSkill(p,'biyue')){var c=draw(1);p.hand=p.hand.concat(c);log(p.name+' 闭月 '+T('draw')+' 1');snd('card');}
 renderAll();
 if(checkWin())return;
 G.turn=(G.turn+1)%G.players.length;
 while(!cur().alive)G.turn=(G.turn+1)%G.players.length;
 startTurn();
}

/* ===================== 人类出牌 ===================== */
function enableHumanPlay(){renderSeats();renderHand();var p=human();var btns=[];
 if(hasSkill(p,'zhiheng'))btns.push({t:'制衡',fn:function(){SG.skillZhiheng();}});
 if(hasSkill(p,'kurou'))btns.push({t:'苦肉',fn:function(){SG.skillKurou();}});
 btns.push({t:T('end'),cls:'gold',fn:function(){SG.endPlay();}});
 renderActions(btns);renderHint(T('myHand')+' · '+T('play'));
}
function endPlay(){if(G.phase!=='play')return;SEL=null;endTurn();}
function clickSeat(s){if(!SEL||!G)return;var p=human();var i=(idxOf(p)+s)%4;var tgt=G.players[i];if(tgt===p||!tgt.alive)return;var ci=SEL.cardIdx;var _cd=p.hand[ci];if(_cd&&validTargets(_cd.id).indexOf(tgt)<0){showToast(T('noTarget'));return;}SEL=null;resolvePlay(p,ci,tgt);}
function validTargets(id){var p=human();var r=[];for(var i=0;i<G.players.length;i++){var t=G.players[i];if(t===p||!t.alive)continue;
 if(id==='sha'){if(!inRange(p,t))continue;if(hasSkill(t,'kongcheng')&&t.hand.length===0)continue;r.push(t);}
 else if(id==='shunshou'){if(distance(p,t)!==1)continue;r.push(t);}
 else {r.push(t);}
 }return r;}
function clickCard(i){var p=human();if(!p.alive)return;
 if(PENDING){pendingCard(i);return;}
 if(G.phase!=='play'||cur()!==p)return;__fxCardTap(i);
 var cd=p.hand[i],id=cd.id,cat=C[id].cat;
 if(cat==='weapon'||cat==='armor'||cat==='horseP'||cat==='horseM'){equipCard(p,i);return;}
 if(id==='tao'){if(p.hp<p.maxHp)useTao(p,i,null);else showToast(T('noTarget'));return;}
 if(id==='wuzhong'){useWuzhong(p,i);return;}
 if(id==='taoyuan'){useTaoyuan(p,i);return;}
 if(id==='nanman'||id==='wanqi'){useAoe(p,i);return;}
 if(id==='wuxie'){showToast('无懈可击 · v1 暂作响应牌');return;}
 var vt=validTargets(id);if(!vt.length){showToast(T('noTarget'));return;}
 SEL={cardIdx:i};renderHint(T('target')+' · '+cardName(id));renderSeats();__fxMarkTargets(id);
}
function resolvePlay(p,i,tgt){var cd=p.hand[i];var id=cd.id;playCardFx(p,i,tgt,cd);
 if(id==='sha')useSha(p,i,tgt);
 else if(id==='guohe')useDismantle(p,i,tgt);
 else if(id==='shunshou')useSnatch(p,i,tgt);
 else if(id==='juedou')useDuel(p,i,tgt);
 else if(id==='jiedao')useBorrow(p,i,tgt);
}
/* ---------- 杀 ---------- */
function useSha(p,i,tgt){var cd=removeHand(p,i);G.discard.push(cd);G.usedSlash++;log(p.name+' '+T('used')+' '+T('sha')+' '+T('attacked')+' '+tgt.name);snd('sha');renderAll();resolveSlash(p,tgt,cd);resumePlay();slashFx(p,tgt,cd);}
function resolveSlash(src,tgt,cd){var black=cd.color==='black';if(tgt.equip.armor==='renwang'&&black&&!(src.equip.weapon==='qinggang')){log(tgt.name+' 仁王盾');snd('dodge');renwangFx(tgt);return;}var need=hasSkill(src,'wushuang')?2:1;askDodge(src,tgt,need);}
function validDodge(p){var r=[];for(var i=0;i<p.hand.length;i++){var id=p.hand[i].id;if(id==='shan')r.push(i);else if(hasSkill(p,'qingguo')&&p.hand[i].color==='black')r.push(i);else if(hasSkill(p,'longdan')&&id==='sha')r.push(i);}return r;}
function askDodge(src,tgt,need){if(tgt.ai){var d=validDodge(tgt);var use=d.slice(0,need);if(use.length>=need){use.forEach(function(i){var c=tgt.hand.splice(i,1)[0];G.discard.push(c);});for(var k=0;k<need;k++){}log(tgt.name+' '+T('shan'));snd('dodge');dodgeFx(tgt);renderSeats();}else{applyDamage(src,tgt,1,'sha');}return;}
 PENDING={type:'dodge',src:src,tgt:tgt,need:need};renderPending();}
function renderPending(){var P=PENDING;renderHand();renderActions(null);renderHint('');
 if(P.type==='dodge'){var d=validDodge(human());var can=d.length>=P.need;renderActions([{t:T('respondSlashBtn')+' ×'+P.need,cls:'red',dis:!can,fn:function(){humanDodge();}},{t:T('takeDamage'),fn:function(){var src=P.src,tgt=P.tgt;PENDING=null;applyDamage(src,tgt,1,'sha');}}]);renderHint(P.src.name+' → '+P.tgt.name+' · '+T('respondSlash'));}
 if(P.type==='dying'){var p=P.p;var t=validTao(p);var can=t.length>0;renderActions([{t:T('useTao'),cls:'gold',dis:!can,fn:function(){humanDyingTao();}},{t:T('skip'),fn:function(){PENDING=null;finishDeath(p);}}]);renderHint(T('dyingHint'));}
}
function pendingCard(i){var P=PENDING;if(!P)return;
 if(P.type==='discard'){pendingDiscard(i);return;}
 if(P.type==='dodge'){var p=human();var idx=P.used||0;var vd=validDodge(p);if(vd.indexOf(i)<0)return;var c=p.hand.splice(i,1)[0];G.discard.push(c);P.used=(P.used||0)+1;snd('dodge');if(P.used>=P.need){var src=P.src,tgt=P.tgt;PENDING=null;log(tgt.name+' '+T('shan'));renderAll();dodgeFx(human());}else{renderPending();}return;}
 if(P.type==='dying'){var p=P.p;var tv=validTao(p);if(tv.indexOf(i)<0)return;var c=p.hand.splice(i,1)[0];G.discard.push(c);p.hp++;snd('heal');log(p.name+' '+T('heal'));PENDING=null;renderAll();return;}
}
function humanDodge(){var P=PENDING;if(!P||P.type!=='dodge')return;var p=human();var vd=validDodge(p);if(vd.length<P.need)return;var src=P.src,tgt=P.tgt;for(var k=0;k<P.need;k++){var j=validDodge(p)[0];var c=p.hand.splice(j,1)[0];G.discard.push(c);}PENDING=null;log(tgt.name+' '+T('shan'));snd('dodge');renderAll();dodgeFx(human());}

/* ===================== 基础/装备/锦囊 ===================== */
function removeHand(p,i){return p.hand.splice(i,1)[0];}
function makeCard(id){return {id:id,suit:SUITS[rnd(4)],color:'red',num:rnd(13)+1};}
function equipCard(p,i){var cd=removeHand(p,i);var slot=cd.id;var old=null;
 if(slot==='liannu'||slot==='qinggang'||slot==='cixiong'||slot==='hanbing'||slot==='guanshi'||slot==='qinglong'||slot==='zhangba'||slot==='fangtian'||slot==='qilin'){old=p.equip.weapon;p.equip.weapon=slot;}
 else if(slot==='bagua'||slot==='renwang'){old=p.equip.armor;p.equip.armor=slot;}
 else if(slot==='horseP'){old=p.equip.horseP;p.equip.horseP=slot;}
 else if(slot==='horseM'){old=p.equip.horseM;p.equip.horseM=slot;}
 if(old){G.discard.push({id:old,suit:'s',color:'black',num:1});if(hasSkill(p,'xiaoji')){var c=draw(2);p.hand=p.hand.concat(c);log(p.name+' 枭姬 摸2');}}
 log(p.name+' '+T('equip')+' '+cardName(slot));snd('equip');renderAll();
 if(!p.ai){enableHumanPlay();}
}
function useTao(p,i,tgt){var cd=removeHand(p,i);G.discard.push(cd);var who=tgt||p;who.hp++;if(who.hp>who.maxHp)who.hp=who.maxHp;log(p.name+' '+T('used')+' '+T('tao')+' → '+who.name+' '+T('heal'));snd('heal');renderAll();if(!p.ai){enableHumanPlay();}}
function validTao(p){var r=[];for(var i=0;i<p.hand.length;i++){if(p.hand[i].id==='tao')r.push(i);else if(hasSkill(p,'jijiu')&&p.hand[i].color==='red')r.push(i);}return r;}
function useWuzhong(p,i){removeHand(p,i);G.discard.push({id:'wuzhong',suit:'h',color:'red',num:1});var c=draw(2);p.hand=p.hand.concat(c);log(p.name+' '+T('used')+' '+cardName('wuzhong'));snd('card');renderAll();if(!p.ai)enableHumanPlay();}
function useTaoyuan(p,i){removeHand(p,i);G.discard.push({id:'taoyuan',suit:'h',color:'red',num:1});alive().forEach(function(x){if(x.hp<x.maxHp){x.hp++;}});log(p.name+' '+T('used')+' '+cardName('taoyuan'));snd('heal');renderAll();if(!p.ai)enableHumanPlay();}
function useAoe(p,i){var cd=removeHand(p,i);G.discard.push(cd);var isNan=cd.id==='nanman';log(p.name+' '+T('used')+' '+cardName(cd.id));snd('card');renderAll();var others=alive().filter(function(x){return x!==p;});for(var k=0;k<others.length;k++){var t=others[k];if(isNan){var si=findShaIdx(t);if(si>=0){var sc=t.hand.splice(si,1)[0];G.discard.push(sc);log(t.name+' 打出【杀】');snd('sha');}else{applyDamage(p,t,1,null);}}else{var di=validDodge(t)[0];if(di>=0){var dc=t.hand.splice(di,1)[0];G.discard.push(dc);log(t.name+' 打出【闪】');snd('dodge');}else{applyDamage(p,t,1,null);}}}renderAll();if(!p.ai)enableHumanPlay();}
function useDismantle(p,i,tgt){removeHand(p,i);G.discard.push({id:'guohe',suit:'s',color:'black',num:1});var pool=[];if(tgt.equip.weapon)pool.push(tgt.equip.weapon);if(tgt.equip.armor)pool.push(tgt.equip.armor);if(tgt.equip.horseP)pool.push(tgt.equip.horseP);if(tgt.equip.horseM)pool.push(tgt.equip.horseM);if(tgt.hand.length)pool.push('hand');
 if(pool.length){var pick=pool[rnd(pool.length)];if(pick==='hand'){var j=rnd(tgt.hand.length);var c=tgt.hand.splice(j,1)[0];G.discard.push(c);}else{var slot=null;if(pick===tgt.equip.weapon)tgt.equip.weapon=null;else if(pick===tgt.equip.armor)tgt.equip.armor=null;else if(pick===tgt.equip.horseP)tgt.equip.horseP=null;else tgt.equip.horseM=null;G.discard.push({id:pick,suit:'s',color:'black',num:1});if(hasSkill(tgt,'xiaoji')){var cc=draw(2);tgt.hand=tgt.hand.concat(cc);}}}
 log(p.name+' '+T('used')+' '+cardName('guohe')+' → '+tgt.name);snd('card');renderAll();if(!p.ai)enableHumanPlay();}
function useSnatch(p,i,tgt){removeHand(p,i);G.discard.push({id:'shunshou',suit:'s',color:'black',num:1});var pool=[];if(tgt.equip.weapon)pool.push(tgt.equip.weapon);if(tgt.equip.armor)pool.push(tgt.equip.armor);if(tgt.equip.horseP)pool.push(tgt.equip.horseP);if(tgt.equip.horseM)pool.push(tgt.equip.horseM);if(tgt.hand.length)pool.push('hand');
 if(pool.length){var pick=pool[rnd(pool.length)];if(pick==='hand'){var j=rnd(tgt.hand.length);p.hand.push(tgt.hand.splice(j,1)[0]);}else{var got=pick;if(pick===tgt.equip.weapon)tgt.equip.weapon=null;else if(pick===tgt.equip.armor)tgt.equip.armor=null;else if(pick===tgt.equip.horseP)tgt.equip.horseP=null;else tgt.equip.horseM=null;p.hand.push({id:got,suit:'s',color:'black',num:1});if(hasSkill(tgt,'xiaoji')){var cc=draw(2);tgt.hand=tgt.hand.concat(cc);}}}
 log(p.name+' '+T('used')+' '+cardName('shunshou')+' → '+tgt.name);snd('card');renderAll();if(!p.ai)enableHumanPlay();}
function useDuel(p,i,tgt){removeHand(p,i);G.discard.push({id:'juedou',suit:'s',color:'black',num:1});log(p.name+' '+T('used')+' '+cardName('juedou')+' → '+tgt.name);snd('card');renderAll();duelResolve(p,tgt);}
function duelResolve(a,b){var attacker=a,defender=b;var k=0;while(k<20){var si=findShaIdx(defender);if(si<0){applyDamage(attacker,defender,1,null);break;}var sc=defender.hand.splice(si,1)[0];G.discard.push(sc);log(defender.name+' 打出【杀】');snd('sha');renderAll();var t=attacker;attacker=defender;defender=t;k++;}if(!a.ai)enableHumanPlay();}
function useBorrow(p,i,tgt){removeHand(p,i);G.discard.push({id:'jiedao',suit:'s',color:'black',num:1});log(p.name+' '+T('used')+' '+cardName('jiedao')+' → '+tgt.name);snd('card');
 if(tgt.equip.weapon){var w=tgt.equip.weapon;tgt.equip.weapon=null;G.discard.push({id:w,suit:'s',color:'black',num:1});if(hasSkill(tgt,'xiaoji')){var c=draw(2);tgt.hand=tgt.hand.concat(c);}log(tgt.name+' 失去武器');}else{var c=draw(1);p.hand=p.hand.concat(c);log(p.name+' 摸1');}
 renderAll();if(!p.ai)enableHumanPlay();}

/* ===================== 伤害/死亡/胜负 ===================== */
function findIdx(p,id){for(var i=0;i<p.hand.length;i++)if(p.hand[i].id===id)return i;return -1;}
function findShaIdx(p){for(var i=0;i<p.hand.length;i++){var id=p.hand[i].id;if(id==='sha')return i;if(hasSkill(p,'wusheng')&&p.hand[i].color==='red')return i;if(hasSkill(p,'longdan')&&id==='shan')return i;}return -1;}
function applyDamage(src,tgt,n,cardId){if(!tgt.alive)return;tgt.hp-=n;log((src?src.name+' ':'')+T('causeDmg')+' '+tgt.name+' '+n);snd('dmg');renderAll();
 if(tgt.alive&&src&&src!==tgt){
  if(hasSkill(tgt,'jianxiong')&&cardId){var c=makeCard(cardId);tgt.hand.push(c);log(tgt.name+' 奸雄');snd('card');}
  if(hasSkill(tgt,'fankui')&&src.hand.length){var j=rnd(src.hand.length);tgt.hand.push(src.hand.splice(j,1)[0]);log(tgt.name+' 反馈');snd('card');}
  if(hasSkill(tgt,'yiji')){var cc=draw(2);tgt.hand=tgt.hand.concat(cc);log(tgt.name+' 遗计 摸2');snd('card');}
  if(hasSkill(tgt,'ganglie')){if(src.hand.length>=2){var a=src.hand.splice(rnd(src.hand.length),1)[0];var b=src.hand.splice(rnd(src.hand.length),1)[0];G.discard.push(a);G.discard.push(b);log(src.name+' 刚烈 弃2');}else{src.hp--;log(src.name+' 刚烈 受伤');snd('dmg');if(src.hp<=0)checkDeath(src);}}
 }
 renderAll();checkDeath(tgt);
}
function checkDeath(p){if(!p.alive||p.hp>0)return;
 if(p.ai){var t=validTao(p)[0];if(t>=0){var c=p.hand.splice(t,1)[0];G.discard.push(c);p.hp++;log(p.name+' '+T('used')+' '+T('tao'));snd('heal');renderAll();return;}finishDeath(p);}
 else{PENDING={type:'dying',p:p};renderPending();}
}
function finishDeath(p){PENDING=null;p.alive=false;p.hp=0;log(p.name+' 阵亡 · '+T(p.role));snd('lose');p.hand.forEach(function(c){G.discard.push(c);});p.hand=[];if(p.equip.weapon)G.discard.push({id:p.equip.weapon,suit:'s',color:'black',num:1});p.equip={weapon:null,armor:null,horseP:null,horseM:null};renderAll();checkWin();}
function checkWin(){if(G.over)return true;var a=alive();var lord=a.find(function(p){return p.lord;});var rebels=a.filter(function(p){return p.role==='rebel';});var spies=a.filter(function(p){return p.role==='spy';});
 if(!lord){if(spies.length>0&&rebels.length===0)endGame('spy');else endGame('rebel');return true;}
 if(rebels.length===0&&spies.length===0){endGame('lord');return true;}
 return false;}
function endGame(role){if(G.over)return;G.over=true;snd(role==='lord'?'win':'lose');var t=role==='lord'?T('lordWin'):role==='rebel'?T('rebelWin'):T('spyWin');openModal('<h3>'+T('gameOver')+'</h3><p style="text-align:center;font-size:1.2rem">'+t+'</p><p style="text-align:center"><button class="btn gold" onclick="SG.newGame()">'+T('newGame')+'</button></p>');}
/* ===================== AI ===================== */
function aiEnemy(p){var a=alive();var lord=a.find(function(x){return x.lord;});if(p.role==='rebel'&&lord&&lord!==p)return lord;var others=a.filter(function(x){return x!==p;});if(p.role==='loyal'){var r=a.filter(function(x){return x.role==='rebel'||x.role==='spy';});if(r.length)return r[rnd(r.length)];}return others[rnd(others.length)];}
function aiDiscard(n){var p=cur();for(var k=0;k<n&&p.hand.length;k++){var j=rnd(p.hand.length);G.discard.push(p.hand.splice(j,1)[0]);}log(p.name+' '+T('discard')+' '+n);finishTurn();}
function aiPlay(){var p=cur();
 var i=0;while(i<p.hand.length){var id=p.hand[i].id,cat=C[id].cat;if(cat==='weapon'||cat==='armor'||cat==='horseP'||cat==='horseM'){equipCard(p,i);continue;}i++;}
 if(p.hp<p.maxHp){var ti=validTao(p)[0];if(ti>=0)useTao(p,ti,null);}
 var wi=findIdx(p,'wuzhong');if(wi>=0)useWuzhong(p,wi);
 if(alive().some(function(x){return x.hp<x.maxHp;})){var ty=findIdx(p,'taoyuan');if(ty>=0)useTaoyuan(p,ty);}

}

      if(!p.ai){ var el=q('#hand .card[data-i="'+i+'"]'); if(el)from=FX.rect(el); }

      if(!from)return;
      FX.ring(from.x,from.y,'#ffd76e',120,400,5);
      var to=tgt?FX.seatRect(tgt):null;
      if(to){ FX.flyCard(cd,from.x,from.y,to.x,to.y,440); FX.glowSeat(tgt,'gold'); FX.log('playfly:'+cd.id); }
      else { FX.glowSeat(p,'gold'); FX.log('play:'+cd.id); }
    }catch(e){ if(window.__SGS_DEBUG)console.error('playCardFx',e); }
  };
})();

/* ================= 批次2：杀 / 闪 特效 ================= */
(function(){
  window.slashFx=function(p,tgt,cd){
    try{
      var A=FX.seatRect(p), B=FX.seatRect(tgt); if(!A||!B)return;
      setTimeout(function(){
        FX.blade(A.x,A.y,B.x,B.y,'#ff5040');
        FX.ring(B.x,B.y,'#ff6a4a',130,430,6);
        FX.glyph(B.x,B.y,'杀','#ff5a3c',84);
        FX.burst((A.x+B.x)/2,(A.y+B.y)/2,['#ff7a4a','#fff','#e04040'],12,72,5);
        FX.log('slashfx:'+((cd&&cd.id)||'sha'));
      },80);
    }catch(e){ if(window.__SGS_DEBUG)console.error('slashFx',e); }
  };
  window.dodgeFx=function(p){
    try{
      var R=FX.seatRect(p); if(!R)return;
      FX.ring(R.x,R.y,'#bfe9ff',118,480,5);
      FX.glyph(R.x,R.y,'闪','#dff3ff',74);
      FX.burst(R.x,R.y,['#dff3ff','#fff','#9fd8ff'],10,52,5);
      FX.log('dodgefx');
    }catch(e){ if(window.__SGS_DEBUG)console.error('dodgeFx',e); }
  };
  window.renwangFx=function(p){
    try{
      var R=FX.seatRect(p); if(!R)return;
      FX.stamp(R.x,R.y,'无','#9aa7b5',52);
      FX.ring(R.x,R.y,'#9aa7b5',110,420,4);
      snd('renwang');
      FX.log('renwangfx');
    }catch(e){ if(window.__SGS_DEBUG)console.error('renwangFx',e); }
  };
})();

/* ================= 批次3：锦囊扫屏特效 ================= */
(function(){
  var CFG={
    wuzhong:{ch:'无',color:'#7fd4ff',vign:'rgba(80,190,255,.22)',band:'rgba(90,200,255,.62)'},
    taoyuan:{ch:'桃',color:'#ff9ecb',vign:'rgba(255,120,180,.22)',band:'rgba(255,150,200,.6)'},
    nanman:{ch:'蛮',color:'#ff5a3c',vign:'rgba(220,60,30,.28)',band:'rgba(240,90,50,.6)'},
    wanqi:{ch:'箭',color:'#9fd4ff',vign:'rgba(80,150,255,.24)',band:'rgba(120,190,255,.62)'},
    guohe:{ch:'拆',color:'#c9a0ff',vign:'rgba(150,90,255,.22)',band:'rgba(170,110,255,.58)'},
    shunshou:{ch:'顺',color:'#8ff0b0',vign:'rgba(80,220,150,.2)',band:'rgba(110,235,170,.58)'},
    juedou:{ch:'斗',color:'#ffb347',vign:'rgba(255,150,50,.24)',band:'rgba(255,180,80,.6)'},
    jiedao:{ch:'借',color:'#d8e2ee',vign:'rgba(160,180,205,.2)',band:'rgba(200,215,235,.55)'}
  };
  function trickFx(cd){
    try{
      var cfg=CFG[(cd&&cd.id)||'wuzhong']||CFG.wuzhong;
      var label=cd&&C[cd.id]?N(C[cd.id].name):'';
      FX.sweep({vign:cfg.vign,band:cfg.band,ch:cfg.ch,chColor:cfg.color,label:label});
      snd('trick');
      FX.log('trickfx:'+((cd&&cd.id)||'?'));
    }catch(e){ if(window.__SGS_DEBUG)console.error('trickFx',e); }
  }
  function wrap(name,getId){
    var _f=window[name];
    window[name]=function(){
      var id=null;
      try{ var p=arguments[0],i=arguments[1]; id=(p&&p.hand&&p.hand[i])?p.hand[i].id:null; }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(id){ trickFx({id:id}); FX.log('trickwrap:'+name); } }catch(e){ if(window.__SGS_DEBUG)console.error('trickwrap',name,e); }
      return r;
    };
  }
  wrap('useWuzhong');
  wrap('useTaoyuan');
  wrap('useAoe');
  wrap('useDismantle');
  wrap('useSnatch');
  wrap('useDuel');
  wrap('useBorrow');
})();

/* ================= 批次4：装备 / 马 特效 ================= */
(function(){
  var WEAPONS={liannu:1,qinggang:1,cixiong:1,hanbing:1,guanshi:1,qinglong:1,zhangba:1,fangtian:1,qilin:1};
  function kind(id){ if(WEAPONS[id])return 'weapon'; if(id==='bagua'||id==='renwang')return 'armor'; return 'horse'; }
  function equipFx(p,id,from){
    try{
      if(!id)return;
      var R=FX.seatRect(p); if(!R)return;
      var k=kind(id), color=k==='weapon'?'#ffd76e':k==='armor'?'#9fd4ff':'#b9a6ff';
      var ch=k==='weapon'?'武':k==='armor'?'防':'马';
      var label=C[id]?N(C[id].name):id;
      var arrive=function(){
        FX.ring(R.x,R.y,color,150,520,6);
        FX.glyph(R.x,R.y,ch,color,84);
        FX.text(R.x,R.y-58,label,color,26);
        FX.burst(R.x,R.y,[color,'#fff'],12,64,6);
        FX.glowSeat(p,'gold');
        FX.log('equipfx:'+id);
      };
      if(from){ FX.flyCard({id:id,suit:'h',color:'red',num:1},from.x,from.y,R.x,R.y,360); setTimeout(arrive,230); }
      else { arrive(); }
      if(k==='horse'){ snd('horse'); } else { snd('equip'); }
    }catch(e){ if(window.__SGS_DEBUG)console.error('equipFx',e); }
  }
  var _f=window.equipCard;
  window.equipCard=function(p,i){
    var cd=null,from=null;
    try{ cd=p.hand[i]; if(!p.ai){ var el=document.querySelector('#hand .card[data-i="'+i+'"]'); if(el)from=FX.rect(el); } }catch(e){}
    var r=_f.apply(null,arguments);
    try{ equipFx(p,cd?cd.id:null,from); }catch(e){ if(window.__SGS_DEBUG)console.error('equip wrap',e); }
    return r;
  };
})();

/* ================= 批次5：扣血 / 摸牌 / 回合光效 / 回复 ================= */
(function(){
  function backSprite(){
    var d=document.createElement('div'); d.className='fx fx-card';
    d.style.cssText='background:linear-gradient(165deg,#8a2626,#431010);border-color:#b06060;color:#e6c875';
    d.innerHTML='<span class="ct" style="color:#d8a86a">牌</span><span class="big" style="color:#e6c875;font-size:30px">三國</span><span class="nm" style="color:#c9a84c">华夏文脉</span>';
    return d;
  }
  window.FX.drawCards=function(pl,n){
    try{
      var from=window.FX.rect('#pileDeck'), to=window.FX.seatRect(pl);
      if(!from||!to||!n)return;
      for(var j=0;j<n;j++){(function(j){
        setTimeout(function(){
          var d=backSprite();
          d.style.cssText+=';left:'+(from.x-38)+'px;top:'+(from.y-49)+'px;opacity:.98';
          (document.getElementById('fx')||document.body).appendChild(d);
          var dx=to.x-from.x, dy=to.y-from.y;
          try{ var a=d.animate([
            {transform:'translate(0,0) scale(.72) rotate(0deg)',opacity:1},
            {transform:'translate('+(dx*.5)+'px,'+(dy*.5-46)+'px) scale(1.02) rotate(6deg)',opacity:1,offset:.55},
            {transform:'translate('+dx+'px,'+dy+'px) scale(.3) rotate(-10deg)',opacity:0}
          ],{duration:330,easing:'cubic-bezier(.35,.05,.5,1)'});
            a.finished.then(function(){ if(d.parentNode)d.parentNode.removeChild(d); }).catch(function(){});
          }catch(e){ if(d.parentNode)d.parentNode.removeChild(d); }
          window.FX.log('drawcard:'+pl.name);
        }, j*90);
      })(j);}
      setTimeout(function(){ window.FX.glowSeat(pl,'gold'); }, n*90+40);
    }catch(e){ if(window.__SGS_DEBUG)console.error('drawCards',e); }
  };

  function dmgFx(tgt,n){
    var R=window.FX.seatRect(tgt); if(!R)return;
    window.FX.ring(R.x,R.y,'#ff3c2f',150,540,6);
    window.FX.burst(R.x,R.y,['#ff5a4a','#ffd0c0','#ffffff'],14,78,6);
    window.FX.text(R.x,R.y,'-'+n,'#ff5040',42);
    window.FX.glowSeat(tgt,'red');
    window.FX.log('dmgfx:'+n);
  }
  function healFx(who){
    var R=window.FX.seatRect(who); if(!R)return;
    window.FX.text(R.x,R.y,'+1','#6ee0a0',38);
    window.FX.burst(R.x,R.y,['#6ee0a0','#d8ffd8','#fff'],10,52,5);
    window.FX.glowSeat(who,'green');
    window.FX.log('healfx');
  }

  // 扣血
  (function(){ var _f=window.applyDamage;
    window.applyDamage=function(src,tgt,n,cardId){
      var hpB=0; try{ hpB=tgt?tgt.hp:0; }catch(e){}
      var r=_f.apply(null,arguments);
      try{
        if(tgt&&tgt.hp<hpB){ dmgFx(tgt,hpB-tgt.hp); if(tgt===human()||(src&&src===human()))window.FX.shake(360); }
      }catch(e){ if(window.__SGS_DEBUG)console.error('applyDamage fx',e); }
      return r;
    };
  })();

  // 摸牌阶段
  (function(){ var _f=window.drawPhase;
    window.drawPhase=function(){
      var p=null,n=2; try{ p=cur(); if(hasSkill(p,'yingzi'))n++; }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(p)window.FX.drawCards(p,n); }catch(e){ if(window.__SGS_DEBUG)console.error('drawPhase fx',e); }
      return r;
    };
  })();

  // 回合开始光效
  (function(){ var _f=window.startTurn;
    window.startTurn=function(){
      var p=null; try{ p=cur(); }catch(e){}
      var r=_f.apply(null,arguments);
      try{
        if(p){
          window.FX.glowSeat(p,'gold');
          if(p===human()){ window.FX.banner((N(genById(p.gid).name)||p.name)+' · '+T('phaseStart'),'#e6c875',34); snd('turn'); }
          else { snd('phase'); }
          window.FX.log('turnfx:'+p.name);
        }
      }catch(e){ if(window.__SGS_DEBUG)console.error('startTurn fx',e); }
      return r;
    };
  })();

  // 桃/回复
  (function(){ var _f=window.useTao;
    window.useTao=function(p,i,tgt){
      var who=null,hpB=0; try{ who=tgt||p; hpB=who.hp; }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(who&&who.hp>hpB){ healFx(who); } }catch(e){ if(window.__SGS_DEBUG)console.error('useTao fx',e); }
      return r;
    };
  })();

  // 制衡 / 苦肉 摸牌
  (function(){ var _f=window.skillZhiheng;
    window.skillZhiheng=function(){
      var p=null,n=0; try{ p=human(); n=p.hand.length; }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(p)window.FX.drawCards(p,n); }catch(e){ if(window.__SGS_DEBUG)console.error('zhiheng fx',e); }
      return r;
    };
  })();
  (function(){ var _f=window.skillKurou;
    window.skillKurou=function(){
      var p=null; try{ p=human(); }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(p)window.FX.drawCards(p,2); }catch(e){ if(window.__SGS_DEBUG)console.error('kurou fx',e); }
      return r;
    };
  })();

  // 修复：humanDyingTao 原从未定义（濒死时无法用桃自救），此处补上（不改规则）
  window.humanDyingTao=function(){
    try{
      if(!PENDING||PENDING.type!=='dying')return;
      var p=PENDING.p; var tv=validTao(p); if(!tv.length)return;
      var c=p.hand.splice(tv[0],1)[0]; G.discard.push(c); p.hp++;
      log(p.name+' '+T('used')+' '+T('tao')); snd('heal');
      healFx(p);
      PENDING=null; renderAll();
    }catch(e){ if(window.__SGS_DEBUG)console.error('humanDyingTao',e); }
  };
})();

/* ================= 批次6：收尾（阵亡 / 胜负 / 濒死氛围 / 收尾润色） ================= */
(function(){
  function overlayCss(color){
    var d=document.createElement('div'); d.className='fx';
    d.style.cssText='position:fixed;left:0;top:0;width:100vw;height:100vh;background:'+color+';opacity:0';
    (document.getElementById('fx')||document.body).appendChild(d);
    try{ var a=d.animate([{opacity:0},{opacity:1,offset:.25},{opacity:.9,offset:.7},{opacity:0}],{duration:1100,easing:'ease-out'});
      a.finished.then(function(){ if(d.parentNode)d.parentNode.removeChild(d); }).catch(function(){});
    }catch(e){ if(d.parentNode)d.parentNode.removeChild(d); }
    return d;
  }
  function confetti(n,colors,power){
    n=n||60; colors=colors||['#ffd76e','#e6c875','#fff3c4','#ff9e6a','#9fd4ff']; power=power||520;
    var W=window.innerWidth;
    for(var i=0;i<n;i++){
      var x=Math.random()*W, y=-20-Math.random()*80;
      var p=document.createElement('div'); p.className='fx fx-p';
      var size=4+Math.random()*5;
      p.style.cssText='left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+(size*1.6)+'px;border-radius:1px;background:'+colors[i%colors.length];
      (document.getElementById('fx')||document.body).appendChild(p);
      var dx=(Math.random()-.5)*240, dy=power*(.5+Math.random()*.7), rot=(Math.random()-.5)*720;
      try{ var a=p.animate([
        {transform:'translate(0,0) rotate(0deg)',opacity:1},
        {transform:'translate('+(dx*.4)+'px,'+(dy*.5)+'px) rotate('+(rot*.4)+'deg)',opacity:1,offset:.5},
        {transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg)',opacity:0}
      ],{duration:1600+Math.random()*900,easing:'cubic-bezier(.2,.4,.5,1)'});
        a.finished.then(function(){ if(p.parentNode)p.parentNode.removeChild(p); }).catch(function(){});
      }catch(e){ if(p.parentNode)p.parentNode.removeChild(p); }
    }
  }
  window.FX.confetti=confetti;
  window.FX.overlay=overlayCss;

  function deathFx(p){
    var R=window.FX.seatRect(p); if(!R)return;
    overlayCss('rgba(120,10,10,.25)');
    window.FX.ring(R.x,R.y,'#8a1f1f',190,900,9);
    window.FX.burst(R.x,R.y,['#5a2a2a','#8a1f1f','#d8b0a0','#fff'],18,100,7);
    window.FX.stamp(R.x,R.y,'阵亡','#c0392b',66);
    snd('death');
    window.FX.log('deathfx:'+p.name);
  }
  function dyingFx(p){
    var R=window.FX.seatRect(p); if(!R)return;
    overlayCss('rgba(160,20,20,.16)');
    window.FX.glowSeat(p,'red');
    window.FX.log('dyingfx');
  }
  function resultFx(role){
    try{
      var p=human(); if(!p)return;
      var win = (role==='lord'&&(p.role==='lord'||p.role==='loyal')) || (role==='rebel'&&p.role==='rebel') || (role==='spy'&&p.role==='spy');
      if(win){ overlayCss('rgba(255,215,120,.20)'); window.FX.confetti(70,['#ffd76e','#e6c875','#fff3c4','#ff9e6a','#9fd4ff']); window.FX.banner('胜利','#ffd76e',56); snd('win'); }
      else { overlayCss('rgba(40,40,48,.28)'); window.FX.confetti(46,['#7a8088','#5a5f66','#9aa0a8']); window.FX.banner('败北','#c9c9cf',56); snd('lose'); }
      window.FX.log('resultfx:'+role+(win?'/win':'/lose'));
    }catch(e){ if(window.__SGS_DEBUG)console.error('resultFx',e); }
  }

  // 阵亡
  (function(){ var _f=window.finishDeath;
    window.finishDeath=function(p){
      var was=null; try{ was=p?p.alive:null; }catch(e){}
      var r=_f.apply(null,arguments);
      try{ if(p&&was&&!p.alive)deathFx(p); }catch(e){ if(window.__SGS_DEBUG)console.error('finishDeath fx',e); }
      return r;
    };
  })();

  // 濒死氛围（人类）
  (function(){ var _f=window.checkDeath;
    window.checkDeath=function(p){
      var r=_f.apply(null,arguments);
      try{ if(p&&!p.ai&&p.hp<=0&&p.alive&&PENDING&&PENDING.type==='dying')dyingFx(p); }catch(e){ if(window.__SGS_DEBUG)console.error('checkDeath fx',e); }
      return r;
    };
  })();

  // 胜负
  (function(){ var _f=window.endGame;
    window.endGame=function(role){
      var r=_f.apply(null,arguments);
      try{ resultFx(role); }catch(e){ if(window.__SGS_DEBUG)console.error('endGame fx',e); }
      return r;
    };
  })();
})();

/* ============ 开局居中「开始新游戏」 ============ */
(function(){
  var ov=null;
  function ensure(){
    if(ov)return ov;
    ov=document.createElement('div'); ov.id='sgsStart';
    ov.innerHTML='<div class="sgs-start-card">'+
      '<div class="seal">三国杀</div>'+
      '<div class="sub">华夏文脉 · 身份局</div>'+
      '<div class="roles">主公 · 忠臣 · 反贼 · 内奸</div>'+
      '<button class="start-btn" id="sgsStartBtn">▶ 开始新游戏</button>'+
      '<div class="tip">消灭敌对阵营即可获胜 · 每回合 摸牌→出牌→弃牌<br>点击任意按钮将开启音效</div>'+
      '</div>';
    document.body.appendChild(ov);
    ov.querySelector('#sgsStartBtn').onclick=function(){ try{ SG.newGame(); }catch(e){} };
    return ov;
  }
  function show(){ var e=ensure(); e.className='on'; }
  function hide(){ if(ov)ov.className=''; }
  window.__sgsStartShow=show; window.__sgsStartHide=hide;
  // 把 newGame 包一层：开局后自动收起居中面板（顶栏/结束弹窗按钮同样生效）
  var _n=window.SG.newGame;
  window.SG.newGame=function(){ var r=_n.apply(null,arguments); hide(); return r; };
  window.newGame=window.SG.newGame;
  // 语言切换时按钮文字跟随
  var _s=window.SG.setLang;
  window.SG.setLang=function(l){ var r=_s.apply(null,arguments); var b=document.getElementById('sgsStartBtn'); if(b)b.textContent=(LANG==='zh'||LANG==='tw')?'▶ 开始新游戏':'▶ '+T('newGame'); return r; };
  window.setLang=window.SG.setLang;
  // 初始：未开局则居中显示
  function initUI(){ ensure(); var b=document.getElementById('sgsStartBtn'); if(b)b.textContent=(LANG==='zh'||LANG==='tw')?'▶ 开始新游戏':'▶ '+T('newGame'); if(typeof G==='undefined'||!G){ show(); } else { hide(); } }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',initUI); } else { initUI(); }
})();
