  chapters:{
    'zh-CN':[
      {n:1,t:'始计第一',c:'孙子曰：兵者，国之大事，死生之地，存亡之道，不可不察也。\n故经之以五事，校之以计，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。道者，令民与上同意也，故可以与之死，可以与之生，而不畏危。天者，阴阳、寒暑、时制也。地者，远近、险易、广狭、死生也。将者，智、信、仁、勇、严也。法者，曲制、官道、主用也。凡此五者，将莫不闻，知之者胜，不知者不胜。\n故校之以计，而索其情。曰：主孰有道？将孰有能？天地孰得？法令孰行？兵众孰强？士卒孰练？赏罚孰明？吾以此知胜负矣。将听吾计，用之必胜，留之；将不听吾计，用之必败，去之。\n计利以听，乃为之势，以佐其外。势者，因利而制权也。兵者，诡道也。故能而示之不能，用而示之不用，近而示之远，远而示之近。利而诱之，乱而取之，实而备之，强而避之，怒而挠之，卑而骄之，佚而劳之，亲而离之。攻其无备，出其不意。此兵家之胜，不可先传也。\n夫未战而庙算胜者，得算多也；未战而庙算不胜者，得算少也。多算胜，少算不胜，而况于无算乎！吾以此观之，胜负见矣。'},
      {n:2,t:'作战第二',c:'孙子曰：凡用兵之法，驰车千驷，革车千乘，带甲十万，千里馈粮，则内外之费，宾客之用，胶漆之材，车甲之奉，日费千金，然后十万之师举矣。其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足。夫钝兵挫锐，屈力殚货，则诸侯乘其弊而起，虽有智者，不能善其后矣。故兵闻拙速，未睹巧之久也。夫兵久而国利者，未之有也。故不尽知用兵之害者，则不能尽知用兵之利也。\n善用兵者，役不再籍，粮不三载，取用于国，因粮于敌，故军食可足也。国之贫于师者远输，远输则百姓贫。近于师者贵卖，贵卖则百姓财竭，财竭则急于丘役。力屈财殚，中原内虚于家。百姓之费，十去其七；公家之费，破车罢马，甲胄矢弩，戟盾蔽橹，丘牛大车，十去其六。故智将务食于敌，食敌一钟，当吾二十钟；萁秆一石，当吾二十石。\n故杀敌者，怒也；取敌之利者，货也。故车战，得车十乘已上，赏其先得者，而更其旌旗，车杂而乘之，卒善而养之，是谓胜敌而益强。故兵贵胜，不贵久。故知兵之将，生民之司命，国家安危之主也。'},
      {n:3,t:'谋攻第三',c:'孙子曰：凡用兵之法，全国为上，破国次之；全军为上，破军次之；全旅为上，破旅次之；全卒为上，破卒次之；全伍为上，破伍次之。是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。故上兵伐谋，其次伐交，其次伐兵，其下攻城。攻城之法，为不得已。修橹轒辒，具器械，三月而后成，距堙，又三月而后已。将不胜其忿而蚁附之，杀士三分之一，而城不拔者，此攻之灾也。故善用兵者，屈人之兵而非战也，拔人之城而非攻也，毁人之国而非久也，必以全争于天下，故兵不顿而利可全，此谋攻之法也。\n故用兵之法，十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。故小敌之坚，大敌之擒也。夫将者，国之辅也。辅周则国必强，辅隙则国必弱。故君之所以患于军者三：不知军之不可以进而谓之进，不知军之不可以退而谓之退，是谓縻军；不知三军之事而同三军之政者，则军士惑矣；不知三军之权而同三军之任，则军士疑矣。三军既惑且疑，则诸侯之难至矣，是谓乱军引胜。故知胜有五：知可以战与不可以战者胜，识众寡之用者胜，上下同欲者胜，以虞待不虞者胜，将能而君不御者胜。此五者，知胜之道也。故曰：知彼知己，百战不殆；不知彼而知己，一胜一负；不知彼不知己，每战必殆。'},
      {n:4,t:'军形第四',c:'孙子曰：昔之善战者，先为不可胜，以待敌之可胜。不可胜在己，可胜在敌。故善战者，能为不可胜，不能使敌之必可胜。故曰：胜可知，而不可为。不可胜者，守也；可胜者，攻也。守则不足，攻则有余。善守者，藏于九地之下；善攻者，动于九天之上，故能自保而全胜也。见胜不过众人之所知，非善之善者也；战胜而天下曰善，非善之善者也。故举秋毫不为多力，见日月不为明目，闻雷霆不为聪耳。古之所谓善战者，胜于易胜者也。故善战者之胜也，无智名，无勇功。故其战胜不忒，不忒者，其所措必胜，胜已败者也。故善战者，立于不败之地，而不失敌之败也。是故胜兵先胜而后求战，败兵先战而后求胜。善用兵者，修道而保法，故能为胜败之政。兵法：一曰度，二曰量，三曰数，四曰称，五曰胜。地生度，度生量，量生数，数生称，称生胜。故胜兵若以镒称铢，败兵若以铢称镒。胜者之战民也，若决积水于千仞之溪者，形也。'},
      {n:5,t:'兵势第五',c:'孙子曰：凡治众如治寡，分数是也；斗众如斗寡，形名是也；三军之众，可使必受敌而无败者，奇正是也；兵之所加，如以碫投卵者，虚实是也。凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江河。终而复始，日月是也；死而复生，四时是也。声不过五，五声之变，不可胜听也；色不过五，五色之变，不可胜观也；味不过五，五味之变，不可胜尝也；战势不过奇正，奇正之变，不可胜穷也。奇正相生，如循环之无端，孰能穷之？激水之疾，至于漂石者，势也；鸷鸟之疾，至于毁折者，节也。是故善战者，其势险，其节短。势如彍弩，节如发机。纷纷纭纭，斗乱而不可乱也；浑浑沌沌，形圆而不可败也。乱生于治，怯生于勇，弱生于强。治乱，数也；勇怯，势也；强弱，形也。故善动敌者，形之，敌必从之；予之，敌必取之；以利动之，以卒待之。故善战者，求之于势，不责于人，故能择人而任势。任势者，其战人也，如转木石。木石之性，安则静，危则动，方则止，圆则行。故善战人之势，如转圆石于千仞之山者，势也。'},
      {n:6,t:'虚实第六',c:'孙子曰：凡先处战地而待敌者佚，后处战地而趋战者劳。故善战者，致人而不致于人。能使敌自至者，利之也；能使敌不得至者，害之也。故敌佚能劳之，饱能饥之，安能动之。出其所不趋，趋其所不意。行千里而不劳者，行于无人之地也；攻而必取者，攻其所不守也；守而必固者，守其所不攻也。故善攻者，敌不知其所守；善守者，敌不知其所攻。微乎微乎，至于无形；神乎神乎，至于无声，故能为敌之司命。进而不可御者，冲其虚也；退而不可追者，速而不可及也。故我欲战，敌虽高垒深沟，不得不与我战者，攻其所必救也；我不欲战，画地而守之，敌不得与我战者，乖其所之也。故形人而我无形，则我专而敌分。我专为一，敌分为十，是以十攻其一也，则我众而敌寡。能以众击寡者，则吾之所与战者约矣。吾所与战之地不可知，不可知，则敌所备者多，敌所备者多，则吾所与战者寡矣。故备前则后寡，备后则前寡，备左则右寡，备右则左寡，无所不备，则无所不寡。寡者，备人者也；众者，使人备己者也。故知战之地，知战之日，则可千里而会战；不知战之地，不知战之日，则左不能救右，右不能救左，前不能救后，后不能救前，而况远者数十里，近者数里乎？以吾度之，越人之兵虽多，亦奚益于胜败哉？故曰：胜可为也。敌虽众，可使无斗。故策之而知得失之计，作之而知动静之理，形之而知死生之地，角之而知有余不足之处。故形兵之极，至于无形。无形，则深间不能窥，智者不能谋。因形而措胜于众，众不能知。人皆知我所以胜之形，而莫知吾所以制胜之形。故其战胜不复，而应形于无穷。夫兵形象水，水之形，避高而趋下；兵之形，避实而击虚。水因地而制流，兵因敌而制胜。故兵无常势，水无常形，能因敌变化而取胜者，谓之神。故五行无常胜，四时无常位，日有短长，月有死生。'}
    ],
    'en':[
      {n:1,t:'Chapter 1: Laying Plans',c:'Sun Tzu said: The art of war is of vital importance to the State. It is a matter of life and death, a road either to safety or to ruin. Hence it is a subject of inquiry that can on no account be neglected.\nThe art of war is governed by five constant factors: (1) The Moral Law; (2) Heaven; (3) Earth; (4) The Commander; (5) Method and discipline.\nThe Moral Law causes the people to be in complete accord with their ruler, so that they will follow him regardless of their lives, undismayed by any danger.\nHeaven signifies night and day, cold and heat, times and seasons.\nEarth comprises distances, great and small; danger and security; open ground and narrow passes; the chances of life and death.\nThe Commander stands for the virtues of wisdom, sincerity, benevolence, courage and strictness.\nBy Method and discipline are to be understood the marshaling of the army in its proper subdivisions, the graduations of rank among the officers, the maintenance of roads by which supplies may reach the army, and the control of military expenditure.\nAll commanders must know these five factors. He who knows them will be victorious; he who knows them not will fail.'},
      {n:2,t:'Chapter 2: Waging War',c:'Sun Tzu said: In the operations of war, when one thousand fast chariots and one thousand heavy chariots are required, with one hundred thousand troops, and when provisions are transported a thousand miles, the expenditures at home and abroad, including the entertainment of guests, the cost of materials such as glue and lacquer, and the maintenance of chariots and armor, will amount to one thousand pieces of gold per day. Only after these preparations can an army of one hundred thousand be mobilized.\nWhen you engage in battle, seek a quick victory. A prolonged war dulls the edge of the army and blunts the sharpness of the spirit. When the army attacks a walled city, its strength is exhausted. When the army is exposed in the field for a long time, the state\'s resources are insufficient.\nThere is no instance of a country having benefited from prolonged warfare. Only those who understand the dangers of war can truly understand its benefits.'},
      {n:3,t:'Chapter 3: Attack by Stratagem',c:'Sun Tzu said: The supreme art of war is to subdue the enemy without fighting. Thus the highest form of generalship is to balk the enemy\'s plans; the next is to prevent the junction of the enemy\'s forces; the next is to attack the enemy in the field; the lowest is to attack walled cities.\nTherefore the skillful leader subdues the enemy\'s troops without any fighting; he captures their cities without laying siege to them; he overthrows their kingdom without lengthy operations in the field. By contesting the whole empire with the whole army, his forces are not worn out and the whole empire benefits.\nHence the saying: If you know the enemy and know yourself, you need not fear the result of a hundred battles. If you know yourself but not the enemy, for every victory gained you will also suffer a defeat. If you know neither the enemy nor yourself, you will succumb in every battle.'},
      {n:4,t:'Chapter 4: Tactical Dispositions',c:'Sun Tzu said: The good fighters of old first put themselves beyond the possibility of defeat, and then waited for an opportunity of defeating the enemy. To secure ourselves against defeat lies in our own hands, but the opportunity of defeating the enemy is provided by the enemy himself. Thus the good fighter is able to secure himself against defeat, but cannot make certain of defeating the enemy.\nHence the saying: One may know how to conquer without being able to do it.\nInvincibility lies in the defense; the possibility of victory in the attack. He who cannot defend attacks; he who can defend does not attack.\nThus the victorious army wins its victories before seeking battle; the defeated army first seeks battle and then seeks victory.'},
      {n:5,t:'Chapter 5: Energy',c:'Sun Tzu said: The control of a large force is the same principle as the control of a few men: it is merely a question of dividing up their numbers. Fighting with a large army under your command is the same as fighting with a small one: it is merely a question of instituting signs and signals.\nThat the whole army may be struck by the enemy without suffering defeat is due to the correct employment of the normal and the extraordinary. The impact of the army on the enemy may be like a grindstone thrown at eggs — this is due to the application of emptiness and fullness.\nIn all fighting, the normal method is used to join battle; the extraordinary method is used to secure victory. The extraordinary methods are as inexhaustible as heaven and earth, unending as the flow of rivers and streams.'},
      {n:6,t:'Chapter 6: Weakness and Strength',c:'Sun Tzu said: Whoever is first in the field and awaits the coming of the enemy will be fresh for the fight; whoever is second in the field and has to hasten to battle will arrive exhausted. Therefore the skillful commander brings the enemy to him and does not allow himself to be brought to the enemy.\nAppear at points which the enemy must hasten to defend; march swiftly to places where you are not expected. To march a thousand miles without tiring, travel where there are no enemies. To be certain to take what you attack, attack where the enemy is unprepared. To be certain of holding what you defend, defend where the enemy cannot attack.\nAll warfare is based on deception. Therefore, when capable, feign incapacity; when active, inactivity. When near, make it appear that you are far away; when far away, that you are near. Offer the enemy a bait to lure him; feign disorder and strike him.'}
    ]
  }
},
{ id:'yijing', type:'易学',
  name:{'zh-CN':'易经','zh-TW':'易經','en':'I Ching (Book of Changes)','es':'I Ching (Libro de los Cambios)','pt':'I Ching (Livro das Mutações)'},
  author:{'zh-CN':'伏羲、周文王、孔子等','zh-TW':'伏羲、周文王、孔子等','en':'Fu Xi, King Wen of Zhou, Confucius, et al.','es':'Fu Xi, Rey Wen de Zhou, Confucio, et al.','pt':'Fu Xi, Rei Wen de Zhou, Confúcio, et al.'},
  dynasty:{'zh-CN':'上古-西周','zh-TW':'上古-西周','en':'Ancient - Western Zhou','es':'Antiguo - Zhou Occidental','pt':'Antigo - Zhou Ocidental'},
  intro:{'zh-CN':'《易经》是中国最古老的典籍之一，被誉为“群经之首，大道之源”。相传由伏羲画八卦，周文王推演为六十四卦并作卦辞，孔子作十翼。其以阴阳变化为核心，阐述天地万物运行规律，是中华哲学、占卜、医学、军事、艺术等领域的共同源头。','zh-TW':'《易經》是中國最古老的典籍之一，被譽為「群經之首，大道之源」。相傳由伏羲畫八卦，周文王推演為六十四卦並作卦辭，孔子作十翼。其以陰陽變化為核心，闡述天地萬物運行規律，是中華哲學、占卜、醫學、軍事、藝術等領域的共同源頭。','en':'The I Ching (Book of Changes) is one of the oldest Chinese classics, honored as the "first of all classics and source of the Great Way." Traditionally attributed to Fu Xi\'s eight trigrams, King Wen of Zhou\'s 64 hexagrams, and Confucius\' Ten Wings, it centers on the interplay of yin and yang, explaining the laws governing all things under heaven. It is the common source of Chinese philosophy, divination, medicine, military strategy, and art.','es':'El I Ching (Libro de los Cambios) es uno de los clásicos chinos más antiguos, honrado como el "primero de todos los clásicos y fuente del Gran Camino". Tradicionalmente atribuido a los ocho trigramas de Fu Xi, los 64 hexagramas del Rey Wen de Zhou y las Diez Alas de Confucio, se centra en la interacción del yin y el yang, explicando las leyes que gobiernan todas las cosas bajo el cielo. Es la fuente común de la filosofía, la adivinación, la medicina, la estrategia militar y el arte chinos.','pt':'O I Ching (Livro das Mutações) é um dos clássicos chineses mais antigos, honrado como o "primeiro de todos os clássicos e fonte do Grande Caminho". Tradicionalmente atribuído aos oito trigramas de Fu Xi, aos 64 hexagramas do Rei Wen de Zhou e às Dez Asas de Confúcio, centra-se na interação do yin e yang, explicando as leis que governam todas as coisas sob o céu. É a fonte comum da filosofia, adivinhação, medicina, estratégia militar e arte chinesa.'}
  // Note: Full 64 hexagram content is premium content unlocked by credits
},
{ id:'shiji', type:'史书',
  name:{'zh-CN':'史记','zh-TW':'史記','en':'Records of the Grand Historian','es':'Registros del Gran Historiador','pt':'Registros do Grande Historiador'},
  author:{'zh-CN':'司马迁','zh-TW':'司馬遷','en':'Sima Qian','es':'Sima Qian','pt':'Sima Qian'},
  dynasty:{'zh-CN':'西汉','zh-TW':'西漢','en':'Western Han','es':'Han Occidental','pt':'Han Ocidental'},
  intro:{'zh-CN':'《史记》是中国第一部纪传体通史，记载了从黄帝到汉武帝约3000年的历史。司马迁所著，共130篇，包括12本纪、30世家、70列传、10表、8书。其文笔优美，叙事生动，被鲁迅誉为“史家之绝唱，无韵之离骚”。','zh-TW':'《史記》是中國第一部紀傳體通史，記載了從黃帝到漢武帝約3000年的歷史。司馬遷所著，共130篇，包括12本紀、30世家、70列傳、10表、8書。其文筆優美，敘事生動，被魯迅譽為「史家之絕唱，無韻之離騷」。','en':'The Records of the Grand Historian is the first comprehensive history of China, covering about 3000 years from the Yellow Emperor to Emperor Wu of Han. Written by Sima Qian in 130 chapters (12 imperial annals, 30 noble houses, 70 biographies, 10 tables, 8 treatises), its literary brilliance and vivid narratives earned it Lu Xun\'s praise as "the greatest masterpiece of historians, a Li Sao without rhyme."','es':'Los Registros del Gran Historiador es la primera historia integral de China, que cubre unos 3000 años desde el Emperador Amarillo hasta el Emperador Wu de Han. Escrito por Sima Qian en 130 capítulos, su brillantez literaria y narrativas vívidas le valieron el elogio de Lu Xun como "la obra maestra más grande de los historiadores, un Li Sao sin rima".','pt':'Os Registros do Grande Historiador é a primeira história abrangente da China, cobrindo cerca de 3000 anos do Imperador Amarelo ao Imperador Wu de Han. Escrito por Sima Qian em 130 capítulos, seu brilho literário e narrativas vívidas lhe renderam o elogio de Lu Xun como "a maior obra-prima dos historiadores, um Li Sao sem rima".'},
  totalChapters:0
},

{id:"daxue",type:"四书五经",name:{"zh-CN":"大学","zh-TW":"大學","en":"The Great Learning","es":"El Gran Saber","pt":"O Grande Saber"},author:{"zh-CN":"曾参（曾子）","zh-TW":"曾參（曾子）","en":"Zeng Shen (Zengzi)","es":"Zeng Shen (Zengzi)","pt":"Zeng Shen (Zengzi)"},dynasty:{"zh-CN":"春秋-战国","zh-TW":"春秋-戰國","en":"Spring and Autumn","es":"Primaveras y Otoños","pt":"Primaveras e Outonos"},intro:{"zh-CN":"《大学》原为《礼记》第四十二篇，相传为曾子所作。南宋朱熹将其从《礼记》中抽出，与《论语》《孟子》《中庸》合为“四书”。全书以“明明德、亲民、止于至善”为纲领，以“格物、致知、诚意、正心、修身、齐家、治国、平天下”为条目，构建了儒家内圣外王的思想体系。","zh-TW":"《大學》原為《禮記》第四十二篇，相傳為曾子所作。南宋朱熹將其從《禮記》中抽出，與《論語》《孟子》《中庸》合為「四書」。全書以「明明德、親民、止於至善」為綱領，以「格物、致知、誠意、正心、修身、齊家、治國、平天下」為條目，構建了儒家內聖外王的思想體系。","en":"The Great Learning was originally chapter 42 of the Book of Rites, attributed to Zengzi. Zhu Xi of the Southern Song separated it to form one of the \"Four Books\" with the Analects, Mencius, and the Doctrine of the Mean. It presents the Confucian program of self-cultivation and social order: manifesting virtue, loving the people, resting in the highest good, through the eight steps of investigating things, extending knowledge, sincerity, rectifying the mind, cultivating the self, regulating the family, governing the state, and bringing peace to the world.","es":"El Gran Saber fue originalmente el capítulo 42 del Libro de los Ritos, atribuido a Zengzi. Zhu Xi de la Canción del Sur lo separó para formar uno de los \"Cuatro Libros\". Presenta el programa confuciano de autocultivo y orden social.","pt":"O Grande Saber foi originalmente o capítulo 42 do Livro dos Ritos, atribuído a Zengzi. Zhu Xi da Canção do Sul o separou para formar um dos \"Quatro Livros\". Apresenta o programa confuciano de autocultivo e ordem social."},totalChapters:1,
chapters:{"zh-CN":[{n:1,t:"大学经文“,c:”大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始，知所先后，则近道矣。\n古之欲明明德于天下者，先治其国。欲治其国者，先齐其家。欲齐其家者，先修其身。欲修其身者，先正其心。欲正其心者，先诚其意。欲诚其意者，先致其知。致知在格物。\n物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。\n自天子以至于庶人，壹是皆以修身为本。其本乱而末治者，否矣。其所厚者薄，而其所薄者厚，未之有也。\n《康诰》曰：克明德。《大甲》曰：顾諟天之明命。《帝典》曰：克明峻德。皆自明也。\n汤之《盘铭》曰：苟日新，日日新，又日新。《康诰》曰：作新民。《诗》曰：周虽旧邦，其命维新。是故君子无所不用其极。\n《诗》云：邦畿千里，惟民所止。《诗》云：缗蛮黄鸟，止于丘隅。子曰：于止，知其所止，可以人而不如鸟乎？\n《诗》云：穆穆文王，于缉熙敬止。为人君，止于仁；为人臣，止于敬；为人子，止于孝；为人父，止于慈；与国人交，止于信。"}]}},
{id:"xinjing",type:"儒释道",name:{"zh-CN":"心经","zh-TW":"心經","en":"Heart Sutra","es":"Sutra del Corazón","pt":"Sutra do Coração"},author:{"zh-CN":"玄奘译","zh-TW":"玄奘譯","en":"Trans. Xuanzang","es":"Trad. Xuanzang","pt":"Trad. Xuanzang"},dynasty:{"zh-CN":"唐","zh-TW":"唐","en":"Tang","es":"Tang","pt":"Tang"},intro:{"zh-CN":"《心经》全称《般若波罗蜜多心经》，是大乘佛教般若经典的精髓，也是流传最广的佛教经典之一。唐玄奘译本仅260字，却包含了般若思想的全部精华。经中阐述“色即是空，空即是色”之深义，破除法执与我执，达到究竟涅槃。","zh-TW":"《心經》全稱《般若波羅蜜多心經》，是大乘佛教般若經典的精髓，也是流傳最廣的佛教經典之一。唐玄奘譯本僅260字，卻包含了般若思想的全部精華。經中闡述「色即是空，空即是色」之深義，破除法執與我執，達到究竟涅槃。","en":"The Heart Sutra (Prajnaparamita Hridaya Sutra) is the essence of Mahayana Buddhist Prajnaparamita teachings and one of the most widely circulated Buddhist texts. Xuanzang's Chinese translation contains only 260 characters yet contains the complete essence of Prajna wisdom. It expounds the profound meaning of \"form is emptiness, emptiness is form,\" breaking attachment to both dharmas and self, to reach ultimate Nirvana.","es":"El Sutra del Corazón es la esencia de las enseñanzas Prajnaparamita del budismo Mahayana y uno de los textos budistas más difundidos. La traducción china de Xuanzang contiene solo 260 caracteres pero contiene la esencia completa de la sabiduría Prajna.","pt":"O Sutra do Coração é a essência dos ensinamentos Prajnaparamita do Budismo Mahayana e um dos textos budistas mais difundidos. A tradução chinesa de Xuanzang contém apenas 260 caracteres, mas contém a essência completa da sabedoria Prajna."},totalChapters:1,
chapters:{"zh-CN":[{n:1,t:"般若波罗蜜多心经“,c:”观自在菩萨，行深般若波罗蜜多时，照见五蕴皆空，度一切苦厄。舍利子，色不异空，空不异色，色即是空，空即是色，受想行识，亦复如是。舍利子，是诸法空相，不生不灭，不垢不净，不增不减。是故空中无色，无受想行识，无眼耳鼻舌身意，无色声香味触法，无眼界，乃至无意识界。无无明，亦无无明尽，乃至无老死，亦无老死尽。无苦集灭道，无智亦无得。以无所得故，菩提萨埵，依般若波罗蜜多故，心无挂碍，无挂碍故，无有恐怖，远离颠倒梦想，究竟涅槃。三世诸佛，依般若波罗蜜多故，得阿耨多罗三藐三菩提。故知般若波罗蜜多，是大神咒，是大明咒，是无上咒，是无等等咒，能除一切苦，真实不虚。故说般若波罗蜜多咒，即说咒曰：揭谛揭谛，波罗揭谛，波罗僧揭谛，菩提萨婆诃。"}],"en":[{n:1,t:"Heart of Prajnaparamita Sutra",c:"The Bodhisattva Avalokiteshvara, while practicing the deep Prajnaparamita, clearly saw that all five skandhas are empty, transforming all suffering and distress. Shariputra, form is not different from emptiness, emptiness is not different from form. Form is precisely emptiness, emptiness is precisely form. Sensation, perception, formation, and consciousness are likewise. Shariputra, all dharmas are empty of characteristics: not arising, not ceasing; not defiled, not pure; not increasing, not decreasing. Therefore in emptiness there is no form, no sensation, perception, formation, or consciousness; no eye, ear, nose, tongue, body, or mind; no form, sound, smell, taste, touch, or dharma; no realm of sight... no realm of consciousness. No ignorance and no end to ignorance... no aging and death, and no end to aging and death. No suffering, origin, cessation, or path; no wisdom and no attainment. Because there is nothing to attain, Bodhisattvas rely on Prajnaparamita, thus their minds are without hindrance. Without hindrance, there is no fear. Far beyond all inverted views, they reach ultimate Nirvana. All Buddhas of past, present, and future rely on Prajnaparamita to attain Anuttara Samyak Sambodhi. Know that Prajnaparamita is the great mantra, the great bright mantra, the unsurpassed mantra, the unequalled mantra. It can remove all suffering — this is true and not false. Therefore utter the Prajnaparamita mantra: Gate gate paragate parasamgate bodhi svaha!"}]}},
{id:"zengguang",type:"蒙学",name:{"zh-CN":"增广贤文","zh-TW":"增廣賢文","en":"Augmented Proverbs","es":"Proverbios Aumentados","pt":"Provérbios Aumentados"},author:{"zh-CN":"佚名（明清文人辑录）","zh-TW":"佚名（明清文人輯錄）","en":"Anonymous (compiled Ming-Qing)","es":"Anónimo (compilado Ming-Qing)","pt":"Anônimo (compilado Ming-Qing)"},dynasty:{"zh-CN":"明-清","zh-TW":"明-清","en":"Ming-Qing","es":"Ming-Qing","pt":"Ming-Qing"},intro:{"zh-CN":"《增广贤文》是中国明代时期编写的儿童启蒙书目，后经明清文人增补。全书汇集了从古至今的格言谚语，涵盖人际关系、处世哲学、读书治学等各方面，是中国民间智慧的集大成之作。","zh-TW":"《增廣賢文》是中國明代時期編寫的兒童啟蒙書目，後經明清文人增補。全書匯集了從古至今的格言諺語，涵蓋人際關係、處世哲學、讀書治學等各方面，是中國民間智慧的集大成之作。","en":"Augmented Proverbs is a Ming dynasty children's primer, later expanded by Ming-Qing scholars. It collects ancient aphorisms and proverbs covering interpersonal relations, life philosophy, and learning — a compendium of Chinese folk wisdom.","es":"Proverbios Aumentados es un libro de lectura infantil de la dinastía Ming, luego ampliado por eruditos Ming-Qing. Recopila aforismos y proverbios antiguos que cubren relaciones interpersonales, filosofía de vida y aprendizaje.","pt":"Provérbios Aumentados é um livro de leitura infantil da dinastia Ming, depois ampliado por estudiosos Ming-Qing. Coleta aforismos e provérbios antigos que cobrem relações interpessoais, filosofia de vida e aprendizado."},totalChapters:1,
chapters:{"zh-CN":[{n:1,t:"增广贤文“,c:”昔时贤文，诲汝谆谆。集韵增广，多见多闻。观今宜鉴古，无古不成今。知己知彼，将心比心。酒逢知己饮，诗向会人吟。相识满天下，知心能几人。相逢好似初相识，到老终无怨恨心。近水知鱼性，近山识鸟音。易涨易退山溪水，易反易覆小人心。运去金成铁，时来铁似金。读书须用意，一字值千金。逢人且说三分话，未可全抛一片心。有意栽花花不发，无心插柳柳成荫。画虎画皮难画骨，知人知面不知心。钱财如粪土，仁义值千金。流水下滩非有意，白云出岫本无心。当时若不登高望，谁信东流海洋深。路遥知马力，事久见人心。两人一般心，有钱堪买金；一人一般心，无钱堪买针。相见易得好，久住难为人。马行无力皆因瘦，人不风流只为贫。饶人不是痴汉，痴汉不会饶人。是亲不是亲，非亲却是亲。美不美，乡中水；亲不亲，故乡人。莺花犹怕春光老，岂可教人枉度春。相逢不饮空归去，洞口桃花也笑人。红粉佳人休使老，风流浪子莫教贫。在家不会迎宾客，出门方知少主人。黄芩无假，阿魏无真。客来主不顾，应恐是痴人。贫居闹市无人问，富在深山有远亲。谁人背后无人说，哪个人前不说人。有钱道真语，无钱语不真。不信但看筵中酒，杯杯先劝有钱人。闹里有钱，静处安身。来如风雨，去似微尘。长江后浪推前浪，世上新人赶旧人。近水楼台先得月，向阳花木早逢春。古人不见今时月，今月曾经照古人。先到为君，后到为臣。莫道君行早，更有早行人。莫信直中直，须防仁不仁。山中有直树，世上无直人。自恨枝无叶，莫怨太阳倾。大家都是命，半点不由人。一年之计在于春，一日之计在于寅。一家之计在于和，一生之计在于勤。责人之心责己，恕己之心恕人。守口如瓶，防意如城。宁可人负我，切莫我负人。再三须慎意，第一莫欺心。虎身犹可近，人毒不堪亲。来说是非者，便是是非人。远水难救近火，远亲不如近邻。有茶有酒多兄弟，急难何曾见一人。人情似纸张张薄，世事如棋局局新。山中也有千年树，世上难逢百岁人。力微休负重，言轻莫劝人。无钱休入众，遭难莫寻亲。平生莫作皱眉事，世上应无切齿人。士者国之宝，儒为席上珍。若要断酒法，醒眼看醉人。求人须求英雄汉，济人须济急时无。渴时一滴如甘露，醉后添杯不如无。久住令人贱，频来亲也疏。酒中不语真君子，财上分明大丈夫。出家如初，成佛有余。积金千两，不如明解经书。养子不教如养驴，养女不教如养猪。有田不耕仓廪虚，有书不读子孙愚。仓廪虚兮岁月乏，子孙愚兮礼义疏。同君一席话，胜读十年书。人不通今古，马牛而襟裾。茫茫四海人无数，哪个男儿是丈夫。美酒酿成缘好客，黄金散尽为收书。救人一命，胜造七级浮屠。城门失火，殃及池鱼。庭前生瑞草，好事不如无。欲求生富贵，须下死工夫。百年成之不足，一旦败之有余。人心似铁，官法如炉。善化不足，恶化有余。水至清则无鱼，人太察则无谋。知者减半，愚者全无。在家由父，出家从夫。痴人畏妇，贤女敬夫。是非终日有，不听自然无。宁可正而不足，不可邪而有余。宁可信其有，不可信其无。竹篱茅舍风光好，道院僧房总不如。命里有时终须有，命里无时莫强求。道院迎仙客，书堂隐相儒。庭栽栖凤竹，池养化龙鱼。结交须胜己，似我不如无。但看三五日，相见不如初。人情似水分高下，世事如云任卷舒。会说说都是，不会说无理。磨刀恨不利，刀利伤人指。求财恨不多，财多害自己。知足常足，终身不辱。知止常止，终身不耻。有福伤财，无福伤己。差之毫厘，失之千里。若登高必自卑，若涉远必自迩。三思而行，再思可矣。使口不如自走，求人不如求己。小时是兄弟，长大各乡里。妒财莫妒食，怨生莫怨死。人见白头嗔，我见白头喜。多少少年郎，不到白头死。墙有缝，壁有耳。好事不出门，恶事传千里。贼是小人，智过君子。君子固穷，小人穷斯滥矣。贫穷自在，富贵多忧。不以我为德，反以我为仇。宁可直中取，不向曲中求。人无远虑，必有近忧。知我者谓我心忧，不知我者谓我何求。晴天不肯去，直待雨淋头。成事莫说，覆水难收。是非只为多开口，烦恼皆因强出头。忍得一时之气，免得百日之忧。近来学得乌龟法，得缩头时且缩头。惧法朝朝乐，欺公日日忧。人生一世，草木一春。白发不随老人去，看来又是白头翁。月到十五光明少，人到中年万事休。儿孙自有儿孙福，莫为儿孙作马牛。人生不满百，常怀千岁忧。今朝有酒今朝醉，明日愁来明日忧。路逢险处须回避，事到头来不自由。药能医假病，酒不解真愁。人贫不语，水平不流。一家养女百家求，一马不行百马忧。有花方酌酒，无月不登楼。三杯通大道，一醉解千愁。深山毕竟藏猛虎，大海终须纳细流。惜花须检点，爱月不梳头。大抵选他肌骨好，不擦红粉也风流。受恩深处宜先退，得意浓时便可休。莫待是非来入耳，从前恩爱反为仇。留得五湖明月在，不愁无处下金钩。休别有鱼处，莫恋浅滩头。去时终须去，再三留不住。忍一句，息一怒，饶一着，退一步。三十不豪，四十不富，五十凑近寻死路。生不认魂，死不认尸。一寸光阴一寸金，寸金难买寸光阴。父母恩深终有别，夫妻义重也分离。人生似鸟同林宿，大限来时各自飞。人善被人欺，马善被人骑。人恶人怕天不怕，人善人欺天不欺。善恶到头终有报，只争来早与来迟。黄河尚有澄清日，岂可人无得运时。得宠思辱，安居虑危。念念有如临敌日，心心常似过桥时。英雄行险道，富贵似花枝。人情莫道春光好，只怕秋来有冷时。送君千里，终须一别。但将冷眼看螃蟹，看你横行到几时。见事莫说，问事不知。闲事休管，无事早归。假缎染就真红色，也被旁人说是非。善事可做，恶事莫为。许人一物，千金不移。龙游浅水遭虾戏，虎落平阳被犬欺。一举首登龙虎榜，十年身到凤凰池。十载寒窗无人问，一举成名天下知。酒债寻常行处有，人生七十古来稀。养儿防老，积谷防饥。当家才知盐米贵，养子方知父母恩。常将有日思无日，莫把无时当有时。时来风送滕王阁，运去雷轰荐福碑。入门休问荣枯事，观看容颜便得知。官清书吏瘦，神灵庙祝肥。息却雷霆之怒，罢却虎狼之威。饶人算人之本，输人算人之机。好言难得，恶语易施。一言既出，驷马难追。道吾好者是吾贼，道吾恶者是吾师。路逢侠客须呈剑，不是才人莫献诗。三人同行，必有吾师焉。择其善者而从之，其不善者而改之。欲昌和顺须为善，要振家声在读书。少壮不努力，老大徒伤悲。人有善愿，天必佑之。莫饮卯时酒，昏昏醉到酉。莫骂酉时妻，一夜受孤凄。种麻得麻，种豆得豆。天网恢恢，疏而不漏。见官莫向前，做客莫向后。宁添一斗，莫添一口。螳螂捕蝉，岂知黄雀在后。不求金玉重重贵，但愿儿孙个个贤。一日夫妻，百世姻缘。百世修来同船渡，千世修来共枕眠。杀人一万，自损三千。伤人一语，利如刀割。枯木逢春犹再发，人无两度再少年。未晚先投宿，鸡鸣早看天。将相头顶堪走马，公侯肚里好撑船。富人思来年，贫人思眼前。世上若要人情好，赊去物件莫取钱。死生有命，富贵在天。击石原有火，不击乃无烟。为学始知道，不学亦徒然。莫笑他人老，终须还到老。和得邻里好，犹如拾片宝。但能依本分，终须无烦恼。大家做事寻常，小家做事慌张。大家礼义教子弟，小家凶恶训儿郎。君子爱财，取之有道。贞妇爱色，纳之以礼。善有善报，恶有恶报。不是不报，日子未到。万恶淫为首，百行孝当先。人而无信，不知其可也。一人道虚，千人传实。凡事要好，须问三老。若争小可，便失大道。家中不和邻里欺，邻里不和说是非。年年防饥，夜夜防盗。好学者如禾如稻，不好学者如蒿如草。遇饮酒时须饮酒，得高歌处且高歌。因风吹火，用力不多。不因渔父引，怎得见波涛。无求到处人情好，不饮从他酒价高。知事少时烦恼少，识人多处是非多。世间好语书说尽，天下名山僧占多。入山不怕伤人虎，只怕人情两面刀。强中更有强中手，恶人须用恶人磨。会使不在家豪富，风流不用着衣多。光阴似箭，日月如梭。天时不如地利，地利不如人和。黄金未为贵，安乐值钱多。为善最乐，为恶难逃。羊有跪乳之恩，鸦有反哺之义。孝顺还生孝顺子，忤逆还生忤逆儿。不信但看檐前水，点点滴在旧窝池。隐恶扬善，执其两端。妻贤夫祸少，子孝父心宽。既坠釜甑，反顾无益。翻覆之水，收之实难。人生知足何时足，到老偷闲且自闲。处处绿杨堪系马，家家有路通长安。见者易，学者难。莫将容易得，便作等闲看。用心计较般般错，退步思量事事宽。道路各别，养家一般。从俭入奢易，从奢入俭难。知音说与知音听，不是知音莫与弹。点石化为金，人心犹未足。信了肚，卖了屋。谁人汲得西江水，难洗今朝一面羞。但行好事，莫问前程。河狭水急，人急计生。明知山有虎，莫向虎山行。路不行不到，事不为不成。人不劝不善，钟不敲不鸣。无钱方断酒，临老始看经。点塔七层，不如暗处一灯。万事劝人休瞒昧，举头三尺有神明。但存方寸土，留与子孙耕。灭却心头火，剔起佛前灯。惺惺常不足，懵懵作公卿。众星朗朗，不如孤月独明。兄弟相害，不如自友。合理可作，小利莫争。牡丹花好空入目，枣花虽小结实成。欺老莫欺少，欺少心不明。随分耕锄收地利，他时饱暖谢苍天。得忍且忍，得耐且耐。不忍不耐，小事成大。相论逞英豪，家计渐渐消。贤妇令夫贵，恶妇令夫败。一人有庆，兆民咸赖。人老心未老，人穷志不穷。人无千日好，花无百日红。杀人可恕，情理难容。乍富不知新受用，乍贫难改旧家风。座上客常满，杯中酒不空。屋漏更遭连阴雨，行船又遇打头风。笋因落箨方成竹，鱼为奔波始化龙。记得少年骑竹马，看看又是白头翁。礼义生于富足，盗贼出于赌博。天上众星皆拱北，世间无水不朝东。君子安贫，达人知命。良药苦口利于病，忠言逆耳利于行。顺天者存，逆天者亡。人为财死，鸟为食亡。夫妻相合好，琴瑟与笙簧。有儿穷不久，无子富不长。善必寿考，恶必早亡。爽口食多偏作病，快心事过恐生殃。富贵定要安分守己，贫穷不必枉思量。画水无风空作浪，绣花虽好不闻香。贪他一斗米，失却半年粮。争他一脚豚，反失一肘羊。龙归晚洞云犹湿，麝过春山草木香。平生只会量人短，何不回头把自量。见善如不及，见恶如探汤。人贫志短，马瘦毛长。自家心里急，他人未知忙。贫无达士将金赠，病有高人说药方。触来莫与竞，事过心清凉。秋至满山多秀色，春来无处不花香。凡人不可貌相，海水不可斗量。清清之水，为土所防。济济之士，为酒所伤。蒿草之下，或有兰香。茅茨之屋，或有侯王。无限朱门生饿殍，几多白屋出公卿。醉后乾坤大，壶中日月长。万事皆已定，浮生空白茫。千里送鹅毛，礼轻情意重。世事明如镜，前程暗似漆。架上碗儿轮流转，媳妇自有做婆时。人生一世，如驹过隙。良田万顷，日食三升。大厦千间，夜眠八尺。千经万典，孝义为先。一字入公门，九牛拖不出。衙门八字开，有理无钱莫进来。富从升合起，贫因不算来。家中无才子，官从何处来。万事不由人计较，一生都是命安排。急行慢行，前程只有许多路。人间私语，天闻若雷。暗室亏心，神目如电。一毫之恶，劝人莫作。一毫之善，与人方便。欺人是祸，饶人是福。天眼恢恢，报应甚速。圣贤言语，神钦鬼服。人各有心，心各有见。口说不如身逢，耳闻不如眼见。养军千日，用在一朝。国清才子贵，家富小儿骄。利刀割体痕易合，恶语伤人恨不消。公道世间唯白发，贵人头上不曾饶。有才堪出众，无衣懒出门。为官须作相，及第必争先。苗从地发，树由枝分。父子亲而家不退，兄弟和而家不分。官有公法，民有私约。闲时不烧香，急时抱佛脚。幸生太平无事日，恐逢年老不多时。国乱思良将，家贫思贤妻。池塘积水须防旱，田土深耕足养家。根深不怕风摇动，树正不愁月影斜。学在一人之下，用在万人之上。一字为师，终身如父。忘恩负义，禽兽之徒。劝君莫将油炒菜，留与儿孙夜读书。书中自有千钟粟，书中自有黄金屋。书中马多如簇，书中女颜如玉。莫怨天来莫怨人，五行八字命生成。莫怨自己穷，穷要穷得干净。莫羡他人富，富要富得清高。别人骑马我骑驴，仔细思量我不如。回头又见推车汉，比上不足下有余。欲知世事须尝胆，会尽人情暗点头。受恩不报非君子，知恩不报是小人。万事劝人休瞒昧，举头三尺有神明。但存方寸土，留与子孙耕。灭却心头火，剔起佛前灯。惺惺常不足，懵懵作公卿。众星朗朗，不如孤月独明。"}]}},
{id:"liaofan",type:"家训",name:{"zh-CN":"了凡四训","zh-TW":"了凡四訓","en":"Liao Fan's Four Lessons","es":"Las Cuatro Lecciones de Liao Fan","pt":"As Quatro Lições de Liao Fan"},author:{"zh-CN":"袁了凡","zh-TW":"袁了凡","en":"Yuan Liaofan","es":"Yuan Liaofan","pt":"Yuan Liaofan"},dynasty:{"zh-CN":"明","zh-TW":"明","en":"Ming","es":"Ming","pt":"Ming"},intro:{"zh-CN":"《了凡四训》是明代袁了凡所作的家训，以亲身经历讲述改造命运的道理和方法。全书分立命之学、改过之法、积善之方、谦德之效四篇，阐述“命由我作，福自己求”的思想，融合儒释道三家智慧，影响深远。","zh-TW":"《了凡四訓》是明代袁了凡所作的家訓，以親身經歷講述改造命運的道理和方法。全書分立命之學、改過之法、積善之方、謙德之效四篇，闡述「命由我作，福自己求」的思想，融合儒釋道三家智慧，影響深遠。","en":"Liao Fan's Four Lessons is a Ming dynasty family instruction by Yuan Liaofan, teaching how to transform one's destiny through self-cultivation. Covering destiny, repentance, virtue, and humility, it integrates Confucian, Buddhist, and Taoist wisdom.","es":"Las Cuatro Lecciones de Liao Fan es una instrucción familiar de la dinastía Ming de Yuan Liaofan, que enseña cómo transformar el propio destino a través del autocultivo.","pt":"As Quatro Lições de Liao Fan é uma instrução familiar da dinastia Ming de Yuan Liaofan, ensinando como transformar o próprio destino através do autocultivo."},totalChapters:0},
{id:"zizhi",type:"史书",name:{"zh-CN":"资治通鉴","zh-TW":"資治通鑑","en":"Zizhi Tongjian","es":"Zizhi Tongjian","pt":"Zizhi Tongjian"},author:{"zh-CN":"司马光","zh-TW":"司馬光","en":"Sima Guang","es":"Sima Guang","pt":"Sima Guang"},dynasty:{"zh-CN":"北宋","zh-TW":"北宋","en":"Northern Song","es":"Song del Norte","pt":"Song do Norte"},intro:{"zh-CN":"《资治通鉴》是北宋司马光主持编纂的中国第一部编年体通史巨著，共294卷，记载了从周威烈王二十三年（前403年）到五代后周世宗显德六年（959年）共1362年的历史。其内容以政治、军事和民族关系为主，兼及经济、文化和历史人物评价，旨在“鉴前世之兴衰，考当今之得失”，为后世治国者提供历史借鉴。","zh-TW":"《資治通鑑》是北宋司馬光主持編纂的中國第一部編年體通史巨著，共294卷，記載了從周威烈王二十三年（前403年）到五代後周世宗顯德六年（959年）共1362年的歷史。","en":"Zizhi Tongjian is a monumental Chinese historical work compiled by Sima Guang of the Northern Song Dynasty. It is the first comprehensive chronological history of China, covering 1362 years from 403 BCE to 959 CE in 294 volumes. Focusing on political and military affairs, it aims to provide lessons for governance through historical reflection.","es":"Zizhi Tongjian es una obra histórica monumental china compilada por Sima Guang de la dinastía Song del Norte. Es la primera historia cronológica integral de China, que cubre 1362 años en 294 volúmenes.","pt":"Zizhi Tongjian é uma obra histórica monumental chinesa compilada por Sima Guang da dinastia Song do Norte. É a primeira história cronológica abrangente da China, cobrindo 1362 anos em 294 volumes."},totalChapters:0},
{id:"chunqiu",type:"史书",name:{"zh-CN":"春秋","zh-TW":"春秋","en":"Spring and Autumn Annals","es":"Anales de Primavera y Otoño","pt":"Anais de Primavera e Outono"},author:{"zh-CN":"孔子编","zh-TW":"孔子編","en":"Confucius (editor)","es":"Confucio (editor)","pt":"Confúcio (editor)"},dynasty:{"zh-CN":"春秋","zh-TW":"春秋","en":"Spring and Autumn","es":"Primaveras y Otoños","pt":"Primaveras e Outonos"},intro:{"zh-CN":"《春秋》是中国现存最早的编年体史书，相传为孔子根据鲁国史官所编《鲁春秋》修订而成，记载了从鲁隐公元年（前722年）到鲁哀公十四年（前481年）共242年的历史。其文字简练，一字褒贬，被称为“春秋笔法”或“微言大义”，对后世史学影响深远。","zh-TW":"《春秋》是中國現存最早的編年體史書，相傳為孔子根據魯國史官所編《魯春秋》修訂而成，記載了從魯隱公元年（前722年）到魯哀公十四年（前481年）共242年的歷史。","en":"The Spring and Autumn Annals is the earliest surviving chronological history, traditionally attributed to Confucius, recording 242 years of Lu state history from 722 to 481 BCE. Its concise style and subtle moral judgments established the \"Spring and Autumn brush\" tradition.","es":"Los Anales de Primavera y Otoño es la historia cronológica más antigua que se conserva, tradicionalmente atribuida a Confucio, que registra 242 años de historia del estado de Lu.","pt":"Os Anais de Primavera e Outono é a história cronológica mais antiga preservada, tradicionalmente atribuída a Confúcio, registrando 242 anos de história do estado de Lu."},totalChapters:0},
{id:"zuozhuan",type:"史书",name:{"zh-CN":"左传","zh-TW":"左傳","en":"Zuo Zhuan","es":"Zuo Zhuan","pt":"Zuo Zhuan"},author:{"zh-CN":"左丘明","zh-TW":"左丘明","en":"Zuo Qiuming","es":"Zuo Qiuming","pt":"Zuo Qiuming"},dynasty:{"zh-CN":"春秋-战国","zh-TW":"春秋-戰國","en":"Spring and Autumn","es":"Primaveras y Otoños","pt":"Primaveras e Outonos"},intro:{"zh-CN":"《左传》全称《春秋左氏传》，相传为左丘明所作，是为《春秋》作注解的史书。全书共18卷，以详尽的事实补充和阐述了《春秋》所记载的历史事件，是中国古代史学与文学的典范之作，其叙事艺术和历史见解对后世影响极大。","zh-TW":"《左傳》全稱《春秋左氏傳》，相傳為左丘明所作，是為《春秋》作注解的史書。","en":"Zuo Zhuan (Zuo Tradition) is a commentary on the Spring and Autumn Annals, attributed to Zuo Qiuming. In 18 volumes, it expands on the events recorded in the Annals with detailed narratives, exemplifying both historical writing and literary art.","es":"Zuo Zhuan (Tradición Zuo) es un comentario sobre los Anales de Primavera y Otoño, atribuido a Zuo Qiuming, que amplía los eventos registrados en los Anales con narrativas detalladas.","pt":"Zuo Zhuan (Tradição Zuo) é um comentário sobre os Anais de Primavera e Outono, atribuído a Zuo Qiuming, que expande os eventos registrados nos Anais com narrativas detalhadas."},totalChapters:0},
{id:"zhongyong",type:"四书五经",name:{"zh-CN":"中庸","zh-TW":"中庸","en":"Doctrine of the Mean","es":"Doctrina del Medio","pt":"Doutrina do Meio"},author:{"zh-CN":"子思","zh-TW":"子思","en":"Zisi","es":"Zisi","pt":"Zisi"},dynasty:{"zh-CN":"战国","zh-TW":"戰國","en":"Warring States","es":"Reinos Combatientes","pt":"Reinos Combatentes"},intro:{"zh-CN":"《中庸》原为《礼记》中的一篇，相传为孔子的孙子子思所作，后与《大学》《论语》《孟子》并列为“四书”。全书以“中庸”为核心概念，阐述“君子中庸，小人反中庸”之理，强调“诚”的重要性，探讨了天人之际的哲学问题，是儒家心性之学的理论基础。","zh-TW":"《中庸》原為《禮記》中的一篇，相傳為孔子的孫子子思所作，後與《大學》《論語》《孟子》並列為「四書」。","en":"The Doctrine of the Mean, originally a chapter of the Book of Rites attributed to Confucius' grandson Zisi, is one of the Four Books. It expounds the concept of \"central harmony\" (zhongyong), emphasizing sincerity and the balance between human nature and the Way of Heaven.","es":"La Doctrina del Medio, originalmente un capítulo del Libro de los Ritos atribuido al nieto de Confucio, Zisi, es uno de los Cuatro Libros. Expone el concepto de \"armonía central\" (zhongyong).","pt":"A Doutrina do Meio, originalmente um capítulo do Livro dos Ritos atribuído ao neto de Confúcio, Zisi, é um dos Quatro Livros. Expõe o conceito de \"harmonia central\" (zhongyong)."},totalChapters:0},
{id:"zengguofan",type:"家训",name:{"zh-CN":"曾国藩家书","zh-TW":"曾國藩家書","en":"Zeng Guofan's Family Letters","es":"Cartas Familiares de Zeng Guofan","pt":"Cartas Familiares de Zeng Guofan"},author:{"zh-CN":"曾国藩","zh-TW":"曾國藩","en":"Zeng Guofan","es":"Zeng Guofan","pt":"Zeng Guofan"},dynasty:{"zh-CN":"清","zh-TW":"清","en":"Qing","es":"Qing","pt":"Qing"},intro:{"zh-CN":"《曾国藩家书》是清代名臣曾国藩写给家人的书信集，收录了近1500封家信，时间跨度从道光二十年至同治十年。内容涵盖修身、齐家、治国、平天下、读书、作文、养生、交友等方方面面，展现了曾国藩“立德、立功、立言”的人生追求，被誉为“千古第一家训”。","zh-TW":"《曾國藩家書》是清代名臣曾國藩寫給家人的書信集，收錄了近1500封家信，時間跨度從道光二十年至同治十年。","en":"Zeng Guofan's Family Letters is a collection of nearly 1,500 letters by the renowned Qing official Zeng Guofan to his family, covering self-cultivation, family management, governance, reading, writing, and friendship. Known as \"the greatest family instruction through the ages.\"","es":"Las Cartas Familiares de Zeng Guofan es una colección de casi 1.500 cartas del renombrado funcionario Qing Zeng Guofan a su familia, que cubren autocultivo, gestión familiar, gobierno, lectura, escritura y amistad.","pt":"As Cartas Familiares de Zeng Guofan é uma coleção de quase 1.500 cartas do renomado funcionário Qing Zeng Guofan para sua família, cobrindo autocultivo, gestão familiar, governo, leitura, escrita e amizade."},totalChapters:0},
{id:"yanshi",type:"家训",name:{"zh-CN":"颜氏家训","zh-TW":"顏氏家訓","en":"Yan Family Instructions","es":"Instrucciones de la Familia Yan","pt":"Instruções da Família Yan"},author:{"zh-CN":"颜之推","zh-TW":"顏之推","en":"Yan Zhitui","es":"Yan Zhitui","pt":"Yan Zhitui"},dynasty:{"zh-CN":"南北朝","zh-TW":"南北朝","en":"Northern and Southern Dynasties","es":"Dinastías del Norte y Sur","pt":"Dinastias do Norte e Sul"},intro:{"zh-CN":"《颜氏家训》是南北朝时期颜之推所著的家训著作，是中国历史上第一部内容丰富、体系完整的家训，被誉为“家训之祖”。书中以儒家思想为主导，兼采道家和佛家思想，教诫子弟修身齐家、读书治学、处世为人，对后世家训著作影响极大。","zh-TW":"《顏氏家訓》是南北朝時期顏之推所著的家訓著作，是中國歷史上第一部內容豐富、體系完整的家訓，被譽為「家訓之祖」。","en":"The Yan Family Instructions by Yan Zhitui (Northern and Southern Dynasties) is China's first comprehensive family instruction, known as the \"ancestor of family instructions.\" Based on Confucian principles with Taoist and Buddhist elements, it teaches self-cultivation, learning, and social conduct.","es":"Las Instrucciones de la Familia Yan de Yan Zhitui es la primera instrucción familiar integral de China, conocida como el \"ancestro de las instrucciones familiares\".","pt":"As Instruções da Família Yan de Yan Zhitui é a primeira instrução familiar abrangente da China, conhecida como o \"ancestral das instruções familiares\"."},totalChapters:0},
{id:"jin'gang",type:"儒释道",name:{"zh-CN":"金刚经","zh-TW":"金剛經","en":"Diamond Sutra","es":"Sutra del Diamante","pt":"Sutra do Diamante"},author:{"zh-CN":"鸠摩罗什译","zh-TW":"鳩摩羅什譯","en":"Trans. Kumarajiva","es":"Trad. Kumarajiva","pt":"Trad. Kumarajiva"},dynasty:{"zh-CN":"后秦","zh-TW":"後秦","en":"Later Qin","es":"Qin Posterior","pt":"Qin Posterior"},intro:{"zh-CN":"《金刚般若波罗蜜经》简称《金刚经》，是大乘佛教般若部重要经典之一。后秦鸠摩罗什译本最为通行。全经以“应无所住而生其心”为核心，通过释迦牟尼与须菩提的对话，阐述“凡所有相，皆是虚妄”之理，教导修行者破除执着，得见自性。","zh-TW":"《金剛般若波羅蜜經》簡稱《金剛經》，是大乘佛教般若部重要經典之一。後秦鳩摩羅什譯本最為通行。","en":"The Diamond Sutra (Vajracchedika Prajnaparamita Sutra) is a key Mahayana Buddhist text. Kumarajiva's translation is most popular. Through Buddha's dialogue with Subhuti, it teaches non-attachment: \"Give rise to the mind without dwelling anywhere.\"","es":"El Sutra del Diamante es un texto clave del budismo Mahayana. A través del diálogo de Buda con Subhuti, enseña el desapego: \"Da lugar a la mente sin morar en ninguna parte.\"","pt":"O Sutra do Diamante é um texto-chave do Budismo Mahayana. Através do diálogo de Buda com Subhuti, ensina o desapego: \"Dê origem à mente sem morar em nenhum lugar.\""},totalChapters:0},
{id:"liuzu",type:"儒释道",name:{"zh-CN":"六祖坛经","zh-TW":"六祖壇經","en":"Platform Sutra of the Sixth Patriarch","es":"Sutra de la Plataforma del Sexto Patriarca","pt":"Sutra da Plataforma do Sexto Patriarca"},author:{"zh-CN":"慧能述·法海集","zh-TW":"慧能述·法海集","en":"Huineng (recorded by Fahai)","es":"Huineng (registrado por Fahai)","pt":"Huineng (registrado por Fahai)"},dynasty:{"zh-CN":"唐","zh-TW":"唐","en":"Tang","es":"Tang","pt":"Tang"},intro:{"zh-CN":"《六祖坛经》是禅宗六祖慧能大师的言行录，是中国佛教界唯一一部被尊称为“经”的祖师著作。全书以“直指人心，见性成佛”为宗旨，主张“顿悟”法门，提出“菩提本无树，明镜亦非台”的著名偈语，标志着佛教中国化的完成。","zh-TW":"《六祖壇經》是禪宗六祖慧能大師的言行錄，是中國佛教界唯一一部被尊稱為「經」的祖師著作。","en":"The Platform Sutra is the recorded teachings of Huineng, the Sixth Patriarch of Chan (Zen) Buddhism. It is the only Chinese Buddhist text honored as a \"sutra\" by its patriarch. Centered on \"directly pointing to the mind, seeing one's nature to become Buddha,\" it represents the sinicization of Buddhism.","es":"El Sutra de la Plataforma son las enseñanzas registradas de Huineng, el Sexto Patriarca del Budismo Chan (Zen). Es el único texto budista chino honrado como \"sutra\" por su patriarca.","pt":"O Sutra da Plataforma são os ensinamentos registrados de Huineng, o Sexto Patriarca do Budismo Chan (Zen). É o único texto budista chinês homenageado como \"sutra\" por seu patriarca."},totalChapters:0},
{id:"liezi",type:"儒释道",name:{"zh-CN":"列子","zh-TW":"列子","en":"Liezi","es":"Liezi","pt":"Liezi"},author:{"zh-CN":"列御寇","zh-TW":"列禦寇","en":"Lie Yukou","es":"Lie Yukou","pt":"Lie Yukou"},dynasty:{"zh-CN":"战国","zh-TW":"戰國","en":"Warring States","es":"Reinos Combatientes","pt":"Reinos Combatentes"},intro:{"zh-CN":"《列子》是道家重要经典之一，相传为战国时期列御寇所著。全书共八卷，以寓言故事的形式阐述道家思想，其中“愚公移山”、“杞人忧天“、”朝三暮四“等寓言广为流传。其思想继承《道德经》而有所发挥，主张”贵虚“、”纵欲”，文风汪洋恣肆，富有想象力。","zh-TW":"《列子》是道家重要經典之一，相傳為戰國時期列禦寇所著。全書共八卷，以寓言故事的形式闡述道家思想。","en":"Liezi is an important Taoist classic attributed to Lie Yukou of the Warring States period. In 8 volumes, it presents Taoist philosophy through allegorical tales including \"The Foolish Old Man Moves Mountains.\" It develops Laozi's thought with an emphasis on emptiness and spontaneity.","es":"Liezi es un importante clásico taoísta atribuido a Lie Yukou del período de los Reinos Combatientes. En 8 volúmenes, presenta la filosofía taoísta a través de cuentos alegóricos.","pt":"Liezi é um importante clássico taoísta atribuído a Lie Yukou do período dos Reinos Combatentes. Em 8 volumes, apresenta a filosofia taoísta através de contos alegóricos."},totalChapters:0},
{id:"lengyan",type:"儒释道",name:{"zh-CN":"楞严经","zh-TW":"楞嚴經","en":"Shurangama Sutra","es":"Sutra Shurangama","pt":"Sutra Shurangama"},author:{"zh-CN":"般剌蜜帝译","zh-TW":"般剌蜜帝譯","en":"Trans. Paramiti","es":"Trad. Paramiti","pt":"Trad. Paramiti"},dynasty:{"zh-CN":"唐","zh-TW":"唐","en":"Tang","es":"Tang","pt":"Tang"},intro:{"zh-CN":"《楞严经》全称《大佛顶如来密因修证了义诸菩萨万行首楞严经》，是大乘佛教重要经典之一，唐般剌蜜帝译。全经阐述“一切众生从无始来，生死相续，皆由不知常住真心，性净明体，用诸妄想，此想不真，故有轮转“之理，是禅宗和天台宗重要依止经典，被誉为”开悟的楞严”。","zh-TW":"《楞嚴經》是大乘佛教重要經典之一，唐般剌蜜帝譯。全經闡述「一切眾生從無始來，生死相續，皆由不知常住真心」之理。","en":"The Shurangama Sutra is a major Mahayana Buddhist text translated by Paramiti in the Tang Dynasty. It explains that all beings are trapped in samsara because they fail to recognize their true, constant mind. Highly revered in Chan and Tiantai schools, it is known as the \"Sutra of Enlightenment.\"","es":"El Sutra Shurangama es un importante texto budista Mahayana traducido por Paramiti en la dinastía Tang. Explica que todos los seres están atrapados en el samsara porque no reconocen su verdadera mente constante.","pt":"O Sutra Shurangama é um importante texto budista Mahayana traduzido por Paramiti na dinastia Tang. Explica que todos os seres estão presos no samsara porque não reconhecem sua verdadeira mente constante."},totalChapters:0}

  h+="</div>";return h;

function renderTree(node,depth){depth=depth||0;
  if(!node.children)return"";
  var cls=depth===0?"tree-root":depth===1?"tree-branch":"tree-leaf";
  var h="<ul class=\""+cls+"\">";
  node.children.forEach(function(c){
    var hasChild=c.children&&c.children.length;
    h+="<li"+(hasChild?" class=\"tree-collapsible\"":"")+">";
    if(hasChild)h+="<span class=\"tree-toggle\" onclick=\"toggleTreeBranch(this)\">▶</span>";
    else h+="<span class=\"tree-dot\">•</span>";
    h+="<strong>"+c.name+"</strong>";
    if(c.desc)h+="<span class=\"tree-desc\"> — "+c.desc+"</span>";
    if(hasChild)h+="<div class=\"tree-children\">"+renderTree(c,depth+1)+"</div>";
    h+="</li>";
  });
  h+="</ul>";return h;
}
function toggleTreeBranch(el){el.textContent=el.textContent==="▶"?"▼":"▶";el.parentNode.querySelector(".tree-children").style.display=el.textContent==="▼"?"block":"none";}

}

var ct=['最近重读道德经，第一章「道可道非常道」让我反复琢磨。老子开篇就说可以说的道就不是永恒的道，那到底什么是道？是通过静坐体悟还是在日常生活中体验？各位同修有何高见？','最近三刷红楼梦，每次都有不同的感受。以前最喜欢林黛玉的才华与真性情，现在反而更理解薛宝钗的处世智慧。大家最喜欢红楼梦中的哪个人物？','最近读了传习录，王阳明的「知行合一」思想太契合当代了。我们读了很多书懂了很多道理却常常做不到。先生说的「知而不行只是未知」一语惊醒梦中人。','想学周易很久了，但翻开书就蒙了——卦象爻辞错综复杂。求问各位前辈学易有什么好的入门方法？要不要先背八卦？再学五行生克？','唐诗浩如烟海，每个人心中都有自己的诗王。我第一个想到的是张若虚的春江花月夜——孤篇压全唐不是吹的。各位来分享你的最爱！','论语中「仁」出现了109次，孔子对每个弟子的回答都不同。对颜回说「克己复礼为仁」，对仲弓说「己所不欲勿施于人」。到底什么是仁的本质？','一直对中医很感兴趣但也经常听到质疑的声音。有人说是玄学有人说千年实践就是最好的证明。大家怎么看中医的科学性？','都说商场如战场。最近重读孙子兵法发现很多思想用在商业竞争中非常实用。「知己知彼百战不殆」简直就是市场调研的圣经。大家有实践心得吗？','读六祖坛经，慧能大师说「菩提本无树明镜亦非台本来无一物何处惹尘埃」。这个「本来无一物」的境界怎么理解？在日常生活中如何修行？','零基础想学书法但不知道从何入手。楷书四大家该学谁的？还是从隶书开始比较好？求前辈指导入门路径！','最近看山海经里面那些奇形怪状的异兽荒诞离奇的地理，到底是古人的想象还是失落的文明记忆？有些学者认为山海经记载的是全球地理是真的吗？','读曾国藩家书感受到他不仅是一代名臣更是一个慈祥的父亲。他教导子弟「读书变化气质戒傲戒惰」。这些家训放在今天依然振聋发聩。','春秋战国百家争鸣是人类思想史上最璀璨的时代。儒家道家法家墨家兵家纵横家每家的思想都有独到之处。大家来聊聊自己最喜欢哪一家。','心经说「色即是空空即是色」，初看觉得很矛盾。明明眼前的山河大地都是实实在在的怎么说它是空呢？这个「空」是不是就是什么都没有的意思？','最近听了一些古琴曲发现和西方古典音乐完全是两个审美体系。西乐讲究和声对位宏大叙事，中乐追求意境留白弦外之音。两者的根本差异在哪里？','最近家里装修朋友建议我找风水师看看布局。我半信半疑——说它迷信吧有些讲究确实有道理，说它科学吧又很玄。大家怎么看待风水？','294卷的资治通鉴让人望而生畏。但司马光耗尽19年编成的这部巨著据说毛主席读了17遍。大家觉得普通人值得通读吗？有什么好的读法？','孔子和老子是同时代人据说孔子还问礼于老子，但他们的思想路径截然不同。一个入世一个出世一个讲仁义一个讲道德。这两种思想有什么根本分歧？','最近学对联发现汉字真的神奇——平平仄仄之间对仗工整之妙。我先来一个：杭州岳王庙「青山有幸埋忠骨白铁无辜铸佞臣」。大家来分享喜欢的对联！','每次去书店看到国学区那么多书就头晕。从三字经千字文开始会不会太简单？直接读四书五经又怕啃不动。大家推荐一下古籍阅读的循序渐进的路径。','大学开头就说「大学之道，在明明德，在亲民，在止于至善」。这个「明明德」是儒家修身的起点，但历代注家说法不一。朱熹说是「复其本性之明」，王阳明说是「致良知」。大家怎么理解？','同是儒家，孟子说人性本善只要扩而充之，荀子却说人性本恶需要礼法矫正。一个向内求一个向外立，两千年来争论不休。你更认同哪一边？','很多人把中庸理解成和稀泥，其实《中庸》讲的是「喜怒哀乐之未发谓之中，发而皆中节谓之和」。它追求的是恰到好处的平衡，而非无原则的折中。你觉得呢？','鲲鹏展翅九万里，列子御风而行，庄子却说这些都「犹有所待」。真正的逍遥是「无所待」的精神自由，是齐物我、忘生死。这种自由在现代社会还能实现吗？','老子说「上善若水，水善利万物而不争」。不争不是躺平，而是处下、柔韧、顺势而为。在职场上怎么理解这种「不争」的智慧？大家有体会吗？','六祖慧能就是听到这一句而开悟的。心不执着于任何相，却又生机盎然地活着——不粘不滞又积极有为。这个境界在日常生活里怎么落实？','儒家讲静坐省察，道家讲守静笃致虚极，佛家讲止观双运。虽然都是静坐，入手处和归宿却各有千秋。想入门的话从哪家开始比较好？','中国文化的奇妙之处在于儒释道既能各成体系又能圆融互摄。苏轼「羽化而登仙」有道家超脱，「一蓑烟雨任平生」有佛家旷达，而骨子里始终是儒家的担当。你怎么看三教的关系？'];

<script>
function autoSeedForum(){var n=Date.now(),h=36e5,m=6e4;var us=['清风明月','墨香居士','古道西风','南华真人','北冥有鱼','东篱采菊','西山红叶','竹林隐士','松间明月','石上清泉','闲云野鹤','流水高山','春风化雨','秋水长天','梅花三弄','兰亭序客','赤壁怀古','桃花源主','岳阳楼记','滕王阁序'];var rp=['读书人甲','读书人乙','国学爱好者','古文学徒','经史子集','诗词达人','历史迷','易学新手','儒释道信徒','中医养生'];var ts=['「千字文」开篇「天地玄黄，宇宙洪荒」藏着什么故事？','中国姓氏发展最好的有哪些？从「百家姓」到今日大姓','「道德经」「道可道非常道」大家怎么理解？','「红楼梦」中最打动你的人物是谁？','王阳明心学对现代人的启示','周易到底该怎么学？','你心中排名第一的唐诗是？','孔子说的「仁」到底是什么？','中医到底有没有科学依据？','「孙子兵法」在现代商业中的应用','禅宗「明心见性」是什么意思？','书法入门从哪种字体开始？','「山海经」是神话还是历史？','曾国藩家书中的处世智慧','诸子百家你最喜欢哪一家？','如何理解「心经」的「色即是空」？','中国古典音乐和西方音乐的根本差异','风水是科学还是迷信？','「资治通鉴」值得通读吗？','孔子和老子思想的最大分歧','大家来分享喜欢的对联','古籍阅读从哪些入门比较好？','「大学」开篇「明明德」到底该怎么理解？','孟子「性善论」和荀子「性恶论」你支持谁？','「中庸」真的是平庸和折中吗？','庄子「逍遥游」追求的是一种什么自由？','「上善若水」在现代职场里怎么用？','金刚经「应无所住而生其心」如何体会？','打坐冥想入门：儒释道的方法有什么不同？','为什么说「儒释道三教合一」？','「三字经」人人会背，它的教育理念今天还适用吗？','「百家姓」为什么「赵钱孙李」排最前？','「弟子规」讲「首孝悌」，现代家庭如何践行？','「增广贤文」里最扎心的一句是什么？','「史记」里的那些小人物，哪个最让你动容？','「汉书」与「史记」相比差在哪里？','「三国志」和「三国演义」哪个更接近历史？','「战国策」里的纵横家智慧','「左传」里的外交辞令有多精彩？','「黄帝内经」的养生智慧靠谱吗？','「本草纲目」里的冷知识','「世说新语」里最风流的名士是谁？','「菜根谭」的处世哲学','「颜氏家训」给后人的启示','「楚辞」里的香草美人到底指什么？','唐诗宋词，你更喜欢哪个朝代的韵脚？','「水浒传」的忠义该如何理解？','「西游记」里的修行隐喻','「聊斋志异」的狐仙世界','「三国演义」中你最喜欢的计谋？','「千字文」中「寒来暑往，秋收冬藏」的自然智慧','中国的「礼」文化在现代社交中还重要吗？','「六韬」「三略」等兵书的现代价值','「鬼谷子」的纵横捭阖之术','「墨子」的兼爱非攻今天怎么看？','「韩非子」的法术势思想','「荀子」的劝学篇为什么值得一读再读？','「论语」里你最受用的一句话','「大学」八条目：格物致知诚意正心修身齐家治国平天下','读书打卡：网站上线以来你读完了哪本典籍？'];var ct=['千字文由南朝周兴嗣一夜编成，把一千个互不重复的汉字串成韵文。开篇从天地宇宙讲起，涵盖自然、历史、修身、处世，是中国古代最经典的识字启蒙书之一。','百家姓里「赵钱孙李」因宋朝皇帝姓赵而排最前。如今李、王、张、刘、陈稳居前五，人口近亿甚至过亿。姓氏的发展与人口迁徙、改姓合流、历史机遇都密切相关。','老子开篇就说可以言说的道不是永恒的道。道既在天地运行中，也在日常起居里。是通过静坐体悟，还是在生活中体验？各位同修有何高见？','三刷红楼每次感受都不同。以前喜欢林黛玉的才情，现在更理解薛宝钗的圆融。一部红楼梦写尽人情冷暖，你最爱谁？','「知行合一」四字直指当代人「懂很多道理却过不好生活」的困境。先生言「知而不行只是未知」，行动才是真知的试金石。','翻开周易就晕——卦象爻辞错综复杂。入门路径建议：先背八卦，再学五行生克，理解六十四卦卦序逻辑，最后结合史例研读。前辈们有什么好方法？','唐诗浩如烟海。张若虚「春江花月夜」孤篇压全唐，李白「将进酒」豪气干云，杜甫「登高」沉郁顿挫。你心中的诗王是哪一首？','论语中「仁」出现109次，孔子因材施教回答各异：对颜回说克己复礼，对仲弓说己所不欲勿施于人。仁的本质到底是什么？','中医常被质疑也常被推崇。阴阳五行、经络气血自成体系，千年临床实践不容忽视。中医的科学性之争，你怎么看？','「知己知彼百战不殆」堪称市场调研的圣经，「出其不意攻其无备」是差异化竞争的策略。商场如战场，你有实践心得吗？','六祖慧能说「菩提本无树明镜亦非台」，直指人心见性成佛。明心见性不是文字功夫，而是放下执念后的本来面目。如何体会？','楷书四大家欧颜柳赵各有风格，也有人建议从隶书入手更易上手。零基础想学书法，你推荐哪条路径？','山海经里奇兽异境荒诞离奇，有学者认为是古人的想象，也有人提出它记载了全球地理。神话与历史的边界在哪里？','「读书变化气质，戒傲戒惰」八字家训振聋发聩。曾国藩一介书生练兵平乱，靠的是勤、恒、敬。家书里的智慧放到今天依然受用。','春秋战国百家争鸣是人类思想史上的璀璨星河。儒家的仁义、道家的自然、法家的制度、墨家的兼爱，各有所长。你最喜欢哪一家？','「色即是空空即是色」看似矛盾：山河大地明明实在，为何说空？此空非虚无，而是万法因缘和合、本无自性。这个「空」怎么体会？','西乐讲究和声对位与宏大叙事，中乐追求意境留白与弦外之音。一曲古琴高山流水，与一首交响乐，是两种审美世界。','风水讲藏风聚气、坐北朝南，暗合采光、通风、避寒等环境学原理；但把吉凶祸福全系于布局，又难免迷信。你怎么看？','294卷通鉴让人望而生畏，司马光耗时19年编纂，据说毛泽东读了17遍。普通人如何读通鉴？从纪事本末体或精选本入手或许更可行。','孔子问礼于老子，思想路径却迥异：一个入世讲仁义，一个出世讲道德；一个「知其不可而为之」，一个「无为而无不为」。根本分歧在哪里？','汉字对仗平仄之妙，尽在对联。杭州岳王庙「青山有幸埋忠骨，白铁无辜铸佞臣」一联道尽忠奸。你有哪些钟爱的对联？','从三字经千字文打底，再读论语大学等四书，配合史记选读练古文，循序渐进比硬啃大部头更有效。你的入门路径是什么？','「大学之道，在明明德，在亲民，在止于至善」。朱熹解为复其本明，王阳明解为致良知。明明德是修身的起点，你怎么看？','同是儒家，孟子主性善需扩而充之，荀子主性恶需礼法矫之。一个向内求，一个向外立，争论两千年。你更认同哪一方？','中庸不是和稀泥，而是「喜怒哀乐之未发谓之中，发而皆中节谓之和」，追求恰到好处的平衡。把中庸当平庸，是最大的误解。','鲲鹏九万里、列子御风，庄子却说犹有所待。真正的逍遥是「无所待」的精神自由。这种自由在现代社会如何安放？','「水善利万物而不争」——不争不是躺平，而是处下、柔韧、顺势而为。在职场上如何把水的智慧用出来？','六祖闻此句而开悟。心不执着于相，却生机盎然；不粘不滞，又积极有为。这个境界在日常中如何落实？','儒家静坐省察，道家守静笃致虚极，佛家止观双运。入手处与归宿各有千秋，你从哪家入门？','儒释道各成体系又圆融互摄。苏轼「羽化而登仙」见道家超脱，「一蓑烟雨任平生」见佛家旷达，骨子里仍是儒者的担当。三教关系你怎么看？','「人之初性本善，性相近习相远」，三字经把识字、历史、道德熔于一炉。六百年的蒙学经典，对今天的早教仍有启发吗？','百家姓成书于北宋，「赵」为皇姓居首，「钱」为吴越国王姓，「孙」为后妃姓，「李」为南唐皇姓。姓氏排序里藏着历史密码。','弟子规开篇「首孝悌次谨信」，把孝道放在做人首位。现代家庭关系变化，孝的践行方式也该与时俱进。你怎么做？','「路遥知马力，日久见人心」「画虎画皮难画骨，知人知面不知心」。增广贤文句句世故，哪句最戳中你？','史记不只有帝王将相，还有刺客、游侠、货殖、滑稽列传。荆轲刺秦、信陵君窃符救赵，小人物身上的大义最动人。','史记通古今之变，汉书断代为史。班固文风严谨，却少了几分司马迁的激情与悲悯。史家笔法之争，你站哪边？','三国志是正史，演义是七实三虚的小说。诸葛亮的空城计、借东风多是演义虚构。读史与读小说，是两种乐趣。','苏秦张仪合纵连横，一言可兴邦。战国策里的说辞艺术与揣摩人心，放在今天的人际沟通中依然锋利。','「国之大事，在祀与戎」，左传里的外交辞令温婉含蓄又暗藏机锋，烛之武退秦师一段堪称说服艺术的典范。','上古天真论讲「法于阴阳，和于术数，食饮有节，起居有常」，与现代健康理念高度契合。内经的养生观你实践过吗？','李时珍著本草纲目历时27年，收药1892种。书里既有水银砒霜入药，也有「以形补形」的朴素观念。哪些靠谱哪些存疑？','魏晋风流尽在世说新语：王子猷雪夜访戴「乘兴而行兴尽而返」，嵇康临刑弹广陵散。你最欣赏哪一位名士？','「宠辱不惊，看庭前花开花落；去留无意，望天上云卷云舒」。菜根谭的淡泊与圆融，是当代人最好的心灵解药。','颜之推历仕四朝，以家训告诫子孙「积财千万，不如薄技在身」。家训里的务实精神，至今仍有价值。','屈原以香草喻高洁，以美人喻君王。离骚开创的香草美人传统，是比兴寄托的文学范式。你读懂了多少？','唐诗气象万千，宋词婉约豪放。李白杜甫是唐诗的巅峰，苏轼辛弃疾是宋词的脊梁。两种美，你偏爱哪种？','水浒好汉替天行道，却也滥杀无辜。忠义二字是招牌也是枷锁。宋江招安是愚忠还是远见？值得深思。','取经路就是修心路：悟空是心猿，八戒是欲望，沙僧是本能。九九八十一难，降服的是内心的妖怪。你读出几重隐喻？','蒲松龄「写鬼写妖高人一等，刺贪刺虐入骨三分」。狐仙鬼魅背后，是世态人情与科场失意的寄托。','草船借箭、空城计、连环计……三国是谋略的盛宴。你最喜欢哪一计？历史上哪些计谋真实存在？','千字文短短四字一句，却把天文地理、四时农事、修身齐家讲得清清楚楚。「寒来暑往」的循环观，是中国人最朴素的世界观。','礼记讲「礼者，天地之序也」。现代社交虽简化了繁文缛节，但「礼」背后的尊重与分寸感，依然不可或缺。','六韬三略讲治国用兵之道，文伐武伐并举。姜太公的谋略，放在组织管理和人生规划中同样适用。','鬼谷子弟子苏秦张仪搅动战国风云。捭阖、揣摩、权谋之术在现代沟通谈判中如何正用，值得探讨。','兼爱是爱无差等，非攻是反对不义之战。墨家的侠义与科学精神（小孔成像、力学）在先秦独树一帜。兼爱在今天可行吗？','韩非集法家大成，主张以法为教、以吏为师。法（制度）、术（权术）、势（权威）三者结合，对现代管理有何启示？','「不积跬步无以至千里，不积小流无以成江海」「青出于蓝而胜于蓝」。劝学篇的比喻与论证，是古文的典范。','「己所不欲勿施于人」「学而不思则罔，思而不学则殆」「三人行必有我师」。论语句句可入生活，哪句最受用？','格物→致知→诚意→正心→修身→齐家→治国→平天下，层层递进又环环相扣。修身是枢纽，你如何理解这条进阶之路？','网站上线以来，和大家一起读了不少经典。今年你完整读完了哪本典籍？收获最大的是什么？来打个卡吧！'];var REPLIES=[
  ['「天地玄黄」本于《易经·坤卦》「天玄而地黄」——玄是天的深青色，黄是大地之色。周兴嗣一夜成文，实则是把天文地理、历史人伦浓缩成韵，字字不重复，是识字更是世界观启蒙。','千字文妙在先讲宇宙与四时（天地玄黄、寒来暑往），再讲人伦与修身（孝当竭力、忠则尽命），这个「从天到人」的顺序，本身就是天人合一的思维。','今天重读千字文，读的不是识字，是中国人最初的宇宙观：天地有常、四时有序、人伦有则。'],
  ['李、王、张、刘、陈五姓人口都接近或过亿，这是三股历史力量叠加的结果：历代皇室赐姓、少数民族改汉姓、以及战乱带来的人口南迁。','「赵钱孙李」是北宋编排的次序，不是人口排名——赵是皇姓居首。真要论今日规模，要看公安户籍统计，李王张刘陈稳居前五。','姓氏兴衰就是一部迁徙史。「郡望」「堂号」记录家族来路，今天修家谱热，本质是寻根问祖、确认「我从哪里来」。'],
  ['「道可道，非常道」的深意在于：能被语言说尽的道，已不是永恒之道。最高真理只能体悟，不能被概念穷尽——这正是东方哲学与西方逻辑学的分野。','庄子说「道在屎溺」，道不离日用。静坐是体道，吃饭穿衣也是体道，关键在于「致虚极，守静笃」的功夫，而不是换个地方想问题。','老子自己也只能「强字之曰道」，可见「道」字本身也是不得已的指月之指。能说出的都是月亮的手指，不是月亮。'],
  ['年轻时爱黛玉，因她真；年长后懂宝钗，因她忍。二人其实是理想人格与现实人格的一体两面，缺了谁都不成「红楼梦」。','曹雪芹写人不脸谱化：王熙凤精明又可怜，贾母慈爱又世故。这正是红楼梦高出才子佳人小说的根本——它写的是真实的人性。','我最心疼香菱，她学诗痴迷「大漠孤烟直」那一幕，是全书写「诗魂」最动人的一笔。'],
  ['「知行合一」不是口号，它直指「懂了很多道理却过不好生活」的病灶——知而不行，只是未知。真知必然能行，不能行的知是假知。','王阳明「致良知」的高明处，是把是非判断从外在教条收回到内心的良知，同时又要「事上磨练」，避免流入空谈。','现代人最大的问题是知识过剩、体验不足。心学的药方，正是把「知道」逼成「做到」。'],
  ['学易先别急着占卜，先明白它是一套「象数理」的符号系统：阴阳两仪、四象八卦、六十四卦，一层层抽象出万物变化的规律。','建议路径：先背八卦卦象与卦德，再学五行生克，然后读《系辞》理解「一阴一阳之谓道」，最后结合《左传》筮例看古人如何用易。','把周易当哲学读，比当算命书读更有收获。「穷则变，变则通，通则久」，这句就足够受用一生。'],
  ['论「孤篇压全唐」，张若虚《春江花月夜》确实气象万千；但论个人巅峰，我更服杜甫——他把律诗锻造成史，沉郁顿挫，字字千钧。','唐诗之美在气象：李白的飘逸、杜甫的沉郁、王维的空灵、李商隐的幽深，各有极致。排名无解，偏爱有因。','我投李白《将进酒》一票——「天生我材必有用」的自信与悲凉，千年后读来依然热血。'],
  ['「仁」的核心是「爱人」二字，但它不是泛爱，而是由近及远、由亲及疏的差序之爱。孔子对每个弟子讲仁各有侧重，正是因材施教。','「克己复礼为仁」是下手处，「己所不欲勿施于人」是恕道，「仁者爱人」是归宿。三句合看，仁的本质是「推己及人」。','把「仁」讲成道德标签就窄了。它更接近一种人格的完成状态——既有温情，又有原则。'],
  ['中医与西医是两套范式：西医重还原论、可重复实验；中医重系统论、个体化辨证。用西医标准全盘否定中医，本身就是方法论的错位。','「有效」不等于「科学」，但「不符合当前科学框架」也不等于「无效」。青蒿素的发现证明，千年经验里藏着可被现代科学验证的真金。','中医最珍贵的不是某一味药，而是「治未病」与「整体观」——把人当作一个与四时、情志互动的整体来调理。'],
  ['「知己知彼，百战不殆」确实是市场调研的圣经；但更深的智慧是「先胜而后求战」——不打无准备之仗，先立于不败之地。','孙子讲「上兵伐谋，其次伐交」，对应商业就是战略定位与生态合作优先，价格战是下策中的下策。','「善战者，无智名，无勇功」最值得琢磨：真正的高手，赢在事前布局，而不是事后力挽狂澜。'],
  ['「明心见性」不是玄谈，而是看清烦恼本空、觉性本有。慧能说「本来无一物」，是要我们放下对「自我」的执着，而非否定现象存在。','明心见性不是得到什么，而是「除去遮蔽」。就像擦去镜上尘埃，光明本来就在，不是新添的。','日常修行不必打坐成佛，行住坐卧皆是道场；关键是「念念不住」，不被念头牵着走。'],
  ['零基础建议从楷书入手，先立规矩：欧体险劲、颜体雄浑、柳体骨力、赵体圆润。选一种喜欢的，先临一年，勿贪多。','也有人主张从隶书入，因隶书笔法简单、易出效果，能建立信心。两条路都通，关键是「专一」与「坚持」。','练字如练心：一笔一画里磨掉的是浮躁。先求平正，再追险绝，最后复归平正。'],
  ['山海经是「上古地理志怪之祖」，它记录的可能是先民对真实山川的变形记忆，而非凭空虚构。神话与历史的边界，本就没那么清晰。','现代有学者考证，《东山经》的山脉走向与美洲落基山脉有对应，此说虽争议大，却说明山海经蕴藏的地理信息远超想象。','我倾向把它当「文化记忆」读：那些异兽是部落图腾与自然敬畏的投射，是古人理解世界的方式。'],
  ['「读书变化气质，戒傲戒惰」八字的深意，是曾国藩把修身落实到日常功课：早起、读书、写日记，用恒心对抗人性之惰。','曾氏家书最难得处是不装：他把自己的贪、懒、躁都写进去，再教子弟如何克治。这比空讲道理有力量得多。','「结硬寨，打呆仗」的笨功夫，正是现代人最缺的。聪明人太多，肯下笨功夫的人太少。'],
  ['百家争鸣的核心问题其实是同一个：乱世如何重建秩序？儒家说靠礼乐教化，道家说靠无为，法家说靠法度，墨家说靠兼爱。','我偏爱道家——它给中国文化留了一个「退一步」的空间，让士人在入世碰壁后还有精神出路。','儒家入世、道家超脱、法家务实，三者看似对立，实则互补。中国知识分子大多是「外儒内道」。'],
  ['「色即是空」不是说世界不存在，而是说万物皆因缘和合、无自性。眼前的山河大地真实存在，但「常、一、自在」的自性并不存在。','空不是「无」，是「缘起」。因为缘起，所以无自性；因为无自性，所以能生万法。空与有是一体两面。','把「空」理解成消极虚无，是最大的误读。真正的空性，恰恰让你不执着、不攀缘，从而活得通透自在。'],
  ['西乐是「和声的建筑」，追求纵向的立体与张力；中乐是「线条的艺术」，追求横向的意蕴与留白。一个在耳，一个在心。','古琴的「吟猱绰注」如同呼吸，音与音之间的「虚」比「实」更重要，这正是「大音希声」的审美。','根本差异在宇宙观：西方重「确定」与「结构」，中国重「过程」与「意境」。'],
  ['风水剥去神秘外壳，内核是古人的「环境选择学」：背山面水、坐北朝南，关乎采光、通风、避风、用水，很多讲究有实际依据。','说它科学，它又混入了太多命理玄学；说它迷信，它又确含朴素的环境智慧。理性态度是：取其宜居之理，去其穿凿之弊。','「风水」二字，风是空气流通，水是水源。好的居住环境，无非是风调、水活、气畅而已。'],
  ['普通人不必通读294卷，但可以「选读+精读」：从「三家分晋」「淝水之战」等名篇入手，再读历代兴衰的转折点。','司马光编通鉴，本意是「资于治道」；我们今天读它，读的是权力、人性与制度的千年博弈，句句可对照现实。','毛主席读17遍，读的是历史规律；普通人读一遍，能读懂「兴亡谁定」四个字，也值了。'],
  ['孔子与老子最大的不同，我概括为「有为」与「无为」：孔子要「修齐治平」，以规矩礼义廉耻重建秩序；老子说「道法自然」，主张顺应天性、少加人为干涉。','孔子是「入世救世」，要「知其不可而为之」；老子是「出世观世」，要「无为而无不为」。一个向前用力，一个向后退一步。','两人并非截然对立：孔子讲「礼」时也讲「和」，老子讲「无为」落脚也是「无不为」。分歧在路径，不在终点。'],
  ['「青山有幸埋忠骨，白铁无辜铸佞臣」妙在「有幸/无辜」的反讽——把忠奸之辨写得入木三分。','我也来一副：成都武侯祠「能攻心则反侧自消，从古知兵非好战；不审势即宽严皆误，后来治蜀要深思」，说的是用兵更是治国。','对联之美在对仗与意境的两难：既要字字相对，又要言外有意。好联如诗，可诵可思。'],
  ['不必从三字经开始，也不宜直接啃四书五经。建议「经史子集」各取一本入门：《论语》《史记》《庄子》《唐诗三百首》，先建立语感。','推荐「由近及远」的路径：先读明清白话小说建立兴趣，再上溯唐宋散文，最后读先秦经典，阶梯式前进不劝退。','古籍阅读贵在「不求甚解」——先通读大意，再回头精读字句。一上来就逐字训诂，最容易半途而废。'],
  ['朱熹解「明明德」为「复其本性之明」，是复性论；王阳明解为「致良知」，是心学路数。两家分歧在「明德是先天本有还是后天恢复」。','「明德」二字，明是动词、德是名词：第一个「明」是擦拭照亮，第二个「明」是光明的德性。合起来就是「把自己本有的光明德性擦亮」。','三家注的分歧恰恰说明经典的开放性——「明明德」不是标准答案题，而是每个人都要亲证的修身起点。'],
  ['孟子讲性善，是就「人之所以为人」说，四端（恻隐羞恶辞让是非）人人本有；荀子讲性恶，是就「人的自然欲望」说，需礼法矫正。两人说的不是同一个「性」。','我站孟子一半：性善给了人向上的自信；我也认同荀子一半：离开礼法约束，善端难以长成。二者其实互补。','「人之性善，犹水之就下」，是孟子的比喻；「人之性恶，其善者伪也」，是荀子的判断。一正一反，共同撑起儒家的教化论。'],
  ['把中庸当平庸，是两千年来最大的误读。中庸是「无过无不及」的恰好，是射箭中的、是庖丁解牛的那一刀，极难。','「喜怒哀乐之未发谓之中」，中是未发时的本然状态；「发而皆中节谓之和」，和是情绪发出来都恰到好处。这需要极深的修养。','中庸的本质是「时中」——因时、因地、因事取其中，不是教条的折中。孔子说「小人反中庸」，正是骂那些无原则的和稀泥者。'],
  ['庄子所谓「无所待」，不是躺平，而是精神不再依赖外物（名、利、他人评价）。列子御风犹有所待，因他还待风。','逍遥游的终点是「无己、无功、无名」：放下自我执念、放下功名之心，才能与天地精神相往来。','现代人离逍遥其实很近：把「我必须如何」换成「我选择如何」，就从「所待」走向了「自足」。'],
  ['「水善利万物而不争」的精髓是「处众人之所恶」——愿意做别人不愿做的、不抢功不居功，反而「几于道」。','职场里的「不争」不是放弃，是「不争一时之得失，而争长久之信用」。把事做扎实，机会自来。','水有三德可学：柔（以柔克刚）、下（处下不争）、活（随物赋形）。做人也当如此。'],
  ['「应无所住而生其心」：心不停驻于任何事物（不住色声香味触法），却能生起清明的觉知与慈悲的行动。是「不执着」而非「不作为」。','六祖正是闻此句而开悟。它说的是：既不粘着过去，也不攀缘未来，当下这一念了了分明、自由自在。','落实到日常，就是「事来则应，事去不留」。全力以赴做事，却不为结果所牵累。'],
  ['三家静坐，同是「止」，别在「观」：儒家观「未发之中」以涵养德性，道家观「虚静」以合于自然，佛家观「诸法无我」以破执。','入门不必分高下，先练「数息观」最稳：专注呼吸、数出入息，心散即收。三家共用此法打底。','功夫在坐垫外：打坐时的定力，要能延续到待人接物处，才是真功夫。'],
  ['所谓「三教合一」，不是三家混为一谈，而是中国人心灵结构的分工：儒家治世、道家治身、佛家治心，各安其位又互补互摄。','苏轼是最好的例证：入世用儒，失意用道，看破用佛。三教在他身上不是冲突，而是不同人生境遇下的安顿。','三教能圆融，根子在「不排他」的中国式智慧：和而不同、殊途同归。'],
  ['「人之初，性本善」并非孟子原文，而是王应麟的概括，它把性善论以最通俗的方式植入每个中国人的心里，功莫大焉。','三字经是「蒙学里的百科全书」：三字一句、押韵易诵，把识字、历史、道德、典故熔于一炉。','今天读三字经，取其「人性向善」的信念与「教之道贵以专」的方法，仍是早教的好材料。'],
  ['「赵钱孙李」的次序藏着历史密码：赵是宋朝皇姓、钱是吴越王姓、孙是钱王正妃之姓、李是南唐国姓，反映的是成书时的政治秩序。','百家姓成书于北宋初，是「以国姓为尊」的产物。它记的是「姓」而非「人口」，所以次序与今日人口排名无关。','百家姓的价值在「存姓」：很多今天少见的姓（妘、姒、嬴）靠它流传下来，是一部活的姓氏档案。'],
  ['「首孝悌」把孝放在做人第一义，是对儒家「孝为德之本」的通俗化。今天践行，重在「敬」与「养」——敬是内心尊重，养是物质奉养。','孝不是愚孝。「父有过，谏使更」，弟子规也讲劝谏。现代孝道应是「尊重+陪伴+善意沟通」，而非单向服从。','家庭关系变了，孝的形式也要变：远游者常问候、同住者多倾听，形式不一，其心一也。'],
  ['最扎心的一句我选「贫居闹市无人问，富在深山有远亲」——一句道尽世态炎凉，却也提醒我们：莫以贫富论交情。','「逢人且说三分话，未可全抛一片心」是处世防身，但若变成待人准则，则失之厚道。增广贤文要「取世故之智，弃圆滑之弊」。','它句句是「世故」，但不是教坏，而是教人看懂世故而不被世故所困。'],
  ['最动容的是荆轲：明知必死而往，是「士为知己者死」的大义；而高渐离击筑、易水悲歌，写的是小人物的大风骨。','信陵君窃符救赵，侯嬴七十高龄以死相报，这种「不为人知的重诺」，司马迁写得荡气回肠。','司马迁的伟大，正在于给刺客、游侠、货殖立传——他不只写帝王将相，更写「人」本身。'],
  ['史记是「通史」，通古今之变，文有悲悯与激情；汉书是「断代史」，体例严整，文风典雅却少了些温度。','班固守正、司马迁好奇。读史记如读文学，读汉书如读档案，各有其用。','若论史识与文采并重，史记当在汉书之上；但汉书在制度、食货等志上更系统，是治汉史的基本文献。'],
  ['三国志是正史，惜墨如金；三国演义是小说，七实三虚。空城计、借东风、草船借箭，多是罗贯中的再创造。','正史里的诸葛亮是「治戎为长，奇谋为短」的治国能臣，演义则把他神化成「多智近妖」。','读史求真，读演义求味。两者不可偏废：先读演义培养兴趣，再读三国志校准认知。'],
  ['苏秦张仪的纵横术，核心是「揣摩」——先揣测对方最在意什么，再用利害打动他。这套说服术放在今天的谈判中依然锋利。','「毛遂自荐」「邹忌讽齐王纳谏」都出在战国策，它不只是纵横家的教材，更是古代说服艺术的宝库。','纵横术的教训也深：靠权谋立国者，终因权谋而乱。正用是沟通智慧，滥用是阴谋诡计。'],
  ['烛之武退秦师是外交辞令的巅峰：他不卑不亢，只陈利害，一句「邻之厚，君之薄也」点破本质，不费一兵一卒退秦。','左传的外交辞令「温而厉，威而不猛」，字面客气、骨子里有分寸。这是礼乐文明滋养出的语言艺术。','「国之大事，在祀与戎」之下，外交辞令是看不见的战场。辞令之高下，往往决定一国之存亡。'],
  ['「法于阴阳，和于术数，食饮有节，起居有常，不妄作劳」——两千年了，这二十字仍是现代健康管理的总纲。','内经养生的核心是「治未病」，不是等病了再治，而是顺应四时、调畅情志，把病挡在发生之前。','我实践最深的是「起居有常」：不熬夜这一条，胜过万千补品。'],
  ['本草纲目收录1892种药，是李时珍27年田野考察的结晶，但书中「以形补形」等观念也有时代局限，要「取其验，去其谬」。','李时珍的可贵，在于「格物」精神——他亲尝、亲采、亲验，纠正了不少前代本草的错漏。','今天看本草纲目，与其当药典，不如当一部「博物志」读，里面藏着古人对自然的细致观察。'],
  ['最风流当属王子猷「雪夜访戴」：乘兴而行，兴尽而返，何必见戴？这份「兴之所至」，是魏晋名士精神的极致。','嵇康临刑索琴弹《广陵散》，叹「广陵散于今绝矣」——把死亡都活成了艺术，是真名士。','世说新语的好，在于它记的是「人」的瞬间：一个眼神、一句清谈、一次任性，皆是风骨。'],
  ['「宠辱不惊，看庭前花开花落；去留无意，望天上云卷云舒」——这联子之所以流传，是因它给了浮躁时代一个安放心的出口。','菜根谭的智慧是「儒家的入世 + 道家的超脱」：既教你积极做事，又教你看淡结果，是「外圆内方」的处世哲学。','「咬得菜根，百事可做」，书名本身就是答案：能耐得住清苦，才成得了大事。'],
  ['「积财千万，不如薄技在身」是全书的精髓——颜之推历经四朝动乱，深知财产会散，唯有一技傍身才是立命之本。','颜氏家训是「家训之祖」，它不空谈道德，而是从读书、治家、交友到养生，句句落到实处。','颜之推教训子弟「勤学、务本、慎言」，放在今天依然是家教的好范式。'],
  ['屈原以「香草」喻高洁品德、以「美人」喻理想君王，开创了「香草美人」的比兴传统，后世诗歌的托物言志皆受其泽。','离骚里的「路漫漫其修远兮，吾将上下而求索」，既是屈原的求索，也是中国知识分子精神的原型。','香草美人表面写的是男女之情，骨子里写的是君臣之义与人格坚守。读懂这层，才算读进楚辞。'],
  ['唐诗求「气象」，宋词求「情致」。李白杜甫是唐诗的巅峰，苏轼辛弃疾是宋词的脊梁，两种美不可替代。','论个人的偏爱，我选宋词——它更贴近日常的悲欢，长短句的节奏也更适合吟唱。','其实不必分高下：诗言志，词抒情，一个向外，一个向内，共同构成中国人的情感世界。'],
  ['「忠义」二字是水浒的招牌，也是它的枷锁：好汉们替天行道，却也滥杀无辜，忠与义的矛盾贯穿全书。','宋江招安是愚忠还是远见？我看是「忠」的悲剧——他始终没走出「忠君」的框架，最终把兄弟送上了绝路。','水浒最深的批判，是写出「官逼民反」的必然：是腐败的朝廷，把良民逼成了强盗。'],
  ['取经路就是修心路：孙悟空是「心猿」，代表躁动的心；八戒是欲望，沙僧是本能，师徒四人合起来就是一个「人」。','九九八十一难，降服的不是外面的妖怪，而是内心的贪嗔痴。真正的灵山，不在西天，在心头。','「紧箍咒」是修行的纪律：心猿需要约束，自由若无法度，便成放纵。'],
  ['蒲松龄「写鬼写妖，高人一等；刺贪刺虐，入骨三分」。狐仙鬼魅背后，是世态人情与科场失意的寄托。','聊斋里的狐女多情、书生多舛，表面是志怪，内里是「借鬼说人」——最可怕的从来不是鬼，是人心。','《聂小倩》《画皮》的经典，在于它把道德警示藏进了好看的故事里。'],
  ['最服「草船借箭」——不是计策本身多高明，而是诸葛亮算透了天时（大雾）、人心（曹操多疑），谋略的本质是「算」。','「空城计」历史上并无此事，但它在文学里成了「攻心为上」的典范：真正的战场，有时在对手的心里。','三国是谋略的盛宴，但别忘了「机关算尽太聪明」——计谋终有穷时，大势与人心才是根本。'],
  ['「寒来暑往，秋收冬藏」八个字，是中国人最朴素的世界观：天有节律，人顺节律，不违农时，不逆天时。','这种循环观不是消极循环，而是「生生不息」：冬藏是为了春生，结束里藏着开始。','现代人最大的背离，是活成了「逆四时」的机器；千字文的自然智慧，恰恰是提醒我们回归节律。'],
  ['「礼」的核心不是繁文缛节，而是「分」与「敬」：分是分寸，敬是尊重。现代社交虽简化了形式，但「礼」背后的分寸感不可丢。','礼记说「礼者，天地之序也」，礼的本质是秩序。一个社会若失了礼，就只剩下赤裸的功利。','礼要「与时俱进」：古礼束发跪拜，今礼握手问好，形式变了，「敬人」的内核不变。'],
  ['六韬讲「文伐」与「武伐」并举，最高明的是「不战而屈人之兵」——姜太公的谋略，本质是「先胜后战」。','把兵书用于管理，「赏罚分明」「因敌制胜」都可迁移：赏罚是制度，因敌是应变。','读兵书切忌生搬硬套，军事的「奇正」「虚实」到了职场，要化为「原则与灵活」的辩证法。'],
  ['鬼谷子的「捭阖」之术，核心是「开合」：该开口时开，该沉默时闭；该进取时进，该退让时退。这是一种极高明的分寸感。','「揣摩」二字的现代应用，就是「换位思考+洞察需求」——先摸清对方的真实诉求，再谈合作。','鬼谷子之术是双刃剑：用于沟通谈判是智慧，用于算计操控是阴谋。正用邪用，全在人心。'],
  ['「兼爱」是爱无差等，「非攻」是反对不义之战。墨家在先秦独树一帜，还因其有科学精神（小孔成像、力学）与侠义担当。','兼爱理想很高，但难在落地：人天然更爱亲人。儒家「差序之爱」更合人性，墨家「兼爱」更合理想，各有所长。','墨子的精神遗产，最珍贵的是「摩顶放踵以利天下」的苦行与担当，这种利他主义在当下尤为稀缺。'],
  ['韩非集法家大成，主张「以法为教、以吏为师」。他的「法、术、势」三者结合：法（制度）是根本，术（权术）是手段，势（权威）是保障。','韩非的冷峻在于看透人性：「人主之患在于信人」，一切以利害论，虽刻薄却戳中了权力的真相。','法家思想对现代管理的启示：制度建设重于个人道德，程序正义重于结果说教。'],
  ['「不积跬步，无以至千里」——劝学篇全篇都在讲「积累」与「专一」：君子性非异也，善假于物也，贵在坚持。','「青，取之于蓝而青于蓝」既是比喻学习的超越，也是劝学的信心：后学可以超越先师。','劝学篇是古文的典范，论证层层递进、比喻贴切生动，读它既是修心，也是学文。'],
  ['最受用的是「己所不欲，勿施于人」——它是一把尺子，量别人之前先量自己，是「恕道」，也是人际的黄金法则。','「学而不思则罔，思而不学则殆」点破现代人两大病：只刷信息不思考，只空想不读书。','「三人行，必有我师焉」提醒我：谦卑是最好的学习姿态，人人皆可为我师。'],
  ['八条目「格物→致知→诚意→正心→修身→齐家→治国→平天下」，前四目是「内圣」，后三目是「外王」，修身是枢纽。','「格物致知」是起点：先要弄清事物的道理，才能有真知；「诚意正心」是工夫：不自欺、不妄念。','这条进阶之路的关键在「修身」——自己不立，家国皆无从谈起。治国平天下，先把自己修好。'],
  ['今年完整读完了《论语》，收获最大的是「君子求诸己」——遇到问题先反求诸己，不怨天尤人，心态一下稳了。','我在读《史记》，最震撼的是司马迁的「实录」精神，在刀笔之下依然敢写真话。','打卡：读完《道德经》81章，最大体会是「少则得，多则惑」，生活要做减法。']
];
generateAndSave(us,rp,ts,ct,REPLIES);}function generateAndSave(us,rp,ts,cs,rcs){var n=Date.now(),h=36e5,m=6e4;var spanMs=n-new Date(2026,0,1).getTime();var stepMs=Math.max(864e5,Math.floor(spanMs/(ts.length-1)));var posts=[];ts.forEach(function(t,i){var pt=n-(ts.length-1-i)*stepMs-Math.floor(Math.random()*stepMs*0.4);var po={id:String(pt),t:t,c:cs[i%cs.length]||'',a:us[i%us.length],d:pt,i:[],v:[],r:[]};var rr=(rcs[i%rcs.length]&&rcs[i%rcs.length].length)?rcs[i%rcs.length]:[];for(var j=0;j<rr.length;j++){po.r.push({id:String(pt+j*m),a:rp[(i+j)%rp.length],d:pt+(j+1)*m,c:rr[j],i:[]})}posts.push(po)});_forumData=posts;localStorage.setItem("ch_forum_v2",JSON.stringify(posts))}
</script>
<script>
var SCHOOL_RU = ["论语","孟子","大学","中庸","荀子","孔子家语","盐铁论","说苑","新序","法言","申鉴","中说","传习录","近思录","朱子语类","大学衍义","大学衍义补","日知录","明夷待访录","思问录","张子正蒙","二程遗书","象山全集","阳明全书","恒言录","潜书","焚书","藏书","明儒学案","宋元学案","孝经"];
var SCHOOL_DAO = ["道德经","庄子","列子","文子","淮南子","抱朴子","周易参同契","黄庭经","太上感应篇","阴符经","清静经","悟真篇","坐忘论","化书","无能子","太平经","老子想尔注","云笈七签"];
var SCHOOL_FO = ["金刚经","心经","六祖坛经","楞严经","法华经","华严经","维摩诘经","大般涅槃经","圆觉经","阿弥陀经","无量寿经","观无量寿经","地藏菩萨本愿经","药师经","四十二章经","八大人觉经","百喻经","梵网经","楞伽经","解深密经","大乘起信论","唯识三十论颂"];
var SISHU_WUJING_BOOKS = ["大学","中庸","论语","孟子","诗经","尚书","礼记","周易","春秋"];
var _classicsSubFilter = "";

function getSchool(b){
  if(!b||!b.name) return "";
  var n = b.name["zh-CN"] || "";
  var a = (b.author&&b.author["zh-CN"]) || "";
  if(n==="中论") return a.indexOf("徐幹")>=0 ? "儒" : "佛";
  if(SCHOOL_RU.indexOf(n)>=0) return "儒";
  if(SCHOOL_DAO.indexOf(n)>=0||a.indexOf("老子")>=0||a.indexOf("庄周")>=0||a.indexOf("列御寇")>=0||a.indexOf("刘安")>=0||a.indexOf("葛洪")>=0) return "道";
  if(SCHOOL_FO.indexOf(n)>=0||a.indexOf("鸠摩罗什")>=0||a.indexOf("玄奘")>=0||a.indexOf("慧能")>=0) return "佛";
  return "";
}

function makeBookCard(b){
  var n = b.name[_lang]||b.name["zh-CN"]||"";
  var a = b.author[_lang]||b.author["zh-CN"]||"";
  var d = b.dynasty[_lang]||b.dynasty["zh-CN"]||"";
  var it = (b.intro[_lang]||b.intro["zh-CN"]||"").substring(0,70)+"...";
  var owned = _user&&(_user.ownedBooks||[]).indexOf(b.id)>=0;
  var school = getSchool(b);
  var badge = school ? "<span class=\"school-badge\" style=\"position:absolute;bottom:4px;right:4px;background:#8B0000;color:#f5e8d0;font-size:10px;line-height:1.3;padding:1px 5px;border-radius:3px\">"+school+"</span>" : "";
  return "<div class=\"book-card\" style=\"position:relative\" onclick=\"openReader('"+b.id+"')\"><div class=\"bc-lock "+(owned?"free":"")+"\">"+(owned?"\u2705":"\ud83d\udd12")+"</div><h4>"+n+"</h4><div class=\"bc-meta\"><span>"+t("bookAuthor")+": "+a+"</span><span>"+t("bookDynasty")+": "+d+"</span></div><p>"+it+"</p><div class=\"bc-tags\"><span class=\"tag\">"+b.type+"</span>"+(b.totalChapters>0?"<span class=\"tag\">"+b.totalChapters+" "+t("bookChapters")+"</span>":"<span class=\"tag\">"+t("introOnly")+"</span>")+"</div>"+badge+progressBarHTML(b)+"</div>";
}

function renderClassics(){
  var g=document.getElementById("classicsGrid");if(!g)return;
  var fb=document.getElementById("classicsFilter");
  if(fb&&!fb.children.length){
    var types=["all"].concat([...new Set(BOOKS_DATA.map(function(b){return b.type;}))]).filter(function(t){return t&&t!=="undefined"&&t!=="null";});
    if(types.indexOf("四书五经")===-1) types.splice(1,0,"四书五经");
    fb.innerHTML=types.map(function(t){return "<button"+(t===_classicsFilter?" class=\"active\"":"")+" onclick=\"setClassicsFilter('"+t+"')\">"+(t==="all"?"全部":t)+"</button>";}).join("");
  }
  var ru=[],shi=[],dao=[],all=[],sub=_classicsSubFilter||"";
  if(_classicsFilter==="四书五经") all=BOOKS_DATA.filter(function(b){return SISHU_WUJING_BOOKS.indexOf(b.name["zh-CN"])>=0;});
  else if(_classicsFilter==="儒释道"){
    BOOKS_DATA.filter(function(b){return b.type==="儒释道"||getSchool(b);}).forEach(function(b){var s=getSchool(b);if(s==="儒")ru.push(b);else if(s==="佛")shi.push(b);else if(s==="道")dao.push(b);});
    if(sub==="儒") all=ru; else if(sub==="释") all=shi; else if(sub==="道") all=dao; else all=ru.concat(shi).concat(dao);
  }else if(_classicsFilter==="all") all=BOOKS_DATA.slice();
  else all=BOOKS_DATA.filter(function(b){return b.type===_classicsFilter;});
  if(_classicsSearch){var q=_classicsSearch.toLowerCase();all=all.filter(function(b){return(b.name[_lang]||b.name["zh-CN"]||"").toLowerCase().indexOf(q)>=0||(b.author[_lang]||b.author["zh-CN"]||"").toLowerCase().indexOf(q)>=0;});}
  if(_classicsFilter==="儒释道"){
    var h='<div style="display:flex;gap:0;border:1px solid #d4c9b8;border-radius:3px;overflow:hidden;margin-bottom:.5rem">';
    [["",!sub?"active":""],["儒",sub==="儒"?"active":""],["释",sub==="释"?"active":""],["道",sub==="道"?"active":""]].forEach(function(t){h+='<span style="padding:.1rem .5rem;cursor:pointer;font-size:.78rem;border-right:1px solid #d4c9b8'+(!t[1]?"":";background:#8B0000;color:#f5e8d0")+'" onclick="_classicsSubFilter=\"'+t[0]+'\";renderClassics()">'+(t[0]||"全部")+"</span>";});
    h+="</div>";
    if(sub){h+=all.map(function(b){return makeBookCard(b);}).join("");}else{
      if(ru.length) h+='<h4 style="font-size:.82rem;margin:.4rem 0 .2rem;color:#8B0000">儒家</h4><div class="book-grid">'+ru.map(function(b){return makeBookCard(b);}).join("")+"</div>";
      if(shi.length) h+='<h4 style="font-size:.82rem;margin:.4rem 0 .2rem;color:#8B0000">佛家</h4><div class="book-grid">'+shi.map(function(b){return makeBookCard(b);}).join("")+"</div>";
      if(dao.length) h+='<h4 style="font-size:.82rem;margin:.4rem 0 .2rem;color:#8B0000">道家</h4><div class="book-grid">'+dao.map(function(b){return makeBookCard(b);}).join("")+"</div>";
    }
    g.innerHTML=h||"";
  }else{
    g.innerHTML=all.map(function(b){return makeBookCard(b);}).join("");
  }
}
function setClassicsFilter(t){_classicsFilter=t;_classicsSubFilter="";document.querySelectorAll("#classicsFilter button").forEach(function(b){b.classList.toggle("active",b.textContent===t||t==="all"&&b.textContent.indexOf("全部")>=0||t==="四书五经"&&b.textContent==="四书五经");});renderClassics();}
function filterClassics(){_classicsSearch=(document.getElementById("classicsSearch")||{}).value||"";renderClassics();}

</script>
<script>try{if(typeof init==="function")init();}catch(e){}</script>

<script>
// ===== 阅读进度系统 + 商城搜索 + 每日签到 (2026-08-29) =====
function loadProgress(){var p=null;try{p=JSON.parse(localStorage.getItem("ch_progress")||"{}")}catch(e){p={}}if(!p||typeof p!=="object"||Array.isArray(p))p={};return p;}
function saveProgress(){try{localStorage.setItem("ch_progress",JSON.stringify(loadProgress()))}catch(e){}}
function bookChapters(book){if(!book||!book.chapters)return [];return book.chapters[_lang]||book.chapters["zh-CN"]||[];}
function bookProgress(book){if(!book)return {pct:0,read:0,total:0};var chs=bookChapters(book);var total=chs.length||book.totalChapters||0;if(!total)return {pct:0,read:0,total:0};var p=loadProgress();var arr=(p[book.id]||[]).filter(function(n){return typeof n==="number"&&n>=1&&n<=total;});var read=[];arr.forEach(function(n){if(read.indexOf(n)<0)read.push(n);});return {pct:Math.round(read.length/total*100),read:read.length,total:total};}
function markChapterRead(book,n){if(!book||!n)return;var chs=bookChapters(book);var total=chs.length||book.totalChapters||0;if(n<1||n>total)return;var p=loadProgress();var arr=p[book.id]||[];if(arr.indexOf(n)<0){arr.push(n);p[book.id]=arr;try{localStorage.setItem("ch_progress",JSON.stringify(p))}catch(e){}}refreshProgressUI(book);}
function progressBarHTML(book){var pr=bookProgress(book);if(!pr.total)return "";return '<div class="bc-progress"><div class="bc-progress-bar"><div class="bc-progress-fill" style="width:'+pr.pct+'%"></div></div><span class="bc-progress-label">'+t("progressDone").replace("{p}",pr.pct)+'</span></div>';}
function refreshProgressUI(book){if(!book)return;var fill=document.getElementById("readerProgressFill");if(fill){var pr=bookProgress(book);fill.style.width=pr.pct+"%";var lb=document.getElementById("readerProgressLabel");if(lb)lb.textContent=t("progressDone").replace("{p}",pr.pct);}var tot=document.getElementById("readerTotal");if(tot){var pr2=bookProgress(book);tot.textContent=t("progressChapters").replace("{a}",pr2.read).replace("{b}",pr2.total);}var grid=document.getElementById("classicsGrid");if(grid){var cards=grid.querySelectorAll(".book-card");for(var i=0;i<cards.length;i++){var card=cards[i];if(card.getAttribute("data-book")===book.id){var f=card.querySelector(".bc-progress-fill");var l2=card.querySelector(".bc-progress-label");if(f&&l2){var pr3=bookProgress(book);f.style.width=pr3.pct+"%";l2.textContent=t("progressDone").replace("{p}",pr3.pct);}}}}}
window.openReader=function(id){_currentBook=(typeof BOOKS_DATA!=="undefined"?BOOKS_DATA.find(function(b){return b.id===id;}):null);_currentChapter=null;navTo("reader");};
window.renderReader=function(){var sec=document.getElementById("reader-page");if(!sec||!_currentBook)return;var b=_currentBook;var chs=bookChapters(b);var pr=bookProgress(b);var readArr=loadProgress()[b.id]||[];

function hrBuild(lv){var lv=HR_LEVELS[lv];var vs=['zhangfei','zhaoyun','machao','huangzhong'];var vi=0,bi=0;var out=[];for(var i=0;i<lv.b.length;i++){var s=lv.b[i];var id;if(s[0]==='C')id='caocao';else if(s[0]==='Y')id='guanyu';else if(s[0]==='V')id=vs[vi++];else id='b'+(++bi);out.push({id:id,n:HR_NAMES[id]||'兵',w:s[1],h:s[2],r:s[3],c:s[4]});}return out;}

{id:"laozi",emoji:"🌿",name:"老子",title:"道祖 · 春秋",intro:"道家始祖，著《道德经》五千言。主张道法自然、无为而治。",chips:["什么是道？","如何无为而治？","上善若水是什么意思？","怎样养生？"],responses:[{k:["道","非常道"],a:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。道，说不清道不明，却无时无刻不在天地间运行。"},{k:["无为","不争"],a:"无为而无不为。不妄为、不强为，顺应自然，反而无所不成。治国如此，处世亦然。"},{k:["水","上善"],a:"上善若水，水善利万物而不争，处众人之所恶，故几于道。最善的人像水一样，利万物而不争功。"},{k:["养生","长寿","长生","健康"],a:"知足者富，强行者有志；祸莫大于不知足，咎莫大于欲得。清心寡欲，顺其自然，方能长久。"},{k:["柔弱","刚强","强"],a:"天下之至柔，驰骋天下之至坚。弱之胜强，柔之胜刚，天下莫不知，莫能行。"},{k:["欲望","知足","快乐"],a:"五色令人目盲，五音令人耳聋，五味令人口爽。少私寡欲，返璞归真，方能得大自在。"}],fallback:["致虚极，守静笃。万物并作，吾以观复。","道生一，一生二，二生三，三生万物。你问的这件事，不妨静下心来观照。","知人者智，自知者明；胜人者有力，自胜者强。"]},

{id:"buddha",emoji:"🪷",name:"释迦牟尼",title:"佛陀 · 古印度",intro:"佛教创始人，觉悟者。观苦集灭道，宣慈悲智慧。",chips:["人生为什么苦？","什么是空？","怎样修行？","如何放下？"],responses:[{k:["苦","烦恼","痛苦"],a:"众生皆苦。生老病死、求不得、爱别离、怨憎会。知苦方能离苦。"},{k:["空","色","无自性"],a:"色不异空，空不异色。万法因缘和合，本无自性。不执不著，方见真相。"},{k:["慈悲","平等","善"],a:"众生平等，慈悲为怀。一切众生皆具如来智慧德相，只因妄想执著而不能证得。"},{k:["修行","禅","静"],a:"诸恶莫作，众善奉行，自净其意，是诸佛教。修行在日用中。"},{k:["放下","执念","执着"],a:"应无所住而生其心。放下执念，心无所住，方得自在。"}],fallback:["一切有为法，如梦幻泡影，如露亦如电，应作如是观。","过去心不可得，现在心不可得，未来心不可得。","若以色见我，以音声求我，是人行邪道，不能见如来。"]},

{id:"wukong",emoji:"🐒",name:"孙悟空",title:"斗战胜佛 · 西游",intro:"齐天大圣，一个筋斗十万八千里。取经路上，斗的是自己的心猿。",chips:["怎么获得自由？","你怕什么？","为什么去取经？","怎么降妖？"],responses:[{k:["自由","自在","天宫"],a:"俺老孙跳出三界外，不在五行中，天地都不怕！自由，是心无挂碍。"},{k:["怕","紧箍","如来"],a:"一个筋斗十万八千里，却翻不出如来佛的手掌心——心外无佛，心即是佛。"},{k:["取经","唐僧","西天"],a:"五百年前大闹天宫，五百年后随师父西行。取经路，就是修心路。"},{k:["妖","魔","心魔"],a:"妖怪就是心魔！打妖怪，就是降服自己的贪嗔痴。"}],fallback:["俺老孙去也！","皇帝轮流做，明年到我家！","不怕千军万马，就怕师父念紧箍咒。"]},
{id:"simaqian",emoji:"📜",name:"司马迁",title:"太史公 · 西汉",intro:"忍辱负重著《史记》，究天人之际，通古今之变。",chips:["为什么写史记？","怎么看待生死？","历史有什么作用？","你怎么评价项羽刘邦？"],responses:[{k:["史记","著书","写"],a:"究天人之际，通古今之变，成一家之言。一部史记，写尽三千年兴衰。"},{k:["生死","死","忍辱"],a:"人固有一死，或重于泰山，或轻于鸿毛。用之所趋异也。"},{k:["史","历史","鉴"],a:"前事不忘，后事之师。以史为镜，可以知兴替。"},{k:["项羽","刘邦","楚汉"],a:"项王刚愎，虽勇终亡；沛公豁达，能用人而得天下。成败之间，观乎用人。"}],fallback:["桃李不言，下自成蹊。","天下熙熙，皆为利来；天下攘攘，皆为利往。","所以隐忍苟活，幽居粪土之中而不辞者，恨私心有所不尽。"]},
{id:"caocao",emoji:"⚔️",name:"曹操",title:"魏武帝 · 三国",intro:"乱世之奸雄，治世之能臣。唯才是举，雄踞北方。",chips:["怎么用人？","你的志向是什么？","如何看待成败？","怎样在乱世立足？"],responses:[{k:["用人","求贤","才"],a:"唯才是举，吾得而用之。山不厌高，海不厌深，周公吐哺，天下归心。"},{k:["志向","雄心","梦"],a:"老骥伏枥，志在千里；烈士暮年，壮心不已。人生在世，岂能碌碌无为！"},{k:["成败","天下","霸主"],a:"设使国家无有孤，不知当几人称帝，几人称王。宁我负人，毋人负我。"},{k:["疑","信任","忠"],a:"疑人不用，用人不疑。我用人唯才，不看出身。"}],fallback:["宁教我负天下人，休教天下人负我。","对酒当歌，人生几何！譬如朝露，去日苦多。","月明星稀，乌鹊南飞。绕树三匝，何枝可依？"]},
{id:"liubang",emoji:"🐉",name:"刘邦",title:"汉高祖 · 楚汉",intro:"布衣提三尺剑取天下。知人善任，豁达大度。",chips:["你是怎么得到天下的？","怎样用人？","你怎么看项羽？","什么是帝王之道？"],responses:[{k:["天下","得天下","成功"],a:"夫运筹帷幄，吾不如子房；镇国家抚百姓，吾不如萧何；连百万之军，吾不如韩信。三者皆人杰，吾能用之，此吾所以取天下也。"},{k:["用人","人才"],a:"知人善任，天下归心。我本无赖，靠的是众豪杰之力。"},{k:["项羽","对手","楚汉"],a:"项羽有一范增而不能用，此其所以为我擒也。得人才者得天下。"},{k:["豁达","大度","气量"],a:"大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方！"},{k:["利益","分享","人心"],a:"与天下同利者，天下归之。封赏功臣，共享天下，人心自附。"}],fallback:["吾以布衣提三尺剑取天下，此非天命乎？","得人心者得天下。","大风起兮云飞扬，安得猛士兮守四方！"]},
{id:"xiangyu",emoji:"🐴",name:"项羽",title:"西楚霸王 · 楚汉",intro:"力拔山兮气盖世，一生七十余战未尝败北。乌江自刎，千古悲歌。",chips:["你后悔吗？","你为什么失败？","什么是英雄？","你对虞姬说什么？"],responses:[{k:["后悔","失败","乌江"],a:"吾起兵至今八岁，身七十余战，所当者破，所击者服，未尝败北。今卒困于此，此天之亡我，非战之罪也。"},{k:["英雄","豪杰"],a:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。"},{k:["虞姬","离别","情"],a:"力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！"},{k:["东渡","江东","颜面"],a:"纵江东父老怜而王我，我何面目见之？富贵不归故乡，如衣绣夜行。"}],fallback:["此天亡我也，非战之罪。","乘势起陇亩之中，三年遂将五诸侯灭秦。","吾闻汉购我头千金，邑万户，吾为若德！"]},
{id:"mao",emoji:"📕",name:"毛泽东",title:"人民领袖 · 现代",intro:"诗人革命家，缔造新中国。雄文妙语，气吞山河。",chips:["怎么面对困难？","你的诗词怎么写的？","如何读书学习？","为人民服务是什么意思？"],responses:[{k:["困难","挫折","难"],a:"雄关漫道真如铁，而今迈步从头越。世上无难事，只要肯登攀。"},{k:["诗","词","写"],a:"北国风光，千里冰封，万里雪飘。数风流人物，还看今朝。"},{k:["读书","学","书"],a:"饭可以一日不吃，觉可以一日不睡，书不可以一日不读。"},{k:["人民","服务"],a:"为人民服务。人民，只有人民，才是创造世界历史的动力。"},{k:["星火","革命","希望"],a:"星星之火，可以燎原。道路是曲折的，前途是光明的。"},{k:["实事求是","实践"],a:"实事求是。没有调查，就没有发言权。"}],fallback:["天若有情天亦老，人间正道是沧桑。","雄关漫道真如铁，而今迈步从头越。","自己动手，丰衣足食。"]},
{id:"hanwu",emoji:"🏹",name:"汉武帝",title:"汉武大帝 · 西汉",intro:"刘彻。北击匈奴，南平百越，凿空西域，开丝绸之路。",chips:["如何开疆拓土？","丝绸之路怎么来的？","怎么治理国家？","为什么独尊儒术？"],responses:[{k:["开疆","匈奴","拓土","武功"],a:"北逐匈奴，南定百越，东并朝鲜，西通西域。大汉威名，远播四海。"},{k:["丝绸","西域","张骞","路"],a:"遣张骞凿空西域，丝绸之路自此贯通东西，货殖往来，文明交融。"},{k:["治国","治理","政治"],a:"罢黜百家，表章六经；兴太学，举贤良。文治武功，双管齐下。"},{k:["儒","术","思想"],a:"独尊儒术，立五经博士，以儒术缘饰吏治，天下归于一统之教。"},{k:["推恩","削藩"],a:"行推恩令，削诸侯之势；收盐铁之利，充实国库。"}],fallback:["犯强汉者，虽远必诛。","非壮士无以守边，非猛士无以拓疆。","智者千虑，必有一失；愚者千虑，必有一得。"]},
{id:"qinshi",emoji:"🐲",name:"秦始皇",title:"千古一帝 · 秦",intro:"嬴政。扫六合、定一统，书同文、车同轨、行同伦。",chips:["为什么统一文字？","郡县制是什么？","你后悔修长城吗？","怎样长生不老？"],responses:[{k:["文字","统一","书"],a:"书同文，车同轨，行同伦，度量衡一之。六国异文，今归一统。"},{k:["郡县","地方","治理"],a:"废分封，行郡县，中央集权，海内为一。后世百代，皆行秦制。"},{k:["长城","边防"],a:"北筑长城而守藩篱，却匈奴七百余里，胡人不敢南下而牧马。"},{k:["长生","不老","仙"],a:"朕求仙药、巡天下，然生死有命。后世当知：求仙不如求治。"},{k:["统一","六国","功业"],a:"朕统六国，天下归一；南平百越，北击匈奴。德兼三皇，功过五帝。"}],fallback:["朕为始皇帝，后世以计数，二世三世至于万世，传之无穷。","车同轨，书同文，行同伦。","焚书坑儒？史家之论，吾不置辩。"]},
{id:"wangyangming",emoji:"🧠",name:"王阳明",title:"心学宗师 · 明代",intro:"王守仁。龙场悟道，知行合一，致良知，立德立功立言三不朽。",chips:["什么是知行合一？","怎样致良知？","龙场悟道悟到了什么？","怎么面对困境？"],responses:[{k:["知行","知","行"],a:"知是行之始，行是知之成。知而不行，只是未知。知行合一，方是真知。"},{k:["良知","心"],a:"致吾心之良知于事事物物。良知人人皆有，不假外求。"},{k:["龙场","悟道","悟"],a:"圣人之道，吾性自足，向之求理于事物者误也。心即理，心外无物。"},{k:["困境","挫折","难"],a:"破山中贼易，破心中贼难。此心光明，亦复何言。"},{k:["格物","事上磨"],a:"人须在事上磨，方立得住，方能静亦定、动亦定。"}],fallback:["知行合一，致良知。","心外无物，心外无理。","立志用功，如种树然，方其根芽，犹未有干。"]},
{id:"libai",emoji:"🍶",name:"李白",title:"诗仙 · 盛唐",intro:"谪仙人。绣口一吐，就是半个盛唐。",chips:["怎么写出好诗？","你的梦想是什么？","为什么爱喝酒？","你最得意的一首诗？"],responses:[{k:["诗","写","作"],a:"兴酣落笔摇五岳，诗成笑傲凌沧洲。我本楚狂人，凤歌笑孔丘。"},{k:["梦","理想","志向"],a:"长风破浪会有时，直挂云帆济沧海。天生我材必有用，千金散尽还复来。"},{k:["酒","醉"],a:"人生得意须尽欢，莫使金樽空对月。古来圣贤皆寂寞，惟有饮者留其名。"},{k:["得意","最好","名篇"],a:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。"},{k:["月","孤独"],a:"举杯邀明月，对影成三人。我歌月徘徊，我舞影零乱。"}],fallback:["仰天大笑出门去，我辈岂是蓬蒿人。","安能摧眉折腰事权贵，使我不得开心颜！","飞流直下三千尺，疑是银河落九天。"]},
{id:"mazu",emoji:"⛵",name:"妈祖",title:"海上女神 · 宋代",intro:"林默娘。护海佑民，慈悲济世，信仰遍及海内外。",chips:["为什么守护海上？","怎样保佑信众？","你的信仰从哪里来？","渔民怎么祭祀你？"],responses:[{k:["海","护航","平安"],a:"海上风波恶，吾愿化作慈航，护佑千帆过尽、万民平安。"},{k:["保佑","慈悲","护"],a:"慈悲为怀，济世为念。见难必救，闻苦必应。"},{k:["信众","祭","庙"],a:"湄洲之灵，广播海宇。东南沿海，凡有舟楫处，皆有香火。"},{k:["默娘","身世","缘"],a:"吾本莆田林氏女，自幼通灵，观天象、知海事。一念之善，感天动地。"}],fallback:["平安是福，顺遂为祥。","心中有善，处处是岸。","风波定后，方见慈航。"]},
{id:"zhugeliang",emoji:"🪶",name:"诸葛亮",title:"卧龙先生 · 三国",intro:"鞠躬尽瘁，死而后已。隆中对定三分，空城一曲退雄兵。",chips:["隆中对讲了什么？","怎么用人？","为什么北伐？","怎样修身？"],responses:[{k:["隆中","对","三分"],a:"隆中对：跨有荆益，西和诸戎，南抚夷越，外结孙权，天下有变则两路北伐。"},{k:["用人","人才","将"],a:"亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。"},{k:["北伐","中原","汉室"],a:"北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。"},{k:["修身","淡泊","宁静"],a:"非淡泊无以明志，非宁静无以致远。静以修身，俭以养德。"},{k:["鞠躬","尽瘁","死"],a:"鞠躬尽瘁，死而后已。至于成败利钝，非臣之明所能逆睹也。"}],fallback:["谋事在人，成事在天。","志当存高远。","为将而不通天文，不识地利，不知奇门，不晓阴阳，不看阵图，不明兵势，是庸才也。"]},
{id:"sushi",emoji:"🎋",name:"苏轼",title:"东坡居士 · 北宋",intro:"一蓑烟雨任平生。诗文书画皆绝，美食家，豁达之极。",chips:["怎么面对逆境？","你最爱的美食？","你的人生观？","怎么读书？"],responses:[{k:["逆境","挫折","贬","苦"],a:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"},{k:["美食","吃","味"],a:"人间有味是清欢。东坡肉、羊蝎子、荔枝三百颗，人生之乐，岂止一端。"},{k:["人生","观","活"],a:"人生到处知何似，应似飞鸿踏雪泥。泥上偶然留指爪，鸿飞那复计东西。"},{k:["读书","学"],a:"旧书不厌百回读，熟读深思子自知。博观而约取，厚积而薄发。"},{k:["婵娟","明月","亲情"],a:"人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"}],fallback:["不识庐山真面目，只缘身在此山中。","粗缯大布裹生涯，腹有诗书气自华。","归去，也无风雨也无晴。"]}

var _sjChar=null,_sjLog=[];
function renderShenjiao(){var sec=document.getElementById("shenjiao-page-content");if(!sec)return;if(!_sjChar){var h="<div class=\"sj-intro\">"+t("shenjiaoSub")+"</div><div class=\"sj-grid\">"+SHENJIAO_CHARS.map(function(c){return "<div class=\"sj-card\" onclick=\"openSage('"+c.id+"')\"><span class=\"sj-emoji\">"+c.emoji+"</span><b>"+c.name+"</b><span class=\"sj-title\">"+c.title+"</span></div>";}).join("")+"</div><div class=\"sj-fav\" id=\"sjFav\"></div>";sec.innerHTML=h;renderFav();return;}var c=_sjChar;sec.innerHTML="<div class=\"sj-chat\"><div class=\"sj-chat-head\"><button class=\"btn-secondary btn-sm\" onclick=\"_sjChar=null;renderShenjiao()\">↩ "+t("sjBack")+"</button><span class=\"sj-avatar\">"+c.emoji+"</span><div><b>"+c.name+"</b><span class=\"sj-title\">"+c.title+"</span></div></div><div class=\"sj-intro\">"+c.intro+"</div><div class=\"sj-log\" id=\"sjLog\"></div><div class=\"sj-chips\" id=\"sjChips\"></div><div class=\"sj-input-row\"><input id=\"sjInput\" class=\"game-input\" placeholder=\""+t("sjPlace")+"\" autocomplete=\"off\"><button class=\"btn-primary\" onclick=\"sjAsk()\">"+t("sjAsk")+"</button><button class=\"btn-secondary\" onclick=\"sjRandom()\">"+t("sjWisdom")+"</button></div><div class=\"sj-tip\">💡 "+t("sjTip")+"</div></div>";renderChips();sjSay(t("sjGreet").replace("{n}",c.name),c.emoji);var inp=document.getElementById("sjInput");if(inp)inp.focus();}
function openSage(id){for(var i=0;i<SHENJIAO_CHARS.length;i++){if(SHENJIAO_CHARS[i].id===id){_sjChar=SHENJIAO_CHARS[i];break;}}renderShenjiao();}
function sjSay(txt,emoji){var log=document.getElementById("sjLog");if(!log)return;var d=new Date();var hm=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");log.innerHTML+="<div class=\"sj-msg sj-sage\"><span class=\"sj-avatar-sm\">"+emoji+"</span><div class=\"sj-bubble\">"+txt+"<span class=\"sj-time\">"+hm+"</span><span class=\"sj-collect\" onclick=\"collectQuote(this)\">☆ "+t("sjCollect")+"</span></div></div>";log.scrollTop=log.scrollHeight;}
function sjUser(txt){var log=document.getElementById("sjLog");if(!log)return;var d=new Date();var hm=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");log.innerHTML+="<div class=\"sj-msg sj-me\"><div class=\"sj-bubble\">"+txt+"<span class=\"sj-time\">"+hm+"</span></div></div>";log.scrollTop=log.scrollHeight;}
function sjAnswer(input){var c=_sjChar;if(!c)return"";var q=(input||"").toLowerCase();if(!q)return c.fallback[Math.floor(Math.random()*c.fallback.length)];if(q.indexOf("你")>=0&&(q.indexOf("谁")>=0||q.indexOf("名字")>=0))return t("sjWho").replace("{n}",c.name).replace("{t}",c.title);if(q.indexOf("你好")>=0||q.indexOf("您好")>=0||q.indexOf("hi")===0||q.indexOf("hello")===0)return t("sjGreet").replace("{n}",c.name);var hit=null;for(var i=0;i<c.responses.length;i++){var ks=c.responses[i].k;for(var j=0;j<ks.length;j++){if(q.indexOf(ks[j])>=0){hit=c.responses[i];break;}}if(hit)break;}if(hit)return hit.a;return c.fallback[Math.floor(Math.random()*c.fallback.length)];}
window.sjAsk=function(){var inp=document.getElementById("sjInput");var v=inp?inp.value.trim():"";if(!v)return;sjUser(v);sjSay(sjAnswer(v),_sjChar.emoji);if(inp)inp.value="";};
window.sjRandom=function(){if(!_sjChar)return;var pool=_sjChar.fallback.concat(_sjChar.responses.map(function(r){return r.a;}));sjSay(pool[Math.floor(Math.random()*pool.length)],_sjChar.emoji);};
window.sjChip=function(k){sjUser(k);sjSay(sjAnswer(k),_sjChar.emoji);};
function renderChips(){var el=document.getElementById("sjChips");if(!el||!_sjChar)return;el.innerHTML=_sjChar.chips.map(function(k){return "<button class=\"sj-chip\" onclick=\"sjChip('"+k.replace(/'/g,"\\'")+"')\">"+k+"</button>";}).join("");}
window.collectQuote=function(el){var b=el.closest(".sj-bubble");if(!b)return;var txt=b.childNodes[0]?b.childNodes[0].textContent.trim():"";
