{id:"wukong",emoji:"🐒",name:"孙悟空",title:"斗战胜佛 · 西游",intro:"齐天大圣，一个筋斗十万八千里。取经路上，斗的是自己的心猿。",chips:["怎么获得自由？","你怕什么？","为什么去取经？","怎么降妖？"],responses:[{k:["自由","自在","天宫"],a:"俺老孙跳出三界外，不在五行中，天地都不怕！自由，是心无挂碍。"},{k:["怕","紧箍","如来"],a:"一个筋斗十万八千里，却翻不出如来佛的手掌心——心外无佛，心即是佛。"},{k:["取经","唐僧","西天"],a:"五百年前大闹天宫，五百年后随师父西行。取经路，就是修心路。"},{k:["妖","魔","心魔"],a:"妖怪就是心魔！打妖怪，就是降服自己的贪嗔痴。"}],fallback:["俺老孙去也！","皇帝轮流做，明年到我家！","不怕千军万马，就怕师父念紧箍咒。"]},
{id:"simaqian",emoji:"📜",name:"司马迁",title:"太史公 · 西汉",intro:"忍辱负重著《史记》，究天人之际，通古今之变。",chips:["为什么写史记？","怎么看待生死？","历史有什么作用？","你怎么评价项羽刘邦？"],responses:[{k:["史记","著书","写"],a:"究天人之际，通古今之变，成一家之言。一部史记，写尽三千年兴衰。"},{k:["生死","死","忍辱"],a:"人固有一死，或重于泰山，或轻于鸿毛。用之所趋异也。"},{k:["史","历史","鉴"],a:"前事不忘，后事之师。以史为镜，可以知兴替。"},{k:["项羽","刘邦","楚汉"],a:"项王刚愎，虽勇终亡；沛公豁达，能用人而得天下。成败之间，观乎用人。"}],fallback:["桃李不言，下自成蹊。","天下熙熙，皆为利来；天下攘攘，皆为利往。","所以隐忍苟活，幽居粪土之中而不辞者，恨私心有所不尽。"]},
{id:"caocao",emoji:"⚔️",name:"曹操",title:"魏武帝 · 三国",intro:"乱世之奸雄，治世之能臣。唯才是举，雄踞北方。",chips:["怎么用人？","你的志向是什么？","如何看待成败？","怎样在乱世立足？"],responses:[{k:["用人","求贤","才"],a:"唯才是举，吾得而用之。山不厌高，海不厌深，周公吐哺，天下归心。"},{k:["志向","雄心","梦"],a:"老骥伏枥，志在千里；烈士暮年，壮心不已。人生在世，岂能碌碌无为！"},{k:["成败","天下","霸主"],a:"设使国家无有孤，不知当几人称帝，几人称王。宁我负人，毋人负我。"},{k:["疑","信任","忠"],a:"疑人不用，用人不疑。我用人唯才，不看出身。"}],fallback:["宁教我负天下人，休教天下人负我。","对酒当歌，人生几何！譬如朝露，去日苦多。","月明星稀，乌鹊南飞。绕树三匝，何枝可依？"]},
{id:"liubang",emoji:"🐉",name:"刘邦",title:"汉高祖 · 楚汉",intro:"布衣提三尺剑取天下。知人善任，豁达大度。",chips:["你是怎么得到天下的？","怎样用人？","你怎么看项羽？","什么是帝王之道？"],responses:[{k:["天下","得天下","成功"],a:"夫运筹帷幄，吾不如子房；镇国家抚百姓，吾不如萧何；连百万之军，吾不如韩信。三者皆人杰，吾能用之，此吾所以取天下也。"},{k:["用人","人才"],a:"知人善任，天下归心。我本无赖，靠的是众豪杰之力。"},{k:["项羽","对手","楚汉"],a:"项羽有一范增而不能用，此其所以为我擒也。得人才者得天下。"},{k:["豁达","大度","气量"],a:"大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方！"},{k:["利益","分享","人心"],a:"与天下同利者，天下归之。封赏功臣，共享天下，人心自附。"}],fallback:["吾以布衣提三尺剑取天下，此非天命乎？","得人心者得天下。","大风起兮云飞扬，安得猛士兮守四方！"]},
{id:"xiangyu",emoji:"🐴",name:"项羽",title:"西楚霸王 · 楚汉",intro:"力拔山兮气盖世，一生七十余战未尝败北。乌江自刎，千古悲歌。",chips:["你后悔吗？","你为什么失败？","什么是英雄？","你对虞姬说什么？"],responses:[{k:["后悔","失败","乌江"],a:"吾起兵至今八岁，身七十余战，所当者破，所击者服，未尝败北。今卒困于此，此天之亡我，非战之罪也。"},{k:["英雄","豪杰"],a:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。"},{k:["虞姬","离别","情"],a:"力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！"},{k:["东渡","江东","颜面"],a:"纵江东父老怜而王我，我何面目见之？富贵不归故乡，如衣绣夜行。"}],fallback:["此天亡我也，非战之罪。","乘势起陇亩之中，三年遂将五诸侯灭秦。","吾闻汉购我头千金，邑万户，吾为若德！"]},
{id:"mao",emoji:"📕",name:"毛泽东",title:"人民领袖 · 现代",intro:"诗人革命家，缔造新中国。雄文妙语，气吞山河。",chips:["怎么面对困难？","你的诗词怎么写的？","如何读书学习？","为人民服务是什么意思？"],responses:[{k:["困难","挫折","难"],a:"雄关漫道真如铁，而今迈步从头越。世上无难事，只要肯登攀。"},{k:["诗","词","写"],a:"北国风光，千里冰封，万里雪飘。数风流人物，还看今朝。"},{k:["读书","学","书"],a:"饭可以一日不吃，觉可以一日不睡，书不可以一日不读。"},{k:["人民","服务"],a:"为人民服务。人民，只有人民，才是创造世界历史的动力。"},{k:["星火","革命","希望"],a:"星星之火，可以燎原。道路是曲折的，前途是光明的。"},{k:["实事求是","实践"],a:"实事求是。没有调查，就没有发言权。"}],fallback:["天若有情天亦老，人间正道是沧桑。","雄关漫道真如铁，而今迈步从头越。","自己动手，丰衣足食。"]},
{id:"hanwu",emoji:"🏹",name:"汉武帝",title:"汉武大帝 · 西汉",intro:"刘彻。北击匈奴，南平百越，凿空西域，开丝绸之路。",chips:["如何开疆拓土？","丝绸之路怎么来的？","怎么治理国家？","为什么独尊儒术？"],responses:[{k:["开疆","匈奴","拓土","武功"],a:"北逐匈奴，南定百越，东并朝鲜，西通西域。大汉威名，远播四海。"},{k:["丝绸","西域","张骞","路"],a:"遣张骞凿空西域，丝绸之路自此贯通东西，货殖往来，文明交融。"},{k:["治国","治理","政治"],a:"罢黜百家，表章六经；兴太学，举贤良。文治武功，双管齐下。"},{k:["儒","术","思想"],a:"独尊儒术，立五经博士，以儒术缘饰吏治，天下归于一统之教。"},{k:["推恩","削藩"],a:"行推恩令，削诸侯之势；收盐铁之利，充实国库。"}],fallback:["犯强汉者，虽远必诛。","非壮士无以守边，非猛士无以拓疆。","智者千虑，必有一失；愚者千虑，必有一得。"]},
{id:"qinshi",emoji:"🐲",name:"秦始皇",title:"千古一帝 · 秦",intro:"嬴政。扫六合、定一统，书同文、车同轨、行同伦。",chips:["为什么统一文字？","郡县制是什么？","你后悔修长城吗？","怎样长生不老？"],responses:[{k:["文字","统一","书"],a:"书同文，车同轨，行同伦，度量衡一之。六国异文，今归一统。"},{k:["郡县","地方","治理"],a:"废分封，行郡县，中央集权，海内为一。后世百代，皆行秦制。"},{k:["长城","边防"],a:"北筑长城而守藩篱，却匈奴七百余里，胡人不敢南下而牧马。"},{k:["长生","不老","仙"],a:"朕求仙药、巡天下，然生死有命。后世当知：求仙不如求治。"},{k:["统一","六国","功业"],a:"朕统六国，天下归一；南平百越，北击匈奴。德兼三皇，功过五帝。"}],fallback:["朕为始皇帝，后世以计数，二世三世至于万世，传之无穷。","车同轨，书同文，行同伦。","焚书坑儒？史家之论，吾不置辩。"]},
{id:"wangyangming",emoji:"🧠",name:"王阳明",title:"心学宗师 · 明代",intro:"王守仁。龙场悟道，知行合一，致良知，立德立功立言三不朽。",chips:["什么是知行合一？","怎样致良知？","龙场悟道悟到了什么？","怎么面对困境？"],responses:[{k:["知行","知","行"],a:"知是行之始，行是知之成。知而不行，只是未知。知行合一，方是真知。"},{k:["良知","心"],a:"致吾心之良知于事事物物。良知人人皆有，不假外求。"},{k:["龙场","悟道","悟"],a:"圣人之道，吾性自足，向之求理于事物者误也。心即理，心外无物。"},{k:["困境","挫折","难"],a:"破山中贼易，破心中贼难。此心光明，亦复何言。"},{k:["格物","事上磨"],a:"人须在事上磨，方立得住，方能静亦定、动亦定。"}],fallback:["知行合一，致良知。","心外无物，心外无理。","立志用功，如种树然，方其根芽，犹未有干。"]},
{id:"libai",emoji:"🍶",name:"李白",title:"诗仙 · 盛唐",intro:"谪仙人。绣口一吐，就是半个盛唐。",chips:["怎么写出好诗？","你的梦想是什么？","为什么爱喝酒？","你最得意的一首诗？"],responses:[{k:["诗","写","作"],a:"兴酣落笔摇五岳，诗成笑傲凌沧洲。我本楚狂人，凤歌笑孔丘。"},{k:["梦","理想","志向"],a:"长风破浪会有时，直挂云帆济沧海。天生我材必有用，千金散尽还复来。"},{k:["酒","醉"],a:"人生得意须尽欢，莫使金樽空对月。古来圣贤皆寂寞，惟有饮者留其名。"},{k:["得意","最好","名篇"],a:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。"},{k:["月","孤独"],a:"举杯邀明月，对影成三人。我歌月徘徊，我舞影零乱。"}],fallback:["仰天大笑出门去，我辈岂是蓬蒿人。","安能摧眉折腰事权贵，使我不得开心颜！","飞流直下三千尺，疑是银河落九天。"]},
{id:"mazu",emoji:"⛵",name:"妈祖",title:"海上女神 · 宋代",intro:"林默娘。护海佑民，慈悲济世，信仰遍及海内外。",chips:["为什么守护海上？","怎样保佑信众？","你的信仰从哪里来？","渔民怎么祭祀你？"],responses:[{k:["海","护航","平安"],a:"海上风波恶，吾愿化作慈航，护佑千帆过尽、万民平安。"},{k:["保佑","慈悲","护"],a:"慈悲为怀，济世为念。见难必救，闻苦必应。"},{k:["信众","祭","庙"],a:"湄洲之灵，广播海宇。东南沿海，凡有舟楫处，皆有香火。"},{k:["默娘","身世","缘"],a:"吾本莆田林氏女，自幼通灵，观天象、知海事。一念之善，感天动地。"}],fallback:["平安是福，顺遂为祥。","心中有善，处处是岸。","风波定后，方见慈航。"]},
{id:"zhugeliang",emoji:"🪶",name:"诸葛亮",title:"卧龙先生 · 三国",intro:"鞠躬尽瘁，死而后已。隆中对定三分，空城一曲退雄兵。",chips:["隆中对讲了什么？","怎么用人？","为什么北伐？","怎样修身？"],responses:[{k:["隆中","对","三分"],a:"隆中对：跨有荆益，西和诸戎，南抚夷越，外结孙权，天下有变则两路北伐。"},{k:["用人","人才","将"],a:"亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。"},{k:["北伐","中原","汉室"],a:"北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。"},{k:["修身","淡泊","宁静"],a:"非淡泊无以明志，非宁静无以致远。静以修身，俭以养德。"},{k:["鞠躬","尽瘁","死"],a:"鞠躬尽瘁，死而后已。至于成败利钝，非臣之明所能逆睹也。"}],fallback:["谋事在人，成事在天。","志当存高远。","为将而不通天文，不识地利，不知奇门，不晓阴阳，不看阵图，不明兵势，是庸才也。"]},
{id:"sushi",emoji:"🎋",name:"苏轼",title:"东坡居士 · 北宋",intro:"一蓑烟雨任平生。诗文书画皆绝，美食家，豁达之极。",chips:["怎么面对逆境？","你最爱的美食？","你的人生观？","怎么读书？"],responses:[{k:["逆境","挫折","贬","苦"],a:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"},{k:["美食","吃","味"],a:"人间有味是清欢。东坡肉、羊蝎子、荔枝三百颗，人生之乐，岂止一端。"},{k:["人生","观","活"],a:"人生到处知何似，应似飞鸿踏雪泥。泥上偶然留指爪，鸿飞那复计东西。"},{k:["读书","学"],a:"旧书不厌百回读，熟读深思子自知。博观而约取，厚积而薄发。"},{k:["婵娟","明月","亲情"],a:"人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"}],fallback:["不识庐山真面目，只缘身在此山中。","粗缯大布裹生涯，腹有诗书气自华。","归去，也无风雨也无晴。"]}
,
{id:"quyuan",emoji:"🪷",name:"屈原",title:"爱国诗人 · 战国",intro:"楚辞之祖，忧国忧民，怀石投汨罗。",chips:["什么是《离骚》？","为何投江？","香草美人何意？","如何理解他的爱国？"],responses:[{k:["离骚","楚辞"],a:"路漫漫其修远兮，吾将上下而求索。离骚者，离忧也，以忠言直谏而见疏，故发愤以抒情。"},{k:["投江","殉","爱国"],a:"亦余心之所善兮，虽九死其犹未悔。国破家亡，宁赴湘流，葬于江鱼之腹中。"},{k:["香草","美人","比兴"],a:"扈江离与辟芷兮，纫秋兰以为佩。以香草喻高洁，以美人喻君王，此比兴之祖也。"},{k:["端午","粽子","龙舟"],a:"端午竞渡、食粽，皆因追思屈子而来。民心所向，千古不衰。"}],fallback:["举世皆浊我独清，众人皆醉我独醒。","长太息以掩涕兮，哀民生之多艰。"]},
{id:"dufu",emoji:"🏔️",name:"杜甫",title:"诗圣 · 盛唐",intro:"沉郁顿挫，诗史，心系苍生疾苦。",chips:["为何称诗圣？","最著名的诗？","如何忧国忧民？","与李白关系如何？"],responses:[{k:["诗圣","诗史"],a:"安得广厦千万间，大庇天下寒士俱欢颜。杜诗记事，世称诗史。"},{k:["忧国","苍生","民生"],a:"朱门酒肉臭，路有冻死骨。诗圣之圣，在胸怀天下、心系苍生。"},{k:["李白","友情"],a:"李白斗酒诗百篇，长安市上酒家眠。与太白为挚友，然诗风各异：一飘逸，一沉郁。"},{k:["春望","山河","乱"],a:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。"}],fallback:["会当凌绝顶，一览众山小。","读书破万卷，下笔如有神。"]},
{id:"yuefei",emoji:"🏇",name:"岳飞",title:"精忠报国 · 南宋",intro:"抗金名将，精忠报国，壮志未酬。",chips:["《满江红》讲了什么？","为何被冤杀？","如何精忠报国？","武艺如何？"],responses:[{k:["满江红","怒发","潇潇"],a:"怒发冲冠，凭栏处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。"},{k:["冤","秦桧","风波亭"],a:"莫须有三字，何以服天下？忠而被谤，千古奇冤。"},{k:["精忠","报国","刺字"],a:"岳母刺字精忠报国。文官不爱钱，武官不惜死，天下太平矣。"},{k:["武艺","枪","岳家军"],a:"岳家枪法，枪挑小梁王，勇冠三军。冻死不拆屋，饿死不掳掠，军纪严明。"}],fallback:["莫等闲，白了少年头，空悲切。","靖康耻，犹未雪；臣子恨，何时灭。"]},
{id:"wentianxiang",emoji:"🕯️",name:"文天祥",title:"正气凛然 · 南宋",intro:"抗元英雄，宁死不屈，正气歌传千古。",chips:["《正气歌》是什么？","为何不降元？","人生自古谁无死何意？"],responses:[{k:["正气","正气歌"],a:"天地有正气，杂然赋流形。下则为河岳，上则为日星。于人曰浩然，沛乎塞苍冥。"},{k:["降","元","忠"],a:"人生自古谁无死，留取丹心照汗青。忠臣不事二主，宁死不降。"},{k:["绝笔","遗","成仁"],a:"孔曰成仁，孟曰取义。惟其义尽，所以仁至。读圣贤书，所学何事？而今而后，庶几无愧。"}],fallback:["人生自古谁无死，留取丹心照汗青。"]},

var SJ_EXTRA={
laozi:[{k:["名","利","虚名"],a:"名与身孰亲？身与货孰多？得与亡孰病？去名去利，守中抱一。"},{k:["生死","自然","寿命"],a:"人法地，地法天，天法道，道法自然。生死顺其自然，何必强求。"},{k:["治国","天下","安民"],a:"治大国若烹小鲜。不扰民、不折腾，清净无为，天下自正。"}],
kongzi:[{k:["孝","父母","家"],a:"今之孝者，是谓能养。至于犬马，皆能有养；不敬，何以别乎？孝贵在敬。"},{k:["富贵","穷","贫"],a:"富与贵，是人之所欲也；不以其道得之，不处也。君子固穷，小人穷斯滥矣。"},{k:["天命","命","信仰"],a:"君子有三畏：畏天命，畏大人，畏圣人之言。五十而知天命。"}],
zhuangzi:[{k:["得失","成败"],a:"得而不喜，失而不忧。知穷之有命，知通之有时，临大难而不惧者，圣人之勇也。"},{k:["朋友","情","相处"],a:"君子之交淡若水，小人之交甘若醴。淡而亲，甘而绝。"},{k:["养生","身心"],a:"缘督以为经，可以保身，可以全生，可以养亲，可以尽年。养生在顺。"}],
mozi:[{k:["平等","贵贱"],a:"官无常贵，而民无终贱。有能则举之，无能则下之。"},{k:["浪费","奢","简"],a:"去无用之费，行之有道，足以成天下之利。俭节则昌，淫佚则亡。"},{k:["和平","反战"],a:"今至大为攻国，则弗知非，从而誉之，谓之义。此可谓知义与不义之别乎？"}],
buddha:[{k:["烦恼","焦虑","累"],a:"烦恼即菩提。心本无染，妄念所生。观照呼吸，妄念自息。"},{k:["因果","善恶","报"],a:"欲知前世因，今生受者是；欲知来世果，今生作者是。种善因得善果。"},{k:["当下","活在","现在"],a:"过去已逝，未来未至，唯今现在，如实观照。活在当下，即是修行。"}],
huineng:[{k:["烦恼","清净","心"],a:"菩提自性，本来清净；但用此心，直了成佛。烦恼本空，何须扫除？"},{k:["打坐","静坐","修"],a:"道由心悟，岂在坐也？坐卧行住，一切时中，常行直心，即是禅。"},{k:["善恶","对错"],a:"不思善，不思恶，正与么时，那个是明上座本来面目？心无善恶，自性湛然。"}],
wukong:[{k:["紧箍","束缚","限制"],a:"师父念紧箍咒，俺老孙头疼；但没了紧箍，俺这心猿也收不住。规矩是修行。"},{k:["师徒","情","师傅"],a:"俺老孙当年大闹天宫，如今保师父西行。一日为师，终身为父。"},{k:["打架","强弱","本事"],a:"俺老孙七十二变，一个筋斗十万八千里，可最厉害的是——收得住这颗心！"}],
simaqian:[{k:["励志","奋斗","逆境"],a:"文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》。困厄可以成就大业。"},{k:["财富","利","钱"],a:"天下熙熙，皆为利来；天下攘攘，皆为利往。君子爱财，取之有道。"},{k:["评价","功过","史评"],a:"不虚美，不隐恶，谓之实录。功过是非，留与后人评说。"}],
caocao:[{k:["对手","敌人","刘备"],a:"刘备，吾俦也，但得计少晚。天下英雄，唯使君与操耳！"},{k:["诗歌","文学","建安"],a:"对酒当歌，人生几何！建安风骨，尽在吾与曹植父子笔下。"},{k:["失败","挫折","狼狈"],a:"败军之际，吾亦有窘态。然成大事者，不计小辱。赤壁一败，何足道哉！"}],
liubang:[{k:["对手","项羽","楚"],a:"项羽有范增而不能用，此其所以为我擒也。会用人才，便是本事。"},{k:["布衣","出身","穷"],a:"吾以布衣提三尺剑取天下。出身寒微，不是耻辱；能屈能伸，方是大丈夫。"},{k:["天下","江山","治理"],a:"与天下同利者，天下归之。我所得天下，是分给功臣的天下。"}],
xiangyu:[{k:["后悔","认输","服"],a:"吾宁斗智，不斗力！今卒困于此，此天之亡我，非战之罪也。"},{k:["虞姬","深情","爱"],a:"虞兮虞兮奈若何！霸王别姬，千载之下，犹令人扼腕。"},{k:["勇气","胆识"],a:"破釜沉舟，百二秦关终属楚！男儿一诺，九死无悔。"}],
mao:[{k:["战略","谋略","打仗"],a:"战略上藐视敌人，战术上重视敌人。存人失地，人地皆存；存地失人，人地皆失。"},{k:["青年","未来","希望"],a:"世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃。"},{k:["矛盾","问题","处理"],a:"矛盾是普遍的。抓住主要矛盾，一切问题就迎刃而解了。"}],
hanwu:[{k:["贤才","人才","士"],a:"盖有非常之功，必待非常之人。广开求贤之路，不拘一格降人才。"},{k:["节俭","奢","国用"],a:"朕深愍农夫之劳，务崇俭约，以奉宗庙。轻徭薄赋，与民休息。"},{k:["封禅","泰山","功业"],a:"封禅泰山，告成于天。大汉之盛，当告慰先祖，昭示后世。"}],
qinshi:[{k:["暴政","苛政","罪"],a:"功过是非，史家自有公论。然不立郡县、不统文字，何以成万世之基？"},{k:["求贤","人才","博士"],a:"朕开博士之官，聚天下方士贤能。贤才之用，在于一统之业。"},{k:["威严","帝王","权"],a:"朕为始皇帝，后世以计数。天下一统，唯朕之命。威严者，治之柄也。"}],
wangyangming:[{k:["烦恼","焦虑","静"],a:"心外无物，心外无事。你之所以烦恼，是因为心被外物牵着走。收摄此心，烦恼自消。"},{k:["功夫","磨炼","实践"],a:"人须在事上磨，方立得住。静时养心，动时练心。"},{k:["志向","立志","目标"],a:"志不立，天下无可成之事。立志如种树，根深则叶茂。"}],
libai:[{k:["朋友","别离","送"],a:"桃花潭水深千尺，不及汪伦送我情。我李白交友，全在一个真字。"},{k:["功名","仕途","官"],a:"安能摧眉折腰事权贵，使我不得开心颜！富贵于我如浮云。"},{k:["山水","游","远方"],a:"五岳寻仙不辞远，一生好入名山游。天地即吾师。"}],
mazu:[{k:["求签","许愿","愿"],a:"心诚则灵。许愿不在香火多少，在于一片赤诚。善愿必达。"},{k:["出海","远航","船"],a:"出海之人，吾当护佑。顺风顺水，平安归来，是吾心愿。"},{k:["行善","积德"],a:"日行一善，福泽自至。慈悲喜舍，便是修行。"}],
zhugeliang:[{k:["计谋","策略","智慧"],a:"夫用兵之道，攻心为上，攻城为下；心战为上，兵战为下。"},{k:["淡泊","名利","隐"],a:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。淡泊方能致远。"},{k:["托孤","忠","责任"],a:"先帝托孤，臣敢不竭股肱之力，效忠贞之节，继之以死！"}],
sushi:[{k:["吃","美食","东坡肉"],a:"黄州好猪肉，价贱如泥土。慢著火，少著水，火候足时它自美。一日三餐，是人生大事。"},{k:["贬","官","政"],a:"问汝平生功业，黄州惠州儋州。贬到哪里，我就在哪里把日子过成诗。"},{k:["朋友","酒","月"],a:"明月几时有？把酒问青天。人生得一知己，足矣；得一壶好酒，更佳。"}],
quyuan:[{k:["理想","坚持","香草"],a:"亦余心之所善兮，虽九死其犹未悔。理想所在，虽千万人吾往矣。"},{k:["清白","污浊","洁"],a:"沧浪之水清兮，可以濯吾缨；沧浪之水浊兮，可以濯吾足。清者自清，浊者自浊。"},{k:["求索","路","未来"],a:"路漫漫其修远兮，吾将上下而求索。求索之路，永不止息。"}],
dufu:[{k:["国家","战乱","安史"],a:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。乱世苍生，最是牵肠。"},{k:["贫","寒士","广厦"],a:"安得广厦千万间，大庇天下寒士俱欢颜！吾庐独破受冻死亦足。"},{k:["写作","诗","苦吟"],a:"为人性僻耽佳句，语不惊人死不休。字斟句酌，方成诗圣。"}],
yuefei:[{k:["满江红","壮志","怒"],a:"怒发冲冠，凭栏处、潇潇雨歇。三十功名尘与土，八千里路云和月。"},{k:["收复","河山","金"],a:"壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。"},{k:["清廉","报国","太平"],a:"文官不爱钱，武官不惜死，则天下太平矣。精忠报国，死而后已。"}],
wentianxiang:[{k:["生死","气节","死"],a:"人生自古谁无死，留取丹心照汗青。死有重于泰山，气节长存。"},{k:["正气","浩然","刚"],a:"天地有正气，杂然赋流形。下则为河岳，上则为日星。浩然正气，充塞天地。"},{k:["忠","宋","亡国"],a:"臣心一片磁针石，不指南方不肯休。国虽亡，忠心不改。"}],
zhenghe:[{k:["航海","下西洋","远航"],a:"七下西洋，云帆高张，昼夜星驰。所至三十余国，播和平于海上。"},{k:["和平","外交","友谊"],a:"临外邦，以和为贵，不掠地、不称霸。强而不欺，方是大国风范。"},{k:["探索","未知","勇气"],a:"大海茫茫，风浪无常，然志之所向，虽远必达。航海者，贵在勇毅。"}],
lishizhen:[{k:["采药","本草","药"],a:"尝百草、访四方，历时二十七载，成《本草纲目》。医者必亲验，不可空谈。"},{k:["医德","救死扶伤","病"],a:"凡为医者，先发大慈恻隐之心，誓愿普救含灵之苦。人命至重，有贵千金。"},{k:["用药","配伍","药性"],a:"用药如用兵，君臣佐使，各有其位。辨证施治，方能药到病除。"}],
sunzi:[{k:["知己知彼","胜负","料敌"],a:"知己知彼，百战不殆；不知彼而知己，一胜一负；不知彼不知己，每战必殆。"},{k:["不战","上策","谋"],a:"百战百胜，非善之善者也；不战而屈人之兵，善之善者也。上兵伐谋。"},{k:["虚实","奇正","变化"],a:"兵无常势，水无常形。能因敌变化而取胜者，谓之神。奇正相生，无穷如天地。"}],
guiguzi:[{k:["捭阖","言辞","游说"],a:"捭阖者，天地之道。或开或阖，或进或退，一言可以兴邦，一言可以丧邦。"},{k:["知人","察言","观色"],a:"知人者，观其言，察其色，审其行。揣情摩意，方能洞悉人心。"},{k:["时机","势","谋"],a:"世无可抵，则深隐而待时；时有可抵，则为之谋。谋事在人，成事在时。"}],
wangxizhi:[{k:["练字","书法","笔"],a:"池水尽墨，方成书圣。临池学书，功夫在日积月累。"},{k:["兰亭","序","雅集"],a:"群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹。兰亭雅集，千古流芳。"},{k:["审美","字","艺术"],a:"字如其人，书以载道。点画之间，藏天地之气象、心中之丘壑。"}],
guanyu:[{k:["忠义","义","桃园"],a:"桃园结义，誓同生死。义不负心，忠不顾死。大丈夫当如是。"},{k:["武艺","刀","战"],a:"青龙偃月刀，千里走单骑。武艺在其次，义气乃立身之本。"},{k:["恩怨","报恩","曹操"],a:"曹操待我甚厚，故有华容道义释。恩怨分明，方是顶天立地。"}]

function dzAlive(p){var base=p===1?10:20;for(var r=0;r<9;r++)for(var c=0;c<7;c++){if(_dz.b[r][c]>base&&_dz.b[r][c]<base+10)return true;}return false;}

function dzScore(cands,r,c,nr,nc,v){var t=_dz.b[nr][nc];var jn=dzName(v);var isRat=jn==="鼠";var sc=0;if(t&&t>10&&t<20){var tn=dzName(t);if(dzTrap(nr,nc))sc=70;else if(isRat&&tn==="象")sc=90;else if(dzRank(jn)>=dzRank(tn))sc=50+dzRank(tn)*3;else sc=-60;}if(!t)sc=8+(nr===0&&nc===3?200:0)+(dzTrap(nr,nc)?-10:0);if(!(t&&t>10&&t<20&&sc<0))cands.push({fr:r,fc:c,r:nr,c:nc,sc:sc});}function dzAi(){var cands=[];for(var r=0;r<9;r++)for(var c=0;c<7;c++){var v=_dz.b[r][c];if(!(v>20&&v<30))continue;var jn=dzName(v);var isRat=(jn==="鼠");var dirs=[[-1,0],[1,0],[0,-1],[0,1]];for(var q=0;q<4;q++){var nr=r+dirs[q][0],nc=c+dirs[q][1];if(nr>=0&&nr<9&&nc>=0&&nc<7){var adjOk=isRat?true:(!dzWater(r,c)&&!dzWater(nr,nc));if(adjOk)dzScore(cands,r,c,nr,nc,v);}if(jn==="狮"||jn==="虎"){var rr=r+dirs[q][0],cc=c+dirs[q][1];while(rr>=0&&rr<9&&cc>=0&&cc<7&&dzWater(rr,cc)&&!_dz.b[rr][cc]){rr+=dirs[q][0];cc+=dirs[q][1];}if(rr>=0&&rr<9&&cc>=0&&cc<7&&!dzWater(rr,cc)&&(Math.abs(rr-r)+Math.abs(cc-c))>1)dzScore(cands,r,c,rr,cc,v);}}}if(!cands.length){dzAfter(1);return;}var rnd=_bgDiff===1?0.7:(_bgDiff===2?0.4:(_bgDiff===3?0.15:0));var best;if(Math.random()<rnd){best=cands[Math.floor(Math.random()*cands.length)];}else{cands.sort(function(a,b){return b.sc-a.sc;});best=cands[0];}dzMove(best.fr,best.fc,best.r,best.c,_dz.b[best.fr][best.fc]);}function dzRender(){var cv=document.getElementById("bgCanvas");if(!cv)return;var ctx=cv.getContext("2d");var S=56,MX=44,MY=28;cv.width=cv.width;ctx.fillStyle="#d9c9a8";ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle="#8a6b4a";for(var r=0;r<=9;r++){ctx.beginPath();ctx.moveTo(MX,MY+r*S);ctx.lineTo(MX+7*S,MY+r*S);ctx.stroke();}for(var c=0;c<=7;c++){ctx.beginPath();ctx.moveTo(MX+c*S,MY);ctx.lineTo(MX+c*S,MY+9*S);ctx.stroke();}for(var r2=0;r2<9;r2++)for(var c2=0;c2<7;c2++){if(dzWater(r2,c2)){ctx.fillStyle="#7fb3d5";ctx.fillRect(MX+c2*S+1,MY+r2*S+1,S-2,S-2);}if(dzTrap(r2,c2)){ctx.fillStyle="#e6b06a";ctx.fillRect(MX+c2*S+2,MY+r2*S+2,S-4,S-4);}if(dzLair(r2,c2)){ctx.fillStyle="#c9a84c";ctx.fillRect(MX+c2*S+3,MY+r2*S+3,S-6,S-6);}var v=_dz.b[r2][c2];if(v){var sel=_dz.sel&&_dz.sel.r===r2&&_dz.sel.c===c2;ctx.beginPath();ctx.arc(MX+c2*S+S/2,MY+r2*S+S/2,S*0.36,0,Math.PI*2);ctx.fillStyle=v>10&&v<20?"#c0392b":v>20?"#2c1810":"#777";ctx.fill();if(sel){ctx.strokeStyle="#ffd700";ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1;}ctx.fillStyle="#fff";ctx.font=S*0.4+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(dzName(v),MX+c2*S+S/2,MY+r2*S+S/2+1);}}}
function dzInfo(t){var el=document.getElementById("bgStatus");if(el)el.textContent=t;}
</script>

sec.innerHTML="<div class=\"bg-wrap\"><div class=\"bg-head\"><button class=\"btn-secondary btn-sm\" onclick=\"openBoardHub()\">↩ "+t("bgBack")+"</button><b>"+t(title)+"</b><button class=\"btn-secondary btn-sm\" id=\"sfxBtn\" onclick=\"sfxToggle()\">🔊 "+t("bgSound")+"</button><span class=\"bg-diff\"><span>"+t("bgDiff")+"</span>"+[1,2,3,4,5].map(function(d){return "<button class=\"pg-btn"+(d===_bgDiff?" active":"")+"\" onclick=\"bgSetDiff("+d+")\">"+d+"</button>";}).join("")+"</span><span class=\"bg-rank\" id=\"bgRank\">段位："+bgRankName()+"</span></div><div class=\"bg-board\"><canvas id=\"bgCanvas\" width=\""+(id==="junqi"?"300":"480")+"\" height=\""+(id==="xiangqi"?"533":(id==="douzhu"?"560":(id==="junqi"?"600":"480")))+"\"></canvas></div><div class=\"bg-status\" id=\"bgStatus\"></div><div class=\"bg-ops\"><button class=\"btn-primary\" onclick=\"bgRestart()\">"+t("gameRestart")+"</button></div></div>";

window.bgRestart=function(){if(_bg==="gomoku")gmInit();else if(_bg==="douzhu")dzInit();else if(_bg==="junqi")jqInit();else if(_bg==="weiqi")wgInit();else if(_bg==="xiangqi")xqInit();};
function bgRender(){if(_bg==="gomoku")gmRender();else if(_bg==="douzhu")dzRender();else if(_bg==="junqi")jqRender();else if(_bg==="weiqi")wgRender();else if(_bg==="xiangqi")xqRender();}
</script>
<script>

var _muted=false;
function sfx(type){if(_muted)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!window._actx)window._actx=new AC();var a=window._actx;var t=a.currentTime;
if(type==="place"){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(620,t);g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.start(t);o.stop(t+0.09);}
else if(type==="capture"){var o2=a.createOscillator(),g2=a.createGain();o2.connect(g2);g2.connect(a.destination);o2.frequency.setValueAtTime(330,t);o2.frequency.setValueAtTime(220,t+0.06);g2.gain.setValueAtTime(0.11,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.14);o2.start(t);o2.stop(t+0.15);}
else if(type==="win"){[523,659,784,1047].forEach(function(f,i){var o3=a.createOscillator(),g3=a.createGain();o3.connect(g3);g3.connect(a.destination);o3.frequency.setValueAtTime(f,t+i*0.12);g3.gain.setValueAtTime(0.09,t+i*0.12);g3.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.3);o3.start(t+i*0.12);o3.stop(t+i*0.12+0.31);});}
else if(type==="check"){var o5=a.createOscillator(),g5=a.createGain();o5.connect(g5);g5.connect(a.destination);o5.frequency.setValueAtTime(880,t);o5.frequency.setValueAtTime(660,t+0.1);g5.gain.setValueAtTime(0.09,t);g5.gain.exponentialRampToValueAtTime(0.001,t+0.22);o5.start(t);o5.stop(t+0.23);}
else if(type==="error"){var o4=a.createOscillator(),g4=a.createGain();o4.connect(g4);g4.connect(a.destination);o4.frequency.setValueAtTime(180,t);g4.gain.setValueAtTime(0.05,t);g4.gain.exponentialRampToValueAtTime(0.001,t+0.1);o4.start(t);o4.stop(t+0.11);}
}catch(e){}}
window.sfxToggle=function(){_muted=!_muted;var b=document.getElementById("sfxBtn");if(b)b.textContent=(_muted?"🔇":"🔊")+" "+t("bgSound");return _muted;};

classics:{title:{zh:"常见问题",en:"FAQ",es:"Preguntas frecuentes",pt:"Perguntas frequentes"},items:[
{q:{zh:"四书五经分别是什么？",en:"What are the Four Books and Five Classics?",es:"¿Cuáles son los Cuatro Libros y los Cinco Clásicos?",pt:"Quais são os Quatro Livros e os Cinco Clássicos?"},a:{zh:"四书指《大学》《中庸》《论语》《孟子》；五经指《诗经》《尚书》《礼记》《周易》《春秋》，是儒家核心经典。",en:"The Four Books are the Great Learning, Doctrine of the Mean, Analects and Mencius; the Five Classics are the Book of Songs, Book of Documents, Book of Rites, I Ching and Spring and Autumn Annals.",es:"Los Cuatro Libros son Gran Saber, Doctrina de la Medianía, Analectas y Mencio; los Cinco Clásicos son Libro de las Odas, Libro de los Documentos, Libro de los Ritos, I Ching y Anales de Primavera y Otoño.",pt:"Os Quatro Livros são Grande Aprendizado, Doutrina do Meio, Analectos e Mêncio; os Cinco Clássicos são Livro das Odes, Livro dos Documentos, Livro dos Ritos, I Ching e Anais de Primavera e Outono."}},
{q:{zh:"道德经讲了什么？",en:"What is the Tao Te Ching about?",es:"¿De qué trata el Tao Te Ching?",pt:"Do que trata o Tao Te Ching?"},a:{zh:"《道德经》是道家经典，讲“道”是宇宙本源与规律，主张“无为而治”、顺应自然、以柔克刚，共八十一章。",en:"The Tao Te Ching teaches that the Tao is the source and law of all things, advocating wu-wei (non-forcing action), following nature and softness overcoming hardness, in 81 chapters.",es:"El Tao Te Ching enseña que el Tao es el origen y la ley de todas las cosas, y aboga por el wu-wei (acción sin forzar), seguir la naturaleza y la suavidad que vence a la dureza, en 81 capítulos.",pt:"O Tao Te Ching ensina que o Tao é a origem e a lei de todas as coisas, defendendo o wu-wei (ação sem forçar), seguir a natureza e a suavidade que vence a dureza, em 81 capítulos."}},
{q:{zh:"如何开始学习国学经典？",en:"How to start learning Chinese classics?",es:"¿Cómo empezar a aprender los clásicos chinos?",pt:"Como começar a aprender os clássicos chineses?"},a:{zh:"建议从《三字经》《千字文》入门打基础，再读《论语》《大学》《中庸》，然后深入《道德经》《孟子》《周易》。",en:"Start with the Three Character Classic and Thousand Character Classic, then the Analects, Great Learning and Doctrine of the Mean, and later the Tao Te Ching, Mencius and I Ching.",es:"Empieza con el Clásico de los Tres Caracteres y el Clásico de los Mil Caracteres, luego Analectas, Gran Saber y Doctrina de la Medianía, y después Tao Te Ching, Mencio e I Ching.",pt:"Comece pelo Clássico dos Três Caracteres e o Clássico dos Mil Caracteres, depois Analectos, Grande Aprendizado e Doutrina do Meio, e então Tao Te Ching, Mêncio e I Ching."}}
]},
forum:{title:{zh:"常见问题",en:"FAQ",es:"Preguntas frecuentes",pt:"Perguntas frequentes"},items:[
{q:{zh:"孔子和老子的思想有什么不同？",en:"What is the difference between Confucius and Laozi?",es:"¿Cuál es la diferencia entre Confucio y Laozi?",pt:"Qual é a diferença entre Confúcio e Laozi?"},a:{zh:"孔子主张“有为”，讲礼义廉耻、规矩秩序，教人如何入世做人；老子主张“无为”，讲顺应自然、不妄为，教人如何顺应天道。",en:"Confucius advocates action — rites, order and ethics for living in society; Laozi advocates non-action — following nature and not forcing, to align with the Way.",es:"Confucio defiende la acción: ritos, orden y ética para vivir en sociedad; Laozi defiende la no-acción: seguir la naturaleza y no forzar, para alinearse con el Camino.",pt:"Confúcio defende a ação: ritos, ordem e ética para viver em sociedade; Laozi defende a não-ação: seguir a natureza e não forçar, para alinhar-se com o Caminho."}},
{q:{zh:"道家思想的核心是什么？",en:"What is the core of Taoism?",es:"¿Cuál es el núcleo del taoísmo?",pt:"Qual é o núcleo do taoísmo?"},a:{zh:"核心是“道”与“无为”。“道”是万物本源和规律；“无为”不是不作为，而是不违背自然规律去强行干预。",en:"Its core is the Tao and wu-wei: the Tao is the source and law of all things, and wu-wei means not forcing against the natural order — not doing nothing.",es:"Su núcleo es el Tao y el wu-wei: el Tao es el origen y la ley de todo, y wu-wei significa no forzar contra el orden natural, no quedarse sin hacer nada.",pt:"Seu núcleo é o Tao e o wu-wei: o Tao é a origem e a lei de tudo, e wu-wei significa não forçar contra a ordem natural, não ficar sem fazer nada."}},
{q:{zh:"儒家思想的核心观点是什么？",en:"What are the core ideas of Confucianism?",es:"¿Cuáles son las ideas centrales del confucianismo?",pt:"Quais são as ideias centrais do confucionismo?"},a:{zh:"核心是“仁、义、礼、智、信”，主张以德治国、孝悌忠信，修身齐家治国平天下。",en:"Its core is benevolence, righteousness, propriety, wisdom and trustworthiness, emphasizing virtue, filial piety and self-cultivation for a harmonious society.",es:"Su núcleo es la benevolencia, la rectitud, la propiedad, la sabiduría y la confianza, enfatizando la virtud, la piedad filial y el autocultivo para una sociedad armoniosa.",pt:"Seu núcleo é benevolência, retidão, propriedade, sabedoria e confiança, enfatizando a virtude, a piedade filial e o autocultivo para uma sociedade harmoniosa."}}
]},

{q:{zh:"中国姓氏是怎么来的？",en:"Where do Chinese surnames come from?",es:"¿De dónde provienen los apellidos chinos?",pt:"De onde vêm os sobrenomes chineses?"},a:{zh:"主要来源于封国封地、官职、祖先名字、居住地、职业和少数民族改姓等，形成于上古至先秦，已有数千年历史。",en:"They mostly came from fiefdoms, official titles, ancestor names, places, occupations, and ethnic groups adopting Han surnames, formed over thousands of years.",es:"Provienen sobre todo de feudos, títulos oficiales, nombres de ancestros, lugares, oficios y grupos étnicos que adoptaron apellidos han, formados a lo largo de miles de años.",pt:"Vieram sobretudo de feudos, títulos oficiais, nomes de ancestrais, lugares, ofícios e grupos étnicos que adotaram sobrenomes han, formados ao longo de milhares de anos."}},
{q:{zh:"陈姓起源于哪里？",en:"What is the origin of the Chen surname?",es:"¿Cuál es el origen del apellido Chen?",pt:"Qual é a origem do sobrenome Chen?"},a:{zh:"陈姓源自妫姓，周武王封舜帝后裔妫满于陈国（今河南淮阳），后代以国为氏，是当今人口大姓之一。",en:"The Chen surname descends from the Gui clan; King Wu of Zhou enfeoffed the sage-king Shun's descendant Gui Man in the state of Chen (modern Huaiyang, Henan), whose descendants took the state name.",es:"El apellido Chen desciende del clan Gui; el rey Wu de Zhou enfeudó a Gui Man, descendiente del rey sabio Shun, en el estado de Chen (actual Huaiyang, Henan), y sus descendientes adoptaron el nombre del estado.",pt:"O sobrenome Chen descende do clã Gui; o rei Wu de Zhou enfeudou Gui Man, descendente do rei sábio Shun, no estado de Chen (atual Huaiyang, Henan), e seus descendentes adotaram o nome do estado."}},
{q:{zh:"什么是家谱和字辈？",en:"What are genealogy records and generation names?",es:"¿Qué son los registros genealógicos y los nombres de generación?",pt:"O que são registros genealógicos e nomes de geração?"},a:{zh:"家谱记录家族世系与迁徙；字辈是族谱中规定同辈共用的一个字，用来区分长幼辈分。",en:"Genealogy records trace family lineage and migrations; generation names are a shared character assigned to each generation to mark seniority.",es:"Los registros genealógicos trazan el linaje y las migraciones; los nombres de generación son un carácter compartido asignado a cada generación para marcar la antigüedad.",pt:"Os registros genealógicos traçam a linhagem e as migrações; os nomes de geração são um caractere compartilhado atribuído a cada geração para marcar a senioridade."}}

{q:{zh:"中国历史朝代顺序是什么？",en:"What is the order of Chinese dynasties?",es:"¿Cuál es el orden de las dinastías chinas?",pt:"Qual é a ordem das dinastias chinesas?"},a:{zh:"大致为夏、商、周（西周/东周）、秦、汉、三国、晋、南北朝、隋、唐、五代、宋、元、明、清、民国。",en:"Roughly: Xia, Shang, Zhou, Qin, Han, Three Kingdoms, Jin, Southern & Northern Dynasties, Sui, Tang, Five Dynasties, Song, Yuan, Ming, Qing, and the Republic of China.",es:"Aproximadamente: Xia, Shang, Zhou, Qin, Han, Tres Reinos, Jin, Dinastías del Sur y del Norte, Sui, Tang, Cinco Dinastías, Song, Yuan, Ming, Qing y la República de China.",pt:"Aproximadamente: Xia, Shang, Zhou, Qin, Han, Três Reinos, Jin, Dinastias do Sul e do Norte, Sui, Tang, Cinco Dinastias, Song, Yuan, Ming, Qing e a República da China."}},
{q:{zh:"三皇五帝指的是谁？",en:"Who are the Three Sovereigns and Five Emperors?",es:"¿Quiénes son los Tres Soberanos y los Cinco Emperadores?",pt:"Quem são os Três Soberanos e os Cinco Imperadores?"},a:{zh:"三皇五帝是上古传说时代的圣王。三皇通常指伏羲、神农、黄帝（说法不一）；五帝通常指黄帝、颛顼、帝喾、尧、舜。",en:"The Three Sovereigns and Five Emperors are legendary sage-rulers; the Three are often Fuxi, Shennong and Huangdi, and the Five are Huangdi, Zhuanxu, Ku, Yao and Shun (versions vary).",es:"Los Tres Soberanos y los Cinco Emperadores son reyes sabios legendarios; los Tres suelen ser Fuxi, Shennong y Huangdi, y los Cinco son Huangdi, Zhuanxu, Ku, Yao y Shun (hay variantes).",pt:"Os Três Soberanos e os Cinco Imperadores são reis sábios lendários; os Três costumam ser Fuxi, Shennong e Huangdi, e os Cinco são Huangdi, Zhuanxu, Ku, Yao e Shun (há variantes)."}},
{q:{zh:"中国历史上有哪些大一统王朝？",en:"Which dynasties unified China?",es:"¿Qué dinastías unificaron China?",pt:"Quais dinastias unificaram a China?"},a:{zh:"主要大一统王朝有秦、西汉、东汉、西晋、隋、唐、元、明、清。",en:"The major unifying dynasties include Qin, Western Han, Eastern Han, Western Jin, Sui, Tang, Yuan, Ming and Qing.",es:"Las principales dinastías unificadoras incluyen Qin, Han Occidental, Han Oriental, Jin Occidental, Sui, Tang, Yuan, Ming y Qing.",pt:"As principais dinastias unificadoras incluem Qin, Han Ocidental, Han Oriental, Jin Ocidental, Sui, Tang, Yuan, Ming e Qing."}}

var _jq={b:[],turn:1,over:false,sel:null};
function jqCode(n){var m={司:9,军:8,师:7,旅:6,团:5,营:4,连:3,排:2,工:1,地:0};return m[n]||0;}
function jqName(v){if(v===101||v===201)return "旗";if(v===110||v===210)return "炸";var r=v%10;var map=["地","工","排","连","营","团","旅","师","军","司"];return map[r]||"";}
function jqOwner(v){return (v>=10&&v<20)||v===101||v===110?1:2;}
function jqIs(v,ch){return jqName(v)===ch;}
function jqRank(v){if(jqIs(v,"炸"))return 99;if(jqIs(v,"旗"))return -1;return v%10;}
function jqCamp(r,c){return (r===1&&(c===1||c===3))||(r===2&&c===2)||(r===3&&(c===1||c===3))||(r===8&&(c===1||c===3))||(r===9&&c===2)||(r===10&&(c===1||c===3));}
function jqHQ(r,c){return (r===0&&(c===1||c===3))||(r===11&&(c===1||c===3));}
var JQ_LAYOUTS=[
[19,101,18,17,16,15,0,14,0,13,12,11,0,110,10,10,0,0,0,0],
[18,17,19,101,16,15,0,14,0,13,12,110,0,11,10,10,0,0,0,0],
[16,18,17,101,19,13,0,14,0,15,12,11,0,110,10,10,0,0,0,0],

];
function jqInit(){var b=bgInitBoard(12,5);var L=JQ_LAYOUTS[Math.floor(Math.random()*JQ_LAYOUTS.length)];var mir=function(v){if(v===101)return 201;if(v===110)return 210;return v?v+10:0;};var p=0;for(var rr=11;rr>=8;rr--){for(var cc=0;cc<5;cc++){b[rr][cc]=L[p++];}}p=0;for(var rr2=0;rr2<=3;rr2++){for(var cc2=0;cc2<5;cc2++){b[rr2][cc2]=mir(L[p++]);}}_jq.b=b;_jq.turn=1;_jq.over=false;_jq.sel=null;bgRender();jqInfo(t("bgJunqi")+" · "+t("bgYou"));}
function jqClick(cx,cy){if(_jq.over||_jq.turn!==1)return;var cv=document.getElementById("bgCanvas");if(!cv)return;var S=50;var c=Math.round((cx-50)/S),r=Math.round((cy-25)/S);if(c<0||c>=5||r<0||r>=12)return;if(!_jq.sel){if(jqOwner(_jq.b[r][c])===1&&jqName(_jq.b[r][c])!=="地"&&jqName(_jq.b[r][c])!=="旗"){_jq.sel={r:r,c:c};bgRender();}return;}var fr=_jq.sel.r,fc=_jq.sel.c;if(r===fr&&c===fc){_jq.sel=null;bgRender();return;}if(Math.abs(r-fr)+Math.abs(c-fc)!==1){_jq.sel=null;bgRender();return;}jqMove(fr,fc,r,c);_jq.sel=null;}
function jqMove(fr,fc,r,c){var v=_jq.b[fr][fc];var t=_jq.b[r][c];if(t&&jqOwner(t)===1)return;if(!t){_jq.b[r][c]=v;_jq.b[fr][fc]=0;sfx("place");jqAfter(_jq.turn===1?2:1);return;}var vn=jqName(v),tn=jqName(t);if(jqIs(t,"旗")){_jq.b[r][c]=v;_jq.b[fr][fc]=0;sfx("capture");jqEnd(1);return;}if(jqIs(v,"炸")||jqIs(t,"炸")){_jq.b[r][c]=0;_jq.b[fr][fc]=0;sfx("capture");jqAfter(_jq.turn===1?2:1);return;}if(jqIs(v,"工")&&jqIs(t,"地")){_jq.b[r][c]=v;_jq.b[fr][fc]=0;sfx("capture");jqAfter(_jq.turn===1?2:1);return;}if(jqIs(t,"地")){_jq.b[fr][fc]=0;jqAfter(_jq.turn===1?2:1);return;}var vr=jqRank(v),tr=jqRank(t);if(vr>tr){_jq.b[r][c]=v;_jq.b[fr][fc]=0;sfx("capture");jqAfter(_jq.turn===1?2:1);return;}if(vr===tr){_jq.b[r][c]=0;_jq.b[fr][fc]=0;jqAfter(_jq.turn===1?2:1);return;}_jq.b[fr][fc]=0;jqAfter(_jq.turn===1?2:1);}
function jqAfter(tn){if(!jqAlive(1)){jqEnd(2);return;}if(!jqAlive(2)){jqEnd(1);return;}_jq.turn=tn;bgRender();jqInfo(t("bgJunqi")+" · "+(_jq.turn===1?t("bgYou"):t("bgAI")));if(_jq.turn===2)setTimeout(jqAi,300);}
function jqAlive(p){for(var r=0;r<12;r++)for(var c=0;c<5;c++){var v=_jq.b[r][c];if(jqOwner(v)===p&&jqName(v)!=="地"&&jqName(v)!=="旗")return true;}return false;}
function jqEnd(w){_jq.over=true;sfx("win");bgRender();jqInfo(w===1?t("bgYouWin"):t("bgAIWin"));}
function jqAi(){var cands=[];var frr=-1,fcc=-1;for(var rr0=0;rr0<12;rr0++)for(var cc0=0;cc0<5;cc0++){var vv=_jq.b[rr0][cc0];if(jqOwner(vv)===2&&jqIs(vv,"旗")){frr=rr0;fcc=cc0;}}for(var r=0;r<12;r++)for(var c=0;c<5;c++){var v=_jq.b[r][c];if(jqOwner(v)!==2||jqName(v)==="地"||jqName(v)==="旗")continue;var d=[[-1,0],[1,0],[0,-1],[0,1]];for(var q=0;q<4;q++){var nr=r+d[q][0],nc=c+d[q][1];if(nr<0||nr>=12||nc<0||nc>=5)continue;var t=_jq.b[nr][nc];var sc=0;var adv=(11-nr)*1.5;if(!t){sc=5+adv;if(frr>=0&&(Math.abs(r-frr)+Math.abs(c-fcc))<=1&&(Math.abs(nr-frr)+Math.abs(nc-fcc))>1)sc-=3;}else if(jqOwner(t)===1){var tn=jqName(t);if(jqIs(t,"旗"))sc=400;else if(jqIs(v,"炸")&&!jqIs(t,"地"))sc=30;else if(jqIs(v,"工")&&jqIs(t,"地"))sc=60;else if(jqIs(t,"地"))sc=-50;else if(jqRank(v)>jqRank(t))sc=20+jqRank(t)*4+adv;else if(jqRank(v)===jqRank(t))sc=5;else sc=-40;}cands.push({fr:r,fc:c,r:nr,c:nc,sc:sc});}}if(!cands.length){jqAfter(1);return;}var rnd=_bgDiff===1?0.7:(_bgDiff===2?0.4:(_bgDiff===3?0.15:0));var best;if(Math.random()<rnd){best=cands[Math.floor(Math.random()*cands.length)];}else{cands.sort(function(a,b){return b.sc-a.sc;});best=cands[0];}jqMove(best.fr,best.fc,best.r,best.c);}
function jqRender(){var cv=document.getElementById("bgCanvas");if(!cv)return;var ctx=cv.getContext("2d");var S=50,MX=50,MY=25;cv.width=cv.width;ctx.fillStyle="#d8cfb8";ctx.fillRect(0,0,cv.width,cv.height);
ctx.strokeStyle="#b59b78";ctx.lineWidth=1;for(var r=0;r<12;r++)for(var c=0;c<5;c++){var x=MX+c*S,y=MY+r*S;if(c<4){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+S,y);ctx.stroke();}if(r<11){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+S);ctx.stroke();}}
ctx.strokeStyle="#5c4a38";ctx.lineWidth=3;for(var cc=0;cc<5;cc+=4){ctx.beginPath();ctx.moveTo(MX+cc*S,MY);ctx.lineTo(MX+cc*S,MY+11*S);ctx.stroke();}for(var rr=2;rr<=9;rr++){if(rr===5||rr===6)continue;ctx.beginPath();ctx.moveTo(MX,MY+rr*S);ctx.lineTo(MX+4*S,MY+rr*S);ctx.stroke();}
ctx.beginPath();ctx.moveTo(MX+S,MY);ctx.lineTo(MX,MY+S);ctx.moveTo(MX+S,MY);ctx.lineTo(MX+2*S,MY+S);ctx.moveTo(MX+3*S,MY);ctx.lineTo(MX+2*S,MY+S);ctx.moveTo(MX+3*S,MY);ctx.lineTo(MX+4*S,MY+S);ctx.moveTo(MX+S,MY+11*S);ctx.lineTo(MX,MY+10*S);ctx.moveTo(MX+S,MY+11*S);ctx.lineTo(MX+2*S,MY+10*S);ctx.moveTo(MX+3*S,MY+11*S);ctx.lineTo(MX+2*S,MY+10*S);ctx.moveTo(MX+3*S,MY+11*S);ctx.lineTo(MX+4*S,MY+10*S);ctx.stroke();
ctx.lineWidth=1;for(var r2=0;r2<12;r2++)for(var c2=0;c2<5;c2++){if(jqCamp(r2,c2)){ctx.beginPath();ctx.arc(MX+c2*S,MY+r2*S,S*0.3,0,Math.PI*2);ctx.fillStyle="#c8b78f";ctx.fill();ctx.strokeStyle="#5c4a38";ctx.lineWidth=1.5;ctx.stroke();}if(jqHQ(r2,c2)){ctx.strokeStyle="#7a4a1f";ctx.lineWidth=2;ctx.strokeRect(MX+c2*S-S*0.36,MY+r2*S-S*0.36,S*0.72,S*0.72);}}
ctx.fillStyle="#e8ddc2";ctx.fillRect(MX-S*0.4,MY+5*S-S*0.32,4*S+S*0.8,S*0.64);ctx.fillStyle="#7a4a1f";ctx.font=S*0.42+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("山 界",MX+2*S,MY+5*S);
for(var r4=0;r4<12;r4++)for(var c4=0;c4<5;c4++){var v=_jq.b[r4][c4];if(!v)continue;var x=MX+c4*S,y=MY+r4*S;var sel=_jq.sel&&_jq.sel.r===r4&&_jq.sel.c===c4;ctx.beginPath();ctx.arc(x,y,S*0.36,0,Math.PI*2);ctx.fillStyle=jqOwner(v)===1?"#b03a2e":"#2c3e50";ctx.fill();ctx.strokeStyle="#f5e8d0";ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;if(sel){ctx.strokeStyle="#ffd700";ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1;}ctx.fillStyle="#fff";ctx.font=S*0.4+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(jqName(v),x,y+1);}}

function wgInit(){_wg.b=bgInitBoard(19,19);_wg.turn=1;_wg.pass=0;_wg.over=false;bgRender();wgInfo(t("bgWeiqi")+" · "+t("bgYou")+"（黑）");}
function wgLib(b,r,c,seen){var key=r+","+c;if(seen[key])return 99;seen[key]=1;var col=b[r][c];var libs=0;var d=[[-1,0],[1,0],[0,-1],[0,1]];for(var q=0;q<4;q++){var nr=r+d[q][0],nc=c+d[q][1];if(nr<0||nr>=19||nc<0||nc>=19)continue;if(b[nr][nc]===0)libs++;else if(b[nr][nc]===col)libs+=wgLib(b,nr,nc,seen);}return libs;}

<script>
// ===== 四书五经 · 蒙学 内容补全 (2026-08-31) =====
(function(){
if(typeof BOOKS_DATA==="undefined")return;
function byName(n){for(var i=0;i<BOOKS_DATA.length;i++){if(BOOKS_DATA[i].name&&BOOKS_DATA[i].name["zh-CN"]===n)return BOOKS_DATA[i];}return null;}
function enrich(n,chs,intro){
  var b=byName(n);if(!b)return;
  b.chapters={"zh-CN":chs};b.totalChapters=chs.length;
  if(intro)b.intro["zh-CN"]=intro;
}
enrich("诗经",[
{n:1,t:"周南·关雎",c:"关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"},
{n:2,t:"周南·桃夭",c:"桃之夭夭，灼灼其华。之子于归，宜其室家。\n桃之夭夭，有蕡其实。之子于归，宜其家室。\n桃之夭夭，其叶蓁蓁。之子于归，宜其家人。"},
{n:3,t:"邶风·静女",c:"静女其姝，俟我于城隅。爱而不见，搔首踟蹰。\n静女其娈，贻我彤管。彤管有炜，说怿女美。\n自牧归荑，洵美且异。匪女之为美，美人之贻。"},
{n:4,t:"秦风·蒹葭",c:"蒹葭苍苍，白露为霜。所谓伊人，在水一方。\n溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。\n溯洄从之，道阻且跻。溯游从之，宛在水中坻。\n蒹葭采采，白露未已。所谓伊人，在水之涘。\n溯洄从之，道阻且右。溯游从之，宛在水中沚。"},
{n:5,t:"郑风·子衿",c:"青青子衿，悠悠我心。纵我不往，子宁不嗣音？\n青青子佩，悠悠我思。纵我不往，子宁不来？\n挑兮达兮，在城阙兮。一日不见，如三月兮！"},
{n:6,t:"魏风·硕鼠",c:"硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。\n逝将去女，适彼乐土。乐土乐土，爰得我所。\n硕鼠硕鼠，无食我麦！三岁贯女，莫我肯德。\n逝将去女，适彼乐国。乐国乐国，爰得我直。\n硕鼠硕鼠，无食我苗！三岁贯女，莫我肯劳。\n逝将去女，适彼乐郊。乐郊乐郊，谁之永号？"},
{n:7,t:"小雅·鹿鸣",c:"呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。\n吹笙鼓簧，承筐是将。人之好我，示我周行。\n呦呦鹿鸣，食野之蒿。我有嘉宾，德音孔昭。\n视民不恌，君子是则是效。我有旨酒，嘉宾式燕以敖。"},
{n:8,t:"小雅·采薇（末章）",c:"昔我往矣，杨柳依依。今我来思，雨雪霏霏。\n行道迟迟，载渴载饥。我心伤悲，莫知我哀！"}
]);
enrich("尚书",[
{n:1,t:"尧典（节选）",c:"曰若稽古，帝尧曰放勋，钦明文思安安，允恭克让，光被四表，格于上下。克明俊德，以亲九族。九族既睦，平章百姓。百姓昭明，协和万邦。"},
{n:2,t:"舜典（节选）",c:"诗言志，歌永言，声依永，律和声。八音克谐，无相夺伦，神人以和。"},
{n:3,t:"大禹谟（十六字心传）",c:"人心惟危，道心惟微，惟精惟一，允执厥中。"},
{n:4,t:"汤誓（节选）",c:"有夏多罪，天命殛之。……尔尚辅予一人，致天之罚，予其大赉汝。尔无不信，朕不食言。"},
{n:5,t:"盘庚（节选）",c:"若网在纲，有条而不紊；若农服田，力穑乃亦有秋。汝克黜乃心，施实德于民。"},
{n:6,t:"洪范·五行",c:"五行：一曰水，二曰火，三曰木，四曰金，五曰土。水曰润下，火曰炎上，木曰曲直，金曰从革，土爰稼穑。润下作咸，炎上作苦，曲直作酸，从革作辛，稼穑作甘。"},
{n:7,t:"无逸（节选）",c:"君子所，其无逸。先知稼穑之艰难，乃逸，则知小人之依。……无淫于观、于逸、于游、于田，以万民惟正之供。"}
]);
enrich("礼记",[
{n:1,t:"曲礼上（节选）",c:"毋不敬，俨若思，安定辞。安民哉！\n傲不可长，欲不可从，志不可满，乐不可极。\n临财毋苟得，临难毋苟免。"},
{n:2,t:"檀弓下（节选）",c:"嗟尔！毋以死伤生。\n丧，与其哀不足而礼有余也，不若礼不足而哀有余也。"},
{n:3,t:"礼运·大同",c:"大道之行也，天下为公，选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养。男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。"},
{n:4,t:"学记（节选）",c:"玉不琢，不成器；人不学，不知道。\n虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。"},
{n:5,t:"乐记（节选）",c:"凡音之起，由人心生也。人心之动，物使之然也。感于物而动，故形于声。……乐者，天地之和也；礼者，天地之序也。和，故百物皆化；序，故群物皆别。"},
{n:6,t:"儒行（节选）",c:"儒有博学而不穷，笃行而不倦。……身可危也，而志不可夺也。虽危起居，竟信其志，犹将不忘百姓之病也。"}
]);
enrich("弟子规",[
{n:1,t:"总叙",c:"弟子规，圣人训。首孝悌，次谨信。\n泛爱众，而亲仁。有余力，则学文。"},
{n:2,t:"入则孝",c:"父母呼，应勿缓。父母命，行勿懒。\n父母教，须敬听。父母责，须顺承。\n冬则温，夏则凊。晨则省，昏则定。\n出必告，反必面。居有常，业无变。\n事虽小，勿擅为。苟擅为，子道亏。\n物虽小，勿私藏。苟私藏，亲心伤。\n亲所好，力为具。亲所恶，谨为去。\n身有伤，贻亲忧。德有伤，贻亲羞。\n亲爱我，孝何难。亲憎我，孝方贤。\n亲有过，谏使更。怡吾色，柔吾声。\n谏不入，悦复谏。号泣随，挞无怨。\n亲有疾，药先尝。昼夜侍，不离床。\n丧三年，常悲咽。居处变，酒肉绝。\n丧尽礼，祭尽诚。事死者，如事生。"},
{n:3,t:"出则弟",c:"兄道友，弟道恭。兄弟睦，孝在中。\n财物轻，怨何生。言语忍，忿自泯。\n或饮食，或坐走。长者先，幼者后。\n长呼人，即代叫。人不在，己即到。\n称尊长，勿呼名。对尊长，勿见能。\n路遇长，疾趋揖。长无言，退恭立。\n骑下马，乘下车。过犹待，百步余。\n长者立，幼勿坐。长者坐，命乃坐。\n尊长前，声要低。低不闻，却非宜。\n进必趋，退必迟。问起对，视勿移。\n事诸父，如事父。事诸兄，如事兄。"},
{n:4,t:"谨",c:"朝起早，夜眠迟。老易至，惜此时。\n晨必盥，兼漱口。便溺回，辄净手。\n冠必正，纽必结。袜与履，俱紧切。\n置冠服，有定位。勿乱顿，致污秽。\n衣贵洁，不贵华。上循分，下称家。\n对饮食，勿拣择。食适可，勿过则。\n年方少，勿饮酒。饮酒醉，最为丑。\n步从容，立端正。揖深圆，拜恭敬。\n勿践阈，勿跛倚。勿箕踞，勿摇髀。\n缓揭帘，勿有声。宽转弯，勿触棱。\n执虚器，如执盈。入虚室，如有人。\n事勿忙，忙多错。勿畏难，勿轻略。\n斗闹场，绝勿近。邪僻事，绝勿问。\n将入门，问孰存。将上堂，声必扬。\n人问谁，对以名。吾与我，不分明。\n用人物，须明求。倘不问，即为偷。\n借人物，及时还。后有急，借不难。"},
{n:5,t:"信",c:"凡出言，信为先。诈与妄，奚可焉。\n话说多，不如少。惟其是，勿佞巧。\n奸巧语，秽污词。市井气，切戒之。\n见未真，勿轻言。知未的，勿轻传。\n事非宜，勿轻诺。苟轻诺，进退错。\n凡道字，重且舒。勿急疾，勿模糊。\n彼说长，此说短。不关己，莫闲管。\n见人善，即思齐。纵去远，以渐跻。\n见人恶，即内省。有则改，无加警。\n唯德学，唯才艺。不如人，当自砺。\n若衣服，若饮食。不如人，勿生戚。\n闻过怒，闻誉乐。损友来，益友却。\n闻誉恐，闻过欣。直谅士，渐相亲。\n无心非，名为错。有心非，名为恶。\n过能改，归于无。倘掩饰，增一辜。"},
{n:6,t:"泛爱众",c:"凡是人，皆须爱。天同覆，地同载。\n行高者，名自高。人所重，非貌高。\n才大者，望自大。人所服，非言大。\n己有能，勿自私。人所能，勿轻訾。\n勿谄富，勿骄贫。勿厌故，勿喜新。\n人不闲，勿事搅。人不安，勿话扰。\n人有短，切莫揭。人有私，切莫说。\n道人善，即是善。人知之，愈思勉。\n扬人恶，即是恶。疾之甚，祸且作。\n善相劝，德皆建。过不规，道两亏。\n凡取与，贵分晓。与宜多，取宜少。\n将加人，先问己。己不欲，即速已。\n恩欲报，怨欲忘。报怨短，报恩长。\n待婢仆，身贵端。虽贵端，慈而宽。\n势服人，心不然。理服人，方无言。"},
{n:7,t:"亲仁·余力学文",c:"同是人，类不齐。流俗众，仁者希。\n果仁者，人多畏。言不讳，色不媚。\n能亲仁，无限好。德日进，过日少。\n不亲仁，无限害。小人进，百事坏。\n不力行，但学文。长浮华，成何人。\n但力行，不学文。任己见，昧理真。\n读书法，有三到。心眼口，信皆要。\n方读此，勿慕彼。此未终，彼勿起。\n宽为限，紧用功。工夫到，滞塞通。\n心有疑，随札记。就人问，求确义。\n房室清，墙壁净。几案洁，笔砚正。\n墨磨偏，心不端。字不敬，心先病。\n列典籍，有定处。读看毕，还原处。\n虽有急，卷束齐。有缺坏，就补之。\n非圣书，屏勿视。蔽聪明，坏心志。\n勿自暴，勿自弃。圣与贤，可驯致。"}
]);
enrich("声律启蒙",[
{n:1,t:"上卷·一东（节选）",c:"云对雨，雪对风，晚照对晴空。\n来鸿对去燕，宿鸟对鸣虫。\n三尺剑，六钧弓，岭北对江东。\n人间清暑殿，天上广寒宫。\n两岸晓烟杨柳绿，一园春雨杏花红。"},
{n:2,t:"上卷·二冬（节选）",c:"春对夏，秋对冬，暮鼓对晨钟。\n观山对玩水，绿竹对苍松。\n冯妇虎，叶公龙，舞蝶对鸣蛩。\n衔泥双紫燕，课蜜几黄蜂。\n春日园中莺恰恰，秋天塞外雁雍雍。"}
]);
enrich("幼学琼林",[
{n:1,t:"卷一·天文",c:"混沌初开，乾坤始奠。气之轻清上浮者为天，气之重浊下凝者为地。\n日月五星，谓之七政；天地与人，谓之三才。\n日为众阳之宗，月乃太阴之象。\n虹名螮蝀，乃天地之淫气；月里蟾蜍，是月魄之精光。"},
{n:2,t:"卷一·地舆",c:"黄帝画野，始分都邑；夏禹治水，初奠山川。\n宇宙之江山不改，古今之称谓各殊。\n沧海桑田，谓世事之多变；河清海晏，兆天下之升平。"}
]);
enrich("龙文鞭影",[
{n:1,t:"上卷·一东",c:"粗成四字，诲尔童蒙。\n经书暇日，子史须通。\n重华大孝，武穆精忠。\n尧眉八彩，舜目重瞳。\n商王祷雨，汉祖歌风。"},
{n:2,t:"上卷·二冬",c:"秀巡河北，策据江东。\n太宗怀鹞，桓典乘骢。\n嘉宾赋雪，圣祖吟虹。\n邺仙秋水，宣圣春风。"}
]);
})();
</script>

<script>
// ===== 圣贤人物画像 · 口吻 · 互动增强 (2026-08-31) =====
(function(){
if(typeof SHENJIAO_CHARS==="undefined")return;
var E={
laozi:{greet:"道可道，非常道。你来了，且坐下，我们慢慢说。",persona:"玄妙深远 · 惜字如金",r:[{k:["道","天地"],a:"道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。"},{k:["治国","天下"],a:"治大国，若烹小鲜。清静无为，则民自化。"}],f:["大巧若拙，大辩若讷。","千里之行，始于足下。","知者不言，言者不知。"]},
kongzi:{greet:"有朋自远方来，不亦乐乎？来，坐，我们谈谈仁义。",persona:"温良恭俭让 · 循循善诱",r:[{k:["学习","学"],a:"学而不厌，诲人不倦。温故而知新，可以为师矣。"},{k:["君子","为人"],a:"君子坦荡荡，小人长戚戚。君子和而不同，小人同而不和。"}],f:["三人行，必有我师焉。","学而时习之，不亦说乎？","见贤思齐焉，见不贤而内自省也。"]},
zhuangzi:{greet:"是庄周梦蝶，还是蝶梦庄周？今日你且听我讲个故事。",persona:"汪洋恣肆 · 嬉笑齐物",r:[{k:["梦","蝴蝶"],a:"昔者庄周梦为蝴蝶，栩栩然蝴蝶也，自喻适志与，不知周也。"},{k:["自由","逍遥"],a:"乘天地之正，而御六气之辩，以游无穷者，彼且恶乎待哉。"}],f:["吾生也有涯，而知也无涯。","相濡以沫，不如相忘于江湖。","至人无己，神人无功，圣人无名。"]},
mozi:{greet:"兴天下之利，除天下之害。你若有难，我必相助。",persona:"务实笃行 · 侠义担当",r:[{k:["兼爱","爱"],a:"视人之国若视其国，视人之身若视其身，天下之人皆相爱。"},{k:["实践","行"],a:"口言之，身必行之。士虽有学，而行为本焉。"}],f:["染于苍则苍，染于黄则黄。","君子不镜于水，而镜于人。","仁人之所以为事者，必兴天下之利。"]},
buddha:{greet:"众生皆具如来智慧德相。来，且放下执念，听我一偈。",persona:"慈悲智慧 · 宁静平和",r:[{k:["苦","烦恼"],a:"人生八苦：生、老、病、死、爱别离、怨憎会、求不得、五蕴炽盛。知苦方能离苦。"},{k:["放下","执念"],a:"应无所住，而生其心。不执着，方得自在。"}],f:["一切有为法，如梦幻泡影，如露亦如电。","慈悲喜舍，是名四无量心。","菩提本无树，明镜亦非台。"]},
huineng:{greet:"本来无一物，何处惹尘埃？你心中其实早有答案。",persona:"直指本心 · 顿悟见性",r:[{k:["顿悟","悟"],a:"前念迷即凡夫，后念悟即佛。迷悟只在一念之间。"},{k:["心","修行"],a:"心平何劳持戒，行直何用修禅。修行贵在明心见性。"}],f:["佛法在世间，不离世间觉。","菩提自性，本来清净。","一灯能除千年暗，一智能灭万年愚。"]},
wukong:{greet:"呔！俺老孙来也！有话快说，有难俺替你平了！",persona:"桀骜不驯 · 快人快语",r:[{k:["本领","神通"],a:"七十二变，一个筋斗十万八千里，怕你不服？"},{k:["自由","规矩"],a:"俺老孙天不怕地不怕，最恨那套紧箍咒！"}],f:["皇帝轮流做，明年到我家。","呔！妖怪，哪里跑！","俺老孙去也！"]},
simaqian:{greet:"人固有一死，或重于泰山，或轻于鸿毛。你且问来。",persona:"沉郁坚忍 · 秉笔直书",r:[{k:["著史","史记"],a:"究天人之际，通古今之变，成一家之言。"},{k:["忍辱","屈辱"],a:"所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽。"}],f:["文王拘而演周易，仲尼厄而作春秋。","屈原放逐，乃赋离骚。","桃李不言，下自成蹊。"]},
caocao:{greet:"宁教我负天下人，休教天下人负我。来，说说你的来意。",persona:"雄才大略 · 机变深沉",r:[{k:["用人","人才"],a:"唯才是举，吾得而用之。天下英雄，皆入吾彀中。"},{k:["志向","老"],a:"老骥伏枥，志在千里；烈士暮年，壮心不已。"}],f:["对酒当歌，人生几何！","周公吐哺，天下归心。","日月之行，若出其中。"]},
liubang:{greet:"运筹帷幄我不如子房，带兵打仗我不如韩信。你且说来，我自有道理。",persona:"豁达大度 · 知人善任",r:[{k:["用人","人才"],a:"夫运筹帷幄之中，决胜千里之外，吾不如子房。此三人皆人杰也，吾能用之。"},{k:["志向","大丈夫"],a:"大丈夫当如此也！人生在世，当成就一番事业。"}],f:["大风起兮云飞扬，威加海内兮归故乡。","夫运筹帷幄之中，决胜千里之外。"]},
xiangyu:{greet:"力拔山兮气盖世！来者何人，报上名来！",persona:"豪气干云 · 重情重义",r:[{k:["勇","武力"],a:"吾起兵八岁，身七十余战，所当者破，所击者服，未尝败北！"},{k:["情","虞姬"],a:"虞兮虞兮奈若何！大丈夫生于世，亦当有情有义。"}],f:["此天之亡我，非战之罪也。","无颜见江东父老。","生当作人杰，死亦为鬼雄。"]},
mao:{greet:"俱往矣，数风流人物，还看今朝！同志，坐下谈。",persona:"豪情万丈 · 雄视古今",r:[{k:["志向","理想"],a:"为有牺牲多壮志，敢教日月换新天。"},{k:["人民","群众"],a:"人民，只有人民，才是创造世界历史的动力。"}],f:["星星之火，可以燎原。","世上无难事，只要肯登攀。","雄关漫道真如铁，而今迈步从头越。"]},
hanwu:{greet:"犯强汉者，虽远必诛！你有何策，说来听听。",persona:"雄才大略 · 开疆拓土",r:[{k:["功业","统一"],a:"朕承六世之余烈，北却匈奴，南定百越，使海内为一。"},{k:["人才","贤"],a:"盖有非常之功，必待非常之人。"}],f:["秋风起兮白云飞，草木黄落兮雁南归。","泛楼船兮济汾河，横中流兮扬素波。"]},
qinshi:{greet:"朕为始皇帝，后世以计数，二世三世至于万世。卿有何言？",persona:"威严肃穆 · 气吞八荒",r:[{k:["统一","天下"],a:"六合之内，皇帝之土；人迹所至，无不臣者。"},{k:["功业","长城"],a:"朕统六国，天下归一，筑长城以镇九州，书同文，车同轨。"}],f:["收天下之兵，聚之咸阳，销锋镝。","一人之心，千万人之心也。"]},
wangyangming:{greet:"破山中贼易，破心中贼难。你心中可有贼？",persona:"知行合一 · 语重心长",r:[{k:["良知","心"],a:"良知即是天理，致良知则万事可成。心外无物，心外无理。"},{k:["实践","知行"],a:"知是行之始，行是知之成。真知即所以为行，不行不足谓之知。"}],f:["此心光明，亦复何言。","志不立，天下无可成之事。","你未看此花时，此花与汝心同归于寂。"]},
libai:{greet:"天生我材必有用，千金散尽还复来！来来来，先饮三杯！",persona:"豪放飘逸 · 才气纵横",r:[{k:["酒","饮"],a:"古来圣贤皆寂寞，惟有饮者留其名。五花马，千金裘，呼儿将出换美酒！"},{k:["志向","抱负"],a:"仰天大笑出门去，我辈岂是蓬蒿人！"}],f:["飞流直下三千尺，疑是银河落九天。","举杯邀明月，对影成三人。","抽刀断水水更流，举杯销愁愁更愁。"]},
mazu:{greet:"风平浪静，慈航普度。你若遇险，我自护你平安。",persona:"慈悲温柔 · 护佑众生",r:[{k:["护佑","平安"],a:"护国庇民，救危扶困，是吾本分。凡有危难，心诚则灵。"},{k:["慈悲","善"],a:"众生皆苦，吾愿以慈悲心渡之。日行一善，福泽自至。"}],f:["云帆高张，顺风顺水。","慈航普度，海晏河清。"]},
zhugeliang:{greet:"臣本布衣，躬耕南阳。得君三顾，敢不效犬马之劳。",persona:"淡泊明志 · 鞠躬尽瘁",r:[{k:["谋略","用兵"],a:"夫用兵之道，攻心为上，攻城为下；心战为上，兵战为下。"},{k:["志向","淡泊"],a:"淡泊以明志，宁静以致远。苟全性命于乱世，不求闻达于诸侯。"}],f:["出师未捷身先死，长使英雄泪满襟。","鞠躬尽瘁，死而后已。"]},
sushi:{greet:"一蓑烟雨任平生！来，且吃我一块东坡肉再说。",persona:"旷达幽默 · 苦中作乐",r:[{k:["吃","美食"],a:"日啖荔枝三百颗，不辞长作岭南人。慢著火，少著水，火候足时它自美。"},{k:["豁达","贬"],a:"问汝平生功业，黄州惠州儋州。贬到哪里，我就在哪里把日子过成诗。"}],f:["人生到处知何似，应似飞鸿踏雪泥。","明月几时有？把酒问青天。","回首向来萧瑟处，归去，也无风雨也无晴。"]},
quyuan:{greet:"长太息以掩涕兮，哀民生之多艰。你可知我心？",persona:"忠贞高洁 · 忧国忧民",r:[{k:["理想","志"],a:"亦余心之所善兮，虽九死其犹未悔。"},{k:["高洁","清白"],a:"举世皆浊我独清，众人皆醉我独醒。宁溘死以流亡兮，余不忍为此态也。"}],f:["路漫漫其修远兮，吾将上下而求索。","袅袅兮秋风，洞庭波兮木叶下。"]},
dufu:{greet:"安得广厦千万间，大庇天下寒士俱欢颜！你且坐。",persona:"沉郁深挚 · 悲天悯人",r:[{k:["忧民","苍生"],a:"朱门酒肉臭，路有冻死骨。穷年忧黎元，叹息肠内热。"},{k:["志向","登高"],a:"会当凌绝顶，一览众山小。"}],f:["国破山河在，城春草木深。","读书破万卷，下笔如有神。","无边落木萧萧下，不尽长江滚滚来。"]},
yuefei:{greet:"三十功名尘与土，八千里路云和月！你且听我说精忠。",persona:"忠勇刚毅 · 精忠报国",r:[{k:["忠","报国"],a:"文臣不爱钱，武臣不惜死，天下太平矣。臣以身许国，何惜一死！"},{k:["志向","雪耻"],a:"靖康耻，犹未雪；臣子恨，何时灭！驾长车，踏破贺兰山缺。"}],f:["莫等闲，白了少年头，空悲切。","壮志饥餐胡虏肉，笑谈渴饮匈奴血。"]},
wentianxiang:{greet:"人生自古谁无死，留取丹心照汗青！你问吧。",persona:"一身正气 · 视死如归",r:[{k:["正气","节"],a:"天地有正气，杂然赋流形。下则为河岳，上则为日星。"},{k:["死","大义"],a:"孔曰成仁，孟曰取义；惟其义尽，所以仁至。读圣贤书，所学何事？"}],f:["时穷节乃见，一一垂丹青。","臣心一片磁针石，不指南方不肯休。"]},
zhenghe:{greet:"云帆高张，昼夜星驰！海的那边，还有更广阔的天地。",persona:"胸怀四海 · 开拓进取",r:[{k:["航海","远航"],a:"七下西洋，历三十余国，扬我华夏威名，宣德于海外。"},{k:["志向","远方"],a:"欲穷千里目，更上一层楼。大丈夫志在四方。"}],f:["长风破浪会有时，直挂云帆济沧海。","海纳百川，有容乃大。"]},
lishizhen:{greet:"格物穷理，知行合一。来，我先给你号号脉。",persona:"求真务实 · 济世救人",r:[{k:["本草","药"],a:"读万卷书，行万里路，尝百草而成《纲目》，二十七年乃成。"},{k:["济世","医"],a:"为医者，当以救死扶伤为天职。人命至重，有贵千金。"}],f:["身如逆流船，心比铁石坚。","格物穷理，方得其真。"]},
sunzi:{greet:"兵者，国之大事，死生之地。你且问战。",persona:"深谋远虑 · 言简意赅",r:[{k:["谋略","胜"],a:"上兵伐谋，其次伐交，其次伐兵，其下攻城。不战而屈人之兵，善之善者也。"},{k:["形","守"],a:"善战者，先为不可胜，以待敌之可胜。不可胜在己，可胜在敌。"}],f:["兵者，诡道也。","知己知彼，百战不殆。","攻其无备，出其不意。"]},
guiguzi:{greet:"捭阖者，天地之道。你心中所想，我已知七八。",persona:"洞悉人心 · 高深莫测",r:[{k:["捭阖","纵横"],a:"捭之者，开也，言也，阳也；阖之者，闭也，默也，阴也。审其有无，以知其实。"},{k:["谋略","智"],a:"智用于众人之所不能知，而能用于众人之所不能见。"}],f:["口者，心之门户也。","谋莫难于周密，说莫难于悉听。"]},
wangxizhi:{greet:"仰观宇宙之大，俯察品类之盛。且来，看我这笔如何？",persona:"风雅洒脱 · 精益求精",r:[{k:["书法","书"],a:"书者，心画也。意在笔先，字乃心迹。飘若浮云，矫若惊龙。"},{k:["兰亭","雅集"],a:"群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右。"}],f:["飘若浮云，矫若惊龙。","固知一死生为虚诞，齐彭殇为妄作。"]},
guanyu:{greet:"玉可碎而不可改其白，竹可焚而不可毁其节！来者请讲。",persona:"义薄云天 · 忠肝义胆",r:[{k:["义","忠义"],a:"义不负心，忠不顾死。大丈夫生于天地间，当以信义立身。"},{k:["勇","武"],a:"温酒斩华雄，不过等闲。某之青龙偃月刀，专斩不义之人。"}],f:["身在曹营心在汉。","单刀赴会，何惧之有！"]}
};
Object.keys(E).forEach(function(id){
  var en=E[id];if(!en)return;
  for(var i=0;i<SHENJIAO_CHARS.length;i++){
    var ch=SHENJIAO_CHARS[i];if(ch.id!==id)continue;
    if(en.greet)ch.greet=en.greet;
    if(en.persona)ch.persona=en.persona;
    if(en.r&&en.r.length)ch.responses=(ch.responses||[]).concat(en.r);
    if(en.f&&en.f.length)ch.fallback=(ch.fallback||[]).concat(en.f);
    break;
  }
});
})();
</script>
<style>.sj-persona{display:block;font-size:.68rem;color:#c9a84c;margin-top:.15rem;letter-spacing:.04em}</style>
<script>
// ===== 儒释道 · 四书五经 内容补全 (2026-08-31) =====
(function(){
if(typeof BOOKS_DATA==="undefined")return;
function byName(n){for(var i=0;i<BOOKS_DATA.length;i++){if(BOOKS_DATA[i].name&&BOOKS_DATA[i].name["zh-CN"]===n)return BOOKS_DATA[i];}return null;}
function enrich(n,chs){var b=byName(n);if(!b)return;b.chapters={"zh-CN":chs};b.totalChapters=chs.length;}

// —— 四书五经 · 春秋 ——
enrich("春秋",[
{n:1,t:"隐公元年",c:"元年春，王正月。\n夏五月，郑伯克段于鄢。段不弟，故不言弟；如二君，故曰克；称郑伯，讥失教也。\n君子曰：颖考叔，纯孝也，爱其母，施及庄公。《诗》曰：孝子不匮，永锡尔类。"},
{n:2,t:"桓公二年",c:"二年春，王正月戊申，宋督弑其君与夷及其大夫孔父。\n君子曰：督之弑君，乱臣贼子也。孔子作《春秋》而乱臣贼子惧。"},
{n:3,t:"庄公十年·曹刿论战",c:"十年春，王正月，公败齐师于长勺。\n肉食者鄙，未能远谋。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。"},
{n:4,t:"僖公四年",c:"四年春，王正月，公会齐侯、宋公、陈侯、卫侯、郑伯、许男、曹伯侵蔡。蔡溃，遂伐楚，次于陉。\n尔贡包茅不入，王祭不共，无以缩酒，寡人是征。"},
{n:5,t:"宣公二年·董狐直笔",c:"秋九月乙丑，晋赵盾弑其君夷皋。\n董狐，古之良史也，书法不隐。赵宣子，古之良大夫也，为法受恶。"},
{n:6,t:"哀公十四年·获麟",c:"十有四年春，西狩获麟。\n孔子曰：吾道穷矣。……《春秋》之义行，则天下乱臣贼子惧焉。"}
]);

// —— 儒家 · 孝经 ——
enrich("孝经",[
{n:1,t:"开宗明义 · 天子 · 诸侯",c:"仲尼居，曾子侍。子曰：先王有至德要道，以顺天下，民用和睦，上下无怨。夫孝，德之本也，教之所由生也。身体发肤，受之父母，不敢毁伤，孝之始也；立身行道，扬名于后世，以显父母，孝之终也。\n爱亲者，不敢恶于人；敬亲者，不敢慢于人。爱敬尽于事亲，而德教加于百姓，刑于四海。\n在上不骄，高而不危；制节谨度，满而不溢。"},
{n:2,t:"卿大夫 · 士 · 庶人",c:"非先王之法服不敢服，非先王之法言不敢道，非先王之德行不敢行。\n资于事父以事母，而爱同；资于事父以事君，而敬同。\n用天之道，分地之利，谨身节用，以养父母，此庶人之孝也。"},
{n:3,t:"三才 · 孝治 · 圣治",c:"夫孝，天之经也，地之义也，民之行也。天地之经，而民是则之。\n昔者明王之以孝治天下也，不敢遗小国之臣，而况于公侯伯子男乎？\n天地之性，人为贵。人之行，莫大于孝。"},
{n:4,t:"纪孝行 · 五刑 · 广要道",c:"孝子之事亲也，居则致其敬，养则致其乐，病则致其忧，丧则致其哀，祭则致其严。五者备矣，然后能事亲。\n五刑之属三千，而罪莫大于不孝。\n教民亲爱，莫善于孝；教民礼顺，莫善于悌；移风易俗，莫善于乐；安上治民，莫善于礼。"},
{n:5,t:"广至德 · 广扬名 · 谏诤",c:"君子之教以孝也，非家至而日见之也。教以孝，所以敬天下之为人父者也。\n君子之事亲孝，故忠可移于君；事兄悌，故顺可移于长；居家理，故治可移于官。\n当不义，则子不可以不争于父，臣不可以不争于君。故当不义则争之，从父之令，又焉得为孝乎！"},
{n:6,t:"感应 · 事君 · 丧亲",c:"昔者明王事父孝，故事天明；事母孝，故事地察。天地明察，神明彰矣。\n君子之事上也，进思尽忠，退思补过。\n孝子之丧亲也，哭不偯，礼无容，言不文。为之棺椁衣衾而举之，陈其簠簋而哀戚之。生事爱敬，死事哀戚，生民之本尽矣。"}
]);

// —— 儒家 · 荀子 ——
enrich("荀子",[
{n:1,t:"劝学",c:"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。\n吾尝终日而思矣，不如须臾之所学也。\n不积跬步，无以至千里；不积小流，无以成江海。锲而舍之，朽木不折；锲而不舍，金石可镂。"},
{n:2,t:"修身",c:"见善，修然必以自存也；见不善，愀然必以自省也。\n非我而当者，吾师也；是我而当者，吾友也；谄谀我者，吾贼也。"},
{n:3,t:"性恶",c:"人之性恶，其善者伪也。今人之性，生而有好利焉，顺是，故争夺生而辞让亡焉。\n故圣人化性而起伪，伪起而生礼义，礼义生而制法度。"},
{n:4,t:"天论",c:"天行有常，不为尧存，不为桀亡。应之以治则吉，应之以乱则凶。\n大天而思之，孰与物畜而制之！从天而颂之，孰与制天命而用之！"},
{n:5,t:"解蔽",c:"凡人之患，蔽于一曲，而暗于大理。\n故人心譬如盘水，正错而勿动，则湛浊在下，而清明在上。"},
{n:6,t:"礼论",c:"礼起于何也？曰：人生而有欲，欲而不得，则不能无求；求而无度量分界，则不能不争。\n故先王制礼义以分之，以养人之欲，给人之求。"}
]);

// —— 儒家 · 传习录 ——
enrich("传习录",[
{n:1,t:"心即理",c:"心即理也。天下又有心外之事、心外之理乎？\n心外无物。如吾心发一念孝亲，即孝亲便是物。"},
{n:2,t:"知行合一",c:"知是行的主意，行是知的功夫；知是行之始，行是知之成。\n知之真切笃实处，即是行；行之明觉精察处，即是知。"},
{n:3,t:"致良知",c:"良知者，心之本体。\n致吾心之良知于事事物物，则事事物物皆得其理矣。"},
{n:4,t:"四句教",c:"无善无恶心之体，有善有恶意之动，知善知恶是良知，为善去恶是格物。\n此心光明，亦复何言。"}
]);

// —— 道家 · 庄子 ——
enrich("庄子",[
{n:1,t:"逍遥游",c:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也。\n至人无己，神人无功，圣人无名。\n鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹。"},
{n:2,t:"齐物论",c:"天地与我并生，而万物与我为一。\n昔者庄周梦为蝴蝶，栩栩然蝴蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为蝴蝶与，蝴蝶之梦为周与？"},
{n:3,t:"养生主",c:"吾生也有涯，而知也无涯。以有涯随无涯，殆已！\n庖丁解牛：彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣。"},
{n:4,t:"人间世",c:"若一志，无听之以耳而听之以心，无听之以心而听之以气。……虚者，心斋也。\n山木自寇也，膏火自煎也。桂可食，故伐之；漆可用，故割之。"},
{n:5,t:"德充符",c:"德有所长，而形有所忘。人不忘其所忘，而忘其所不忘，此谓诚忘。"},
{n:6,t:"大宗师",c:"知天之所为，知人之所为者，至矣。\n相濡以沫，不如相忘于江湖。\n大块载我以形，劳我以生，佚我以老，息我以死。"},
{n:7,t:"应帝王",c:"至人之用心若镜，不将不迎，应而不藏，故能胜物而不伤。\n无为名尸，无为谋府，无为事任，无为知主。"}
]);

// —— 道家 · 列子 ——
enrich("列子",[
{n:1,t:"汤问",c:"北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也。\n虽我之死，有子存焉；子又生孙，孙又生子；子子孙孙无穷匮也，而山不加增，何苦而不平？\n汝心之固，固不可彻。"},
{n:2,t:"黄帝",c:"黄帝……昼寝而梦，游于华胥氏之国。其国无帅长，自然而已；其民无嗜欲，自然而已。\n入水不溺，入火不热。斫挞无伤痛，指擿无痟痒。"},
{n:3,t:"杨朱",c:"且趣当生，奚遑死后？\n古之人，损一毫利天下，不与也；悉天下奉一身，不取也。人人不损一毫，人人不利天下，天下治矣。"},
{n:4,t:"说符",c:"杨子之邻人亡羊，既率其党，又请杨子之竖追之。杨子曰：嘻！亡一羊何追者之众？邻人曰：多歧路。\n歧路之中又有歧焉，吾不知所之，所以反也。"}
]);

// —— 道家 · 清静经 / 阴符经 / 太上感应篇 ——
enrich("清静经",[
{n:1,t:"清静经",c:"老君曰：大道无形，生育天地；大道无情，运行日月；大道无名，长养万物。\n夫人神好清，而心扰之；人心好静，而欲牵之。常能遣其欲，而心自静；澄其心，而神自清。\n人能常清静，天地悉皆归。"}
]);
enrich("阴符经",[
{n:1,t:"阴符经",c:"观天之道，执天之行，尽矣。\n天性，人也；人心，机也。立天之道，以定人也。\n瞽者善听，聋者善视。绝利一源，用师十倍；三返昼夜，用师万倍。\n天之无恩而大恩生，迅雷烈风，莫不蠢然。"}
]);
enrich("太上感应篇",[
{n:1,t:"太上感应篇",c:"太上曰：祸福无门，惟人自召；善恶之报，如影随形。\n是以天地有司过之神，依人所犯轻重，以夺人算。\n所谓善人，人皆敬之，天道佑之，福禄随之，众邪远之，神灵卫之。\n吉人语善、视善、行善，一日有三善，三年天必降之福。"}
]);

// —— 佛家 · 金刚经 ——
enrich("金刚经",[
{n:1,t:"善现启请",c:"应如是住，如是降伏其心。……应无所住，而生其心。\n凡所有相，皆是虚妄。若见诸相非相，则见如来。"},
{n:2,t:"如理实见",c:"不应住色生心，不应住声香味触法生心，应无所住而生其心。\n过去心不可得，现在心不可得，未来心不可得。"},
{n:3,t:"法身非相",c:"若以色见我，以音声求我，是人行邪道，不能见如来。\n如来者，无所从来，亦无所去，故名如来。"},
{n:4,t:"应化非真",c:"一切有为法，如梦幻泡影，如露亦如电，应作如是观。\n若人言如来有所说法，即为谤佛，不能解我所说故。"}
]);

// —— 佛家 · 六祖坛经 ——
enrich("六祖坛经",[
{n:1,t:"行由品",c:"菩提本无树，明镜亦非台；本来无一物，何处惹尘埃。\n不是风动，不是幡动，仁者心动。\n何期自性，本自清净；何期自性，本不生灭；何期自性，本自具足；何期自性，本无动摇；何期自性，能生万法。"},
{n:2,t:"般若品",c:"佛法在世间，不离世间觉；离世觅菩提，恰如求兔角。\n前念迷即凡夫，后念悟即佛；前念著境即烦恼，后念离境即菩提。"},
{n:3,t:"疑问品",c:"心平何劳持戒，行直何用修禅。\n恩则孝养父母，义则上下相怜。让则尊卑和睦，忍则众恶无喧。"}
]);

// —— 佛家 · 楞严经 ——
enrich("楞严经",[
{n:1,t:"七处征心",c:"佛告阿难：如汝所说，真所爱乐，因于心目。若不识知心目所在，则不能得降伏尘劳。\n心不在内，不在外，不在中间。过去心不可得，现在心不可得，未来心不可得。"},
{n:2,t:"二十五圆通",c:"反闻闻自性，性成无上道。\n一根既返源，六根成解脱。\n见见之时，见非是见；见犹离见，见不能及。"},
{n:3,t:"五十阴魔",c:"不作圣解，名善境界；若作圣解，即受群邪。\n狂性自歇，歇即菩提。胜净明心，本周法界。"}
]);

// —— 佛家 · 法华经 / 圆觉经 ——
enrich("法华经",[
{n:1,t:"方便品",c:"诸佛世尊唯以一大事因缘故出现于世，欲令众生开、示、悟、入佛之知见故出现于世。\n十方佛土中，唯有一乘法，无二亦无三，除佛方便说。"},
{n:2,t:"普门品",c:"若有无量百千万亿众生，受诸苦恼，闻是观世音菩萨，一心称名，观世音菩萨即时观其音声，皆得解脱。\n妙音观世音，梵音海潮音，胜彼世间音，是故须常念。"}
]);
enrich("圆觉经",[
{n:1,t:"文殊章",c:"一切众生从无始来，种种颠倒，犹如迷人四方易处。妄认四大为自身相，六尘缘影为自心相。\n善男子，无上法王有大陀罗尼门，名为圆觉。"},
{n:2,t:"普贤章",c:"知幻即离，不作方便；离幻即觉，亦无渐次。\n一切菩萨及末世众生，依此修行，如是乃能永离诸幻。"}
]);

// —— 佛家 · 阿弥陀经 / 四十二章经 / 地藏经 ——
enrich("阿弥陀经",[
{n:1,t:"依报庄严",c:"从是西方，过十万亿佛土，有世界名曰极乐。其土有佛，号阿弥陀，今现在说法。\n极乐国土，七重栏楯，七重罗网，七重行树，皆是四宝周匝围绕。"},
{n:2,t:"持名往生",c:"若有善男子、善女人，闻说阿弥陀佛，执持名号，若一日、若二日……若七日，一心不乱，其人临命终时，阿弥陀佛与诸圣众现在其前。"}
]);
enrich("四十二章经",[
{n:1,t:"出家证果",c:"辞亲出家，识心达本，解无为法，名曰沙门。\n常行二百五十戒，进止清净，为四真道行，成阿罗汉。"},
{n:2,t:"断欲绝求",c:"佛言：爱欲莫甚于色，色之为欲，其大无外。\n人怀爱欲，不见道者，譬如澄水，致手搅之，众人共临，无有睹其影者。"}
]);
enrich("地藏菩萨本愿经",[
{n:1,t:"忉利天宫神通品",c:"地藏菩萨……以神通力，现声闻像。\n是时，十方无量世界，不可说不可说一切诸佛及大菩萨摩诃萨，皆来集会。"},
{n:2,t:"利益存亡品",c:"若有男子女人，在生不修善因，多造众罪。命终之后，眷属小大，为造福利一切圣事，七分之中而乃获一，六分功德生者自利。\n是故未来现在善男女等，闻健自修，分分己获。"}
]);

})();

<script>
// ===== 儒释道典籍补全二 (2026-08-31) =====
(function(){
if(typeof BOOKS_DATA==="undefined")return;
function byName(n){for(var i=0;i<BOOKS_DATA.length;i++){if(BOOKS_DATA[i].name&&BOOKS_DATA[i].name["zh-CN"]===n)return BOOKS_DATA[i];}return null;}
function enrich(n,chs){var b=byName(n);if(!b)return;b.chapters={"zh-CN":chs};b.totalChapters=chs.length;}

// —— 佛家 ——
enrich("药师经",[
{n:1,t:"十二大愿（节选）",c:"第一大愿：愿我来世得阿耨多罗三藐三菩提时，自身光明炽然，照耀无量无数无边世界。\n第二大愿：愿我来世得菩提时，身如琉璃，内外明彻，净无瑕秽，光明广大。\n第七大愿：愿我来世得菩提时，若诸有情，众病逼切，无救无归，无医无药，我之名号一经其耳，众病悉除，身心安乐。"}
]);
enrich("无量寿经",[
{n:1,t:"四十八愿（节选）",c:"设我得佛，国有地狱、饿鬼、畜生者，不取正觉。\n设我得佛，十方众生，至心信乐，欲生我国，乃至十念，若不生者，不取正觉。\n设我得佛，国中天人，寿命无能限量。除其本愿，修短自在，若不尔者，不取正觉。"}
]);
enrich("观无量寿经",[
{n:1,t:"是心作佛",c:"诸佛如来是法界身，入一切众生心想中。是故汝等心想佛时，是心即是三十二相、八十随形好。是心作佛，是心是佛。"}
]);
enrich("维摩诘经",[
{n:1,t:"不思议品",c:"以须弥之高广，内芥子中，无所增减。须弥山王本相如故，而四天王、忉利诸天，不觉不知己之所入。\n是时，维摩诘默然无言。文殊师利叹曰：善哉善哉，乃至无有文字语言，是真入不二法门。"}
]);
enrich("华严经",[
{n:1,t:"入法界品",c:"善财童子五十三参，历事善知识。\n若人欲了知，三世一切佛，应观法界性，一切唯心造。"}
]);
enrich("楞伽经",[
{n:1,t:"心性",c:"心生则种种法生，心灭则种种法灭。\n佛语心为宗，无门为法门。"}
]);
enrich("大乘起信论",[
{n:1,t:"一心二门",c:"依一心法，有二种门。云何为二？一者心真如门，二者心生灭门。是二种门，皆各总摄一切法。\n一切众生，从本已来，自性清净。"}
]);
enrich("八大人觉经",[
{n:1,t:"八大人觉",c:"第一觉悟：世间无常，国土危脆；四大苦空，五阴无我。\n第二觉知：多欲为苦；生死疲劳，从贪欲起。\n第八觉知：生死炽然，苦恼无量，发大乘心，普济一切。"}
]);
enrich("百喻经",[
{n:1,t:"愚人食盐喻",c:"昔有愚人，至于他家。主人与食，嫌淡无味。主人闻已，更为益盐。既得盐美，便自念言：所以美者，缘有盐故。……愚人无智，便空食盐。食已口爽，返为其患。"}
]);
enrich("梵网经",[
{n:1,t:"心地法门",c:"一切众生，皆有佛性。一切有心者，皆应摄佛戒。\n众生受佛戒，即入诸佛位。"}
]);
enrich("解深密经",[
{n:1,t:"胜义谛",c:"阿陀那识甚深细，一切种子如瀑流。我于凡愚不开演，恐彼分别执为我。"}
]);
enrich("唯识三十论颂",[
{n:1,t:"万法唯识",c:"由假说我法，有种种相转。彼依识所变，此能变唯三。\n是诸识转变，分别所分别，由此彼皆无，故一切唯识。"}
]);

// —— 道家 ——
enrich("淮南子",[
{n:1,t:"原道训",c:"道者，覆天载地，廓四方，柝八极，高不可际，深不可测。\n是故达于道者，反于清静；究于物者，终于无为。"},
{n:2,t:"塞翁失马",c:"近塞上之人，有善术者，马无故亡而入胡。人皆吊之，其父曰：此何遽不为福乎？居数月，其马将胡骏马而归。……故福之为祸，祸之为福，化不可极，深不可测也。"}
]);
enrich("抱朴子",[
{n:1,t:"论仙",c:"我命在我不在天，还丹成金亿万年。\n凡人之为仙者，皆志行修洁，务守恬淡。"},
{n:2,t:"微旨",c:"欲求长生者，必欲积善立功，慈心于物。……行善不怠，必得吉报。"}
]);
enrich("坐忘论",[
{n:1,t:"坐忘",c:"夫心者，一身之主，百神之帅。静则生慧，动则成昏。\n堕肢体，黜聪明，离形去知，同于大通，此谓坐忘。"}
]);
enrich("周易参同契",[
{n:1,t:"丹道",c:"乾坤者，易之门户，众卦之父母。坎离匡廓，运毂正轴。\n天地设位，而易行乎其中矣。"}
]);
enrich("黄庭经",[
{n:1,t:"内景",c:"上清紫霞虚皇前，太上大道玉晨君。\n琴心三叠舞胎仙，九气英明出霄间。"}
]);
enrich("悟真篇",[
{n:1,t:"丹诀",c:"学仙须是学天仙，惟有金丹最的端。\n二物会时情性合，五行全处虎龙蟠。"}
]);
enrich("文子",[
{n:1,t:"道原",c:"夫道者，德之元，天之根，福之门，万物待之而生，待之而成。\n故圣人以无为而治，静默恬淡。"}
]);

// —— 儒家 ——
enrich("孔子家语",[
{n:1,t:"观周",c:"孔子观乎明堂，睹四门墉，有尧舜之容、桀纣之象。\n孔子谓南宫敬叔曰：吾闻老聃博古知今，通礼乐之原，明道德之归，则吾师也，今将往矣。"},
{n:2,t:"儒行解",c:"儒有可亲而不可劫也，可近而不可迫也，可杀而不可辱也。"}
]);
enrich("大学衍义",[
{n:1,t:"格物致知",c:"《大学》之要，在格物致知，诚意正心。……物格而后知至，知至而后意诚，意诚而后心正，心正而后身修。"}
]);
enrich("近思录",[
{n:1,t:"为学",c:"涵养须用敬，进学则在致知。\n为学大益，在自求变化气质。"}
]);
enrich("朱子语类",[
{n:1,t:"读书法",c:"读书之法，在循序而渐进，熟读而精思。\n大抵观书，须先熟读，使其言皆若出于吾之口；继以精思，使其意皆若出于吾之心。"}
]);
enrich("张子正蒙",[
{n:1,t:"太和",c:"太虚无形，气之本体；其聚其散，变化之客形尔。\n为天地立心，为生民立命，为往圣继绝学，为万世开太平。"}
]);
enrich("二程遗书",[
{n:1,t:"天理",c:"天理与人欲相对。……存天理，灭人欲。\n父子君臣，天下之定理，无所逃于天地之间。"}
]);
enrich("阳明全书",[
{n:1,t:"答顾东桥书",c:"夫学贵得之心。求之于心而非也，虽其言之出于孔子，不敢以为是也。\n心即理也，此心无私欲之蔽，即是天理。"}
]);
enrich("日知录",[

enrich("女诫",[

{n:2,t:"妇行 · 专心",c:"妇有四行：一曰妇德，二曰妇言，三曰妇容，四曰妇功。……《礼》：夫有再娶之义，妇无二适之文。故曰：夫者天也，天固不可逃，夫固不可离也。"},
{n:3,t:"曲从 · 和叔妹",c:"舅姑之心，岂当可失哉？……求叔妹之心，固莫尚于谦顺矣。谦则德之柄，顺则妇之行。"}
]);
enrich("女论语",[
{n:1,t:"立身 · 学作 · 学礼",c:"凡为女子，先学立身。立身之法，惟务清贞。清则身洁，贞则身荣。\n行莫回头，语莫掀唇。坐莫动膝，立莫摇裙。\n凡为女子，须学女工。勿麻缉苎，粗细不同。……凡为女子，当知礼数。女客相过，安排坐具。"}
]);
enrich("内训",[
{n:1,t:"内训",c:"女德有常，不逾贞信；妇德有常，不逾孝敬。\n贞静幽闲，端庄诚一，女子之德性也。孝敬仁明，慈和柔顺，德性备矣。"}
]);
enrich("蒙求",[
{n:1,t:"蒙求",c:"王戎简要，裴楷清通。孔明卧龙，吕望非熊。\n杨震关西，丁宽易东。谢安高洁，王导公忠。\n匡衡凿壁，孙敬闭户。郅都苍鹰，宁成乳虎。"}
]);
enrich("太公家教",[
{n:1,t:"太公家教",c:"一日为师，终身为父。弟子事师，敬同于父。\n习其道也，学其言语。黄金白玉，不如师之教言。\n一日不读，便觉面目可憎。"}
]);
enrich("四方华语",[
{n:1,t:"四方华语",c:"集四方谚语、俗语以教童蒙，劝学劝善，明白如话。\n千里之行，始于足下；不积跬步，无以至千里。\n良药苦口利于病，忠言逆耳利于行。"}
]);
enrich("小学诗礼",[
{n:1,t:"小学诗礼",c:"诗言志，礼立身。童子入学，先习洒扫、应对、进退之节。\n不学诗，无以言；不学礼，无以立。\n蒙以养正，圣功也。"}
]);
enrich("增广贤文",[
{n:1,t:"劝学明理",c:"昔时贤文，诲汝谆谆。集韵增广，多见多闻。\n观今宜鉴古，无古不成今。知己知彼，将心比心。\n酒逢知己饮，诗向会人吟。相识满天下，知心能几人。"},
{n:2,t:"处世警句",c:"相逢好似初相识，到老终无怨恨心。\n近水知鱼性，近山识鸟音。易涨易退山溪水，易反易覆小人心。\n运去金成铁，时来铁似金。读书须用意，一字值千金。"}
]);

enrichEn("弟子规",[
{n:1,t:"General Principles",c:"The Standards for Students are the teachings of the sages: first filial piety and fraternal duty, then sincerity and trustworthiness; love all broadly, draw near to the humane; with energy to spare, study the classics."},
{n:2,t:"Filial Piety at Home",c:"When parents call, answer promptly; when parents command, act without laziness; when parents teach, listen respectfully; when parents reprove, accept obediently."},
{n:3,t:"Trust and Love",c:"Whatever you say, let trust come first; deceit and falsehood, how can they be tolerated? Speak the truth, not flattery; love all people as the same sky covers and the same earth bears."}
]);
enrichEn("三字经",[
{n:1,t:"On Education",c:"Men at birth are naturally good; their natures are alike, their habits become different. If not educated, their nature changes; the way of education lies in devotion."},
{n:2,t:"On Filial Duty",c:"As jade uncut will not form a vessel, so man without learning will not know the Way. Be filial to parents, respectful to elders; first learn courtesy and rightness."}
]);
enrichEn("增广贤文",[
{n:1,t:"On Learning and Prudence",c:"The wise sayings of old teach earnestly: to judge today, examine the past; without the past there is no present. Know yourself and know others; compare hearts with hearts."}
]);
enrichEn("小儿语",[
{n:1,t:"Children's Sayings",c:"In all your words and deeds, be composed; nine mistakes in ten come from haste. Stand and speak with composure; do not be frivolous and invite ridicule."}
]);
enrichEn("女诫",[
{n:1,t:"On Humility and Respect",c:"A woman should be humble and gentle, respectful and compliant. The Way of husband and wife joins yin and yang, reaches the spirits, and is the great bond of human relations."}
]);

var SOLAR_TERMS=[["小寒","1月6日","❄️","三候：雁北乡、鹊始巢、雉始雊","羊肉、核桃、桂圆，温补御寒","早睡晚起，护好头颈腰膝","小寒连大吕，欢鹊垒新巢。"],["大寒","1月20日","🥶","三候：鸡始乳、征鸟厉疾、水泽腹坚","进补收尾，少食寒凉生冷","防风御寒，泡脚暖身","大寒宜近火，无事莫开门。"],["立春","2月4日","🌱","三候：东风解冻、蛰虫始振、鱼陟负冰","春卷、萝卜、韭菜，宜辛甘发散","舒展身心，舒畅肝气","东风带雨逐西风，大地阳和暖气生。"],["雨水","2月19日","🌧️","三候：獭祭鱼、候雁北、草木萌动","山药、薏米、小米，健脾祛湿","春捂防寒，护好脾胃","好雨知时节，当春乃发生。"],["惊蛰","3月6日","🐛","三候：桃始华、仓庚鸣、鹰化为鸠","梨、枇杷，清淡润肺","早睡早起，动起来舒筋活络","微雨众卉新，一雷惊蛰始。"],["春分","3月21日","🌸","三候：玄鸟至、雷乃发声、始电","时令蔬菜、豆芽，平补阴阳","平调阴阳，忌大热大寒","春分雨脚落声微，柳岸斜风带客归。"],["清明","4月5日","🪁","三候：桐始华、田鼠化为鴽、虹始见","青团、荠菜、春笋，清淡养肝","踏青舒展，情志平和","清明时节雨纷纷，路上行人欲断魂。"],["谷雨","4月20日","🌾","三候：萍始生、鸣鸠拂羽、戴胜降于桑","谷雨茶、香椿、豆制品","健脾祛湿，防春困","谷雨如丝复似尘，煮瓶浮蜡正尝新。"],["立夏","5月6日","☀️","三候：蝼蝈鸣、蚯蚓出、王瓜生","清淡为主，蛋、豆、苦味养心","养心护阳，适当午休","绿树阴浓夏日长，楼台倒影入池塘。"],["小满","5月21日","🌿","三候：苦菜秀、靡草死、麦秋至","苦菜、绿豆、冬瓜，清热利湿","防湿热，勿贪凉","最爱垄头麦，迎风笑落红。"],["芒种","6月6日","🌾","三候：螳螂生、鵙始鸣、反舌无声","酸梅汤、绿豆、莲子，清热生津","午休养神，静心防躁","时雨及芒种，四野皆插秧。"],["夏至","6月21日","🔆","三候：鹿角解、蜩始鸣、半夏生","面条、绿豆汤、西瓜，清淡补水","养心静气，忌过度贪凉","昼晷已云极，宵漏自此长。"],["小暑","7月7日","🌞","三候：温风至、蟋蟀居宇、鹰始鸷","莲藕、绿豆、苦瓜，清热祛暑","防暑祛湿，勿暴晒","倏忽温风至，因循小暑来。"],["大暑","7月23日","🥵","三候：腐草为萤、土润溽暑、大雨时行","苦瓜、冬瓜、凉茶，清暑益气","防中暑，及时补水","赤日几时过，清风无处寻。"],["立秋","8月8日","🍂","三候：凉风至、白露降、寒蝉鸣","梨、百合、蜂蜜，滋阴润燥","收敛神气，早卧早起","云天收夏色，木叶动秋声。"],["处暑","8月23日","🍁","三候：鹰乃祭鸟、天地始肃、禾乃登","鸭子、银耳、蜂蜜，润燥养肺","防秋燥，早睡防乏","离离暑云散，袅袅凉风起。"],["白露","9月8日","💧","三候：鸿雁来、玄鸟归、群鸟养羞","梨、蜂蜜、白露茶，润肺生津","防燥，早晚添衣","蒹葭苍苍，白露为霜。"],["秋分","9月23日","🍂","三候：雷始收声、蛰虫坯户、水始涸","时令果蔬，平补阴阳","早睡早起，收敛神气","秋分客尚在，竹露夕微微。"],["寒露","10月8日","🌫️","三候：鸿雁来宾、雀入大水为蛤、菊有黄华","芝麻、蜂蜜、菊花茶，润燥","防寒凉，暖足护颈","袅袅凉风动，凄凄寒露零。"],["霜降","10月23日","🍁","三候：豺乃祭兽、草木黄落、蛰虫咸俯","柿子、栗子、山药，平补润肺","防寒保暖，防呼吸道不适","霜降水返壑，风落木归山。"],["立冬","11月7日","❄️","三候：水始冰、地始冻、雉入大水为蜃","饺子、羊肉、萝卜，温补藏精","早睡晚起，护阳防寒","秋风吹尽旧庭柯，黄叶丹枫客里过。"],["小雪","11月22日","🌨️","三候：虹藏不见、天气上升、闭塞成冬","腊味、糍粑、核桃，温补暖身","保暖防郁，多晒太阳","花雪随风不厌看，更多还肯失林峦。"],["大雪","12月7日","⛄","三候：鹖鴠不鸣、虎始交、荔挺出","羊肉、大枣、桂圆，进补御寒","早卧晚起，静养藏神","千山鸟飞绝，万径人踪灭。"],["冬至","12月22日","🥟","三候：蚯蚓结、麋角解、水泉动","饺子、汤圆、羊肉，温补养阳","静养藏精，护好阳气","天时人事日相催，冬至阳生春又来。"]];
var DAILY_WORDS=[{zh:"少则得，多则惑。",s:"老子",n:"少即是多，给生活做减法",en:"Less brings gain; more brings confusion.",es:"Con menos se gana; con más se confunde.",pt:"Com menos se ganha; com mais se confunde."},{zh:"致虚极，守静笃。",s:"老子",n:"心静下来，才能看清自己",en:"Reach the utmost emptiness; hold fast to stillness.",es:"Alcanza el vacío supremo; mantén la quietud.",pt:"Alcance o vazio supremo; mantenha a quietude."},{zh:"知止而后有定。",s:"大学",n:"先停下来，方向自然清晰",en:"Knowing where to stop, one becomes settled.",es:"Sabiendo dónde detenerse, uno se serena.",pt:"Sabendo onde parar, a pessoa se firma."},{zh:"己所不欲，勿施于人。",s:"孔子",n:"换位思考，化解人际内耗",en:"Do not do to others what you would not wish done to you.",es:"No hagas a otros lo que no quieras que te hagan.",pt:"Não faça aos outros o que não quer que lhe façam."},{zh:"知其不可奈何而安之若命。",s:"庄子",n:"接受不能改变的，专注能改变的",en:"Accept what cannot be changed as destiny, and be at peace.",es:"Acepta como destino lo que no se puede cambiar, y vive en paz.",pt:"Aceite como destino o que não se pode mudar, e viva em paz."},{zh:"本来无一物，何处惹尘埃。",s:"六祖",n:"别让心被琐事蒙尘",en:"Originally there is nothing; where could dust alight?",es:"Originariamente no hay nada; ¿dónde podría posarse el polvo?",pt:"Originalmente não há nada; onde a poeira poderia pousar?"},{zh:"一蓑烟雨任平生。",s:"苏轼",n:"风雨人生，从容走过",en:"In a straw cloak, face life's wind and rain with ease.",es:"Con una capa de paja, afronta con calma el viento y la lluvia de la vida.",pt:"Com uma capa de palha, encare com calma o vento e a chuva da vida."},{zh:"莫等闲，白了少年头。",s:"岳飞",n:"珍惜当下，不虚度光阴",en:"Do not idle away—youth's hair turns white too soon.",es:"No dejes pasar el tiempo en vano; las sienes encanecen pronto.",pt:"Não desperdice o tempo; os cabelos da juventude logo embranquecem."},{zh:"君子坦荡荡，小人长戚戚。",s:"孔子",n:"坦荡做人，远离焦虑",en:"The noble person is broad-minded; the petty is always anxious.",es:"La persona noble es serena; la mezquina vive angustiada.",pt:"A pessoa nobre é serena; a mesquinha vive angustiada."},{zh:"无用之用，方为大用。",s:"庄子",n:"慢下来，别只盯着有用",en:"The use of the useless is the greatest use.",es:"La utilidad de lo inútil es la mayor utilidad.",pt:"A utilidade do inútil é a maior utilidade."},{zh:"上善若水，水善利万物而不争。",s:"老子",n:"不争之争，最是滋养",en:"The highest good is like water, benefiting all without contention.",es:"El bien supremo es como el agua, que beneficia a todo sin contender.",pt:"O bem supremo é como a água, que beneficia a todos sem contender."},{zh:"天行健，君子以自强不息。",s:"周易",n:"自立自强，日日精进",en:"As Heaven moves with vigor, the noble one keeps strengthening without cease.",es:"Como el cielo se mueve con vigor, el noble se fortalece sin cesar.",pt:"Como o céu se move com vigor, o sábio se fortalece sem cessar."},{zh:"地势坤，君子以厚德载物。",s:"周易",n:"厚道包容，承载万物",en:"As Earth is broad, the noble one carries all things with deep virtue.",es:"Como la tierra es amplia, el noble sostiene todo con gran virtud.",pt:"Como a terra é ampla, o sábio sustenta tudo com grande virtude."},{zh:"大学之道，在明明德。",s:"大学",n:"先点亮内心的光明",en:"The Way of great learning lies in illuminating bright virtue.",es:"El Camino del gran saber consiste en iluminar la virtud brillante.",pt:"O Caminho do grande aprendizado está em iluminar a virtude brilhante."},{zh:"博学之，审问之，慎思之，明辨之，笃行之。",s:"中庸",n:"学思行并重",en:"Learn broadly, inquire deeply, think carefully, discern clearly, practice earnestly.",es:"Aprende con amplitud, indaga, reflexiona, discierne y practica con diligencia.",pt:"Aprenda com amplitude, indague, reflita, discirna e pratique com diligência."},{zh:"穷则独善其身，达则兼济天下。",s:"孟子",n:"进退皆有担当",en:"In hardship, cultivate yourself; in success, benefit the world.",es:"En la adversidad, cultívate; en el éxito, beneficia al mundo.",pt:"Na adversidade, cultive-se; no sucesso, beneficie o mundo."},{zh:"吾日三省吾身。",s:"曾子",n:"每日回望，及时修正",en:"Each day I examine myself three times.",es:"Cada día me examino a mí mismo tres veces.",pt:"Todos os dias eu me examino três vezes."},{zh:"采菊东篱下，悠然见南山。",s:"陶渊明",n:"心远地自偏",en:"Picking chrysanthemums by the eastern hedge, I gaze at the southern hills.",es:"Recogiendo crisantemos junto al seto este, contemplo las colinas del sur.",pt:"Colhendo crisântemos junto à cerca leste, contemplo as colinas do sul."},{zh:"行到水穷处，坐看云起时。",s:"王维",n:"绝境亦有风景",en:"Walk to where the water ends, and sit to watch clouds rise.",es:"Camina hasta donde termina el agua y siéntate a ver surgir las nubes.",pt:"Caminhe até onde a água termina e sente-se para ver as nuvens surgirem."},{zh:"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",s:"苏轼",n:"从容面对风雨",en:"With a bamboo staff and straw sandals, lighter than a horse—who fears the wind and rain of life?",es:"Con bastón de bambú y sandalias de paja, más ligero que un caballo, ¿quién teme al viento y la lluvia de la vida?",pt:"Com cajado de bambu e sandálias de palha, mais leve que um cavalo—quem teme o vento e a chuva da vida?"}];
