<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>华夏文脉</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun","Times New Roman",serif;background:#f5f0e8;color:#2c1810;line-height:1.7;overflow-x:hidden;min-height:100vh}
a{color:#8B0000;text-decoration:none;transition:color .2s}
a:hover{color:#c9a84c}
.container{max-width:1200px;margin:0 auto;padding:0 1.5rem}
/* ===== Top Bar ===== */
.top-bar{background:#1a1008;color:#c4b5a0;font-size:.78rem;padding:.3rem 0}
.top-bar-inner{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.3rem}
.lang-switch{display:flex;gap:.2rem}
.lang-btn{background:0 0;border:1px solid #5c4a38;color:#c4b5a0;padding:.15rem .5rem;border-radius:3px;cursor:pointer;font-size:.72rem;transition:all .2s;font-family:inherit}
.lang-btn:hover{border-color:#c9a84c;color:#f5f0e8}
.lang-btn.active{background:#c9a84c;color:#1a1008;border-color:#c9a84c}
.top-bar-user{display:flex;gap:.6rem;align-items:center}
.top-bar-user a{color:#c4b5a0;font-size:.75rem}
.top-bar-user a:hover{color:#c9a84c}
.top-bar-user .credits-badge{color:#c9a84c;font-weight:600}
/* ===== Sticky Nav ===== */
.sticky-nav{position:sticky;top:0;z-index:100;background:rgba(245,240,232,0.95);backdrop-filter:blur(8px);border-bottom:1px solid #d4c9b8}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:52px;padding:0 1.5rem;gap:.3rem}
.nav-brand{font-weight:700;color:#8B0000;font-size:1.05rem;white-space:nowrap;letter-spacing:.1em;cursor:pointer;flex-shrink:0;margin-right:.5rem}
.nav-link{flex-shrink:0;padding:.35rem .65rem;cursor:pointer;font-size:.82rem;color:#5c4a38;border-radius:4px;transition:all .2s;white-space:nowrap;border:0;background:0 0;font-family:inherit}
.nav-link:hover{background:#e8ddd0;color:#8B0000}
.nav-link.active{background:#8B0000;color:#f5f0e8}
.nav-spacer{flex:1}
/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c1810,#4a2c1a 40%,#5c3a28 70%,#2c1810);color:#f5f0e8;text-align:center;padding:3rem 1.5rem}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(200,168,76,0.08) 0,transparent 60%),radial-gradient(ellipse at 70% 60%,rgba(139,0,0,.1) 0,transparent 50%);pointer-events:none}
.hero-pattern{position:absolute;inset:0;opacity:.04;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero-content{position:relative;z-index:1;max-width:800px}
.hero-icon{font-size:3.2rem;margin-bottom:.3rem;opacity:.9}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;letter-spacing:.15em;margin-bottom:.6rem;background:linear-gradient(135deg,#f5f0e8,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(.9rem,2vw,1.3rem);letter-spacing:.3em;color:#e8ddd0;margin-bottom:.8rem}
.hero-desc{font-size:clamp(.85rem,1.6vw,1rem);color:#c4b5a0;max-width:620px;margin:0 auto 2rem;line-height:1.8;letter-spacing:.05em}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hero-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.6rem;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .25s;border:0;font-family:inherit;letter-spacing:.05em}
.hero-btn-primary{background:#c9a84c;color:#2c1810}
.hero-btn-primary:hover{background:#d4b85c;transform:translateY(-1px)}
.hero-btn-secondary{background:0 0;border:1px solid #c9a84c;color:#c9a84c}
.hero-btn-secondary:hover{background:rgba(201,168,76,.1);transform:translateY(-1px)}
.hero-scroll{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;color:#c4b5a0;font-size:.75rem;letter-spacing:.1em;cursor:pointer;animation:floatDown 2s ease-in-out infinite}
@keyframes floatDown{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}
.hero-scroll svg{width:22px;height:22px;stroke:#c4b5a0;fill:none;stroke-width:2}
/* ===== Page Sections ===== */
.page{display:none;padding:2.5rem 1.5rem 4rem}
.page.active{display:block}
.page-title{text-align:center;margin-bottom:2.5rem}
.page-title h2{font-size:clamp(1.4rem,3vw,2rem);color:#2c1810;letter-spacing:.12em;display:inline-block}
.page-title h2::after{content:'';display:block;width:50px;height:2px;background:linear-gradient(90deg,#c9a84c,#8B0000);margin:.5rem auto 0}
.page-title p{color:#7a6a5a;margin-top:.4rem;font-size:.9rem}
/* ===== Timeline ===== */
.timeline-page .timeline{position:relative;padding:1rem 0 2rem;max-width:800px;margin:0 auto}
.timeline-page .timeline::before{content:'';position:absolute;left:28px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#c9a84c,#8B0000,#c9a84c)}
.timeline-page .tl-item{position:relative;padding:0 0 2.5rem 68px;cursor:pointer;transition:opacity .3s}
.timeline-page .tl-item:last-child{padding-bottom:0}
.timeline-page .tl-dot{position:absolute;left:18px;top:4px;width:22px;height:22px;border-radius:50%;background:#f5f0e8;border:3px solid #8B0000;z-index:2;transition:all .3s;display:flex;align-items:center;justify-content:center}
.timeline-page .tl-dot::after{content:'';width:8px;height:8px;border-radius:50%;background:#8B0000;transition:all .3s}
.timeline-page .tl-item:hover .tl-dot,.tl-item.active .tl-dot{background:#8B0000;border-color:#8B0000;transform:scale(1.15)}
.timeline-page .tl-item:hover .tl-dot::after,.tl-item.active .tl-dot::after{background:#c9a84c}
.timeline-page .tl-year{font-size:.78rem;color:#8B0000;font-weight:700;letter-spacing:.05em;margin-bottom:.1rem}
.timeline-page .tl-name{font-size:1.25rem;font-weight:700;color:#2c1810;margin-bottom:.05rem;letter-spacing:.08em}
.timeline-page .tl-sub{font-size:.82rem;color:#7a6a5a;margin-bottom:.3rem}
.timeline-page .tl-preview{font-size:.85rem;color:#5c4a38;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.timeline-page .tl-body{display:none;margin-top:.6rem;padding:.8rem 1rem;background:#e8ddd0;border-radius:8px;border-left:3px solid #8B0000;animation:fadeIn .3s ease}
.timeline-page .tl-item.active .tl-body{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.tl-body h4{color:#8B0000;font-size:.9rem;margin:.5rem 0 .25rem}
.tl-body h4:first-child{margin-top:0}
.tl-body p,.tl-body li{font-size:.85rem;color:#3a2a1e;line-height:1.65}
.tl-body ul{padding-left:1.2rem;list-style:none}
.tl-body ul li::before{content:'\25C6 ';color:#c9a84c;font-size:.65rem}
/* ===== Stats ===== */
.stats{background:#2c1810;color:#f5f0e8;padding:2.5rem 1.5rem;text-align:center}
.stats-inner{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1.5rem}
.stat-item{font-size:1.6rem;font-weight:700}
.stat-item span{display:block;font-size:.82rem;font-weight:400;color:#c4b5a0;margin-top:.25rem;letter-spacing:.1em}
.stat-item .num{color:#c9a84c}
/* ===== Books ===== */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.book-card{background:#fffefb;border:1px solid #e0d5c8;border-radius:8px;padding:1rem 1.2rem 1.6rem;transition:all .25s;cursor:pointer;position:relative}
.book-card:hover{border-color:#c9a84c;box-shadow:0 4px 16px rgba(44,24,16,.08);transform:translateY(-2px)}
.book-card h4{color:#8B0000;font-size:.95rem;margin-bottom:.2rem}
.book-card .bc-meta{font-size:.75rem;color:#7a6a5a;display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem}
.book-card .bc-meta span{border:1px solid #d4c9b8;padding:0 .4rem;border-radius:3px}
.book-card p{font-size:.83rem;color:#5c4a38;line-height:1.55}
.book-card .bc-tags{margin-top:.4rem}
.book-card .bc-tags .tag{display:inline-block;padding:.05rem .4rem;font-size:.72rem;background:#f5f0e8;border:1px solid #c9a84c;border-radius:3px;color:#5c4a38;margin:.1rem}
.book-card .bc-lock{position:absolute;top:.6rem;right:.6rem;color:#c9a84c;font-size:.8rem}
.book-card .bc-lock.free{color:#5c4a38}
/* ===== Book Detail / Reader ===== */
.reader-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.reader-header h2{font-size:1.5rem;color:#2c1810;letter-spacing:.08em}
.reader-header .rh-meta{display:flex;gap:.6rem;flex-wrap:wrap;color:#7a6a5a;font-size:.85rem}
.reader-header .rh-meta span{border:1px solid #d4c9b8;padding:0 .5rem;border-radius:4px}
.reader-access-info{background:#fff8e0;border:1px solid #c9a84c;border-radius:8px;padding:.8rem 1rem;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.reader-access-info span{font-size:.85rem;color:#5c4a38}
.reader-access-info .btn-buy{background:#c9a84c;color:#2c1810;border:0;padding:.4rem 1rem;border-radius:4px;cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;transition:all .2s}
.reader-access-info .btn-buy:hover{background:#d4b85c}
.reader-chapter-list{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1.5rem}
.reader-chapter{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;background:#fffefb;border:1px solid #e0d5c8;border-radius:6px;cursor:pointer;transition:all .2s;font-size:.85rem}
.reader-chapter:hover{border-color:#c9a84c;background:#fff8e0}
.reader-chapter .ch-lock{color:#c9a84c;font-size:.8rem;flex-shrink:0}
.reader-chapter .ch-lock.unlocked{color:#5c4a38}
.reader-chapter .ch-num{color:#7a6a5a;flex-shrink:0;min-width:2rem;font-size:.78rem}
.reader-chapter .ch-title{flex:1;color:#2c1810}
.reader-chapter.locked{opacity:.5;cursor:not-allowed}
.reader-chapter.locked:hover{background:#fffefb;border-color:#e0d5c8}
.reader-chapter.active{background:#8B0000;border-color:#8B0000}
.reader-chapter.active .ch-title,.reader-chapter.active .ch-num{color:#f5f0e8}
.reader-chapter.active .ch-lock{color:#f5f0e8}
.reader-content{background:#fffefb;border:1px solid #e0d5c8;border-radius:8px;padding:1.5rem;margin-top:1rem;animation:fadeIn .3s ease}
.reader-content h3{color:#8B0000;font-size:1.1rem;margin-bottom:.6rem;text-align:center}
.reader-content .chapter-text{font-size:.95rem;line-height:2;color:#2c1810;white-space:pre-wrap}
.reader-lang-select{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.reader-lang-select .lang-opt{padding:.25rem .6rem;border:1px solid #d4c9b8;border-radius:4px;cursor:pointer;font-size:.78rem;background:#fffefb;transition:all .2s;font-family:inherit}
.reader-lang-select .lang-opt:hover{border-color:#c9a84c}
.reader-lang-select .lang-opt.active{background:#8B0000;color:#f5f0e8;border-color:#8B0000}
.reader-lang-select .lang-opt.locked{opacity:.4;cursor:not-allowed;position:relative}
/* ===== Auth Modal ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:#f5f0e8;border-radius:12px;padding:2rem;width:100%;max-width:420px;position:relative;animation:fadeIn .25s ease;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:.8rem;right:1rem;background:0 0;border:0;font-size:1.3rem;color:#7a6a5a;cursor:pointer}
.modal h3{font-size:1.2rem;text-align:center;color:#2c1810;margin-bottom:1.2rem;letter-spacing:.1em}
.form-group{margin-bottom:.8rem}
.form-group label{display:block;font-size:.82rem;color:#5c4a38;margin-bottom:.25rem}
.form-group input,.form-group select{width:100%;padding:.55rem .8rem;border:1px solid #d4c9b8;border-radius:6px;font-size:.88rem;font-family:inherit;background:#fffefb;color:#2c1810;transition:border .2s}
.form-group input:focus{outline:0;border-color:#c9a84c}
.form-group .error{color:#8B0000;font-size:.75rem;margin-top:.15rem}
.btn-primary,.btn-secondary{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1.4rem;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;border:0;font-family:inherit}
.btn-primary{background:#8B0000;color:#f5f0e8}
.btn-primary:hover{background:#a00000}
.btn-secondary{background:#e8ddd0;color:#5c4a38}
.btn-secondary:hover{background:#d4c9b8}
.btn-sm{padding:.35rem .9rem;font-size:.78rem}
.form-footer{text-align:center;margin-top:1rem;font-size:.82rem;color:#7a6a5a}
.form-footer a{color:#8B0000;cursor:pointer}
.form-footer a:hover{text-decoration:underline}
.form-toggle{color:#8B0000;cursor:pointer;font-weight:600}
.form-toggle:hover{text-decoration:underline}
.form-message{padding:.5rem .8rem;border-radius:6px;margin-bottom:.8rem;font-size:.82rem;display:none}
.form-message.error{display:block;background:#ffe0e0;border:1px solid #ff6b6b;color:#8B0000}
.form-message.success{display:block;background:#e0ffe0;border:1px solid #6bff6b;color:#2a5c2a}
.form-message.info{display:block;background:#e0f0ff;border:1px solid #6baaff;color:#0055a0}
/* ===== Shop ===== */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.shop-card{background:#fffefb;border:1px solid #e0d5c8;border-radius:8px;overflow:hidden;transition:all .25s}
.shop-card:hover{border-color:#c9a84c;box-shadow:0 4px 16px rgba(44,24,16,.08);transform:translateY(-2px)}
.shop-card .sc-img{height:160px;background:#e8ddd0;display:flex;align-items:center;justify-content:center;font-size:3rem}
.shop-card .sc-body{padding:.8rem 1rem 1rem}
.shop-card .sc-body h4{font-size:.9rem;color:#2c1810;margin-bottom:.2rem}
.shop-card .sc-body .sc-cat{font-size:.72rem;color:#7a6a5a;margin-bottom:.3rem}
.shop-card .sc-body .sc-desc{font-size:.8rem;color:#5c4a38;line-height:1.5;margin-bottom:.4rem}
.shop-card .sc-body .sc-price{font-size:1rem;font-weight:700;color:#8B0000;margin-bottom:.4rem}
.shop-card .sc-body .sc-price .sc-points{font-size:.75rem;color:#7a6a5a;font-weight:400}
.shop-btn{background:#c9a84c;border:0;padding:.35rem 1rem;border-radius:4px;cursor:pointer;font-size:.8rem;font-weight:600;font-family:inherit;color:#2c1810;transition:all .2s}
.shop-btn:hover{background:#d4b85c}
.shop-filter{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;justify-content:center}
.shop-filter button{padding:.3rem .8rem;border:1px solid #d4c9b8;border-radius:4px;cursor:pointer;font-size:.78rem;background:#fffefb;transition:all .2s;font-family:inherit;color:#5c4a38}
.shop-filter button:hover{border-color:#c9a84c}
.shop-filter button.active{background:#8B0000;color:#f5f0e8;border-color:#8B0000}
/* ===== Credits / Account ===== */
.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-top:1rem}
.account-card{background:#fffefb;border:1px solid #e0d5c8;border-radius:8px;padding:1.2rem}
.account-card h4{color:#8B0000;font-size:.95rem;margin-bottom:.4rem}
.account-card p{font-size:.84rem;color:#5c4a38;line-height:1.5}
.credit-balance{text-align:center;padding:1.5rem;background:#fff8e0;border:1px solid #c9a84c;border-radius:8px;margin-bottom:1rem}
.credit-balance .cb-num{font-size:2.5rem;font-weight:700;color:#c9a84c}
.credit-balance .cb-label{font-size:.85rem;color:#7a6a5a;margin-top:.2rem}
.credit-packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}
.credit-pkg{background:#fffefb;border:2px solid #e0d5c8;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;transition:all .25s}
.credit-pkg:hover{border-color:#c9a84c;transform:translateY(-2px)}
.credit-pkg.recommended{border-color:#c9a84c;background:#fff8e0}
.credit-pkg .cp-credits{font-size:1.6rem;font-weight:700;color:#8B0000}
.credit-pkg .cp-price{font-size:.9rem;color:#7a6a5a;margin:.3rem 0}
.credit-pkg .cp-btn{margin-top:.5rem}
.credit-pkg .cp-badge{display:inline-block;background:#c9a84c;color:#2c1810;font-size:.65rem;padding:.05rem .4rem;border-radius:3px;font-weight:600}
/* ===== Cart Toast ===== */
.cart-toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#2c1810;color:#f5f0e8;padding:.8rem 1.2rem;border-radius:8px;font-size:.82rem;z-index:300;display:none;animation:fadeIn .3s ease;border-left:3px solid #c9a84c}
.cart-toast.show{display:block}
/* ===== Footer ===== */
footer{background:#1a1008;color:#a09080;padding:2rem 1.5rem;text-align:center;font-size:.82rem;letter-spacing:.05em}
footer .footer-title{font-size:1.1rem;color:#c9a84c;margin-bottom:.25rem;letter-spacing:.15em}
footer .footer-divider{width:36px;height:1px;background:#8B0000;margin:.5rem auto}
.cart-count{background:#8B0000;color:#f5f0e8;border-radius:50%;width:18px;height:18px;font-size:.65rem;display:inline-flex;align-items:center;justify-content:center;position:absolute;top:-4px;right:-6px}
.nav-link{position:relative}
/* ===== 儒释道 ===== */
.rsd-tabs{display:flex;gap:.3rem;margin-bottom:1.5rem;justify-content:center}
.rsd-tab{padding:.5rem 1.5rem;border:2px solid #d4c9b8;border-radius:8px;cursor:pointer;font-size:.9rem;background:#fffefb;transition:all .2s;font-family:inherit;font-weight:600;color:#5c4a38}
.rsd-tab:hover{border-color:#c9a84c;color:#8B0000}
.rsd-tab.active{background:#8B0000;color:#f5f0e8;border-color:#8B0000}
.rsd-panel{display:none;animation:fadeIn .3s ease}
.rsd-panel.active{display:block}
.rsd-3col{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.rsd-col{background:#fffefb;border:1px solid #e0d5c8;border-radius:8px;padding:1rem}
.rsd-col h5{color:#8B0000;font-size:.85rem;margin-bottom:.5rem;border-bottom:1px solid #e0d5c8;padding-bottom:.3rem}
.rsd-col ul{list-style:none;padding:0}
.rsd-col ul li{padding:.2rem 0;font-size:.82rem;color:#3a2a1e;border-bottom:1px solid #f0e8e0}
.rsd-col ul li:last-child{border:0}
.rsd-col ul li small{color:#7a6a5a}
.rsd-cross h5{color:#c9a84c;font-size:.9rem;margin-bottom:.6rem;text-align:center}
.rsd-cross-grid{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.rsd-cross-card{display:flex;align-items:center;gap:.4rem;background:#fff8e0;border:1px solid #c9a84c;border-radius:8px;padding:.5rem .8rem;font-size:.82rem}
.rsd-cross-card .rcc-item{color:#5c4a38}
.rsd-cross-card .rcc-arrow{color:#c9a84c;font-weight:700}
/* ===== TTS ===== */
.tts-bar{display:flex;gap:.4rem;align-items:center;margin-bottom:.6rem;padding:.4rem .6rem;background:#f5f0e8;border-radius:6px;flex-wrap:wrap}
.tts-btn{padding:.3rem .7rem;border:1px solid #8B0000;border-radius:4px;cursor:pointer;font-size:.78rem;background:#fffefb;color:#8B0000;transition:all .2s;font-family:inherit}
.tts-btn:hover{background:#8B0000;color:#f5f0e8}
.tts-status{font-size:.75rem;color:#7a6a5a;margin-left:.3rem}
/* ===== Surname ===== */
.surname-search{margin-bottom:1rem;text-align:center}

<script>
const DYNASTIES = [
  {id:'shanggu',name:'上古传说',year:'约公元前 3000 年 — 前 2070 年',subtitle:'三皇五帝 · 文明曙光',summary:'自盘古开天、女娲造人，至燧人氏钻木取火、伏羲氏画八卦、神农氏尝百草，黄帝战蚩尤统一华夏，尧舜禹禅让，是为中华文明之滥觞。《山海经》即为此期神话地理之集大成。',figures:['盘古','女娲','伏羲','神农（炎帝）','黄帝','蚩尤','燧人氏','有巢氏','仓颉','尧','舜','禹'],classics:[{name:'《山海经》',desc:'古代地理志怪之祖，含神话、地理、物产、巫术等内容，共十八卷。',type:'地理志怪'},{name:'《周易》雏形',desc:'伏羲画八卦，为后世《周易》之源头。',type:'哲学'},{name:'《神农本草经》',desc:'托名神农所作，中国最早的中药学著作。',type:'医药'}]},
  {id:'xia',name:'夏朝',year:'约前 2070 — 前 1600',subtitle:'首个世袭制王朝',summary:'大禹治水，划定九州，传位于启，开启"家天下"之制。夏人尊天命、行历法，奠定中原农耕文明根基。',figures:['大禹','启','少康','桀'],classics:[{name:'《夏历》（夏小正）',desc:'相传为夏代历书，按月记载物候、农事、天象。',type:'历法'},{name:'《连山》《归藏》',desc:'传为夏商之《易》，与《周易》并称"三易"。',type:'哲学'}]},
  {id:'shang',name:'商朝',year:'约前 1600 — 前 1046',subtitle:'甲骨文成熟期',summary:'成汤灭夏，盘庚迁殷。商代甲骨文是中国已知最早成熟文字系统。青铜铸造臻于鼎盛。',figures:['成汤','伊尹','盘庚','武丁','妇好','纣王'],classics:[{name:'甲骨卜辞',desc:'商王占卜记录于龟甲兽骨，是中国最早的成文史料。',type:'文献'},{name:'《尚书·商书》',desc:'收录《汤誓》《盘庚》等商代政治诰命。',type:'史书'},{name:'青铜器铭文',desc:'商代晚期青铜器上的铸刻文字，是金文之起源。',type:'金石'}]},
  {id:'xizhou',name:'西周',year:'前 1046 — 前 771',subtitle:'分封制确立 · 礼乐文明',summary:'武王伐纣，周公制礼作乐，确立宗法与分封制度。西周"敬天保民"思想深刻影响后世儒家。',figures:['周文王','周武王','周公旦','姜子牙','周成王','周康王','周幽王'],classics:[{name:'《周易》',desc:'文王拘而演《周易》，群经之首，大道之源。',type:'哲学'},{name:'《诗经》',desc:'中国最早的诗歌总集，收录西周至春秋诗歌305篇。',type:'诗歌'},{name:'《尚书》',desc:'上古政事之汇编，为先秦政典。',type:'史书'},{name:'《周礼》',desc:'记载周代官制与典章制度。',type:'礼制'}]},
  {id:'dongzhou',name:'东周（春秋）',year:'前 770 — 前 476',subtitle:'礼崩乐坏 · 百家争鸣（上）',summary:'平王东迁，王室衰微。诸侯争霸，然思想空前活跃：老子阐道、孔子立儒、孙子著兵。',figures:['齐桓公','晋文公','楚庄王','管仲','老子','孔子','孙子','晏婴','伯牙','师旷'],classics:[{name:'《道德经》',desc:'老子著，五千言道尽天地玄机。',type:'哲学'},{name:'《论语》',desc:'孔子及其弟子言行录，"四书"之首。',type:'哲学'},{name:'《孙子兵法》',desc:'世界上最早的兵书，"兵学圣典"。',type:'军事'},{name:'《春秋》',desc:'孔子编订的鲁国史书，编年史之祖。',type:'史书'}]},
  {id:'zhanguo',name:'东周（战国）',year:'前 475 — 前 221',subtitle:'百家争鸣（下）· 诸子巅峰',summary:'七雄并立，变法图强。百家争鸣达到顶峰。屈原投江、庄子逍遥、孟子论辩，成就中华文化最璀璨篇章。',figures:['孟子','庄子','荀子','韩非子','墨子','屈原','商鞅','孙膑','张仪','苏秦','荆轲'],classics:[{name:'《孟子》',desc:'主张性善论与仁政，"四书"之一。',type:'哲学'},{name:'《庄子》',desc:'汪洋恣肆，逍遥齐物。',type:'哲学'},{name:'《荀子》',desc:'主张性恶论与礼法并重。',type:'哲学'},{name:'《韩非子》',desc:'法家集大成之作。',type:'哲学'},{name:'《楚辞》',desc:'屈原等人所作楚地诗歌，浪漫主义文学之源头。',type:'诗歌'},{name:'《战国策》',desc:'记载战国纵横家言行的国别体史书。',type:'史书'}]},
  {id:'qin',name:'秦朝',year:'前 221 — 前 207',subtitle:'首次大一统',summary:'秦始皇扫六合，书同文车同轨，设郡县、筑长城。虽二世而亡，但"大一统"观念从此植入中华民族血脉。',figures:['秦始皇嬴政','李斯','赵高','蒙恬','陈胜'],classics:[{name:'小篆（秦篆）',desc:'李斯统一文字为小篆，标准字体之始。',type:'文字'},{name:'秦律（睡虎地秦简）',desc:'存世最早的成文法律文献。',type:'法律'}]},
  {id:'xihan',name:'西汉',year:'前 202 — 公元 8',subtitle:'汉武雄风 · 儒术独尊',summary:'汉武帝"罢黜百家，独尊儒术"。张骞通西域，丝绸之路贯通中外。司马迁忍辱著《史记》。',figures:['汉高祖刘邦','汉武帝刘彻','卫青','霍去病','张骞','司马迁','董仲舒','王昭君'],classics:[{name:'《史记》',desc:'司马迁著，第一部纪传体通史，"史家之绝唱，无韵之离骚"。',type:'史书'},{name:'《淮南子》',desc:'刘安召集门客编撰，道家为主兼采百家。',type:'哲学'},{name:'《盐铁论》',desc:'关于盐铁专营的辩论记录。',type:'政治经济'},{name:'《九章算术》',desc:'奠定中国古代数学体系。',type:'数学'}]},
  {id:'xin',name:'新朝',year:'9 — 23',subtitle:'王莽改制',summary:'外戚王莽篡汉建新，托古改制，然不合时宜，天下大乱，新朝仅历15年而亡。',figures:['王莽'],classics:[]},
  {id:'donghan',name:'东汉',year:'25 — 220',subtitle:'光武中兴 · 经学兴盛',summary:'刘秀复兴汉室。造纸术改进、浑天仪问世、佛教东传。许慎著《说文解字》，班固作《汉书》。',figures:['汉光武帝刘秀','邓禹','马援','班超','蔡伦','张衡','许慎','班固','华佗','张仲景'],classics:[{name:'《汉书》',desc:'中国第一部纪传体断代史。',type:'史书'},{name:'《说文解字》',desc:'第一部系统分析汉字字形与字源的字典。',type:'文字'},{name:'《伤寒杂病论》',desc:'中医辨证论治原则之奠基。',type:'医药'},{name:'《论衡》',desc:'王充著，批判谶纬迷信。',type:'哲学'}]},
  {id:'sanguo',name:'三国',year:'220 — 280',subtitle:'魏蜀吴鼎立',summary:'曹操统一北方，刘备据巴蜀，孙权守江东。三国鼎立，英雄辈出。建安文学璀璨夺目。',figures:['曹操','曹丕','曹植','刘备','关羽','张飞','诸葛亮','孙权','周瑜','司马懿','赵云'],classics:[{name:'《三国志》',desc:'陈寿著，纪传体三国史，"二十四史"之一。',type:'史书'},{name:'《出师表》',desc:'诸葛亮名表，忠义感人。',type:'文学'},{name:'《观沧海》《短歌行》',desc:'曹操诗作，建安风骨之代表。',type:'诗歌'},{name:'《洛神赋》',desc:'曹植名篇，辞采华美。',type:'文学'}]},
  {id:'xijin',name:'西晋',year:'265 — 316',subtitle:'短暂统一',summary:'司马炎篡魏建晋，灭吴统一天下。然八王之乱致国势衰微，五胡入华。',figures:['司马炎','王羲之','陶渊明','左思','阮籍','嵇康'],classics:[{name:'《兰亭集序》',desc:'王羲之书法绝品，"天下第一行书"。',type:'书法'},{name:'《桃花源记》',desc:'陶渊明理想国寓言。',type:'文学'},{name:'《搜神记》',desc:'干宝著，中国古代志怪小说之祖。',type:'志怪小说'}]},
  {id:'dongjin',name:'东晋',year:'317 — 420',subtitle:'衣冠南渡 · 六朝风流',summary:'晋室南渡，建康为都。南北对峙，江南经济文化大发展。书法、绘画、文学皆臻高峰。',figures:['王导','谢安','谢玄','王羲之','王献之','顾恺之','陶渊明','谢灵运','祖逖'],classics:[{name:'《兰亭集序》',desc:'王羲之书法巅峰。',type:'书法'},{name:'《桃花源记》《归去来兮辞》',desc:'陶渊明田园文学代表作。',type:'文学'},{name:'《世说新语》',desc:'刘义庆著，记录魏晋名士言行轶事。',type:'笔记小说'}]},
  {id:'nanbeichao',name:'南北朝',year:'420 — 589',subtitle:'南朝宋齐梁陈 · 北朝隋前',summary:'南方宋齐梁陈四朝更迭，北方北魏统一后分裂。南朝尚文，北朝尚武；佛教石窟艺术鼎盛，云冈龙门即此时开凿。',figures:['刘裕','萧衍（梁武帝）','北魏孝文帝','郦道元','祖冲之','刘勰','萧统','花木兰'],classics:[{name:'《文心雕龙》',desc:'刘勰著，第一部体系完整的文学理论巨著。',type:'文学理论'},{name:'《昭明文选》',desc:'萧统编选，最早的诗文总集。',type:'文学'},{name:'《水经注》',desc:'郦道元著，以水道为纲的地理学名著。',type:'地理'},{name:'《世说新语》',desc:'魏晋名士风流之实录。',type:'笔记小说'},{name:'《齐民要术》',desc:'贾思勰著，最早最完整的农业百科全书。',type:'农学'}]},
  {id:'sui',name:'隋朝',year:'581 — 618',subtitle:'再启大一统',summary:'杨坚篡周建隋，平定南方，结束近三百年分裂。开皇之治，开凿大运河，贯通南北。',figures:['隋文帝杨坚','隋炀帝杨广','李春'],classics:[{name:'大运河',desc:'隋炀帝开凿，贯通南北经济大动脉。',type:'工程'},{name:'赵州桥',desc:'李春设计建造，现存最早的石拱桥。',type:'工程'},{name:'《切韵》',desc:'陆法言著，中古音韵之标准。',type:'音韵'}]},
  {id:'tang',name:'唐朝',year:'618 — 907',subtitle:'盛世气象 · 诗歌黄金',summary:'李渊建唐，贞观之治、开元盛世，万国来朝。唐诗是中国文学的最巅峰，李白、杜甫、白居易等群星璀璨。',figures:['唐太宗李世民','魏徵','武则天','唐玄宗李隆基','李白','杜甫','白居易','韩愈','柳宗元','王维','玄奘','鉴真'],classics:[{name:'《全唐诗》',desc:'共收录唐诗四万八千九百余首。',type:'诗歌'},{name:'《贞观政要》',desc:'记载唐太宗治国方略。',type:'政治'},{name:'《唐律疏议》',desc:'东亚法系之源。',type:'法律'},{name:'《金刚经》刻本',desc:'868年印制，世界最早有确切纪年的雕版印刷品。',type:'宗教'},{name:'《史通》',desc:'刘知幾著，第一部系统史学理论著作。',type:'史学理论'},{name:'《通典》',desc:'杜佑著，第一部典章制度通史。',type:'典制'},{name:'《大唐西域记》',desc:'玄奘述，记录西域与印度地理历史。',type:'地理'}]},
  {id:'wudai',name:'五代十国',year:'907 — 960',subtitle:'政权更迭 · 词兴之始',summary:'五代更迭如走马灯。十国割据南方与山西。战乱中词体崛起，李煜以亡国血泪铸就千古词篇。',figures:['朱温','李存勖','柴荣（周世宗）','李煜（南唐后主）','冯道'],classics:[{name:'《南唐二主词》',desc:'李璟、李煜父子词作。',type:'词'},{name:'《花间集》',desc:'赵崇祚编，晚唐五代词总集。',type:'词'}]},
  {id:'beisong',name:'北宋',year:'960 — 1127',subtitle:'文治巅峰 · 理学初兴',summary:'赵匡胤陈桥兵变，杯酒释兵权。重文抑武，科举大兴。城市经济繁荣，理学兴起，三苏、欧阳修等文星璀璨。',figures:['宋太祖赵匡胤','包拯','范仲淹','王安石','司马光','苏轼','苏辙','苏洵','欧阳修','沈括','毕昇','柳永'],classics:[{name:'《资治通鉴》',desc:'司马光主编，编年体通史巨著294卷。',type:'史书'},{name:'《梦溪笔谈》',desc:'沈括著，"中国科学史上的坐标"。',type:'科学'},{name:'《太平御览》',desc:'宋代四大类书之一。',type:'类书'},{name:'《全宋词》',desc:'收录两宋词人作品。',type:'词'},{name:'《清明上河图》',desc:'张择端绘，北宋汴京城市风貌之百科全书。',type:'绘画'}]},
  {id:'nanxun',name:'南宋·辽·西夏·金',year:'1127 — 1279',subtitle:'南北并立 · 民族交融',summary:'宋室南渡，定都临安。岳飞抗金、辛弃疾豪放词、陆游爱国诗，为偏安时代注入不屈之气。理学大成于朱熹。',figures:['宋高宗赵构','岳飞','陆游','辛弃疾','李清照','朱熹','文天祥','成吉思汗'],classics:[{name:'《四书章句集注》',desc:'朱熹集注，元明清科举必读。',type:'哲学'},{name:'《朱子语类》',desc:'朱熹讲学语录汇编。',type:'哲学'},{name:'《东京梦华录》',desc:'孟元老著，追忆北宋汴京风貌。',type:'笔记'}]},
  {id:'yuan',name:'元朝',year:'1271 — 1368',subtitle:'蒙元帝国 · 戏曲繁荣',summary:'忽必烈建元，定都大都。元曲杂剧蔚为大观，关汉卿、王实甫、马致远并称元曲四大家。',figures:['成吉思汗','忽必烈','关汉卿','王实甫','马致远','白朴','赵孟頫','黄公望','郭守敬'],classics:[{name:'《窦娥冤》',desc:'关汉卿代表作，元杂剧巅峰。',type:'戏曲'},{name:'《西厢记》',desc:'王实甫著，"愿天下有情人都成了眷属"。',type:'戏曲'},{name:'《赵氏孤儿》',desc:'第一部传入欧洲的中国戏剧。',type:'戏曲'},{name:'《富春山居图》',desc:'黄公望画作，中国山水画之巅峰。',type:'绘画'},{name:'《授时历》',desc:'郭守敬编制，当时世界最先进的历法。',type:'天文'}]},
  {id:'ming',name:'明朝',year:'1368 — 1644',subtitle:'永乐大典 · 小说兴盛',summary:'朱元璋驱元建明。永乐帝迁都北京，派郑和七下西洋。长篇小说《三国演义》《水浒传》《西游记》《金瓶梅》相继问世。李时珍著《本草纲目》。',figures:['明太祖朱元璋','明成祖朱棣','郑和','王阳明','海瑞','戚继光','张居正','李时珍','宋应星','徐光启'],classics:[{name:'《三国演义》',desc:'罗贯中著，第一部长篇历史演义小说。',type:'小说'},{name:'《水浒传》',desc:'施耐庵著，英雄传奇小说之典范。',type:'小说'},{name:'《西游记》',desc:'吴承恩著，神魔小说之巅峰。',type:'小说'},{name:'《金瓶梅》',desc:'世情小说之开山。',type:'小说'},{name:'《本草纲目》',desc:'李时珍著，载药1892种，东方医药巨典。',type:'医药'},{name:'《天工开物》',desc:'宋应星著，农业与手工业技术百科全书。',type:'科技'},{name:'《永乐大典》',desc:'中国古代最大百科类书。',type:'类书'},{name:'《传习录》',desc:'王阳明著，心学精华，"知行合一"。',type:'哲学'}]},
  {id:'qing',name:'清朝',year:'1644 — 1912',subtitle:'康乾盛世 · 红楼绝唱',summary:'康雍乾三朝达鼎盛，统合疆域奠定现代版图。《四库全书》编纂。晚清鸦片战争后国门洞开。《红楼梦》横空出世，成中国古典文学之巅。',figures:['康熙皇帝','雍正皇帝','乾隆皇帝','曹雪芹','吴敬梓','蒲松龄','纳兰性德','林则徐','曾国藩','康有为','梁启超'],classics:[{name:'《红楼梦》',desc:'曹雪芹著，中国古典文学巅峰之作。',type:'小说'},{name:'《四库全书》',desc:'中国古代最大丛书，收书3461种。',type:'类书'},{name:'《儒林外史》',desc:'吴敬梓著，讽刺小说杰作。',type:'小说'},{name:'《聊斋志异》',desc:'蒲松龄著，志怪小说之巅峰。',type:'小说'},{name:'《康熙字典》',desc:'收字47035个，古代字书之最。',type:'文字'},{name:'《古文观止》',desc:'历代散文精华总集。',type:'文学'},{name:'《唐诗三百首》',desc:'流传最广的唐诗选本。',type:'诗歌'}]},
  {id:'minguo',name:'中华民国',year:'1912 — 1949',subtitle:'白话文运动 · 现代转型',summary:'辛亥革命推翻帝制。五四运动掀起新文化浪潮，白话文取代文言文，现代文学诞生。',figures:['孙中山','鲁迅','胡适','陈独秀','蔡元培','徐志摩','朱自清','老舍','沈从文'],classics:[{name:'《呐喊》',desc:'鲁迅著，中国现代小说开山之作。',type:'小说'},{name:'《彷徨》',desc:'鲁迅著，现代小说经典。',type:'小说'},{name:'《朝花夕拾》',desc:'鲁迅著，回忆性散文典范。',type:'散文'},{name:'《尝试集》',desc:'胡适著，中国第一部白话新诗集。',type:'诗歌'},{name:'《骆驼祥子》',desc:'老舍著，京味文学代表作。',type:'小说'},{name:'《边城》',desc:'沈从文著，乡土文学经典。',type:'小说'}]},
  {id:'zhonghua',name:'中华人民共和国',year:'1949 至今',subtitle:'伟大复兴 · 文化传承',summary:'新中国成立，历经建设、改革与复兴之路。国学由沉寂而复兴，中华优秀传统文化的传承与发展成为时代主题。',figures:['毛泽东','周恩来','邓小平','钱学森','袁隆平','莫言','刘慈欣'],classics:[{name:'《毛泽东诗词》',desc:'革命现实主义诗篇。',type:'诗歌'},{name:'《平凡的世界》',desc:'路遥著，改革开放史诗。',type:'小说'},{name:'《白鹿原》',desc:'陈忠实著，渭河平原50年变迁史诗。',type:'小说'},{name:'《活着》',desc:'余华著，生命韧性的书写。',type:'小说'}]}
];

<script>
const BOOKS_DATA = [
{ id:'daodejing', type:'哲学',
  name:{'zh-CN':'道德经','zh-TW':'道德經','en':'Tao Te Ching','es':'Tao Te Ching','pt':'Tao Te Ching'},
  author:{'zh-CN':'老子（李耳）','zh-TW':'老子（李耳）','en':'Laozi (Li Er)','es':'Laozi (Li Er)','pt':'Laozi (Li Er)'},
  dynasty:{'zh-CN':'春秋','zh-TW':'春秋','en':'Spring and Autumn','es':'Primaveras y Otoños','pt':'Primaveras e Outonos'},
  intro:{'zh-CN':'《道德经》是中国古代哲学经典，相传为春秋时期老子所著，共81章。以“道”为核心概念，阐述天地万物之根源与运行规律，主张“无为而治”、"道法自然"，对中国哲学、宗教、政治、军事、艺术等影响深远，是道教最重要的经典，也是世界上被翻译最多的中国典籍之一。','zh-TW':'《道德經》是中國古代哲學經典，相傳為春秋時期老子所著，共81章。以「道」為核心概念，闡述天地萬物之根源與運行規律，主張「無為而治」、「道法自然」，對中國哲學、宗教、政治、軍事、藝術等影響深遠，是道教最重要的經典，也是世界上被翻譯最多的中國典籍之一。','en':'The Tao Te Ching is a classic of ancient Chinese philosophy, traditionally attributed to Laozi from the Spring and Autumn period, comprising 81 chapters. Centered on the concept of the "Tao" (Way), it expounds the origin and laws of all things, advocating "governing by non-action" and "the Tao follows nature." It profoundly influenced Chinese philosophy, religion, politics, military, and art, and remains the most translated Chinese classic worldwide.','es':'El Tao Te Ching es un clásico de la filosofía china antigua, tradicionalmente atribuido a Laozi del período de Primaveras y Otoños, que comprende 81 capítulos. Centrado en el concepto del "Tao" (Camino), expone el origen y las leyes de todas las cosas, abogando por "gobernar mediante la no-acción" y "el Tao sigue la naturaleza". Influyó profundamente en la filosofía, religión, política, milicia y arte chinos, y sigue siendo el clásico chino más traducido del mundo.','pt':'O Tao Te Ching é um clássico da filosofia chinesa antiga, tradicionalmente atribuído a Laozi do período das Primaveras e Outonos, compreendendo 81 capítulos. Centrado no conceito do "Tao" (Caminho), expõe a origem e as leis de todas as coisas, defendendo "governar pela não-ação" e "o Tao segue a natureza". Influenciou profundamente a filosofia, religião, política, militar e arte chinesas, e continua sendo o clássico chinês mais traduzido no mundo.'},
  totalChapters:81,
  chapters:{
    'zh-CN':[
      {n:1,t:'第一章',c:'道可道，非常道；名可名，非常名。无，名天地之始；有，名万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者同出而异名，同谓之玄，玄之又玄，众妙之门。'},
      {n:2,t:'第二章',c:'天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教，万物作焉而不辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。'},
      {n:3,t:'第三章',c:'不尚贤，使民不争；不贵难得之货，使民不为盗；不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹，弱其志，强其骨。常使民无知无欲，使夫智者不敢为也。为无为，则无不治。'},
      {n:4,t:'第四章',c:'道冲而用之或不盈，渊兮似万物之宗。挫其锐，解其纷，和其光，同其尘。湛兮似或存，吾不知谁之子，象帝之先。'},
      {n:5,t:'第五章',c:'天地不仁，以万物为刍狗；圣人不仁，以百姓为刍狗。天地之间，其犹橐籥乎？虚而不屈，动而愈出。多言数穷，不如守中。'},
      {n:6,t:'第六章',c:'谷神不死，是谓玄牝。玄牝之门，是谓天地根。绵绵若存，用之不勤。'},
      {n:7,t:'第七章',c:'天长地久。天地所以能长且久者，以其不自生，故能长生。是以圣人后其身而身先，外其身而身存。非以其无私邪？故能成其私。'},
      {n:8,t:'第八章',c:'上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。夫唯不争，故无尤。'},
      {n:9,t:'第九章',c:'持而盈之，不如其已；揣而锐之，不可长保。金玉满堂，莫之能守；富贵而骄，自遗其咎。功遂身退，天之道。'},
      {n:10,t:'第十章',c:'载营魄抱一，能无离乎？专气致柔，能婴儿乎？涤除玄览，能无疵乎？爱民治国，能无为乎？天门开阖，能为雌乎？明白四达，能无知乎？生之畜之，生而不有，为而不恃，长而不宰，是谓玄德。'},
      {n:11,t:'第十一章',c:'三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。'},
      {n:12,t:'第十二章',c:'五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂，难得之货令人行妨。是以圣人为腹不为目，故去彼取此。'},
      {n:13,t:'第十三章',c:'宠辱若惊，贵大患若身。何谓宠辱若惊？宠为下，得之若惊，失之若惊，是谓宠辱若惊。何谓贵大患若身？吾所以有大患者，为吾有身，及吾无身，吾有何患？故贵以身为天下，若可寄天下；爱以身为天下，若可托天下。'},
      {n:14,t:'第十四章',c:'视之不见名曰夷，听之不闻名曰希，搏之不得名曰微。此三者不可致诘，故混而为一。其上不皦，其下不昧，绳绳不可名，复归于无物。是谓无状之状，无物之象，是谓惚恍。迎之不见其首，随之不见其后。执古之道，以御今之有，能知古始，是谓道纪。'},
      {n:15,t:'第十五章',c:'古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，浑兮其若浊。孰能浊以静之徐清？孰能安以久动之徐生？保此道者不欲盈。夫唯不盈，故能蔽而新成。'},
      {n:16,t:'第十六章',c:'致虚极，守静笃。万物并作，吾以观复。夫物芸芸，各复归其根。归根曰静，是谓复命。复命曰常，知常曰明。不知常，妄作凶。知常容，容乃公，公乃王，王乃天，天乃道，道乃久，没身不殆。'},
      {n:17,t:'第十七章',c:'太上，下知有之；其次，亲而誉之；其次，畏之；其次，侮之。信不足焉，有不信焉。悠兮其贵言。功成事遂，百姓皆谓我自然。'},
      {n:18,t:'第十八章',c:'大道废，有仁义；智慧出，有大伪；六亲不和，有孝慈；国家昏乱，有忠臣。'},
      {n:19,t:'第十九章',c:'绝圣弃智，民利百倍；绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。此三者以为文不足，故令有所属：见素抱朴，少私寡欲。'},
      {n:20,t:'第二十章',c:'绝学无忧。唯之与阿，相去几何？善之与恶，相去若何？人之所畏，不可不畏。荒兮其未央哉！众人熙熙，如享太牢，如春登台。我独泊兮其未兆，如婴儿之未孩；傫傫兮若无所归。众人皆有余，而我独若遗。我愚人之心也哉！沌沌兮！俗人昭昭，我独昏昏。俗人察察，我独闷闷。澹兮其若海，飂兮若无止。众人皆有以，而我独顽且鄙。我独异于人，而贵食母。'},
      {n:21,t:'第二十一章',c:'孔德之容，惟道是从。道之为物，惟恍惟惚。惚兮恍兮，其中有象；恍兮惚兮，其中有物；窈兮冥兮，其中有精。其精甚真，其中有信。自古及今，其名不去，以阅众甫。吾何以知众甫之状哉？以此。'},
      {n:22,t:'第二十二章',c:'曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见故明，不自是故彰，不自伐故有功，不自矜故长。夫唯不争，故天下莫能与之争。古之所谓曲则全者，岂虚言哉！诚全而归之。'},
      {n:23,t:'第二十三章',c:'希言自然。故飘风不终朝，骤雨不终日。孰为此者？天地。天地尚不能久，而况于人乎？故从事于道者，道者同于道，德者同于德，失者同于失。同于道者，道亦乐得之；同于德者，德亦乐得之；同于失者，失亦乐得之。信不足焉，有不信焉。'},
      {n:24,t:'第二十四章',c:'企者不立，跨者不行。自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。'},
      {n:25,t:'第二十五章',c:'有物混成，先天地生。寂兮寥兮，独立而不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。故道大，天大，地大，王亦大。域中有四大，而王居其一焉。人法地，地法天，天法道，道法自然。'},
      {n:26,t:'第二十六章',c:'重为轻根，静为躁君。是以圣人终日行不离辎重。虽有荣观，燕处超然。奈何万乘之主，而以身轻天下？轻则失本，躁则失君。'},
      {n:27,t:'第二十七章',c:'善行无辙迹，善言无瑕谪，善计不用筹策，善闭无关楗而不可开，善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。'},
      {n:28,t:'第二十八章',c:'知其雄，守其雌，为天下溪。为天下溪，常德不离，复归于婴儿。知其白，守其黑，为天下式。为天下式，常德不忒，复归于无极。知其荣，守其辱，为天下谷。为天下谷，常德乃足，复归于朴。朴散则为器，圣人用之则为官长。故大制不割。'},
      {n:29,t:'第二十九章',c:'将欲取天下而为之，吾见其不得已。天下神器，不可为也。为者败之，执者失之。故物或行或随，或嘘或吹，或强或羸，或挫或隳。是以圣人去甚，去奢，去泰。'},
      {n:30,t:'第三十章',c:'以道佐人主者，不以兵强天下，其事好还。师之所处，荆棘生焉。大军之后，必有凶年。善有果而已，不敢以取强。果而勿矜，果而勿伐，果而勿骄，果而不得已，果而勿强。物壮则老，是谓不道，不道早已。'},
      {n:31,t:'第三十一章',c:'夫佳兵者，不祥之器，物或恶之，故有道者不处。君子居则贵左，用兵则贵右。兵者不祥之器，非君子之器，不得已而用之，恬淡为上。胜而不美，而美之者，是乐杀人。夫乐杀人者，则不可以得志于天下矣。吉事尚左，凶事尚右。偏将军居左，上将军居右，言以丧礼处之。杀人之众，以哀悲泣之，战胜以丧礼处之。'},
      {n:32,t:'第三十二章',c:'道常无名，朴虽小，天下莫能臣也。侯王若能守之，万物将自宾。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦将知止。知止可以不殆。譬道之在天下，犹川谷之于江海。'},
      {n:33,t:'第三十三章',c:'知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。'},
      {n:34,t:'第三十四章',c:'大道泛兮，其可左右。万物恃之而生而不辞，功成不名有。衣养万物而不为主，常无欲，可名于小；万物归焉而不为主，可名为大。以其终不自为大，故能成其大。'},
      {n:35,t:'第三十五章',c:'执大象，天下往。往而不害，安平太。乐与饵，过客止。道之出口，淡乎其无味，视之不足见，听之不足闻，用之不足既。'},
      {n:36,t:'第三十六章',c:'将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲夺之，必固与之。是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。'},
      {n:37,t:'第三十七章',c:'道常无为而无不为。侯王若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。无名之朴，夫亦将无欲。不欲以静，天下将自定。'},
      {n:38,t:'第三十八章',c:'上德不德，是以有德；下德不失德，是以无德。上德无为而无以为；下德为之而有以为。上仁为之而无以为；上义为之而有以为。上礼为之而莫之应，则攘臂而扔之。故失道而后德，失德而后仁，失仁而后义，失义而后礼。夫礼者，忠信之薄，而乱之首。前识者，道之华，而愚之始。是以大丈夫处其厚，不居其薄；处其实，不居其华。故去彼取此。'},
      {n:39,t:'第三十九章',c:'昔之得一者：天得一以清，地得一以宁，神得一以灵，谷得一以盈，万物得一以生，侯王得一以为天下贞。其致之，天无以清将恐裂，地无以宁将恐废，神无以灵将恐歇，谷无以盈将恐竭，万物无以生将恐灭，侯王无以贵高将恐蹶。故贵以贱为本，高以下为基。是以侯王自称孤、寡、不谷。此非以贱为本邪？非乎？故致数誉无誉。不欲琭琭如玉，珞珞如石。'},
      {n:40,t:'第四十章',c:'反者道之动，弱者道之用。天下万物生于有，有生于无。'},
      {n:41,t:'第四十一章',c:'上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。故建言有之：明道若昧，进道若退，夷道若颣，上德若谷，大白若辱，广德若不足，建德若偷，质真若渝，大方无隅，大器晚成，大音希声，大象无形，道隐无名。夫唯道，善贷且成。'},
      {n:42,t:'第四十二章',c:'道生一，一生二，二生三，三生万物。万物负阴而抱阳，冲气以为和。人之所恶，唯孤、寡、不谷，而王公以为称。故物或损之而益，或益之而损。人之所教，我亦教之。强梁者不得其死，吾将以为教父。'},
      {n:43,t:'第四十三章',c:'天下之至柔，驰骋天下之至坚。无有入无间，吾是以知无为之有益。不言之教，无为之益，天下希及之。'},
      {n:44,t:'第四十四章',c:'名与身孰亲？身与货孰多？得与亡孰病？是故甚爱必大费，多藏必厚亡。知足不辱，知止不殆，可以长久。'},
      {n:45,t:'第四十五章',c:'大成若缺，其用不弊。大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。躁胜寒，静胜热。清静为天下正。'},
      {n:46,t:'第四十六章',c:'天下有道，却走马以粪。天下无道，戎马生于郊。祸莫大于不知足，咎莫大于欲得。故知足之足，常足矣。'},
      {n:47,t:'第四十七章',c:'不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而名，不为而成。'},
      {n:48,t:'第四十八章',c:'为学日益，为道日损。损之又损，以至于无为。无为而无不为。取天下常以无事，及其有事，不足以取天下。'},
      {n:49,t:'第四十九章',c:'圣人无常心，以百姓心为心。善者吾善之，不善者吾亦善之，德善。信者吾信之，不信者吾亦信之，德信。圣人在天下，歙歙为天下浑其心。百姓皆注其耳目，圣人皆孩之。'},
      {n:50,t:'第五十章',c:'出生入死。生之徒十有三，死之徒十有三，人之生动之死地亦十有三。夫何故？以其生生之厚。盖闻善摄生者，陆行不遇兕虎，入军不被甲兵。兕无所投其角，虎无所措其爪，兵无所容其刃。夫何故？以其无死地。'},
      {n:51,t:'第五十一章',c:'道生之，德畜之，物形之，势成之。是以万物莫不尊道而贵德。道之尊，德之贵，夫莫之命而常自然。故道生之，德畜之，长之育之，亭之毒之，养之覆之。生而不有，为而不恃，长而不宰，是谓玄德。'},
      {n:52,t:'第五十二章',c:'天下有始，以为天下母。既得其母，以知其子；既知其子，复守其母，没身不殆。塞其兑，闭其门，终身不勤。开其兑，济其事，终身不救。见小曰明，守柔曰强。用其光，复归其明，无遗身殃，是为习常。'},
      {n:53,t:'第五十三章',c:'使我介然有知，行于大道，唯施是畏。大道甚夷，而民好径。朝甚除，田甚芜，仓甚虚，服文彩，带利剑，厌饮食，财货有余，是谓盗夸。非道也哉！'},
      {n:54,t:'第五十四章',c:'善建者不拔，善抱者不脱，子孙以祭祀不辍。修之于身，其德乃真；修之于家，其德乃余；修之于乡，其德乃长；修之于国，其德乃丰；修之于天下，其德乃普。故以身观身，以家观家，以乡观乡，以国观国，以天下观天下。吾何以知天下然哉？以此。'},
      {n:55,t:'第五十五章',c:'含德之厚，比于赤子。毒虫不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固。未知牝牡之合而朘作，精之至也。终日号而不嗄，和之至也。知和曰常，知常曰明。益生曰祥，心使气曰强。物壮则老，谓之不道，不道早已。'},
      {n:56,t:'第五十六章',c:'知者不言，言者不知。塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘，是谓玄同。故不可得而亲，不可得而疏；不可得而利，不可得而害；不可得而贵，不可得而贱。故为天下贵。'},
      {n:57,t:'第五十七章',c:'以正治国，以奇用兵，以无事取天下。吾何以知其然哉？以此：天下多忌讳，而民弥贫；民多利器，国家滋昏；人多伎巧，奇物滋起；法令滋彰，盗贼多有。故圣人云：我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴。'},
      {n:58,t:'第五十八章',c:'其政闷闷，其民淳淳；其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。孰知其极？其无正。正复为奇，善复为妖。人之迷，其日固久。是以圣人方而不割，廉而不刿，直而不肆，光而不耀。'},
      {n:59,t:'第五十九章',c:'治人事天莫若啬。夫唯啬，是谓早服。早服谓之重积德。重积德则无不克，无不克则莫知其极。莫知其极，可以有国。有国之母，可以长久。是谓深根固柢，长生久视之道。'},
      {n:60,t:'第六十章',c:'治大国若烹小鲜。以道莅天下，其鬼不神。非其鬼不神，其神不伤人。非其神不伤人，圣人亦不伤人。夫两不相伤，故德交归焉。'},
      {n:61,t:'第六十一章',c:'大国者下流，天下之交，天下之牝。牝常以静胜牡，以静为下。故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。大国不过欲兼畜人，小国不过欲入事人。夫两者各得其所欲，大者宜为下。'},
      {n:62,t:'第六十二章',c:'道者万物之奥。善人之宝，不善人之所保。美言可以市尊，美行可以加人。人之不善，何弃之有？故立天子，置三公，虽有拱璧以先驷马，不如坐进此道。古之所以贵此道者何？不曰求以得，有罪以免邪？故为天下贵。'},
      {n:63,t:'第六十三章',c:'为无为，事无事，味无味。大小多少，报怨以德。图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。是以圣人终不为大，故能成其大。夫轻诺必寡信，多易必多难。是以圣人犹难之，故终无难矣。'},
      {n:64,t:'第六十四章',c:'其安易持，其未兆易谋，其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。是以圣人无为故无败，无执故无失。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货；学不学，复众人之所过。以辅万物之自然而不敢为。'},
      {n:65,t:'第六十五章',c:'古之善为道者，非以明民，将以愚之。民之难治，以其智多。故以智治国，国之贼；不以智治国，国之福。知此两者亦稽式。常知稽式，是谓玄德。玄德深矣远矣，与物反矣，然后乃至大顺。'},
      {n:66,t:'第六十六章',c:'江海所以能为百谷王者，以其善下之，故能为百谷王。是以欲上民，必以言下之；欲先民，必以身后之。是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌。以其不争，故天下莫能与之争。'},
      {n:67,t:'第六十七章',c:'天下皆谓我道大，似不肖。夫唯大，故似不肖。若肖，久矣其细也夫！我有三宝，持而保之：一曰慈，二曰俭，三曰不敢为天下先。慈故能勇，俭故能广，不敢为天下先，故能成器长。今舍慈且勇，舍俭且广，舍后且先，死矣！夫慈，以战则胜，以守则固。天将救之，以慈卫之。'},
      {n:68,t:'第六十八章',c:'善为士者不武，善战者不怒，善胜敌者不与，善用人者为之下。是谓不争之德，是谓用人之力，是谓配天古之极。'},
      {n:69,t:'第六十九章',c:'用兵有言：吾不敢为主而为客，不敢进寸而退尺。是谓行无行，攘无臂，扔无敌，执无兵。祸莫大于轻敌，轻敌几丧吾宝。故抗兵相加，哀者胜矣。'},
      {n:70,t:'第七十章',c:'吾言甚易知，甚易行。天下莫能知，莫能行。言有宗，事有君。夫唯无知，是以不我知。知我者希，则我者贵。是以圣人被褐怀玉。'},
      {n:71,t:'第七十一章',c:'知不知上，不知知病。夫唯病病，是以不病。圣人不病，以其病病，是以不病。'},
      {n:72,t:'第七十二章',c:'民不畏威，则大威至。无狎其所居，无厌其所生。夫唯不厌，是以不厌。是以圣人自知不自见，自爱不自贵。故去彼取此。'},
      {n:73,t:'第七十三章',c:'勇于敢则杀，勇于不敢则活。此两者或利或害。天之所恶，孰知其故？是以圣人犹难之。天之道，不争而善胜，不言而善应，不召而自来，繟然而善谋。天网恢恢，疏而不失。'},
      {n:74,t:'第七十四章',c:'民不畏死，奈何以死惧之？若使民常畏死，而为奇者，吾得执而杀之，孰敢？常有司杀者杀。夫代司杀者杀，是谓代大匠斫。夫代大匠斫者，稀有不伤其手矣。'},
      {n:75,t:'第七十五章',c:'民之饥，以其上食税之多，是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚，是以轻死。夫唯无以生为者，是贤于贵生。'},
      {n:76,t:'第七十六章',c:'人之生也柔弱，其死也坚强。万物草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。是以兵强则灭，木强则折。强大处下，柔弱处上。'},
      {n:77,t:'第七十七章',c:'天之道，其犹张弓与？高者抑之，下者举之；有余者损之，不足者补之。天之道，损有余而补不足。人之道则不然，损不足以奉有余。孰能有余以奉天下？唯有道者。是以圣人为而不恃，功成而不处，其不欲见贤。'},
      {n:78,t:'第七十八章',c:'天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。弱之胜强，柔之胜刚，天下莫不知，莫能行。是以圣人云：受国之垢，是谓社稷主；受国不祥，是为天下王。正言若反。'},
      {n:79,t:'第七十九章',c:'和大怨，必有余怨，安可以为善？是以圣人执左契而不责于人。有德司契，无德司彻。天道无亲，常与善人。'},
      {n:80,t:'第八十章',c:'小国寡民。使有什伯之器而不用，使民重死而不远徙。虽有舟舆，无所乘之；虽有甲兵，无所陈之。使民复结绳而用之。甘其食，美其服，安其居，乐其俗。邻国相望，鸡犬之声相闻，民至老死不相往来。'},
      {n:81,t:'第八十一章',c:'信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。'}
    ],
    'en':[
      {n:1,t:'Chapter 1',c:'The Tao that can be told is not the eternal Tao. The name that can be named is not the eternal name. The nameless is the beginning of heaven and earth. The named is the mother of ten thousand things. Ever desireless, one can see the mystery. Ever desiring, one can see the manifestations. These two spring from the same source but differ in name. This appears as darkness. Darkness within darkness. The gate to all mystery.'},
      {n:2,t:'Chapter 2',c:'When the world knows beauty as beauty, ugliness arises. When it knows good as good, evil arises. Thus being and non-being give rise to each other, difficult and easy complete each other, long and short shape each other, high and low lean on each other, voice and sound harmonize each other, before and after follow each other. Therefore the sage acts without effort and teaches without words. All things arise without being created, are nurtured without possession, act without expectation. When the work is done, it is forgotten. That is why it lasts forever.'},
      {n:3,t:'Chapter 3',c:'Do not exalt the wise, and the people will not compete. Do not prize rare goods, and they will not steal. Do not display what is desirable, and their hearts will not be disturbed. Therefore the sage governs by emptying hearts, filling bellies, weakening ambitions, and strengthening bones. If the people are without knowledge and desire, the clever ones dare not act. Practice non-action, and everything will be governed.'},
      {n:4,t:'Chapter 4',c:'The Tao is empty yet inexhaustible. Deep as the source of all things. It blunts sharp edges, untangles knots, softens glare, merges with dust. Clear as still water, it seems to remain. I do not know whose child it is. It precedes the ancestors of the gods.'},
      {n:5,t:'Chapter 5',c:'Heaven and Earth are not kind. They treat all things as straw dogs. The sage is not kind. He treats the people as straw dogs. Between Heaven and Earth, is it not like a bellows? Empty yet never exhausted, moving and giving more. Many words wear out. Better to hold the middle.'},
      {n:6,t:'Chapter 6',c:'The valley spirit never dies. It is called the mysterious woman. The gate of the mysterious woman is the root of Heaven and Earth. It stretches continuously, barely existent. Use it without effort.'},
      {n:7,t:'Chapter 7',c:'Heaven is eternal, Earth enduring. The reason they can be eternal and enduring is that they do not live for themselves. Therefore they live long. Therefore the sage puts himself last and yet comes first; forgets himself and yet endures. Is it not because of his selflessness? Thus he fulfills his own self.'},
      {n:8,t:'Chapter 8',c:'The highest good is like water. Water benefits all things without contention. It resides where others disdain, thus it is close to the Tao. In dwelling, live close to the ground. In thinking, keep to the deep. In giving, be kind. In speaking, be truthful. In governing, be just. In work, be capable. In action, be timely. Only by not contending does one avoid blame.'},
      {n:9,t:'Chapter 9',c:'To hold and fill to overflowing is not as good as stopping. To sharpen and hone is not long preserved. Halls filled with gold and jade cannot be safeguarded. Wealth and honor breed arrogance, leaving behind misfortune. To retire when the work is done is the way of Heaven.'},
      {n:10,t:'Chapter 10',c:'Can you embrace the One and never leave it? Can you concentrate your energy and become supple as a newborn? Can you cleanse your inner vision until it is spotless? Can you love the people and govern without interference? Can you open and close the gates of Heaven without effort? Can you understand all and yet know nothing? Give birth and nurture. Give without possessing. Act without expecting. Lead without controlling. This is called mysterious virtue.'},
      {n:11,t:'Chapter 11',c:'Thirty spokes share one hub. It is the empty space that makes the wheel useful. Clay is shaped into a vessel. It is the empty space that makes the vessel useful. Doors and windows are cut for a room. It is the empty space that makes the room useful. Therefore, having creates usefulness, but emptiness creates meaning.'},
      {n:12,t:'Chapter 12',c:'Five colors blind the eye. Five tones deafen the ear. Five flavors dull the palate. Racing and hunting drive the heart wild. Rare goods tempt one to misbehave. Therefore the sage satisfies the belly, not the eyes. He lets go of that and chooses this.'},
      {n:13,t:'Chapter 13',c:'Favor and disgrace are like fear. Honor and calamity are like the self. What does it mean that favor and disgrace are like fear? Favor debases. Gaining it is fearful. Losing it is fearful. What does it mean that honor and calamity are like the self? Disaster comes from having a self. Without a self, what disaster can befall? One who values the self as the world can be entrusted with the world.'},
      {n:14,t:'Chapter 14',c:'Looked at but not seen — call it invisible. Listened to but not heard — call it inaudible. Reached for but not touched — call it intangible. These three cannot be fully grasped, thus they merge as one. Above is not bright. Below is not dark. Unceasing, it cannot be named, returning to nothingness. This is the formless form, the imageless image. Call it elusive. Meet it, you see no face. Follow it, you see no back. Hold to the ancient Tao to master what exists today. To know the ancient beginning is the essence of the Tao.'},
      {n:15,t:'Chapter 15',c:'The ancient masters were subtle, mysterious, profound, and responsive. Because they were beyond understanding, I can only describe them vaguely: cautious as crossing a winter stream, alert as fearing all around, formal as a guest, yielding as ice about to melt, simple as an uncarved block, open as a valley, murky as muddy water. Who can settle the muddy and gradually clarify? Who can stir the still and gradually bring forth life? Those who hold the Tao do not seek fullness. Not being full, they are beyond renewal and completion.'},
      {n:16,t:'Chapter 16',c:'Empty the self completely. Embrace perfect peace. All things arise together. I see them return. All things flourish, then return to their root. Returning to the root is stillness. Stillness is returning to life. Returning to life is constancy. Knowing constancy is clarity. Not knowing constancy brings chaos. Knowing constancy brings acceptance. Acceptance brings impartiality. Impartiality brings sovereignty. Sovereignty brings Heaven. Heaven brings the Tao. The Tao brings eternity. The body may perish, but the Tao never harms.'},
      {n:17,t:'Chapter 17',c:'The highest rulers are barely known. Next are those the people love and praise. Next are those they fear. Next are those they despise. When trust is lacking, there is distrust. The sage is careful with words. When the work is done and things accomplished, the people say: We did this ourselves.'},
      {n:18,t:'Chapter 18',c:'When the great Tao is abandoned, kindness and morality arise. When cleverness and knowledge appear, great hypocrisy follows. When family relations are discordant, filial piety and compassion appear. When the state is in chaos, loyal ministers arise.'},
      {n:19,t:'Chapter 19',c:'Abandon sageliness and discard wisdom, and the people benefit a hundredfold. Abandon kindness and discard morality, and the people return to filial piety and compassion. Abandon cleverness and discard profit, and thieves no longer exist. These three are not enough. Therefore let the people hold to simplicity: embrace the uncarved block, reduce selfishness, lessen desires.'},
      {n:20,t:'Chapter 20',c:'Abandon learning and have no worries. How much difference between yes and no? How much difference between good and evil? What others fear, one must also fear. Vast indeed, without end. The multitude are joyous, feasting as if enjoying a great sacrifice, as if ascending a terrace in spring. I alone am quiet, showing no sign, like an infant who has not yet smiled. I drift, as if belonging nowhere. The multitude have more than enough. I alone seem lacking. I have the mind of a fool — muddled! The common people are bright. I alone am dim. The common people are sharp. I alone am muddled. Calm as the sea, drifting endlessly. The multitude have purpose. I alone am stubborn and humble. I alone differ from others. I value the mother of all.'},
      {n:21,t:'Chapter 21',c:'The greatest virtue follows the Tao alone. The Tao is elusive and evasive. Elusive and evasive, yet within it are forms. Evasive and elusive, yet within it are things. Dark and deep, yet within it is essence. The essence is truthful. Within it is trust. From ancient times until now, its name endures, witnessing the beginning of all. How do I know the nature of all? Through this.'},
      {n:22,t:'Chapter 22',c:'Bent becomes whole. Crooked becomes straight. Hollow becomes full. Worn becomes new. Little becomes gain. Much becomes confusion. Therefore the sage embraces the One as the model for the world. Not seeing oneself, one is clear. Not asserting oneself, one is distinguished. Not boasting, one has merit. Not praising oneself, one endures. Only by not contending does one find no opposition in the world. The ancient saying "bent becomes whole" — is it empty words? Truly, wholeness returns to it.'}
    ],
    'es':[
      {n:1,t:'Capítulo 1',c:'El Tao que puede ser expresado no es el Tao eterno. El nombre que puede ser nombrado no es el nombre eterno. Lo sin nombre es el origen del cielo y la tierra. Lo nombrado es la madre de todas las cosas. Libre de deseos, se puede ver el misterio. Con deseos, se pueden ver las manifestaciones. Ambos surgen de la misma fuente pero difieren en nombre. Esto aparece como oscuridad. Oscuridad dentro de la oscuridad. La puerta a todo misterio.'},
      {n:2,t:'Capítulo 2',c:'Cuando el mundo conoce la belleza como belleza, surge la fealdad. Cuando conoce el bien como bien, surge el mal. Así, el ser y el no-ser se generan mutuamente, lo difícil y lo fácil se completan, lo largo y lo corto se forman, lo alto y lo bajo se inclinan, la voz y el sonido se armonizan, el antes y el después se suceden. Por lo tanto, el sabio actúa sin esfuerzo y enseña sin palabras. Todas las cosas surgen sin ser creadas, son nutridas sin posesión, actúan sin expectativa. Cuando la obra está hecha, se olvida. Por eso perdura para siempre.'},
      {n:3,t:'Capítulo 3',c:'No exaltes al sabio, y el pueblo no competirá. No valores bienes raros, y no robarán. No muestres lo deseable, y sus corazones no serán perturbados. Por lo tanto, el sabio gobierna vaciando corazones, llenando vientres, debilitando ambiciones y fortaleciendo huesos. Si el pueblo está sin conocimiento y deseo, los astutos no se atreven a actuar. Practica la no-acción, y todo será gobernado.'},
      {n:4,t:'Capítulo 4',c:'El Tao está vacío pero inagotable. Profundo como la fuente de todas las cosas. Embota los bordes afilados, desenreda nudos, suaviza el resplandor, se funde con el polvo. Claro como agua quieta, parece permanecer. No sé de quién es hijo. Precede a los ancestros de los dioses.'},
      {n:5,t:'Capítulo 5',c:'El Cielo y la Tierra no son bondadosos. Tratan todas las cosas como perros de paja. El sabio no es bondadoso. Trata al pueblo como perros de paja. Entre el Cielo y la Tierra, ¿no es como un fuelle? Vacío pero nunca exhausto, moviéndose y dando más. Muchas palabras se desgastan. Mejor sostener el centro.'},
      {n:6,t:'Capítulo 6',c:'El espíritu del valle nunca muere. Se llama la mujer misteriosa. La puerta de la mujer misteriosa es la raíz del Cielo y la Tierra. Se extiende continuamente, apenas existente. Úsalo sin esfuerzo.'},
      {n:7,t:'Capítulo 7',c:'El Cielo es eterno, la Tierra perdurable. La razón por la que pueden ser eternos y perdurables es que no viven para sí mismos. Por lo tanto viven mucho. Así, el sabio se pone al final y sin embargo llega primero; se olvida de sí mismo y sin embargo perdura.'},
      {n:8,t:'Capítulo 8',c:'El bien supremo es como el agua. El agua beneficia a todas las cosas sin lucha. Reside donde otros desdeñan, así está cerca del Tao. En la vivienda, vive cerca del suelo. En el pensamiento, mantente profundo. Al dar, sé bondadoso. Al hablar, sé veraz. Al gobernar, sé justo. En el trabajo, sé capaz. En la acción, sé oportuno. Solo sin luchar se evita la culpa.'},
      {n:9,t:'Capítulo 9',c:'Sostener y llenar hasta desbordar no es tan bueno como detenerse. Afilar y amolar no se preserva por largo tiempo. Salones llenos de oro y jade no pueden ser protegidos. La riqueza y el honor engendran arrogancia, dejando atrás la desgracia. Retirarse cuando el trabajo está hecho es el camino del Cielo.'},
      {n:10,t:'Capítulo 10',c:'¿Puedes abrazar el Uno y nunca dejarlo? ¿Puedes concentrar tu energía y volverte flexible como un recién nacido? ¿Puedes limpiar tu visión interior hasta que esté impecable? ¿Puedes amar al pueblo y gobernar sin interferencia? Da a luz y nutre. Da sin poseer. Actúa sin esperar. Lidera sin controlar. Esto se llama virtud misteriosa.'}
    ],
    'pt':[
      {n:1,t:'Capítulo 1',c:'O Tao que pode ser expresso não é o Tao eterno. O nome que pode ser nomeado não é o nome eterno. O sem nome é a origem do céu e da terra. O nomeado é a mãe de todas as coisas. Livre de desejos, pode-se ver o mistério. Com desejos, podem-se ver as manifestações. Ambos surgem da mesma fonte, mas diferem no nome. Isso aparece como escuridão. Escuridão dentro da escuridão. A porta para todo mistério.'},
      {n:2,t:'Capítulo 2',c:'Quando o mundo conhece a beleza como beleza, surge a feiura. Quando conhece o bem como bem, surge o mal. Assim, ser e não-ser dão origem um ao outro, difícil e fácil se completam, longo e curto se formam, alto e baixo se inclinam, voz e som se harmonizam, antes e depois se seguem. Portanto, o sábio age sem esforço e ensina sem palavras. Todas as coisas surgem sem serem criadas, são nutridas sem posse, agem sem expectativa. Quando o trabalho é feito, é esquecido. É por isso que dura para sempre.'},
      {n:3,t:'Capítulo 3',c:'Não exalte o sábio, e o povo não competirá. Não valorize bens raros, e eles não roubarão. Não mostre o que é desejável, e seus corações não serão perturbados. Portanto, o sábio governa esvaziando corações, enchendo barrigas, enfraquecendo ambições e fortalecendo ossos. Se o povo está sem conhecimento e desejo, os espertos não ousam agir. Pratique a não-ação, e tudo será governado.'},
      {n:4,t:'Capítulo 4',c:'O Tao está vazio, mas inesgotável. Profundo como a fonte de todas as coisas. Embota arestas afiadas, desembaraça nós, suaviza o brilho, funde-se com a poeira. Claro como água parada, parece permanecer. Não sei de quem é filho. Precede os ancestrais dos deuses.'},
      {n:5,t:'Capítulo 5',c:'O Céu e a Terra não são bondosos. Tratam todas as coisas como cães de palha. O sábio não é bondoso. Trata o povo como cães de palha. Entre o Céu e a Terra, não é como um fole? Vazio, mas nunca exausto, movendo-se e dando mais. Muitas palavras se desgastam. Melhor manter o centro.'}
    ]
  }
},
{ id:'lunyu', type:'哲学',
  name:{'zh-CN':'论语','zh-TW':'論語','en':'The Analects','es':'Analectas','pt':'Analectos'},
  author:{'zh-CN':'孔子及弟子','zh-TW':'孔子及弟子','en':'Confucius and his disciples','es':'Confucio y sus discípulos','pt':'Confúcio e seus discípulos'},
  dynasty:{'zh-CN':'春秋-战国','zh-TW':'春秋-戰國','en':'Spring and Autumn - Warring States','es':'Primaveras y Otoños - Reinos Combatientes','pt':'Primaveras e Outonos - Reinos Combatentes'},
  intro:{'zh-CN':'《论语》是儒家学派的经典著作之一，由孔子的弟子及其再传弟子编撰而成。它以语录体和对话文体记录了孔子及其弟子的言行，集中体现了孔子的政治主张、伦理思想、道德观念及教育原则。全书共20篇，其中许多格言警句已成为中华民族的文化基因。','zh-TW':'《論語》是儒家學派的經典著作之一，由孔子的弟子及其再傳弟子編撰而成。它以語錄體和對話文體記錄了孔子及其弟子的言行，集中體現了孔子的政治主張、倫理思想、道德觀念及教育原則。全書共20篇，其中許多格言警句已成為中華民族的文化基因。','en':'The Analects is one of the most important texts of Confucianism, compiled by the disciples and their followers of Confucius. It records the words and deeds of Confucius and his disciples in the form of dialogues and sayings, embodying Confucius\' political views, ethical thoughts, moral concepts, and educational principles. Consisting of 20 books, many of its aphorisms have become part of the cultural DNA of the Chinese nation.','es':'Las Analectas es uno de los textos más importantes del confucianismo, compilado por los discípulos y sus seguidores de Confucio. Registra las palabras y hechos de Confucio y sus discípulos en forma de diálogos y dichos, encarnando las opiniones políticas, pensamientos éticos, conceptos morales y principios educativos de Confucio. Consta de 20 libros, muchos de cuyos aforismos se han convertido en parte del ADN cultural de la nación china.','pt':'Os Analectos é um dos textos mais importantes do Confucionismo, compilado pelos discípulos e seus seguidores de Confúcio. Registra as palavras e feitos de Confúcio e seus discípulos na forma de diálogos e ditados, incorporando as visões políticas, pensamentos éticos, conceitos morais e princípios educacionais de Confúcio. Consiste em 20 livros, muitos de cujos aforismos se tornaram parte do DNA cultural da nação chinesa.'},
  totalChapters:20,
  chapters:{
    'zh-CN':[
      {n:1,t:'学而第一',c:'子曰：学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\n有子曰：其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！\n子曰：巧言令色，鲜矣仁！\n曾子曰：吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？\n子曰：道千乘之国，敬事而信，节用而爱人，使民以时。\n子曰：弟子入则孝，出则弟，谨而信，泛爱众，而亲仁。行有余力，则以学文。\n子夏曰：贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。\n子曰：君子不重则不威，学则不固。主忠信。无友不如己者。过则勿惮改。\n曾子曰：慎终追远，民德归厚矣。\n子禽问于子贡曰：夫子至于是邦也，必闻其政，求之与？抑与之与？子贡曰：夫子温、良、恭、俭、让以得之。夫子之求之也，其诸异乎人之求之与？\n子曰：父在观其志，父没观其行，三年无改于父之道，可谓孝矣。\n有子曰：礼之用，和为贵。先王之道，斯为美，小大由之。有所不行，知和而和，不以礼节之，亦不可行也。\n有子曰：信近于义，言可复也。恭近于礼，远耻辱也。因不失其亲，亦可宗也。\n子曰：君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。\n子贡曰：贫而无谄，富而无骄，何如？子曰：可也。未若贫而乐，富而好礼者也。子贡曰：《诗》云：如切如磋，如琢如磨，其斯之谓与？子曰：赐也，始可与言《诗》已矣，告诸往而知来者。\n子曰：不患人之不己知，患不知人也。'},
      {n:2,t:'为政第二',c:'子曰：为政以德，譬如北辰，居其所而众星共之。\n子曰：《诗》三百，一言以蔽之，曰：思无邪。\n子曰：道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。\n子曰：吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。\n孟懿子问孝，子曰：无违。樊迟御，子告之曰：孟孙问孝于我，我对曰无违。樊迟曰：何谓也？子曰：生，事之以礼；死，葬之以礼，祭之以礼。\n孟武伯问孝，子曰：父母唯其疾之忧。\n子游问孝，子曰：今之孝者，是谓能养。至于犬马，皆能有养；不敬，何以别乎？\n子夏问孝，子曰：色难。有事弟子服其劳，有酒食先生馔，曾是以为孝乎？\n子曰：吾与回言终日，不违如愚。退而省其私，亦足以发。回也不愚。\n子曰：视其所以，观其所由，察其所安。人焉廋哉？人焉廋哉？\n子曰：温故而知新，可以为师矣。\n子曰：君子不器。\n子贡问君子，子曰：先行其言而后从之。\n子曰：君子周而不比，小人比而不周。\n子曰：学而不思则罔，思而不学则殆。\n子曰：攻乎异端，斯害也已。\n子曰：由，诲女知之乎？知之为知之，不知为不知，是知也。\n子张学干禄，子曰：多闻阙疑，慎言其余，则寡尤；多见阙殆，慎行其余，则寡悔。言寡尤，行寡悔，禄在其中矣。\n哀公问曰：何为则民服？孔子对曰：举直错诸枉，则民服；举枉错诸直，则民不服。\n季康子问：使民敬忠以劝，如之何？子曰：临之以庄则敬，孝慈则忠，举善而教不能则劝。\n或谓孔子曰：子奚不为政？子曰：《书》云：孝乎惟孝，友于兄弟，施于有政。是亦为政，奚其为为政？\n子曰：人而无信，不知其可也。大车无輗，小车无軏，其何以行之哉？\n子张问：十世可知也？子曰：殷因于夏礼，所损益，可知也；周因于殷礼，所损益，可知也；其或继周者，虽百世可知也。\n子曰：非其鬼而祭之，谄也。见义不为，无勇也。'},
      {n:3,t:'八佾第三',c:'孔子谓季氏：八佾舞于庭，是可忍也，孰不可忍也？\n三家者以《雍》彻。子曰：相维辟公，天子穆穆，奚取于三家之堂？\n子曰：人而不仁，如礼何？人而不仁，如乐何？\n林放问礼之本，子曰：大哉问！礼，与其奢也，宁俭；丧，与其易也，宁戚。\n子曰：夷狄之有君，不如诸夏之亡也。\n季氏旅于泰山。子谓冉有曰：女弗能救与？对曰：不能。子曰：呜呼！曾谓泰山，不如林放乎？\n子曰：君子无所争，必也射乎！揖让而升，下而饮，其争也君子。\n子夏问曰：巧笑倩兮，美目盼兮，素以为绚兮，何谓也？子曰：绘事后素。曰：礼后乎？子曰：起予者商也！始可与言《诗》已矣。\n子曰：夏礼，吾能言之，杞不足征也；殷礼，吾能言之，宋不足征也。文献不足故也，足则吾能征之矣。\n子曰：禘自既灌而往者，吾不欲观之矣。\n或问禘之说，子曰：不知也。知其说者之于天下也，其如示诸斯乎？指其掌。\n祭如在，祭神如神在。子曰：吾不与祭，如不祭。\n王孙贾问曰：与其媚于奥，宁媚于灶，何谓也？子曰：不然，获罪于天，无所祷也。\n子曰：周监于二代，郁郁乎文哉！吾从周。\n子入太庙，每事问。或曰：孰谓鄹人之子知礼乎？入太庙，每事问。子闻之曰：是礼也。\n子曰：射不主皮，为力不同科，古之道也。\n子贡欲去告朔之饩羊，子曰：赐也，尔爱其羊，我爱其礼。\n子曰：事君尽礼，人以为谄也。\n定公问：君使臣，臣事君，如之何？孔子对曰：君使臣以礼，臣事君以忠。\n子曰：《关雎》乐而不淫，哀而不伤。\n哀公问社于宰我，宰我对曰：夏后氏以松，殷人以柏，周人以栗，曰使民战栗。子闻之曰：成事不说，遂事不谏，既往不咎。\n子曰：管仲之器小哉！或曰：管仲俭乎？曰：管氏有三归，官事不摄，焉得俭？然则管仲知礼乎？曰：邦君树塞门，管氏亦树塞门；邦君为两君之好，有反坫，管氏亦有反坫。管氏而知礼，孰不知礼？\n子语鲁大师乐，曰：乐其可知也：始作，翕如也；从之，纯如也，皦如也，绎如也，以成。\n仪封人请见，曰：君子之至于斯也，吾未尝不得见也。从者见之。出曰：二三子何患于丧乎？天下之无道也久矣，天将以夫子为木铎。\n子谓《韶》：尽美矣，又尽善也。谓《武》：尽美矣，未尽善也。\n子曰：居上不宽，为礼不敬，临丧不哀，吾何以观之哉？'},
      {n:4,t:'里仁第四',c:'子曰：里仁为美。择不处仁，焉得知？\n子曰：不仁者不可以久处约，不可以长处乐。仁者安仁，知者利仁。\n子曰：唯仁者能好人，能恶人。\n子曰：苟志于仁矣，无恶也。\n子曰：富与贵，是人之所欲也，不以其道得之，不处也；贫与贱，是人之所恶也，不以其道得之，不去也。君子去仁，恶乎成名？君子无终食之间违仁，造次必于是，颠沛必于是。\n子曰：我未见好仁者，恶不仁者。好仁者，无以尚之；恶不仁者，其为仁矣，不使不仁者加乎其身。有能一日用其力于仁矣乎？我未见力不足者。盖有之矣，我未之见也。\n子曰：人之过也，各于其党。观过，斯知仁矣。\n子曰：朝闻道，夕死可矣。\n子曰：士志于道，而耻恶衣恶食者，未足与议也。\n子曰：君子之于天下也，无适也，无莫也，义之与比。\n子曰：君子怀德，小人怀土；君子怀刑，小人怀惠。\n子曰：放于利而行，多怨。\n子曰：能以礼让为国乎？何有？不能以礼让为国，如礼何？\n子曰：不患无位，患所以立；不患莫己知，求为可知也。\n子曰：参乎！吾道一以贯之。曾子曰：唯。子出，门人问曰：何谓也？曾子曰：夫子之道，忠恕而已矣。\n子曰：君子喻于义，小人喻于利。\n子曰：见贤思齐焉，见不贤而内自省也。\n子曰：事父母几谏，见志不从，又敬不违，劳而不怨。\n子曰：父母在，不远游，游必有方。\n子曰：三年无改于父之道，可谓孝矣。\n子曰：父母之年，不可不知也。一则以喜，一则以惧。\n子曰：古者言之不出，耻躬之不逮也。\n子曰：以约失之者鲜矣。\n子曰：君子欲讷于言而敏于行。\n子曰：德不孤，必有邻。\n子游曰：事君数，斯辱矣；朋友数，斯疏矣。'},
      {n:5,t:'公冶长第五',c:'子谓公冶长：可妻也，虽在缧绁之中，非其罪也。以其子妻之。\n子谓南容：邦有道，不废；邦无道，免于刑戮。以其兄之子妻之。\n子谓子贱：君子哉若人！鲁无君子者，斯焉取斯？\n子贡问曰：赐也何如？子曰：女器也。曰：何器也？曰：瑚琏也。\n或曰：雍也仁而不佞。子曰：焉用佞？御人以口给，屡憎于人。不知其仁，焉用佞？\n子使漆雕开仕，对曰：吾斯之未能信。子说。\n子曰：道不行，乘桴浮于海，从我者其由与？子路闻之喜。子曰：由也好勇过我，无所取材。\n孟武伯问：子路仁乎？子曰：不知也。又问，子曰：由也，千乘之国，可使治其赋也，不知其仁也。求也何如？子曰：求也，千室之邑，百乘之家，可使为之宰也，不知其仁也。赤也何如？子曰：赤也，束带立于朝，可使与宾客言也，不知其仁也。\n子谓子贡曰：女与回也孰愈？对曰：赐也何敢望回？回也闻一以知十，赐也闻一以知二。子曰：弗如也，吾与女弗如也。\n宰予昼寝，子曰：朽木不可雕也，粪土之墙不可圬也，于予与何诛？子曰：始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。于予与改是。\n子曰：吾未见刚者。或对曰：申枨。子曰：枨也欲，焉得刚？\n子贡曰：我不欲人之加诸我也，吾亦欲无加诸人。子曰：赐也，非尔所及也。\n子贡曰：夫子之文章，可得而闻也；夫子之言性与天道，不可得而闻也。\n子路有闻，未之能行，唯恐有闻。\n子贡问曰：孔文子何以谓之文也？子曰：敏而好学，不耻下问，是以谓之文也。\n子谓子产：有君子之道四焉：其行己也恭，其事上也敬，其养民也惠，其使民也义。\n子曰：晏平仲善与人交，久而敬之。\n子曰：臧文仲居蔡，山节藻棁，何如其知也？\n子张问曰：令尹子文三仕为令尹，无喜色；三已之，无愠色。旧令尹之政，必以告新令尹。何如？子曰：忠矣。曰：仁矣乎？曰：未知，焉得仁？崔子弑齐君，陈文子有马十乘，弃而违之。至于他邦，则曰：犹吾大夫崔子也。违之。之一邦，则又曰：犹吾大夫崔子也。违之。何如？子曰：清矣。曰：仁矣乎？曰：未知，焉得仁？\n季文子三思而后行，子闻之曰：再，斯可矣。\n子曰：宁武子，邦有道则知，邦无道则愚。其知可及也，其愚不可及也。\n子在陈曰：归与！归与！吾党之小子狂简，斐然成章，不知所以裁之。\n子曰：伯夷、叔齐不念旧恶，怨是用希。\n子曰：孰谓微生高直？或乞醯焉，乞诸其邻而与之。\n子曰：巧言、令色、足恭，左丘明耻之，丘亦耻之。匿怨而友其人，左丘明耻之，丘亦耻之。\n颜渊、季路侍，子曰：盍各言尔志？子路曰：愿车马衣轻裘，与朋友共，敝之而无憾。颜渊曰：愿无伐善，无施劳。子路曰：愿闻子之志。子曰：老者安之，朋友信之，少者怀之。\n子曰：已矣乎！吾未见能见其过而内自讼者也。\n子曰：十室之邑，必有忠信如丘者焉，不如丘之好学也。'}
    ],
    'en':[
      {n:1,t:'Book 1: Xue Er',c:'The Master said: "Is it not pleasant to learn and practice what you have learned? Is it not delightful to have friends coming from afar? Is he not a gentleman who is not upset when others do not understand him?"\nMaster You said: "A man who is filial to his parents and respectful to his elders rarely goes against his superiors. One who never goes against his superiors will never rebel. The gentleman works on the root. When the root is established, the Way grows. Filial piety and brotherly respect — are these not the root of humanity?"\nThe Master said: "Clever words and a pleasing face rarely accompany true virtue."\nMaster Zeng said: "I examine myself three times daily: Have I been loyal in working for others? Have I been trustworthy in dealing with friends? Have I practiced what I have learned?"\nThe Master said: "To govern a large state, be diligent and trustworthy, be economical and love the people, and employ the people at the proper seasons."'},
      {n:2,t:'Book 2: Wei Zheng',c:'The Master said: "One who governs by virtue is like the North Star — it stays in its place, and all the other stars revolve around it."\nThe Master said: "The three hundred poems can be summed up in one phrase: Have no depraved thoughts."\nThe Master said: "If you govern by laws and punish by penalties, the people will avoid them but have no sense of shame. If you govern by virtue and guide by ritual, they will have a sense of shame and come to you of their own accord."\nThe Master said: "At fifteen I set my mind on learning. At thirty I stood firm. At forty I had no doubts. At fifty I knew the will of Heaven. At sixty I was attuned to it. At seventy I could follow my heart\'s desire without overstepping the bounds."'},
      {n:3,t:'Book 3: Ba Yi',c:'Confucius said of the Ji family: "They used eight rows of dancers in their courtyard. If this can be tolerated, what cannot?"\nThe Master said: "A man without humanity — what has he to do with ritual? A man without humanity — what has he to do with music?"\nLin Fang asked about the essence of ritual. The Master said: "What a great question! In ritual, it is better to be simple than extravagant. In mourning, it is better to be deeply sorrowful than to be elaborate in form."'},
      {n:4,t:'Book 4: Li Ren',c:'The Master said: "It is beautiful to live among the humane. How can one be considered wise who does not choose to dwell among humanity?"\nThe Master said: "Wealth and honor are what everyone desires, but if they cannot be obtained in the right way, do not accept them. Poverty and lowliness are what everyone hates, but if they cannot be avoided in the right way, do not abandon them. If a gentleman abandons humanity, how can he be worthy of the name?"\nThe Master said: "If I heard the Way in the morning, I could die content in the evening."'},
      {n:5,t:'Book 5: Gongye Chang',c:'The Master said of Gongye Chang: "He can be married. Though he was imprisoned, it was not his fault." And he married his daughter to him.\nZi Gong asked: "What do you think of me?" The Master said: "You are a vessel." "What kind of vessel?" "A sacred vessel of jade."\nThe Master said: "The Way does not prevail. I will take a raft and drift out to sea. Who will follow me? Zi Lu, I suppose." When Zi Lu heard this, he was overjoyed. The Master said: "Zi Lu is braver than I, but we have no materials to make the raft."'}
    ]
  }

{ id:'sunzibingfa', type:'军事',
  name:{'zh-CN':'孙子兵法','zh-TW':'孫子兵法','en':'The Art of War','es':'El Arte de la Guerra','pt':'A Arte da Guerra'},
  author:{'zh-CN':'孙武','zh-TW':'孫武','en':'Sun Tzu','es':'Sun Tzu','pt':'Sun Tzu'},
  dynasty:{'zh-CN':'春秋','zh-TW':'春秋','en':'Spring and Autumn','es':'Primaveras y Otoños','pt':'Primaveras e Outonos'},
  intro:{'zh-CN':'《孙子兵法》是中国现存最早的兵书，也是世界上最早的军事著作，被誉为“兵学圣典”。孙武所著，共13篇。该书系统阐述了战争的规律、战略战术原则，以及治军之道。其思想不仅应用于军事领域，也被广泛运用于商业、管理、政治等领域，被翻译成多种语言，在全球范围内产生深远影响。','zh-TW':'《孫子兵法》是中國現存最早的兵書，也是世界上最早的軍事著作，被譽為「兵學聖典」。孫武所著，共13篇。該書系統闡述了戰爭的規律、戰略戰術原則，以及治軍之道。其思想不僅應用於軍事領域，也被廣泛運用於商業、管理、政治等領域，被翻譯成多種語言，在全球範圍內產生深遠影響。','en':'The Art of War is the earliest surviving military treatise in China and one of the oldest in the world, honored as the "Sacred Classic of Military Science." Written by Sun Tzu in 13 chapters, it systematically expounds the laws of war, principles of strategy and tactics, and the art of commanding an army. Its wisdom extends beyond military applications to business, management, and politics, and it has been translated into numerous languages with far-reaching global influence.','es':'El Arte de la Guerra es el tratado militar más antiguo que se conserva en China y uno de los más antiguos del mundo, honrado como el "Clásico Sagrado de la Ciencia Militar". Escrito por Sun Tzu en 13 capítulos, expone sistemáticamente las leyes de la guerra, los principios de estrategia y táctica, y el arte de comandar un ejército. Su sabiduría se extiende más allá de las aplicaciones militares a los negocios, la gestión y la política, y ha sido traducida a numerosos idiomas con una influencia global de gran alcance.','pt':'A Arte da Guerra é o tratado militar mais antigo preservado na China e um dos mais antigos do mundo, honrado como o "Clássico Sagrado da Ciência Militar". Escrito por Sun Tzu em 13 capítulos, expõe sistematicamente as leis da guerra, princípios de estratégia e tática, e a arte de comandar um exército. Sua sabedoria se estende além das aplicações militares para negócios, gestão e política, e foi traduzida para vários idiomas com influência global de grande alcance.'},

  chapters:{
    'zh-CN':[
      {n:1,t:'始计第一',c:'孙子曰：兵者，国之大事，死生之地，存亡之道，不可不察也。\n故经之以五事，校之以计，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。道者，令民与上同意也，故可以与之死，可以与之生，而不畏危。天者，阴阳、寒暑、时制也。地者，远近、险易、广狭、死生也。将者，智、信、仁、勇、严也。法者，曲制、官道、主用也。凡此五者，将莫不闻，知之者胜，不知者不胜。\n故校之以计，而索其情。曰：主孰有道？将孰有能？天地孰得？法令孰行？兵众孰强？士卒孰练？赏罚孰明？吾以此知胜负矣。将听吾计，用之必胜，留之；将不听吾计，用之必败，去之。\n计利以听，乃为之势，以佐其外。势者，因利而制权也。兵者，诡道也。故能而示之不能，用而示之不用，近而示之远，远而示之近。利而诱之，乱而取之，实而备之，强而避之，怒而挠之，卑而骄之，佚而劳之，亲而离之。攻其无备，出其不意。此兵家之胜，不可先传也。\n夫未战而庙算胜者，得算多也；未战而庙算不胜者，得算少也。多算胜，少算不胜，而况于无算乎！吾以此观之，胜负见矣。'},
      {n:2,t:'作战第二',c:'孙子曰：凡用兵之法，驰车千驷，革车千乘，带甲十万，千里馈粮，则内外之费，宾客之用，胶漆之材，车甲之奉，日费千金，然后十万之师举矣。其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足。夫钝兵挫锐，屈力殚货，则诸侯乘其弊而起，虽有智者，不能善其后矣。故兵闻拙速，未睹巧之久也。夫兵久而国利者，未之有也。故不尽知用兵之害者，则不能尽知用兵之利也。\n善用兵者，役不再籍，粮不三载，取用于国，因粮于敌，故军食可足也。国之贫于师者远输，远输则百姓贫。近于师者贵卖，贵卖则百姓财竭，财竭则急于丘役。力屈财殚，中原内虚于家。百姓之费，十去其七；公家之费，破车罢马，甲胄矢弩，戟盾蔽橹，丘牛大车，十去其六。故智将务食于敌，食敌一钟，当吾二十钟；萁秆一石，当吾二十石。\n故杀敌者，怒也；取敌之利者，货也。故车战，得车十乘已上，赏其先得者，而更其旌旗，车杂而乘之，卒善而养之，是谓胜敌而益强。故兵贵胜，不贵久。故知兵之将，生民之司命，国家安危之主也。'},
      {n:3,t:'谋攻第三',c:'孙子曰：凡用兵之法，全国为上，破国次之；全军为上，破军次之；全旅为上，破旅次之；全卒为上，破卒次之；全伍为上，破伍次之。是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。故上兵伐谋，其次伐交，其次伐兵，其下攻城。攻城之法，为不得已。修橹轒辒，具器械，三月而后成，距堙，又三月而后已。将不胜其忿而蚁附之，杀士三分之一，而城不拔者，此攻之灾也。故善用兵者，屈人之兵而非战也，拔人之城而非攻也，毁人之国而非久也，必以全争于天下，故兵不顿而利可全，此谋攻之法也。\n故用兵之法，十则围之，五则攻之，倍则分之，敌则能战之，少则能逃之，不若则能避之。故小敌之坚，大敌之擒也。夫将者，国之辅也。辅周则国必强，辅隙则国必弱。故君之所以患于军者三：不知军之不可以进而谓之进，不知军之不可以退而谓之退，是谓縻军；不知三军之事而同三军之政者，则军士惑矣；不知三军之权而同三军之任，则军士疑矣。三军既惑且疑，则诸侯之难至矣，是谓乱军引胜。故知胜有五：知可以战与不可以战者胜，识众寡之用者胜，上下同欲者胜，以虞待不虞者胜，将能而君不御者胜。此五者，知胜之道也。故曰：知彼知己，百战不殆；不知彼而知己，一胜一负；不知彼不知己，每战必殆。'},
      {n:4,t:'军形第四',c:'孙子曰：昔之善战者，先为不可胜，以待敌之可胜。不可胜在己，可胜在敌。故善战者，能为不可胜，不能使敌之必可胜。故曰：胜可知，而不可为。不可胜者，守也；可胜者，攻也。守则不足，攻则有余。善守者，藏于九地之下；善攻者，动于九天之上，故能自保而全胜也。见胜不过众人之所知，非善之善者也；战胜而天下曰善，非善之善者也。故举秋毫不为多力，见日月不为明目，闻雷霆不为聪耳。古之所谓善战者，胜于易胜者也。故善战者之胜也，无智名，无勇功。故其战胜不忒，不忒者，其所措必胜，胜已败者也。故善战者，立于不败之地，而不失敌之败也。是故胜兵先胜而后求战，败兵先战而后求胜。善用兵者，修道而保法，故能为胜败之政。兵法：一曰度，二曰量，三曰数，四曰称，五曰胜。地生度，度生量，量生数，数生称，称生胜。故胜兵若以镒称铢，败兵若以铢称镒。胜者之战民也，若决积水于千仞之溪者，形也。'},
      {n:5,t:'兵势第五',c:'孙子曰：凡治众如治寡，分数是也；斗众如斗寡，形名是也；三军之众，可使必受敌而无败者，奇正是也；兵之所加，如以碫投卵者，虚实是也。凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江河。终而复始，日月是也；死而复生，四时是也。声不过五，五声之变，不可胜听也；色不过五，五色之变，不可胜观也；味不过五，五味之变，不可胜尝也；战势不过奇正，奇正之变，不可胜穷也。奇正相生，如循环之无端，孰能穷之？激水之疾，至于漂石者，势也；鸷鸟之疾，至于毁折者，节也。是故善战者，其势险，其节短。势如彍弩，节如发机。纷纷纭纭，斗乱而不可乱也；浑浑沌沌，形圆而不可败也。乱生于治，怯生于勇，弱生于强。治乱，数也；勇怯，势也；强弱，形也。故善动敌者，形之，敌必从之；予之，敌必取之；以利动之，以卒待之。故善战者，求之于势，不责于人，故能择人而任势。任势者，其战人也，如转木石。木石之性，安则静，危则动，方则止，圆则行。故善战人之势，如转圆石于千仞之山者，势也。'},
      {n:6,t:'虚实第六',c:'孙子曰：凡先处战地而待敌者佚，后处战地而趋战者劳。故善战者，致人而不致于人。能使敌自至者，利之也；能使敌不得至者，害之也。故敌佚能劳之，饱能饥之，安能动之。出其所不趋，趋其所不意。行千里而不劳者，行于无人之地也；攻而必取者，攻其所不守也；守而必固者，守其所不攻也。故善攻者，敌不知其所守；善守者，敌不知其所攻。微乎微乎，至于无形；神乎神乎，至于无声，故能为敌之司命。进而不可御者，冲其虚也；退而不可追者，速而不可及也。故我欲战，敌虽高垒深沟，不得不与我战者，攻其所必救也；我不欲战，画地而守之，敌不得与我战者，乖其所之也。故形人而我无形，则我专而敌分。我专为一，敌分为十，是以十攻其一也，则我众而敌寡。能以众击寡者，则吾之所与战者约矣。吾所与战之地不可知，不可知，则敌所备者多，敌所备者多，则吾所与战者寡矣。故备前则后寡，备后则前寡，备左则右寡，备右则左寡，无所不备，则无所不寡。寡者，备人者也；众者，使人备己者也。故知战之地，知战之日，则可千里而会战；不知战之地，不知战之日，则左不能救右，右不能救左，前不能救后，后不能救前，而况远者数十里，近者数里乎？以吾度之，越人之兵虽多，亦奚益于胜败哉？故曰：胜可为也。敌虽众，可使无斗。故策之而知得失之计，作之而知动静之理，形之而知死生之地，角之而知有余不足之处。故形兵之极，至于无形。无形，则深间不能窥，智者不能谋。因形而措胜于众，众不能知。人皆知我所以胜之形，而莫知吾所以制胜之形。故其战胜不复，而应形于无穷。夫兵形象水，水之形，避高而趋下；兵之形，避实而击虚。水因地而制流，兵因敌而制胜。故兵无常势，水无常形，能因敌变化而取胜者，谓之神。故五行无常胜，四时无常位，日有短长，月有死生。'}
    ],
    'en':[
      {n:1,t:'Chapter 1: Laying Plans',c:'Sun Tzu said: The art of war is of vital importance to the State. It is a matter of life and death, a road either to safety or to ruin. Hence it is a subject of inquiry that can on no account be neglected.\nThe art of war is governed by five constant factors: (1) The Moral Law; (2) Heaven; (3) Earth; (4) The Commander; (5) Method and discipline.\nThe Moral Law causes the people to be in complete accord with their ruler, so that they will follow him regardless of their lives, undismayed by any danger.\nHeaven signifies night and day, cold and heat, times and seasons.\nEarth comprises distances, great and small; danger and security; open ground and narrow passes; the chances of life and death.\nThe Commander stands for the virtues of wisdom, sincerity, benevolence, courage and strictness.\nBy Method and discipline are to be understood the marshaling of the army in its proper subdivisions, the graduations of rank among the officers, the maintenance of roads by which supplies may reach the army, and the control of military expenditure.\nAll commanders must know these five factors. He who knows them will be victorious; he who knows them not will fail.'},
      {n:2,t:'Chapter 2: Waging War',c:'Sun Tzu said: In the operations of war, when one thousand fast chariots and one thousand heavy chariots are required, with one hundred thousand troops, and when provisions are transported a thousand miles, the expenditures at home and abroad, including the entertainment of guests, the cost of materials such as glue and lacquer, and the maintenance of chariots and armor, will amount to one thousand pieces of gold per day. Only after these preparations can an army of one hundred thousand be mobilized.\nWhen you engage in battle, seek a quick victory. A prolonged war dulls the edge of the army and blunts the sharpness of the spirit. When the army attacks a walled city, its strength is exhausted. When the army is exposed in the field for a long time, the state\'s resources are insufficient.\nThere is no instance of a country having benefited from prolonged warfare. Only those who understand the dangers of war can truly understand its benefits.'},
      {n:3,t:'Chapter 3: Attack by Stratagem',c:'Sun Tzu said: The supreme art of war is to subdue the enemy without fighting. Thus the highest form of generalship is to balk the enemy\'s plans; the next is to prevent the junction of the enemy\'s forces; the next is to attack the enemy in the field; the lowest is to attack walled cities.\nTherefore the skillful leader subdues the enemy\'s troops without any fighting; he captures their cities without laying siege to them; he overthrows their kingdom without lengthy operations in the field. By contesting the whole empire with the whole army, his forces are not worn out and the whole empire benefits.\nHence the saying: If you know the enemy and know yourself, you need not fear the result of a hundred battles. If you know yourself but not the enemy, for every victory gained you will also suffer a defeat. If you know neither the enemy nor yourself, you will succumb in every battle.'},
      {n:4,t:'Chapter 4: Tactical Dispositions',c:'Sun Tzu said: The good fighters of old first put themselves beyond the possibility of defeat, and then waited for an opportunity of defeating the enemy. To secure ourselves against defeat lies in our own hands, but the opportunity of defeating the enemy is provided by the enemy himself. Thus the good fighter is able to secure himself against defeat, but cannot make certain of defeating the enemy.\nHence the saying: One may know how to conquer without being able to do it.\nInvincibility lies in the defense; the possibility of victory in the attack. He who cannot defend attacks; he who can defend does not attack.\nThus the victorious army wins its victories before seeking battle; the defeated army first seeks battle and then seeks victory.'},
      {n:5,t:'Chapter 5: Energy',c:'Sun Tzu said: The control of a large force is the same principle as the control of a few men: it is merely a question of dividing up their numbers. Fighting with a large army under your command is the same as fighting with a small one: it is merely a question of instituting signs and signals.\nThat the whole army may be struck by the enemy without suffering defeat is due to the correct employment of the normal and the extraordinary. The impact of the army on the enemy may be like a grindstone thrown at eggs — this is due to the application of emptiness and fullness.\nIn all fighting, the normal method is used to join battle; the extraordinary method is used to secure victory. The extraordinary methods are as inexhaustible as heaven and earth, unending as the flow of rivers and streams.'},
      {n:6,t:'Chapter 6: Weakness and Strength',c:'Sun Tzu said: Whoever is first in the field and awaits the coming of the enemy will be fresh for the fight; whoever is second in the field and has to hasten to battle will arrive exhausted. Therefore the skillful commander brings the enemy to him and does not allow himself to be brought to the enemy.\nAppear at points which the enemy must hasten to defend; march swiftly to places where you are not expected. To march a thousand miles without tiring, travel where there are no enemies. To be certain to take what you attack, attack where the enemy is unprepared. To be certain of holding what you defend, defend where the enemy cannot attack.\nAll warfare is based on deception. Therefore, when capable, feign incapacity; when active, inactivity. When near, make it appear that you are far away; when far away, that you are near. Offer the enemy a bait to lure him; feign disorder and strike him.'}
    ]
  }
},
{ id:'yijing', type:'易学',
  name:{'zh-CN':'易经','zh-TW':'易經','en':'I Ching (Book of Changes)','es':'I Ching (Libro de los Cambios)','pt':'I Ching (Livro das Mutações)'},
  author:{'zh-CN':'伏羲、周文王、孔子等','zh-TW':'伏羲、周文王、孔子等','en':'Fu Xi, King Wen of Zhou, Confucius, et al.','es':'Fu Xi, Rey Wen de Zhou, Confucio, et al.','pt':'Fu Xi, Rei Wen de Zhou, Confúcio, et al.'},
  dynasty:{'zh-CN':'上古-西周','zh-TW':'上古-西周','en':'Ancient - Western Zhou','es':'Antiguo - Zhou Occidental','pt':'Antigo - Zhou Ocidental'},
  intro:{'zh-CN':'《易经》是中国最古老的典籍之一，被誉为“群经之首，大道之源”。相传由伏羲画八卦，周文王推演为六十四卦并作卦辞，孔子作十翼。其以阴阳变化为核心，阐述天地万物运行规律，是中华哲学、占卜、医学、军事、艺术等领域的共同源头。','zh-TW':'《易經》是中國最古老的典籍之一，被譽為「群經之首，大道之源」。相傳由伏羲畫八卦，周文王推演為六十四卦並作卦辭，孔子作十翼。其以陰陽變化為核心，闡述天地萬物運行規律，是中華哲學、占卜、醫學、軍事、藝術等領域的共同源頭。','en':'The I Ching (Book of Changes) is one of the oldest Chinese classics, honored as the "first of all classics and source of the Great Way." Traditionally attributed to Fu Xi\'s eight trigrams, King Wen of Zhou\'s 64 hexagrams, and Confucius\' Ten Wings, it centers on the interplay of yin and yang, explaining the laws governing all things under heaven. It is the common source of Chinese philosophy, divination, medicine, military strategy, and art.','es':'El I Ching (Libro de los Cambios) es uno de los clásicos chinos más antiguos, honrado como el "primero de todos los clásicos y fuente del Gran Camino". Tradicionalmente atribuido a los ocho trigramas de Fu Xi, los 64 hexagramas del Rey Wen de Zhou y las Diez Alas de Confucio, se centra en la interacción del yin y el yang, explicando las leyes que gobiernan todas las cosas bajo el cielo. Es la fuente común de la filosofía, la adivinación, la medicina, la estrategia militar y el arte chinos.','pt':'O I Ching (Livro das Mutações) é um dos clássicos chineses mais antigos, honrado como o "primeiro de todos os clássicos e fonte do Grande Caminho". Tradicionalmente atribuído aos oito trigramas de Fu Xi, aos 64 hexagramas do Rei Wen de Zhou e às Dez Asas de Confúcio, centra-se na interação do yin e yang, explicando as leis que governam todas as coisas sob o céu. É a fonte comum da filosofia, adivinhação, medicina, estratégia militar e arte chinesa.'}
  // Note: Full 64 hexagram content is premium content unlocked by credits
},
{ id:'shiji', type:'史书',
  name:{'zh-CN':'史记','zh-TW':'史記','en':'Records of the Grand Historian','es':'Registros del Gran Historiador','pt':'Registros do Grande Historiador'},
  author:{'zh-CN':'司马迁','zh-TW':'司馬遷','en':'Sima Qian','es':'Sima Qian','pt':'Sima Qian'},
  dynasty:{'zh-CN':'西汉','zh-TW':'西漢','en':'Western Han','es':'Han Occidental','pt':'Han Ocidental'},
  intro:{'zh-CN':'《史记》是中国第一部纪传体通史，记载了从黄帝到汉武帝约3000年的历史。司马迁所著，共130篇，包括12本纪、30世家、70列传、10表、8书。其文笔优美，叙事生动，被鲁迅誉为“史家之绝唱，无韵之离骚”。','zh-TW':'《史記》是中國第一部紀傳體通史，記載了從黃帝到漢武帝約3000年的歷史。司馬遷所著，共130篇，包括12本紀、30世家、70列傳、10表、8書。其文筆優美，敘事生動，被魯迅譽為「史家之絕唱，無韻之離騷」。','en':'The Records of the Grand Historian is the first comprehensive history of China, covering about 3000 years from the Yellow Emperor to Emperor Wu of Han. Written by Sima Qian in 130 chapters (12 imperial annals, 30 noble houses, 70 biographies, 10 tables, 8 treatises), its literary brilliance and vivid narratives earned it Lu Xun\'s praise as "the greatest masterpiece of historians, a Li Sao without rhyme."','es':'Los Registros del Gran Historiador es la primera historia integral de China, que cubre unos 3000 años desde el Emperador Amarillo hasta el Emperador Wu de Han. Escrito por Sima Qian en 130 capítulos, su brillantez literaria y narrativas vívidas le valieron el elogio de Lu Xun como "la obra maestra más grande de los historiadores, un Li Sao sin rima".','pt':'Os Registros do Grande Historiador é a primeira história abrangente da China, cobrindo cerca de 3000 anos do Imperador Amarelo ao Imperador Wu de Han. Escrito por Sima Qian em 130 capítulos, seu brilho literário e narrativas vívidas lhe renderam o elogio de Lu Xun como "a maior obra-prima dos historiadores, um Li Sao sem rima".'},
  totalChapters:0
},
